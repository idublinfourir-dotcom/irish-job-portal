                  code: { type: string }
                  entries: { type: array, items: { type: object, required: [list, title], properties: { list: { type: string }, title: { type: string } } } }
                  listStatus: { enum: [critical-skills, ineligible] }
                  minimums:
                    type: [object, 'null']
                    properties:
                      withDegree: { type: integer }
                      recentGraduate: { type: integer }
                      graduateMonths: { type: integer }
                      withoutDegreeOrNotListed: { type: [integer, 'null'] }
                      minContractMonths: { type: integer }
                      basedOnWeekHours: { type: number }
                  jobs: { $ref: '#/components/schemas/PublicScopedJobs' }
                  quota: { enum: [none, full], description: 'The General permit quota of the code (#85): full when the code is in the quota-full list of the rules in force, else none. No used count is kept.', example: none }
                  text:
                    type: [object, 'null']
                    properties:
                      id: { $ref: '#/components/schemas/Id' }
                      kind: { type: string }
                      slug: { type: string }
                      title: { type: string }
                      body: { type: string }
                      sourceUrl: { type: [string, 'null'] }
                      checkedOn: { type: [string, 'null'] }
                      publishedAt: { $ref: '#/components/schemas/Timestamp' }
                      updatedAt: { $ref: '#/components/schemas/Timestamp' }
                  standingLine: { type: string }
                  rulesCheckedOn: { type: string }
                  registration: { $ref: '#/components/schemas/Registration' }
              example:
                code: '2136'
                entries: [{ list: critical-skills, title: Programmers and software development professionals }]
                listStatus: critical-skills
                minimums: { withDegree: 38000, recentGraduate: 34000, graduateMonths: 12, withoutDegreeOrNotListed: null, minContractMonths: 24, basedOnWeekHours: 39 }
                jobs: { jobs: [], next: null, count: { n: 0, more: false }, signInForMore: true }
                quota: none
                text: null
                standingLine: Our check is guidance, not a permit decision. Only DETE decides. Rules last checked on 1 November 2026.
                rulesCheckedOn: '2026-11-01'
                registration: null
        '400': { $ref: '#/components/responses/PublicBadRequest' }
        '401': { $ref: '#/components/responses/SignInForMore' }
        '404': { $ref: '#/components/responses/PublicNotFound' }
        '429': { $ref: '#/components/responses/PublicTooMany' }

  /api/help:
    get:
      operationId: getHelpPage
      tags: [public]
      summary: A published help page by slug
      description: |
        One help page ("Not sure?", S17) by slug, from the published pages only: a draft or withdrawn page, another kind's slug, an unknown
        or malformed slug (not lowercase letters, digits and hyphens, at most 100) is 404 `NOT_FOUND`. No text is published yet.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-rate-limit: visitor 60 a minute and 600 an hour per address; candidate 300 a minute per login
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,99}$' } }
      responses:
        '200':
          description: The help page.
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, slug, title, body, sourceUrl, checkedOn, publishedAt, updatedAt]
                properties:
                  id: { $ref: '#/components/schemas/Id' }
                  kind: { const: help }
                  slug: { type: string }
                  title: { type: string }
                  body: { type: string }
                  sourceUrl: { type: [string, 'null'] }
                  checkedOn: { type: [string, 'null'] }
                  publishedAt: { $ref: '#/components/schemas/Timestamp' }
                  updatedAt: { $ref: '#/components/schemas/Timestamp' }
              example: { id: '12', kind: help, slug: not-sure, title: Not sure?, body: Placeholder text., sourceUrl: null, checkedOn: null, publishedAt: '2026-11-18T10:00:00.000Z', updatedAt: '2026-11-18T10:00:00.000Z' }
        '404': { $ref: '#/components/responses/PublicNotFound' }
        '429': { $ref: '#/components/responses/PublicTooMany' }

  /api/updates:
    get:
      operationId: listUpdates
      tags: [public]
      summary: The updates feed, newest first
      description: |
        The published updates (news on permits and rules), 20 a page, newest first. `after` is the `next` of the page before; a visitor
        pages it too (the 6-job cap is for job lists only). A cursor this route did not make is 400.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-rate-limit: visitor 60 a minute and 600 an hour per address; candidate 300 a minute per login
      parameters:
        - { name: after, in: query, schema: { type: string, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' } }
      responses:
        '200':
          description: One page of updates.
          content:
            application/json:
              schema:
                type: object
                required: [updates, next]
                properties:
                  updates:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required: [id, kind, slug, title, body, sourceUrl, checkedOn, publishedAt, updatedAt]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        kind: { const: update }
                        slug: { type: string }
                        title: { type: string }
                        body: { type: string }
                        sourceUrl: { type: [string, 'null'] }
                        checkedOn: { type: [string, 'null'] }
                        publishedAt: { $ref: '#/components/schemas/Timestamp' }
                        updatedAt: { $ref: '#/components/schemas/Timestamp' }
                  next: { type: [string, 'null'] }
              example:
                updates: [{ id: '31', kind: update, slug: new-minimums, title: Placeholder update, body: Placeholder text., sourceUrl: 'https://enterprise.gov.ie/', checkedOn: '2026-11-01', publishedAt: '2026-11-18T10:00:00.000Z', updatedAt: '2026-11-18T10:00:00.000Z' }]
                next: null
        '400': { $ref: '#/components/responses/PublicBadRequest' }
        '429': { $ref: '#/components/responses/PublicTooMany' }

  /api/checker:
    get:
      operationId: checkEligibility
      tags: [public]
      summary: The eligibility checker
      description: |
        Whether an offer qualifies for a Critical Skills permit under the rules in force, which minimum applies and why, plus the
        health registration the occupation needs (S6). Strict input: every key at most once and no other key, else 400. Nothing is stored.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-rate-limit: visitor 60 a minute and 600 an hour per address; candidate 300 a minute per login
      parameters:
        - { name: occupationCode, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}$' } }
        - { name: annualPay, in: query, required: true, description: Gross euro a year., schema: { type: string, pattern: '^[0-9]{1,7}(\.[0-9]{1,2})?$' } }
        - { name: relevantDegree, in: query, required: true, schema: { enum: ['true', 'false'] } }
        - { name: degreeAwardMonth, in: query, description: 'YYYY-MM, read only with a relevant degree.', schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
        - { name: contractMonths, in: query, description: Absent for permanent or no end date., schema: { type: string, pattern: '^[0-9]{1,3}$' } }
        - { name: weeklyHours, in: query, description: '1 to 60, default 39.', schema: { type: string, pattern: '^[0-9]{1,2}(\.[0-9]{1,2})?$' } }
        - { name: title, in: query, description: 'The job title, only to tell a regulated role of a mixed code. Never stored.', schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                required: [qualifies, reason, minimum, why, standingLine, rulesCheckedOn, registration]
                properties:
                  qualifies: { type: boolean }
                  reason: { enum: [unknown_code, ineligible, contract_too_short, listed_degree, recent_graduate, non_list_route, below_minimum, degree_needed, non_list_route_blocked] }
                  minimum: { type: [number, 'null'] }
                  why: { type: string }
                  standingLine: { type: string }
                  rulesCheckedOn: { type: string }
                  registration: { $ref: '#/components/schemas/Registration' }
              example:
                qualifies: true
                reason: listed_degree
                minimum: 38000
                why: 'On the Critical Skills list with a relevant degree: the minimum is €38,000.'
                standingLine: Our check is guidance, not a permit decision. Only DETE decides. Rules last checked on 1 November 2026.
                rulesCheckedOn: '2026-11-01'
                registration: null
        '400': { $ref: '#/components/responses/PublicBadRequest' }
        '429': { $ref: '#/components/responses/PublicTooMany' }

  /api/legal:
    get:
      operationId: getLegalText
      tags: [public]
      summary: The legal text in force for a purpose
      description: |
        Step 15 R5. The newest published version of one legal purpose of this site: signup_terms or privacy_notice. Staff publish
        a version at the admin site's `/api/legal-texts` (two people); new sign-ups consent to the version shown here. No login is needed.
        No version yet is 404 `NOT_FOUND`; any other purpose, or none, is 400 `BAD_REQUEST`. The real wording waits for the solicitor and
        the entity: today only placeholder texts exist.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-rate-limit: visitor 60 a minute and 600 an hour per address; candidate 300 a minute per login
      parameters:
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [signup_terms, privacy_notice] } }
      responses:
        '200':
          description: The text in force.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [purpose, version, body, publishedAt]
                properties:
                  purpose: { type: string, enum: [signup_terms, privacy_notice] }
                  version: { type: string }
                  body: { type: string, description: Plain text; line breaks are kept. }
                  publishedAt: { type: string, description: 'The database time, as "2026-11-19 09:30:00.123456+00".' }
              example: { purpose: privacy_notice, version: placeholder-2026-11-19, body: PLACEHOLDER TEXT., publishedAt: '2026-11-19 09:30:00.123456+00' }
        '400':
          description: '`BAD_REQUEST`: the purpose is missing or not one of this site''s.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: BAD_REQUEST } } }
        '404':
          description: '`NOT_FOUND`: no version of that purpose is published yet.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: NOT_FOUND } } }
        '429': { $ref: '#/components/responses/PublicTooMany' }

  /api/contact:
    post:
      operationId: sendContactMessage
      tags: [public]
      summary: The contact form
      description: |
        Files one message for staff. Open to visitors, who must give `name` and `email`; a signed-in candidate may leave them out
        (the account's are used) and the sender id comes from the session. A suspended or deleted candidate is treated as a
        visitor, so may send topic `appeal` (C3), which a signed-in active candidate may not choose. The reply is only `{ ok: true }`:
        it never says whether an email has an account. Order: bot check, Origin, body
        cap, JSON, session, field checks, rate limits. `body` may hold line breaks and tabs, no other control characters.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-body-cap: 24000 characters
      x-rate-limit: 5 an hour per login; a visitor 5 an hour per address and 5 an hour per email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topic, body]
              properties:
                topic: { enum: [general, account, data_request, other, appeal] }
                name: { type: string, minLength: 1, maxLength: 120, description: 'Required for a visitor. Not blank, no control characters.' }
                email: { type: string, maxLength: 254, pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$', description: Required for a visitor. }
                body: { type: string, minLength: 1, maxLength: 5000, description: Not blank. Counted in characters (code points). }
            example: { topic: general, name: Alex Example, email: alex@example.com, body: A made-up question. }
      responses:
        '200':
          description: Filed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: '`BOT_SUSPECTED`: the bot check refused it. `BAD_ORIGIN`: the Origin is not the candidate site. `REFUSED`: a signed-in login whose row is gone.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_ORIGIN }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429':
          description: '`TOO_MANY_REQUESTS`: over 5 messages in an hour for the login, the address or the email. No Retry-After.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: TOO_MANY_REQUESTS }

  /api/report:
    post:
      operationId: reportJob
      tags: [public]
      summary: Report a live job or a company
      description: |
        Files a report on one live job or one company (#102: a company with a page, not rejected, closed or merged away) for trust and safety.
        Exactly one of `jobId` and `companyId`; the reason must be one of that target's codes (placeholder codes). A report never hides
        anything by itself. Signed in only; the reporter is never shown to the employer. Order:
        bot check, Origin, body cap, JSON, field checks, session, rate limit (so a bad body is 400 even without a session).
        `evidence` may hold line breaks and tabs, no other control characters.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 4000 characters
      x-rate-limit: 10 reports an hour per login (job and company reports together)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [jobId, reason]
                  properties:
                    jobId: { $ref: '#/components/schemas/Id' }
                    reason: { enum: [asks_for_money, no_sponsorship, job_closed, wrong_details, other] }
                    evidence: { type: string, minLength: 1, maxLength: 2000 }
                - type: object
                  additionalProperties: false
                  required: [companyId, reason]
                  properties:
                    companyId: { $ref: '#/components/schemas/Id' }
                    reason: { enum: [fake_company, asks_for_money, no_sponsorship, other] }
                    evidence: { type: string, minLength: 1, maxLength: 2000 }
            example: { jobId: '1042', reason: asks_for_money, evidence: The advert asks for a made-up fee. }
      responses:
        '200':
          description: Filed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403':
          description: '`BOT_SUSPECTED`: the bot check refused it. `BAD_ORIGIN`: the Origin is not the candidate site. `REFUSED`: the candidate is suspended or deleted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_ORIGIN }
        '404':
          description: '`JOB_NOT_FOUND`: the job is not live. `COMPANY_NOT_FOUND`: no company page with that id (unknown, rejected, closed or merged away).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: JOB_NOT_FOUND }
        '409':
          description: '`ALREADY_REPORTED`: this login already has an open report on this job or company.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: ALREADY_REPORTED }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429':
          description: '`TOO_MANY_REQUESTS`: over 10 reports in an hour by this login.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: TOO_MANY_REQUESTS }

  /api/alerts/unsubscribe:
    parameters:
      - { name: token, in: query, required: true, description: The token from the alert email (checked before any query)., schema: { type: string, pattern: '^[A-Za-z0-9_-]{32,64}$' } }
      - { name: scope, in: query, required: true, description: '`one`: this alert. `all`: every alert of the same candidate.', schema: { enum: [one, all] } }
    get:
      operationId: unsubscribeInfo
      tags: [alerts]
      summary: What an unsubscribe link would stop
      description: Changes nothing (mail scanners open links). No sign-in; the token is the only credential. An unknown token answers the same shape with `alert` null. A malformed link is 400 before the rate limit; then 60 calls a minute per client address.
      security: []
      x-roles: [anyone with the token]
      responses:
        '200':
          description: The alert's filters in words.
          content:
            application/json:
              schema:
                type: object
                required: [scope, alert]
                properties:
                  scope: { enum: [one, all] }
                  alert:
                    type: [object, 'null']
                    properties:
                      filters: { type: array, items: { type: string } }
                      frequency: { enum: [daily, weekly] }
                      status: { enum: [active, paused, unsubscribed] }
              example: { scope: one, alert: { filters: ['County: Dublin'], frequency: weekly, status: active } }
        '400':
          description: '`BAD_REQUEST`: the token or scope is missing or malformed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_REQUEST }
        '429':
          description: '`TOO_MANY_REQUESTS`: over 60 unsubscribe calls (GET and POST together) a minute from one client address (`x-vercel-forwarded-for`, the only address header trusted). No Retry-After.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: TOO_MANY_REQUESTS }
    post:
      operationId: unsubscribe
      tags: [alerts]
      summary: Unsubscribe (also the RFC 8058 one-click POST)
      description: |
        Sets the alert (scope `one`) or every alert of its candidate (scope `all`) to unsubscribed. No sign-in and no Origin check:
        a mail provider's server sends the one-click POST (`List-Unsubscribe=One-Click`) with no cookie and no Origin. The link,
        then the body size, then the rate limit are checked. The body is read only for its size. An unknown token changes nothing and answers the same.
      security: []
      x-roles: [anyone with the token]
      x-body-cap: 200 characters
      x-rate-limit: unsubscribe GET and POST together, 60 per client address per minute
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: string, maxLength: 200 }
            example: List-Unsubscribe=One-Click
      responses:
        '200':
          description: Done (or nothing to do).
          content:
            application/json:
              schema:
                type: object
                required: [ok, scope]
                properties:
                  ok: { const: true }
                  scope: { enum: [one, all] }
              example: { ok: true, scope: all }
        '400':
          description: '`BAD_REQUEST`: the token or scope is missing or malformed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_REQUEST }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429':
          description: '`TOO_MANY_REQUESTS`: over 60 unsubscribe calls (GET and POST together) a minute from one client address (`x-vercel-forwarded-for`, the only address header trusted). No Retry-After.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: TOO_MANY_REQUESTS }

  /api/candidate/profile:
    get:
      operationId: getProfile
      tags: [account]
      summary: The candidate's profile
      description: The profile, or null before the first save.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    oneOf:
                      - allOf: [{ $ref: '#/components/schemas/Profile' }]
                        required: [degreeBox]
                        properties:
                          degreeBox:
                            enum: [relevant, last_12_months, none]
                            description: |
                              The degree box pre-fill (S19, decisions 69 and 108), derived on each read, never stored or written: `none` without a
                              relevant degree, `last_12_months` until the same month a year after `degreeAwardedMonth` starts in Irish time,
                              otherwise (or with no date) `relevant`.
                      - { type: 'null' }
              example: { profile: { fullName: Alex Example, phone: '+353 1 555 0100', occupationCode: '2136', yearsExperience: 4, hasRelevantDegree: true, degreeField: Computing, degreeAwardedMonth: '2020-06-01', registrationBody: null, registrationNumber: null, registrationStatus: none, locationKind: abroad, currentStamp: null, degreeBox: relevant } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
    put:
      operationId: putProfile
      tags: [account]
      summary: Replace the profile
      description: |
        Replaces the whole profile: a field left out or null is stored empty. Unknown fields are refused. Strings are trimmed and
        may not hold control characters. `degreeAwardedMonth` needs `hasRelevantDegree` true; `currentStamp` needs `locationKind`
        ireland. A Stamp 4 (any stamp starting with 4) pauses every active alert in the same transaction and offers deletion.
        Origin checked; the body check runs before the session check.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/Profile' }]
              unevaluatedProperties: false
            example: { fullName: Alex Example, occupationCode: '2136', yearsExperience: 4, hasRelevantDegree: true, locationKind: ireland, currentStamp: 1G }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [ok, deletionOffered, alertsPaused]
                properties:
                  ok: { const: true }
                  deletionOffered: { type: boolean, description: True after a Stamp 4. }
                  alertsPaused: { type: integer, minimum: 0 }
              example: { ok: true, deletionOffered: false, alertsPaused: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/saved:
    get:
      operationId: listSaved
      tags: [account]
      summary: Saved jobs
      description: Newest first, at most 200 (the cap, so no paging). A job that is no longer live shows only its id, title and employer, with `live` false and its `reason`.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The saved jobs.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved:
                    type: array
                    maxItems: 200
                    items:
                      allOf: [{ $ref: '#/components/schemas/SmallJobCard' }]
                      required: [live, reason, savedAt]
                      properties:
                        live: { type: boolean }
                        reason: { $ref: '#/components/schemas/JobReason' }
                        savedAt: { $ref: '#/components/schemas/Timestamp' }
              example: { saved: [{ jobId: '1042', title: Staff Nurse, employerName: Example Care Ltd, county: Dublin, salaryLow: 38000, salaryHigh: 45000, payGrade: null, badge: null, live: true, reason: null, savedAt: '2026-11-17T10:00:00.000Z' }, { jobId: '1007', title: Chef de Partie, employerName: Example Hotel Ltd, live: false, reason: under_review, savedAt: '2026-11-12T10:00:00.000Z' }] }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
    post:
      operationId: saveJob
      tags: [account]
      summary: Save a job
      description: Saving again is not an error. Origin checked; body check before the session check.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: &jobIdBody
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jobId]
              properties:
                jobId: { $ref: '#/components/schemas/Id' }
            example: { jobId: '1042' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404':
          description: '`JOB_NOT_FOUND`: no such job, or it was never live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: JOB_NOT_FOUND }
        '409':
          description: '`SAVED_LIMIT`: 200 jobs are saved already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: SAVED_LIMIT }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }
    delete:
      operationId: unsaveJob
      tags: [account]
      summary: Remove a saved job
      description: Removing a job that is not saved answers `removed` 0. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: *jobIdBody
      responses:
        '200':
          description: Removed (or was not saved).
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
                properties:
                  ok: { const: true }
                  removed: { type: integer, minimum: 0, maximum: 1 }
              example: { ok: true, removed: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/apply-click:
    post:
      operationId: applyClick
      tags: [account]
      summary: The click on Apply
      description: For a live job whose application route is the employer's own page. Records the click (it starts the "Did you apply?" asks again) and answers the page address to send the candidate to. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: *jobIdBody
      responses:
        '200':
          description: The employer's page address.
          content:
            application/json:
              schema:
                type: object
                required: [ok, url]
                properties:
                  ok: { const: true }
                  url: { type: string }
              example: { ok: true, url: https://jobs.example.com/nurse }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404':
          description: '`JOB_NOT_FOUND`: not a live job with an own-page application route.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: JOB_NOT_FOUND }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/did-you-apply:
    get:
      operationId: didYouApplyPrompts
      tags: [account]
      summary: The "Did you apply?" prompts
      description: Open clicks asked fewer than twice and made within 14 days, newest first, at most 5. Reading changes nothing.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The prompts.
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts:
                    type: array
                    maxItems: 5
                    items:
                      allOf: [{ $ref: '#/components/schemas/SmallJobCard' }]
                      required: [clickId, clickedAt]
                      properties:
                        clickId: { $ref: '#/components/schemas/Id' }
                        clickedAt: { $ref: '#/components/schemas/Timestamp' }
              example: { prompts: [{ clickId: '501', jobId: '1042', title: Staff Nurse, employerName: Example Care Ltd, county: Dublin, salaryLow: 38000, salaryHigh: 45000, payGrade: null, badge: null, clickedAt: '2026-11-16T12:00:00.000Z' }] }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
    post:
      operationId: answerDidYouApply
      tags: [account]
      summary: Answer a "Did you apply?" prompt
      description: Each answer counts as one ask. `yes` also writes the tracker row at applied; a second `not_yet` ends the asking. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clickId, answer]
              properties:
                clickId: { $ref: '#/components/schemas/Id' }
                answer: { enum: ['yes', not_yet, 'no'] }
            example: { clickId: '501', answer: 'yes' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404':
          description: '`CLICK_NOT_FOUND`: not this candidate''s click, or it is already answered.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CLICK_NOT_FOUND }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/tracker:
    post:
      operationId: markApplied
      tags: [account]
      summary: Mark a job applied
      description: Adds a tracker row at applied and closes any open "Did you apply?" for the job as yes. Marking twice changes nothing (`created` false). Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: *jobIdBody
      responses:
        '200':
          description: Marked.
          content:
            application/json:
              schema:
                type: object
                required: [ok, created]
                properties:
                  ok: { const: true }
                  created: { type: boolean }
              example: { ok: true, created: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404':
          description: '`JOB_NOT_FOUND`: no such job, or it was never live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: JOB_NOT_FOUND }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }
    put:
      operationId: setTrackerStage
      tags: [account]
      summary: Change a tracked job's stage
      description: |
        A redirect row may move to applied, interview, offer, rejected or withdrawn; an on-site row only to withdrawn. Another
        stage is refused by the database's tracker guard (403 `REFUSED`). `offerHint` is true for offer. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jobId, stage]
              properties:
                jobId: { $ref: '#/components/schemas/Id' }
                stage: { enum: [applied, interview, viewed, shortlisted, offer, hired, rejected, withdrawn] }
            example: { jobId: '1042', stage: interview }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, offerHint]
                properties:
                  ok: { const: true }
                  offerHint: { type: boolean }
              example: { ok: true, offerHint: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404':
          description: '`NOT_TRACKED`: the job is not in this candidate''s tracker.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: NOT_TRACKED }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/job:
    get:
      operationId: getOwnJob
      tags: [account]
      summary: One saved or tracked job, closed or not
      description: A live job comes with its page address, saved flag and stage. A job that is not live shows only its id, title, employer and `reason`, with up to 5 similar live jobs (same occupation, else same sector).
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      parameters:
        - { name: id, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    allOf: [{ $ref: '#/components/schemas/SmallJobCard' }]
                    required: [live, reason, saved, stage]
                    properties:
                      live: { type: boolean }
                      reason: { $ref: '#/components/schemas/JobReason' }
                      ownPageUrl: { type: [string, 'null'], description: Live jobs only. }
                      closedAt: { type: [string, 'null'], format: date-time, description: Closed jobs only. }
                      saved: { type: boolean }
                      stage: { type: [string, 'null'] }
                  similar: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/SmallJobCard' }, description: Closed jobs only. }
              example: { job: { jobId: '1042', title: Staff Nurse, employerName: Example Care Ltd, live: false, reason: hidden_after_report, closedAt: null, saved: true, stage: applied }, similar: [] }
        '400':
          description: '`BAD_REQUEST`: `id` is missing or not an id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_REQUEST }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404':
          description: '`JOB_NOT_FOUND`: not saved or tracked by this candidate.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: JOB_NOT_FOUND }

  /api/candidate/notifications:
    get:
      operationId: getNotificationSettings
      tags: [account]
      summary: Notification settings
      description: One email switch per category. A category never set is on; `account` is always on.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema: &settings
                type: object
                required: [settings]
                properties:
                  settings:
                    type: object
                    required: [job_alerts, account]
                    properties:
                      job_alerts: { type: boolean }
                      account: { const: true }
              example: { settings: { job_alerts: false, account: true } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
    put:
      operationId: putNotificationSettings
      tags: [account]
      summary: Change notification settings
      description: At least one key; a key left out keeps its value. `account` may be sent only as true; any other key (such as the dropped `apply_reminders`) is 400. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                job_alerts: { type: boolean }
                account: { const: true }
            example: { job_alerts: false }
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema: *settings
              example: { settings: { job_alerts: false, account: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/export:
    get:
      operationId: exportData
      tags: [account]
      summary: Download my data
      description: |
        One JSON file (`Content-Disposition: attachment; filename="my-data-YYYY-MM-DD.json"`, `Cache-Control: no-store`) with
        everything held about the candidate: account, profile, CV details, saved jobs, tracker, "Did you apply?", alerts,
        consents, notification settings and notifications, plus their emails, own actions and who accessed their data. Never
        tokens, password hashes, storage keys or staff notes. Writes one audit row. Query parameters are ignored.
        C4 (#270): the session must come from a sign-in in the last 10 minutes, else 403 `REAUTH_REQUIRED` (no file, no audit row).
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="my-data-2026-11-18.json"
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, account, profile, cv, savedJobs, tracker, didYouApply, alerts, consents, notificationSettings, notifications, documentsYouUploaded, servicesCases, applications, contactRequests, notIncluded]
                properties:
                  exportedAt: { $ref: '#/components/schemas/Timestamp' }
                  account: { type: [object, 'null'] }
                  profile: { type: [object, 'null'] }
                  cv: { type: array }
                  savedJobs: { type: array }
                  tracker: { type: array }
                  didYouApply: { type: array }
                  alerts: { type: array }
                  consents: { type: array }
                  notificationSettings: { type: array }
                  notifications: { type: array }
                  documentsYouUploaded: { type: array, description: 'The copies you uploaded to your permit services cases: caseId, fileName, contentType, byteSize, uploadedAt, copyDeletedAt.' }
                  servicesCases:
                    type: array
                    description: "Your permit services cases: id, permitType, jobId, jobTitle, status, decisionOutcome, documentsNeeded (code and label), payer, createdAt, decidedAt, closedAt, closeReason, your offerDetails, and the timeline (at, kind, status, document labels, outcome, a referral; never a staff id, name or note; the firm only when shown)."
                    items: { type: object }
                  applications: { type: array, maxItems: 0 }
                  contactRequests: { type: array, maxItems: 0 }
                  notIncluded: { type: array, items: { type: object, properties: { section: { type: string }, reason: { type: string } } } }
                additionalProperties: true
              example:
                exportedAt: '2026-11-18T09:30:00.000Z'
                account: { name: Alex Example, email: alex@example.com, emailConfirmed: true, createdAt: '2026-10-01T09:00:00.000Z', lastActiveAt: '2026-11-18T09:00:00.000Z', signInMethods: [credential] }
                profile: null
                cv: []
                savedJobs: []
                tracker: []
                didYouApply: []
                alerts: []
                consents: []
                notificationSettings: []
                notifications: []
                documentsYouUploaded: []
                servicesCases: []
                applications: []
                contactRequests: []
                notIncluded: [{ section: contactFormMessages, reason: 'not available in this file yet; ask for it through the contact form (topic: data request)' }]
        '401': { $ref: '#/components/responses/NoSession' }
        '403':
          description: '`REFUSED` (suspended or deleted), or `REAUTH_REQUIRED`: the session is older than 10 minutes, sign in again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: REAUTH_REQUIRED }

  /api/candidate/account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Delete the account
      description: |
        Final at once. The login is refused from now on, every session ends and one confirmation email is queued. The data goes with the 30-day retention rule. Origin checked.
        C4 (#270): the session must come from a sign-in in the last 10 minutes (password, or Google for an account with no password); an older one is
        403 `REAUTH_REQUIRED` and nothing changes, so the page asks the person to sign in again.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { const: true }
            example: { confirm: true }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403':
          description: '`BAD_ORIGIN`, `REFUSED` (suspended or deleted), or `REAUTH_REQUIRED`: the session is older than 10 minutes, sign in again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: REAUTH_REQUIRED }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: The candidate's job alerts
      description: Newest first, at most 10. The unsubscribe token is never returned.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The alerts.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Alert' } }
              example: { alerts: [{ id: '31', occupationCode: null, sector: health, county: Dublin, salaryMin: null, badge: null, frequency: weekly, status: active, pauseReason: null, lastSentAt: null }] }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a job alert
      description: Needs a confirmed email and no Stamp 4. At most 10 alerts per candidate (every status counts). Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate with a confirmed email]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/AlertFilters' }]
              required: [frequency]
              unevaluatedProperties: false
            example: { sector: health, county: Dublin, frequency: weekly }
      responses:
        '200':
          description: The new alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertReply' }
              example: { alert: { id: '31', occupationCode: null, sector: health, county: Dublin, salaryMin: null, badge: null, frequency: weekly, status: active, pauseReason: null, lastSentAt: null } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': &alertGate
          description: '`BAD_ORIGIN`: the Origin is not the candidate site. `REFUSED`: the candidate is suspended or deleted. `EMAIL_NOT_VERIFIED`: the email is not confirmed yet.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: EMAIL_NOT_VERIFIED }
        '409':
          description: '`ALERT_LIMIT`: 10 alerts already. `STAMP_4`: the profile''s stamp is a Stamp 4.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: ALERT_LIMIT }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }
    put:
      operationId: editAlert
      tags: [alerts]
      summary: Edit a job alert
      description: Replaces every filter (a filter left out becomes "any"). Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/AlertFilters' }]
              required: [id, frequency]
              properties:
                id: { $ref: '#/components/schemas/Id' }
              unevaluatedProperties: false
            example: { id: '31', county: Cork, frequency: daily }
      responses:
        '200':
          description: The alert after the edit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertReply' }
              example: { alert: { id: '31', occupationCode: null, sector: null, county: Cork, salaryMin: null, badge: null, frequency: daily, status: active, pauseReason: null, lastSentAt: null } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': &alertNotFound
          description: '`ALERT_NOT_FOUND`: not this candidate''s alert.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: ALERT_NOT_FOUND }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete a job alert
      description: Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: &alertIdBody
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { $ref: '#/components/schemas/Id' }
            example: { id: '31' }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': *alertNotFound
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/alerts/pause:
    post:
      operationId: pauseAlert
      tags: [alerts]
      summary: Pause a job alert
      description: Only an active alert is paused (reason `candidate`); any other alert is answered unchanged. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: *alertIdBody
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertReply' }
              example: { alert: { id: '31', occupationCode: null, sector: health, county: Dublin, salaryMin: null, badge: null, frequency: weekly, status: paused, pauseReason: candidate, lastSentAt: null } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': *alertNotFound
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/alerts/resume:
    post:
      operationId: resumeAlert
      tags: [alerts]
      summary: Resume a job alert
      description: Back to active from paused or unsubscribed; "new jobs" count from now, so no backlog is sent. Needs a confirmed email and no Stamp 4. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate with a confirmed email]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody: *alertIdBody
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertReply' }
              example: { alert: { id: '31', occupationCode: null, sector: health, county: Dublin, salaryMin: null, badge: null, frequency: weekly, status: active, pauseReason: null, lastSentAt: '2026-11-18T09:30:00.000Z' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': *alertGate
        '404': *alertNotFound
        '409':
          description: '`STAMP_4`: the profile''s stamp is a Stamp 4.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: STAMP_4 }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }

  /api/candidate/cv:
    get:
      operationId: getCv
      tags: [files]
      summary: The CV's details
      description: File name, type, size and upload time. Never the storage key.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '200':
          description: The CV.
          content:
            application/json:
              schema: &cvReply
                type: object
                required: [cv]
                properties:
                  cv: { $ref: '#/components/schemas/Cv' }
              example: { cv: { fileName: alex-example-cv.pdf, contentType: pdf, sizeBytes: 182044, uploadedAt: '2026-11-15T14:00:00.000Z' } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': &cvNotFound
          description: '`CV_NOT_FOUND`: no CV uploaded.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CV_NOT_FOUND }
    put:
      operationId: putCv
      tags: [files]
      summary: Upload or replace the CV
      description: |
        A PDF or DOCX (read from the bytes), at most 4194304 bytes. The name is kept as a label only (last path part, at most
        200 characters, the type's extension). Order: Origin, size header, session, rate limits, then the body. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: 4210688 bytes
      x-rate-limit: 60 candidate writes in 10 minutes and 10 uploads an hour per login
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/Upload' }
      responses:
        '200':
          description: The stored CV.
          content:
            application/json:
              schema: *cvReply
              example: { cv: { fileName: alex-example-cv.pdf, contentType: pdf, sizeBytes: 182044, uploadedAt: '2026-11-18T09:30:00.000Z' } }
        '400': { $ref: '#/components/responses/UploadBadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '409':
          description: '`TRY_AGAIN`: two first uploads raced and this one lost.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: TRY_AGAIN }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/WrongFileType' }
        '422': { $ref: '#/components/responses/ActiveContent' }
        '429': { $ref: '#/components/responses/UploadTooMany' }
        '503': { $ref: '#/components/responses/FilesUnavailable' }
    delete:
      operationId: deleteCv
      tags: [files]
      summary: Remove the CV
      description: Removes the stored file, then its row. The body is not read (no body cap applies). Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      x-body-cap: none (the body is not read)
      x-rate-limit: 60 candidate writes in 10 minutes per login
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': *cvNotFound
        '429': { $ref: '#/components/responses/WriteTooMany' }
        '503': { $ref: '#/components/responses/FilesUnavailable' }

  /api/candidate/cv/download:
    get:
      operationId: downloadCv
      tags: [files]
      summary: Download the CV
      description: 'A 302 to a download link that works for 60 seconds (`Cache-Control: no-store`, `Referrer-Policy: no-referrer`).'
      security: [{ candidateSession: [] }]
      x-roles: [candidate]
      responses:
        '302':
          description: To the short-lived link.
          headers: &downloadHeaders
            Location:
              description: A presigned storage link, valid 60 seconds.
              schema: { type: string }
              example: https://files.example.com/signed-link
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': *cvNotFound
        '503': { $ref: '#/components/responses/FilesUnavailable' }

  /api/candidate/cases:
    get:
      operationId: listCandidateServicesCases
      tags: [services]
      summary: Permit services cases one may read
      description: >-
        This candidate's cases, newest first, 20 a page. A candidate's case that names a company is never the company's (20d:109).
      security: [{ candidateSession: [] }]
      x-roles: [candidate who owns the case]
      parameters:
        - { name: after, in: query, description: The `next` of the page before., schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page of cases.
          content:
            application/json:
              schema:
                type: object
                required: [cases, next]
                additionalProperties: false
                properties:
                  cases: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ServicesCase' } }
                  next: { oneOf: [{ $ref: '#/components/schemas/Cursor' }, { type: 'null' }] }
              example: { cases: [{ id: '31', status: received, decisionOutcome: null, permitType: critical_skills, jobId: '1042', jobTitle: Fake Developer, createdAt: '2026-11-20T08:00:00.000Z', lastChangeAt: '2026-11-20T08:00:00.000Z', documentCount: 0 }], next: null }
        '400':
          description: '`BAD_REQUEST`: an unknown or repeated query key, or a forged or changed paging token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_REQUEST }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
    post:
      operationId: requestCandidateServicesCase
      tags: [services]
      summary: Ask for help with a permit
      description: >-
        A verified candidate asks for help with a permit. In one transaction: the services_request consent record (and the employer_contact one when ticked), the case (payer from the job's company kind; no job: no company and no payer yet), the received event, and the free check on the offer details, kept with the case and returned. At most one open case per job (and one with no job), and 5 open cases. With `employerContact` (only on a request that names a job) a second consent record lets our team contact the employer's HR (S-Q2 A); without it staff never do. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [verified candidate]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permitType, offerDetails, servicesConsent]
              additionalProperties: false
              properties:
                permitType: { enum: [critical_skills, general] }
                jobId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
                offerDetails: { $ref: '#/components/schemas/OfferDetails' }
                servicesConsent: { const: true, description: The services_request consent (placeholder wording until the real text). }
                employerContact: { type: boolean, default: false, description: 'The HR-contact tick (S-Q2 A): only with jobId. Without it staff never contact the employer and the case stays a free check.' }
            example: { permitType: critical_skills, jobId: '1042', offerDetails: { occupationCode: '2136', annualPay: '50000', relevantDegree: 'true', title: Fake Developer }, servicesConsent: true, employerContact: true }
      responses:
        '200':
          description: The case (or, on a replayed key, the case made the first time), with the free check (null on a replay).
          content:
            application/json:
              schema:
                type: object
                required: [case, freeCheck, replayed]
                additionalProperties: false
                properties:
                  case: { $ref: '#/components/schemas/ServicesCase' }
                  freeCheck: { $ref: '#/components/schemas/FreeCheck' }
                  replayed: { type: boolean }
              example: { case: { id: '31', status: received, decisionOutcome: null, permitType: critical_skills, jobId: '1042', jobTitle: Fake Developer, createdAt: '2026-11-20T08:00:00.000Z', lastChangeAt: '2026-11-20T08:00:00.000Z', documentCount: 0 }, freeCheck: { qualifies: true, reason: listed_degree, minimum: 40904, why: 'On the Critical Skills list with a relevant degree: the minimum is EUR 40,904.', standingLine: Rules checked on 12 November 2026., rulesCheckedOn: '2026-11-12', registration: null }, replayed: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403':
          description: '`BAD_ORIGIN`: the Origin is not the candidate site. `NOT_VERIFIED`: the email is not confirmed. `REFUSED`: suspended or deleted, or a database rule refused it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: NOT_VERIFIED }
        '404':
          description: '`JOB_NOT_FOUND`: the job does not exist or is not live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: JOB_NOT_FOUND }
        '409':
          description: '`CASE_ALREADY_OPEN`: an open case on this job (or with no job) already. `CASE_LIMIT`: 5 open cases already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CASE_LIMIT }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }
        '503':
          description: '`SERVICES_UNAVAILABLE`: the services consent texts are not in the database yet (services-texts-cli.ts has not run).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: SERVICES_UNAVAILABLE }
  /api/candidate/cases/{id}:
    parameters:
      - { name: id, in: path, required: true, description: The services case id; anything that is not an id is 404., schema: { type: string } }
    get:
      operationId: getCandidateServicesCase
      tags: [services]
      summary: One permit services case
      description: >-
        The case, read through the side's reader rule. A case the caller may not read, a missing case and a bad id are all 404 (never 403). The timeline and the documents needed are a separate route.
      security: [{ candidateSession: [] }]
      x-roles: [candidate who owns the case]
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                type: object
                required: [case]
                additionalProperties: false
                properties:
                  case: { $ref: '#/components/schemas/ServicesCase' }
              example: { case: { id: '31', status: received, decisionOutcome: null, permitType: critical_skills, jobId: '1042', jobTitle: Fake Developer, createdAt: '2026-11-20T08:00:00.000Z', lastChangeAt: '2026-11-20T08:00:00.000Z', documentCount: 0 } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404':
          description: '`CASE_NOT_FOUND`: not a case this login may read, no such case, or not an id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CASE_NOT_FOUND }
  /api/candidate/cases/{id}/withdraw:
    parameters:
      - { name: id, in: path, required: true, description: The services case id; anything that is not an id is 404., schema: { type: string } }
    post:
      operationId: withdrawCandidateServicesCase
      tags: [services]
      summary: Withdraw one's own open case
      description: >-
        The requester closes an open case (no decision outcome yet) as withdrawn, and the withdrawn event is written (migration 0062). Any body is ignored. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate who owns the case]
      x-body-cap: 2048 characters
      x-rate-limit: 60 candidate writes in 10 minutes per login
      responses:
        '200':
          description: The closed case.
          content:
            application/json:
              schema:
                type: object
                required: [case]
                additionalProperties: false
                properties:
                  case: { $ref: '#/components/schemas/ServicesCase' }
              example: { case: { id: '31', status: closed, decisionOutcome: null, permitType: critical_skills, jobId: '1042', jobTitle: Fake Developer, createdAt: '2026-11-20T08:00:00.000Z', lastChangeAt: '2026-11-20T08:00:00.000Z', documentCount: 0 } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403':
          description: '`BAD_ORIGIN`: the Origin is not this site. `REFUSED`: suspended or deleted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_ORIGIN }
        '404':
          description: '`CASE_NOT_FOUND`: not a case this login may read, no such case, or not an id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CASE_NOT_FOUND }
        '409':
          description: '`CASE_NOT_OPEN`: the case is closed or has a decision outcome.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CASE_NOT_OPEN }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/WriteTooMany' }
  /api/candidate/cases/{id}/documents:
    parameters:
      - { name: id, in: path, required: true, description: The services case id., schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: listCaseDocuments
      tags: [files]
      summary: Documents of one's own services case
      description: The documents this candidate uploaded to the case, oldest first. A case that is not this candidate's is 404.
      security: [{ candidateSession: [] }]
      x-roles: [candidate who owns the case]
      responses:
        '200':
          description: The documents.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents: { type: array, items: { $ref: '#/components/schemas/CaseDocument' } }
              example: { documents: [{ id: '9', fileName: passport.pdf, contentType: pdf, sizeBytes: 90211, uploadedAt: '2026-11-12T10:00:00.000Z', copyDeleted: false }] }
        '400': &badCaseId
          description: '`BAD_REQUEST`: the case or document id is not an id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: BAD_REQUEST }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404': &caseNotFound
          description: '`CASE_NOT_FOUND`: not this candidate''s case.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: CASE_NOT_FOUND }
    post:
      operationId: uploadCaseDocument
      tags: [files]
      summary: Upload a document to one's own services case
      description: A PDF, JPEG or PNG (read from the bytes), at most 4194304 bytes. At most 20 stored copies per case from this side; not while the case is at decision or closed. Origin checked.
      security: [{ candidateSession: [] }]
      x-roles: [candidate who owns the case]
      x-body-cap: 4210688 bytes
      x-rate-limit: 60 candidate writes in 10 minutes and 10 uploads an hour per login
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/Upload' }
      responses:
        '200':
          description: The stored document.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: '#/components/schemas/CaseDocument' }
              example: { document: { id: '10', fileName: payslip.png, contentType: png, sizeBytes: 50112, uploadedAt: '2026-11-18T09:30:00.000Z', copyDeleted: false } }
        '400': { $ref: '#/components/responses/UploadBadRequest' }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/WriteForbidden' }
        '404': *caseNotFound
        '409':
          description: '`CASE_CLOSED`: the case is at decision or closed. `DOCUMENT_LIMIT`: 20 stored copies already.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: DOCUMENT_LIMIT }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/WrongFileType' }
        '422': { $ref: '#/components/responses/ActiveContent' }
        '429': { $ref: '#/components/responses/UploadTooMany' }
        '503': { $ref: '#/components/responses/FilesUnavailable' }

  /api/candidate/cases/{id}/documents/{docId}:
    parameters:
      - { name: id, in: path, required: true, description: The services case id., schema: { $ref: '#/components/schemas/Id' } }
      - { name: docId, in: path, required: true, description: The document id., schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: downloadCaseDocument
      tags: [files]
      summary: Download one document of one's own case
      description: A 302 to a download link that works for 60 seconds, while the stored copy is kept.
      security: [{ candidateSession: [] }]
      x-roles: [candidate who uploaded it]
      responses:
        '302':
          description: To the short-lived link.
          headers: *downloadHeaders
        '400': *badCaseId
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404':
          description: '`DOCUMENT_NOT_FOUND`: not this candidate''s document in this case, or its copy was removed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeError' }
              example: { code: DOCUMENT_NOT_FOUND }
        '503': { $ref: '#/components/responses/FilesUnavailable' }
  /api/candidate/cases/{id}/timeline:
    parameters:
      - { name: id, in: path, required: true, description: The services case id., schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: candidateCaseTimeline
      tags: [files]
      summary: The timeline of a services case
      description: >-
        Every step of the case, oldest first, at most 200 (a case has one step per staff action, so it stays small): the time, the kind, the
        status after it, and for documents_needed the codes with their labels, for decision the outcome with its label, for referred the generic
        code (the firm's name only once REFERRAL_FIRM_SHOWN is turned on). Never a staff id, a staff name or a note. Read through the 0061 reader
        rule: candidate who owns the case. A case this login cannot read is 404, whatever the case is.
      security: [{ candidateSession: [] }]
      x-roles: [candidate who owns the case]
      x-rate-limit: none
      responses:
        '200':
          description: The steps.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: false
                      required: [at, kind, status]
                      properties:
                        at: { type: string, format: date-time }
                        kind: { type: string, enum: [received, assigned, status_changed, documents_needed, decision, closed, referred, withdrawn] }
                        status: { type: string, enum: [received, documents_needed, waiting_for_employer, submitted, decision, closed] }
                        documentsNeeded:
                          type: array
                          maxItems: 30
                          items:
                            type: object
                            required: [code, label]
                            properties:
                              code: { type: string, maxLength: 40 }
                              label: { type: [string, 'null'] }
                        outcome:
                          type: object
                          required: [code, label]
                          properties:
                            code: { type: string, enum: [granted, refused] }
                            label: { type: [string, 'null'] }
                        referral:
                          type: object
                          required: [code]
                          properties:
                            code: { type: string, enum: [referred_to_solicitor] }
                            firm: { type: string, maxLength: 200 }
              example:
                events:
                  - { at: '2026-11-20T09:00:00.000+00:00', kind: received, status: received }
                  - { at: '2026-11-20T10:00:00.000+00:00', kind: documents_needed, status: documents_needed, documentsNeeded: [{ code: passport_copy, label: Passport copy }] }
        '400':
          description: '`BAD_REQUEST`: the case id is not an id.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: BAD_REQUEST } } }
        '401': { $ref: '#/components/responses/NoSession' }
        '403': { $ref: '#/components/responses/ReadForbidden' }
        '404':
          description: "`CASE_NOT_FOUND`: not this candidate's case."
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: CASE_NOT_FOUND } } }
  /api/data-request:
    parameters:
      - { name: token, in: query, required: true, description: 'The token from the confirm email (43 characters, checked before any query). The only query key allowed.', schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
    get:
      operationId: dataRequestInfo
      tags: [account]
      summary: What a data request confirm link would confirm
      description: >-
        Decision #271 (step 15 Q2): staff sent this candidate login's own address a one-time link for a data request made about it. This
        shows the purpose and when the link ends, and changes nothing (mail scanners open links). No sign-in; the token is the only
        credential. A malformed link is 400 before the rate limit; then 30 calls (GET and POST together) per 10 minutes per client address.
        An unknown, used, expired or closed link, or one made for the other site's kind of login, is 404 `INVALID_LINK`, the same for each.
      security: []
      x-roles: [anyone with the token]
      x-rate-limit: data-request GET and POST together, 30 per client address per 10 minutes
      responses:
        '200':
          description: The live link.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [purpose, expiresAt]
                properties:
                  purpose: { enum: [export, erase] }
                  expiresAt: { type: string }
              example: { purpose: export, expiresAt: '2026-11-26T09:30:00.123456+00:00' }
        '400':
          description: '`BAD_REQUEST`: the token is missing or malformed, or another query key is present.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: BAD_REQUEST } } }
        '404':
          description: '`INVALID_LINK`: unknown, used, expired or closed, or made for the other site.'
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: INVALID_LINK } } }
        '429':
          description: '`TOO_MANY_REQUESTS`: over 30 calls in 10 minutes from one client address (`x-vercel-forwarded-for`, the only address header trusted).'
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeError' }, example: { code: TOO_MANY_REQUESTS } } }
    post:
      operationId: dataRequestConfirm
      tags: [account]
      summary: Confirm a data request (once)
      description: >-
        The account owner confirms. The link works once: afterwards it is 404. For an export the reply is the owner's own data file, the
        same as their own export (`Content-Disposition: attachment; filename="my-data-YYYY-MM-DD.json"`, `Cache-Control: no-store`); staff
        never receive it. For an erase the reply is `{ ok: true, purpose: erase }` and staff may then erase the account (two administrators).
        One audit row by the owner. The Origin header must be this site's origin; no body is needed (at most 200 characters).
      security: []
      x-roles: [anyone with the token]
      x-body-cap: 200 characters
      x-rate-limit: data-request GET and POST together, 30 per client address per 10 minutes
      responses:
        '200':
          description: "An erase: confirmed. An export: the data file."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [ok, purpose]
                    properties:
                      ok: { const: true }
                      purpose: { const: erase }
                  - type: object
                    required: [exportedAt, account]
                    properties:
                      exportedAt: { type: string }
                      account: { type: object }
              example: { ok: true, purpose: erase }
        '400':
          description: '`BAD_REQUEST`: the token is missing or malformed, or another query key is present.'

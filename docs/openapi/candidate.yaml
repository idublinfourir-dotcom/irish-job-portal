  /api/health:
    get:
      operationId: candidateHealth
      tags: [ops]
      summary: Health check
      description: Answers whether the database answers `select 1`. The result is cached for a short time. No session, no rate limit. `sharp` (U3) says whether the image re-encoder used at upload loads in this function; it is worked out once per server instance and is not part of `ok`.
      security: []
      x-roles: [anyone]
      x-no-4xx: The route reads nothing from the request, so it has no client error.
      responses:
        '200':
          description: The database answers.
          content:
            application/json:
              schema: &health
                type: object
                required: [ok, database]
                properties:
                  ok: { type: boolean }
                  database: { type: boolean }
                  sharp: { type: boolean }
              example: { ok: true, database: true, sharp: true }
        '503':
          description: The database does not answer (same body, both false).
          content:
            application/json:
              schema: *health
              example: { ok: false, database: false, sharp: true }

  /api/auth/candidate/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: The Better Auth endpoint path (it may hold slashes), for example `sign-in/email`.
        schema: { type: string }
        example: sign-in/email
    get:
      operationId: candidateAuthGet
      tags: [auth]
      summary: Better Auth GET endpoints (candidate pool)
      description: |
        Handed to Better Auth unchanged (basePath `/api/auth/candidate`). The GET endpoints the site uses: `get-session`,
        `verify-email?token=` (the link in the confirmation email, and the two links of an email change), `callback/google` (Google sign-in, on only when
        GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set) and `error`. Request and reply shapes are Better Auth's own; see its docs.
        The session cookie is `candidate.session_token` (`__Secure-` over HTTPS); sessions are read from the database every time.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      responses:
        '200':
          description: Better Auth's reply (for `get-session`, the session and user, or null).
          content:
            application/json:
              schema: { type: [object, 'null'] }
              example: null
        '302':
          description: A redirect (email confirmation and Google callback).
          headers:
            Location:
              schema: { type: string }
              example: /
        '409':
          description: '`EMAIL_TAKEN`: an email-change link whose new address got an account in the meantime (no `callbackURL` given).'
          content:
            application/json:
              schema: { type: object }
              example: { code: EMAIL_TAKEN, message: This address already has an account. }
        '400':
          description: Better Auth refused the request (its own `{ code, message }` body).
          content:
            application/json:
              schema: { type: object }
              example: { code: INVALID_TOKEN, message: invalid token }
    post:
      operationId: candidateAuthPost
      tags: [auth]
      summary: Better Auth POST endpoints (candidate pool)
      description: |
        Handed to Better Auth after the bot check. The POST endpoints the site uses: `sign-up/email`, `sign-in/email`,
        `sign-in/social` (Google), `sign-out`, `send-verification-email`, `request-password-reset`, `reset-password`, `change-email`,
        `revoke-sessions` and `revoke-other-sessions`.

        - Bot check first (only when BOT_CHECK=on) on `sign-up/email`, `sign-in/email`, `request-password-reset`,
          `send-verification-email` and `sign-in/social` (the Google start): 403 `{ "code": "BOT_SUSPECTED" }` before Better Auth reads the body.
        - Better Auth's origin check is on (trusted origin: CANDIDATE_AUTH_URL).
        - Rate limits per client address (`x-vercel-forwarded-for`), stored in the database: `sign-in/email`, `sign-up/email` and
          `sign-in/social` 5 a minute; `request-password-reset` and `send-verification-email` 3 in 5 minutes. On top, those two are limited to 3 an
          hour per email address (keyed hash, counted before the address is looked up; an address over 254 characters is 400
          `INVALID_EMAIL`).
        - `sign-up/email` takes Better Auth's `name`, `email`, `password` plus the three answers `needsPermit`, `over18` and
          `acceptsTerms`, each the JSON value `true`; otherwise 400 `SIGNUP_ANSWERS_REFUSED`. A name must be 1 to 100 characters
          (`SIGNUP_NAME_REFUSED`). Email must be confirmed before sign-in works. A `needsPermit` of `false` (the "no" answer, #8) adds one
          to that UTC day's count (C5, #253) after the rate limit and the bot check, and keeps nothing else about the visitor.
          A Google sign-up's "no" (`additionalData` on `sign-in/social`) counts once too, when the callback proves a new Google
          account, and is refused there as before (`error=SIGNUP_ANSWERS_REFUSED`); a returning Google user's answers are not read.
        - A suspended or deleted candidate cannot start a session (403).
        - A password reset ends every other session.
        - `change-email` `{ newEmail, callbackURL? }` (C4, #270): needs a session from a sign-in in the last 10 minutes, else 403 `REAUTH_REQUIRED`.
          It emails the OLD address a confirm link (kind `change-email`, from the security sender); that link sends the NEW address its own link
          (kind `new-email`), and only that second link changes the address. An address that already has an account answers 200 and sends nothing.
          An address over 254 characters is 400 `INVALID_EMAIL`. 3 in 5 minutes per client address.
        - `link-social` (adding a Google account) needs a session from a sign-in in the last 10 minutes too, else 403 `REAUTH_REQUIRED`.
        - On `verify-email`, either link of an email change whose new address got an account in the meantime is refused and nothing
          changes: a redirect to its `callbackURL` with `error=EMAIL_TAKEN` only when that is a plain path on this site (printable ASCII, no backslash, no whitespace, no encoded slash or backslash `%2F` or `%5C` before `?` or `#`, at most 1,000 characters), else 409 `{ code: EMAIL_TAKEN }` without one.
        - `revoke-sessions` (sign out everywhere) ends every session of this login at once; `revoke-other-sessions` ends all but this one. Any
          signed-in session may call them (no fresh sign-in needed); the next request with an ended session is 401.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-rate-limit: sign-in, sign-up and the Google start 5 a minute per address; reset, resend and change-email 3 in 5 minutes per address; reset and resend also 3 an hour per email
      x-body-cap: none set by this repo (Better Auth's own handling)
      responses:
        '200':
          description: Better Auth's reply.
          content:
            application/json:
              schema: { type: object }
              example: { status: true }
        '400':
          description: Better Auth or the sign-up check refused the body (`SIGNUP_ANSWERS_REFUSED`, `SIGNUP_NAME_REFUSED`, `INVALID_EMAIL` and Better Auth's own codes).
          content:
            application/json:
              schema: { type: object }
              example: { code: SIGNUP_ANSWERS_REFUSED, message: You must accept the terms. }
        '401':
          description: Wrong email or password (Better Auth's own body).
          content:
            application/json:
              schema: { type: object }
              example: { code: INVALID_EMAIL_OR_PASSWORD, message: Invalid email or password }
        '403':
          description: '`BOT_SUSPECTED` (`{ code }` from the bot check), `REAUTH_REQUIRED` (change-email on a session older than 10 minutes), an unconfirmed email, a refused origin, or a suspended or deleted account (Better Auth''s own body).'
          content:
            application/json:
              schema: { type: object }
              example: { code: BOT_SUSPECTED }
        '429':
          description: Over a Better Auth rate limit or the per-email limit.
          content:
            application/json:
              schema: { type: object }
              example: { message: Too many requests. Please try again later. }

  /api/jobs:
    get:
      operationId: listJobs
      tags: [public]
      summary: Job list and search
      description: |
        Live jobs, sponsor history first by default; full-quota jobs sort last. A visitor (no candidate session, or a refused one)
        gets the first 6 jobs, no paging tokens, and `signInForMore`. A signed-in candidate gets 20 a page and `next` and `previous`.
        Each filter may be given once; an empty value means "any". Other query keys are ignored. A token works only with the
        sort and filters it was made with.
      security: [{}, { candidateSession: [] }]
      x-roles: [anyone]
      x-rate-limit: visitor 60 a minute and 600 an hour per address; candidate 300 a minute per login
      parameters:
        - { name: sort, in: query, schema: { enum: [sponsor, newest, salary], default: sponsor } }
        - { name: after, in: query, description: Signed in only. Not with `before`., schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: before, in: query, description: Signed in only. Not with `after`., schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: q, in: query, description: 'Keyword text, trimmed, no control characters.', schema: { type: string, maxLength: 200 } }
        - { name: occupationCode, in: query, schema: { $ref: '#/components/schemas/OccupationCode' } }
        - { name: sector, in: query, schema: { $ref: '#/components/schemas/Sector' } }
        - { name: county, in: query, schema: { $ref: '#/components/schemas/County' } }
        - { name: salaryMin, in: query, description: Whole euros a year; only jobs that state a salary., schema: { type: integer, minimum: 0, maximum: 1000000 } }
        - { name: badge, in: query, description: 'Only jobs with this badge: an employer-signed job, or a job that meets Critical Skills pay (also an alert filter).', schema: { enum: [sponsor_confirmed, critical_skills_eligible] } }
        - { name: postedWithin, in: query, description: Days., schema: { type: integer, enum: [1, 3, 7, 30] } }
        - { name: salaryStated, in: query, schema: { enum: ['true'] } }
      responses:
        '200':
          description: One page of jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJobList' }
              example:
                jobs:
                  - { id: '1042', title: Staff Nurse, employerName: Example Care Ltd, county: Dublin, salaryLow: 38000, salaryHigh: 45000, salaryLine: '€38,000 to €45,000', payGrade: null, passRoute: stated_pay, badge: critical_skills_eligible, quotaFull: false, postedAt: '2026-11-17T08:00:00.000Z', sponsorPermits: 12, lastCheckedAt: '2026-11-18T06:00:00.000Z', contractMonths: null, permitHistory: has_history, source: fetched, employerSlug: example-care, employerLogoUrl: null, payScaleLine: null }
                next: null
                previous: null
                count: { n: 1, more: false }
                signInForMore: false
        '400': { $ref: '#/components/responses/PublicBadRequest' }
        '401': { $ref: '#/components/responses/SignInForMore' }
        '429': { $ref: '#/components/responses/PublicTooMany' }


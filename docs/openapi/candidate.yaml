openapi: 3.1.0
info:
  title: Candidate API (job seekers and visitors)
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    The routes of the candidate site: the public job list, job, company and occupation reads, the contact and report forms,
    the alert unsubscribe link, and the signed-in candidate's own data (profile, saved jobs, tracker, alerts, CV, case
    documents, notification settings, export and account deletion).

    ## Conventions (the same text in candidate.yaml, portal.yaml and admin.yaml)

    - **Origin check on writes.** Every POST, PUT and DELETE that a signed-in person sends must carry an `Origin` header equal to its
      own app's origin (the `*_AUTH_URL` setting). Anything else is refused with 403 before the body is read. The exceptions are named
      on the route: the alert unsubscribe (a mail provider's server sends it with no Origin) and the health checks (GET only).
    - **Body size caps.** Every write has a cap, given on the route in `x-body-cap` (characters of the JSON text, or bytes for a
      file upload). A `Content-Length` over the cap is refused before the body is read, and a body over the cap after reading is
      refused too: 413 on the candidate and portal sites, 400 `bad_body` on the admin site. The Better Auth routes
      (`/api/auth/*`) keep Better Auth's own handling; this repo sets no cap there.
    - **Strict bodies.** A body must be one JSON object with exactly the documented fields: an unknown field, a wrong type or a
      value outside its limits is refused with 400 (no field is dropped silently). Strings are trimmed where the route says so and
      may not hold control characters unless the route says line breaks are allowed.
    - **Two error formats exist today.** Most candidate and portal routes answer `{ "code": "UPPER_CASE" }` (`CodeError`); the admin
      routes and a few others answer `{ "error": "lower_case" }` (`ErrorBody`). Each response names which. A 500 never says why
      (`{ "error": "server_error" }` on admin, an empty or framework body elsewhere); the reason stays in the server log.
    - **Sessions.** Each app has its own Better Auth login pool and its own cookie (`candidate.session_token`,
      `portal.session_token`, `staff.session_token`; `__Secure-` in front of the name over HTTPS). A route that needs a session
      answers 401 without one. Sessions are read from the database on every request (no cookie cache), so a suspended, blocked,
      disabled or deleted login is refused on its next request.
    - **Paging.** Lists page by keyset, never by offset: the reply carries an opaque `next` (and sometimes `previous`) token,
      and the next page is asked for with `after=<token>` (or `before=<token>`). A token works only with the sort and filters it was
      made for; a changed or forged token, or another list's token, is 400. Page sizes are given on each route (job lists 20, a
      visitor 6, audit 50, notices 50, content 20, admin queues 20).
    - **Rate limits.** Limits are counted in the database (shared by every server instance). Over a limit the answer is 429; only
      the public candidate reads send `Retry-After` (seconds). Each write names its limit in `x-rate-limit` ("none" where the code
      has none, as on the admin routes, which rely on the staff sign-in limits).
    - **Ids.** Database ids are 64-bit integers. Every route sends and takes them as strings of digits (`"123"`, pattern
      `^[1-9][0-9]{0,18}$`, at most 9223372036854775807), so no client loses precision. `0`, a leading zero, a JSON number or a
      longer string is refused with the field's 400 code. Login ids (Better Auth) are 32 letters and digits.
    - **Times** are ISO 8601 strings in UTC (`2026-11-18T09:30:00.000Z`); dates without a time are `YYYY-MM-DD`. Not yet uniform:
      the admin replies send Postgres text (`2026-11-18 09:30:00.123456+00`, `DbTime` in admin.yaml) in most lists; each field
      says which. The candidate and portal replies use the `Z` form only.
    - **Admin query strings** are strict: an unknown or repeated query key is 400 `bad_query` on every admin GET (the merge
      preview's `id` is the one key that may repeat).
    - **Examples** are made up. No example holds a real person, company, address or secret.
servers:
  - url: /
    description: The app's own origin (relative; each app is deployed on its own host).
components:
  schemas:
    CodeError:
      type: object
      description: The error body of most candidate and portal routes.
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
      example: { code: BAD_REQUEST }
    ErrorBody:
      type: object
      description: The error body of the admin routes and some portal and candidate routes. `stage` is set only when a rules check failed.
      required: [error]
      properties:
        error: { type: string }
        stage: { type: string }
      example: { error: bad_body }
    Id:
      type: string
      description: A database id as text.
      pattern: '^[1-9][0-9]{0,18}$'
      example: '1042'
    LoginId:
      type: string
      description: A Better Auth login id.
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP'
    Timestamp:
      type: string
      format: date-time
      description: An ISO 8601 time in UTC.
      example: '2026-11-18T09:30:00.000Z'
    Date:
      type: string
      format: date
      example: '2026-11-18'
    Cursor:
      type: string
      description: An opaque keyset paging token from a previous reply. Send it back unchanged.
      pattern: '^[A-Za-z0-9_-]{1,300}$'
      example: eyJzIjoic3BvbnNvciIsInEiOmZhbHNlfQ
    OccupationCode:
      type: string
      description: A SOC 2010 unit group code (4 digits) that is on the site's list of codes.
      pattern: '^[0-9]{4}$'
      example: '2136'
    Sector:
      type: string
      enum: [health, IT, construction and engineering, finance, care, hospitality, pharma and science, other]
    County:
      type: string
      description: One of the 26 counties of the Republic of Ireland.
      enum: [Carlow, Cavan, Clare, Cork, Donegal, Dublin, Galway, Kerry, Kildare, Kilkenny, Laois, Leitrim, Limerick, Longford, Louth, Mayo, Meath, Monaghan, Offaly, Roscommon, Sligo, Tipperary, Waterford, Westmeath, Wexford, Wicklow]
    Count:
      type: [object, 'null']
      description: The capped count of matching jobs, first page only (null on later pages). `n` stops at 200; `more` true means over 200.
      required: [n, more]
      properties:
        n: { type: integer, minimum: 0, maximum: 200 }
        more: { type: boolean }
    JobCard:
      type: object
      description: One job as a list shows it.
      required: [id, title, employerName, county, salaryLow, salaryHigh, salaryLine, payGrade, passRoute, badge, quotaFull, postedAt, sponsorPermits, lastCheckedAt, contractMonths, permitHistory, source, employerSlug, employerLogoUrl, payScaleLine]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        employerName: { type: string }
        county: { type: [string, 'null'] }
        salaryLow: { type: [integer, 'null'], description: Whole euros a year. }
        salaryHigh: { type: [integer, 'null'] }
        salaryLine: { type: [string, 'null'], description: 'The salary text without "a year", or the pay grade when no salary is stated.' }
        payGrade: { type: [string, 'null'] }
        passRoute: { enum: [stated_pay, big_company, pay_floor, public_pay, null], description: How the job passes the pay rule. }
        badge: { type: [string, 'null'], description: '`critical_skills_eligible`, `sponsor_confirmed` or null.' }
        quotaFull: { type: boolean, description: 'The job''s General permit quota is full (#85); the job sorts last and the card shows a label.' }
        postedAt: { $ref: '#/components/schemas/Timestamp' }
        sponsorPermits: { type: [integer, 'null'], description: DETE permits of the last 5 years when the employer has any. }
        lastCheckedAt: { type: [string, 'null'], format: date-time, description: When the job's source last fetched without error. }
        contractMonths: { type: [integer, 'null'], description: 'Months of a fixed-term contract, null when not stated.', example: 24 }
        permitHistory: { enum: [has_history, first_time, not_linked], description: What the employer's DETE permit history is. }
        source: { enum: [fetched, employer, agency, admin_manual], description: Where the job came from. }
        employerSlug: { type: string, description: The employer's company page slug., example: example-care }
        employerLogoUrl: { type: [string, 'null'], description: 'The employer''s logo; null means the card shows the initials of employerName.', example: null }
        payScaleLine: { type: [string, 'null'], description: 'When payGrade is a grade code of the public pay scales in force (#269): "Pay scale for this grade: EUR X to Y" (placeholder wording). Null otherwise.', example: null }
    PublicJobList:
      type: object
      required: [jobs, next, previous, count, signInForMore]
      properties:
        jobs: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/JobCard' } }
        next: { type: [string, 'null'], description: Token for the next page (always null for a visitor). }
        previous: { type: [string, 'null'], description: Token for the page before (with `before=`). }
        count: { $ref: '#/components/schemas/Count' }
        signInForMore: { type: boolean, description: True when a visitor was shown 6 jobs and more exist. }
    PublicScopedJobs:
      type: object
      required: [jobs, next, count, signInForMore]
      properties:
        jobs: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/JobCard' } }
        next: { type: [string, 'null'] }
        count: { $ref: '#/components/schemas/Count' }
        signInForMore: { type: boolean }
    Registration:
      type: [object, 'null']
      description: |
        The health registration the role needs (S6, decision #269), from the registration bodies read on each body's own pages. null when
        the code needs no body, or the job title is known to be unregulated. Placeholder wording.
      required: [status, body, line, steps]
      properties:
        status: { enum: [required, may_need, not_open], description: may_need is a code that mixes regulated and unregulated roles; not_open is a register not open yet. }
        body:
          type: object
          required: [id, name, url, readOn]
          properties:
            id: { enum: [nmbi, medical_council, coru, phecc, psi] }
            name: { type: string }
            url: { type: string, format: uri }
            readOn: { $ref: '#/components/schemas/Date' }
        line: { type: string }
        steps: { type: array, items: { type: string }, description: For an applicant trained outside the EU. Empty unless status is required. }
        degreeNote: { type: string, description: Nurses and midwives only. }
    SmallJobCard:
      type: object
      description: The card of a saved, tracked or similar job.
      required: [jobId, title, employerName]
      properties:
        jobId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        employerName: { type: string }
        county: { type: [string, 'null'] }
        salaryLow: { type: [integer, 'null'] }
        salaryHigh: { type: [integer, 'null'] }
        payGrade: { type: [string, 'null'] }
        badge: { type: [string, 'null'] }
        salaryLine: { type: [string, 'null'], description: 'As on JobCard. Saved, tracked and similar cards of a live job only (not the did-you-apply prompts, not a job that is not live).', example: '€38,000 to €45,000' }
        passRoute: { enum: [stated_pay, big_company, pay_floor, public_pay, null], description: 'As on JobCard. Same cards as salaryLine.', example: stated_pay }
        quotaFull: { type: boolean, description: 'As on JobCard. Same cards as salaryLine.', example: false }
        postedAt: { $ref: '#/components/schemas/Timestamp' }
        lastCheckedAt: { type: [string, 'null'], format: date-time, description: 'As on JobCard. Same cards as salaryLine.', example: '2026-11-18T06:00:00.000Z' }
        contractMonths: { type: [integer, 'null'], description: 'As on JobCard. Same cards as salaryLine.', example: 24 }
        permitHistory: { enum: [has_history, first_time, not_linked], description: 'As on JobCard. Same cards as salaryLine.' }
        source: { enum: [fetched, employer, agency, admin_manual], description: 'As on JobCard. Same cards as salaryLine.' }
        employerSlug: { type: string, description: 'As on JobCard. Same cards as salaryLine.', example: example-care }
        employerLogoUrl: { type: [string, 'null'], description: 'As on JobCard. Same cards as salaryLine.', example: null }
        payScaleLine: { type: [string, 'null'], description: 'As on JobCard. Same cards as salaryLine.', example: null }
    Profile:
      type: object
      description: The candidate profile. Every field may be null (not given).
      properties:
        fullName: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], pattern: '^\+?[0-9 ()-]{5,30}$' }
        occupationCode: { oneOf: [{ $ref: '#/components/schemas/OccupationCode' }, { type: 'null' }] }
        yearsExperience: { type: [integer, 'null'], minimum: 0, maximum: 60 }
        hasRelevantDegree: { type: [boolean, 'null'] }
        degreeField: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        degreeAwardedMonth: { type: [string, 'null'], pattern: '^(19[5-9][0-9]|20[0-9][0-9])-(0[1-9]|1[0-2])-01$', description: The first day of the month. Needs `hasRelevantDegree` true. }
        registrationBody: { type: [string, 'null'], minLength: 1, maxLength: 120 }
        registrationNumber: { type: [string, 'null'], minLength: 1, maxLength: 60 }
        registrationStatus: { enum: [none, in_progress, registered, null] }
        locationKind: { enum: [abroad, ireland, null] }
        currentStamp: { enum: ['0', '1', '1A', '1G', '1H', '2', '2A', '3', '4', 4EUFAM, 4D, 4S, '5', '6', null], description: Needs `locationKind` ireland. }
    JobReason:
      enum: [under_review, hidden_after_report, no_longer_available, null]
      description: |
        Why a saved or tracked job is not shown (S20): null while live; `under_review` (under review by the employer), `hidden_after_report`
        (hidden while a report is looked at), `no_longer_available` (closed, expired, or hidden for any other reason). A code only, never the
        report or staff notes; the page words it.
    Alert:
      type: object
      required: [id, occupationCode, sector, county, salaryMin, badge, frequency, status, pauseReason, lastSentAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        occupationCode: { type: [string, 'null'] }
        sector: { type: [string, 'null'] }
        county: { type: [string, 'null'] }
        salaryMin: { type: [integer, 'null'] }
        badge: { type: [string, 'null'] }
        frequency: { enum: [daily, weekly] }
        status: { enum: [active, paused, unsubscribed] }
        pauseReason: { type: [string, 'null'], description: '`candidate`, `stamp_4` or null.' }
        lastSentAt: { type: [string, 'null'], format: date-time }
    AlertFilters:
      type: object
      description: Filters only, no free text. A filter left out or null means "any".
      properties:
        occupationCode: { oneOf: [{ $ref: '#/components/schemas/OccupationCode' }, { type: 'null' }] }
        sector: { oneOf: [{ $ref: '#/components/schemas/Sector' }, { type: 'null' }] }
        county: { oneOf: [{ $ref: '#/components/schemas/County' }, { type: 'null' }] }
        salaryMin: { type: [integer, 'null'], minimum: 0, maximum: 1000000 }
        badge: { enum: [sponsor_confirmed, critical_skills_eligible, null], description: 'Only jobs with this badge (the same two values as the job search).' }
        frequency: { enum: [daily, weekly] }
    AlertReply:
      type: object
      required: [alert]
      properties:
        alert: { $ref: '#/components/schemas/Alert' }
    ServicesCase:
      type: object
      description: One permit services case as the requester side sees it. Never a note, a staff name or a staff id.
      required: [id, status, decisionOutcome, permitType, jobId, jobTitle, createdAt, lastChangeAt, documentCount]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { enum: [received, documents_needed, waiting_for_employer, submitted, decision, closed] }
        decisionOutcome: { enum: [granted, refused, null], description: Set by staff at decision. }
        permitType: { enum: [critical_skills, general] }
        jobId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        jobTitle: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastChangeAt: { $ref: '#/components/schemas/Timestamp', description: The newest timeline event, or the creation time. }
        documentCount: { type: integer, minimum: 0, description: Stored copies this side uploaded (deleted copies not counted). }
    FreeCheck:
      type: [object, 'null']
      description: The eligibility checker (GET /api/checker on the candidate site, the rules in force) run on the offer details; null when the offer lacks occupationCode, annualPay or relevantDegree.
      required: [qualifies, reason, minimum, why, standingLine, rulesCheckedOn, registration]
      properties:
        qualifies: { type: boolean }
        reason: { type: string }
        minimum: { type: [number, 'null'] }
        why: { type: string }
        standingLine: { type: string }
        rulesCheckedOn: { type: string }
        registration: { type: [object, 'null'] }
    OfferDetails:
      type: object
      description: >-
        The offer as the requester types it: any of these keys, each a string of 1 to 500 characters after trimming, with no control or
        format characters. When occupationCode, annualPay and relevantDegree are all given, they (with the other checker keys) must have
        the checker's own shapes (GET /api/checker), else 400.
      additionalProperties: false
      properties:
        occupationCode: { type: string, minLength: 1, maxLength: 500 }
        annualPay: { type: string, minLength: 1, maxLength: 500 }
        relevantDegree: { type: string, minLength: 1, maxLength: 500 }
        degreeAwardMonth: { type: string, minLength: 1, maxLength: 500 }
        contractMonths: { type: string, minLength: 1, maxLength: 500 }
        weeklyHours: { type: string, minLength: 1, maxLength: 500 }
        title: { type: string, minLength: 1, maxLength: 500 }
        employerName: { type: string, minLength: 1, maxLength: 500 }
        startDate: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, minLength: 1, maxLength: 500 }
    CaseDocument:
      type: object
      required: [id, fileName, contentType, sizeBytes, uploadedAt, copyDeleted]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fileName: { type: string, maxLength: 200 }
        contentType: { enum: [pdf, jpeg, png] }
        sizeBytes: { type: integer }
        uploadedAt: { $ref: '#/components/schemas/Timestamp' }
        copyDeleted: { type: boolean, description: True when the stored copy was removed (the row stays). }
    Cv:
      type: object
      required: [fileName, contentType, sizeBytes, uploadedAt]
      properties:
        fileName: { type: string, maxLength: 200 }
        contentType: { enum: [pdf, docx] }
        sizeBytes: { type: integer, maximum: 4194304 }
        uploadedAt: { $ref: '#/components/schemas/Timestamp' }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { const: true }
    Upload:
      type: object
      description: 'A multipart/form-data body with exactly one part, named `file`. The type is read from the bytes; the declared type and the name are not trusted.'
      required: [file]
      additionalProperties: false
      properties:
        file: { type: string, contentMediaType: application/octet-stream, description: At most 4194304 bytes. }
  headers:
    RetryAfter:
      description: Seconds until the limit that was hit has a new window.
      schema: { type: integer, minimum: 1 }
      example: 42
  securitySchemes:
    candidateSession:
      type: apiKey
      in: cookie
      name: candidate.session_token
      description: The candidate pool's Better Auth session cookie (`__Secure-candidate.session_token` over HTTPS).
  responses:
    BadRequest:
      description: '`BAD_REQUEST`: the body is not JSON, or a field is unknown, missing, of the wrong type or outside its limits.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: BAD_REQUEST }
    NoSession:
      description: '`NO_SESSION`: no candidate session cookie, or it is expired or forged.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: NO_SESSION }
    ReadForbidden:
      description: '`REFUSED`: the candidate is suspended or deleted.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: REFUSED }
    WriteForbidden:
      description: '`BAD_ORIGIN`: the Origin header is not the candidate site. `REFUSED`: the candidate is suspended or deleted, or a database rule refused the change.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: BAD_ORIGIN }
    BodyTooLarge:
      description: '`BODY_TOO_LARGE`: the Content-Length or the body is over the cap.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: BODY_TOO_LARGE }
    WriteTooMany:
      description: '`TOO_MANY_REQUESTS`: over 60 writes in 10 minutes by this login (every candidate write counts together). No Retry-After.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: TOO_MANY_REQUESTS }
    PublicTooMany:
      description: '`TOO_MANY_REQUESTS`: a visitor over 60 reads a minute or 600 an hour from one address, or a candidate over 300 reads a minute.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: TOO_MANY_REQUESTS }
    PublicBadRequest:
      description: '`BAD_REQUEST`: a bad id, slug, code, sort, filter or paging token, a filter given twice, or `after` and `before` together.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: BAD_REQUEST }
    SignInForMore:
      description: '`SIGN_IN_FOR_MORE`: a visitor sent `after` or `before`. Visitors see the first 6 jobs only.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: SIGN_IN_FOR_MORE }
    PublicNotFound:
      description: '`NOT_FOUND`: no live item with that id, slug or code.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: NOT_FOUND }
    UploadBadRequest:
      description: '`BAD_REQUEST`: not multipart/form-data, not exactly one part named `file`, or a bad case id. `EMPTY_FILE`: the file has no bytes.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: EMPTY_FILE }
    FileTooLarge:
      description: '`FILE_TOO_LARGE`: the Content-Length or the bytes read are over 4210688 (4 MiB file plus 16 KiB of multipart wrapping), or the file is over 4194304 bytes.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: FILE_TOO_LARGE }
    WrongFileType:
      description: '`WRONG_FILE_TYPE`: the bytes are not one of the allowed types, an image (PNG, JPEG, WebP) does not decode or is over 40,000,000 pixels, or a PDF is cut short (no %%EOF at its end). Images are stored re-encoded, with no metadata (disarm at upload, S-Q6).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: WRONG_FILE_TYPE }
    ActiveContent:
      description: '`FILE_ACTIVE_CONTENT`: a PDF that carries active content (/JavaScript, /JS, /OpenAction, /AA, /Launch, /EmbeddedFile(s), /RichMedia, /XFA, also escaped or inside an object stream), is encrypted, or hides objects behind a filter the check cannot read, or an object stream that inflates past 16 MiB.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: FILE_ACTIVE_CONTENT }
    UploadTooMany:
      description: '`TOO_MANY_REQUESTS`: over 60 candidate writes in 10 minutes, or over 10 uploads in an hour, by this login.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: TOO_MANY_REQUESTS }
    FilesUnavailable:
      description: '`FILES_UNAVAILABLE`: file storage is not set up on this deployment.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodeError' }
          example: { code: FILES_UNAVAILABLE }
tags:
  - name: public
    description: Open to visitors; a signed-in candidate gets more.
  - name: account
    description: The signed-in candidate's own data.
  - name: alerts
    description: Job alerts and the unsubscribe link.
  - name: files
    description: The CV and services case documents.
  - name: services
    description: Permit services requests and the case tracker.
  - name: auth
    description: Better Auth's own routes.
  - name: ops
    description: Health check.
paths:
  /api:
    get:
      operationId: candidateApiIndex
      tags: [ops]
      summary: Index of this app's routes
      description: >-
        This app's name, the deployed commit (`version`, set per deploy; `local` on a developer machine), the environment, the time and
        every route of the candidate site as `METHOD /path (who may call it)`, keyed by operationId; "(anyone)" is left out. Made from this file
        (decision #265): the sync test fails when `lib/api-index.json` differs from it. Anyone may read it (these routes are visible in any browser anyway). It reads no request input and no database, so no Origin check.
      security: []
      x-roles: [anyone]
      x-rate-limit: none

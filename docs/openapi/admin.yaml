        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }

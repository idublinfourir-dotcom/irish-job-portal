      x-rate-limit: none
      x-body-cap: 400000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, purpose, version, body]
                  properties:
                    action: { const: propose }
                    purpose: { type: string, enum: [signup_terms, portal_signup_terms, privacy_notice, cookie_policy, employer_acceptable_use, data_retention] }
                    version: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
                    body: { type: string, minLength: 1, maxLength: 100000 }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm, refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: propose, purpose: privacy_notice, version: '2026-12-01', body: PLACEHOLDER TEXT. }
      responses:
        '200':
          description: "`propose`: the request id. `confirm`: the published row (id, purpose, version, publishedAt). `refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  id: { $ref: '#/components/schemas/Id' }
                  purpose: { type: string, enum: [signup_terms, portal_signup_terms, privacy_notice, cookie_policy, employer_acceptable_use, data_retention] }
                  version: { type: string }
                  publishedAt: { $ref: '#/components/schemas/DbTime' }
              example: { ok: true, requestId: '131' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 400,000 characters. `bad_action`: unknown action. `bad_purpose`: not one of the three purposes. `bad_version`: not a label of the shape above. `bad_body_text`: blank, too long, holds a control or format character, or breaks the body format (B16: HTML, a `# ` heading, a link that is not https or a site path, a table with uneven rows). `bad_request_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_body_text } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `reauth_required` (C4): propose or confirm with a session older than 10 minutes. `not_active_staff`: the login is not active. `not_content_editor`: proposing without the content editor role. `not_administrator`: confirming, or refusing someone else's proposal, without the administrator role. `not_legal_staff`: refusing with neither role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: reauth_required } } }
        '404':
          description: "`not_found`: no such legal text request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`version_taken`: that label is already published for the purpose. `decision_pending`: a proposal for the purpose waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_person } } }
        '500': { $ref: '#/components/responses/ServerError' }

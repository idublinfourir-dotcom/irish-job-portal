        `privacy_notice`, and the public texts `cookie_policy`, `employer_acceptable_use`, `data_retention`), newest first within a purpose (the first of a purpose is the text in force), each with its body, and the proposals
        waiting for an administrator. The real wording waits for the solicitor and the entity; the placeholders come from signup-terms-cli.ts.
        No query key is allowed.

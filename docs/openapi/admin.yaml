        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnDataRequest
      summary: Ask the account owner to confirm, erase the account a data request names, or close the request
      description: >-
        The account is the one candidate or portal login whose email is the requester's email on the item's contact message (compared in
        lower case). Refused when none matches (`no_account`), when a candidate and a portal login share the address (`several_accounts`), or
        when a signed-in sender typed another login's address (`sender_not_account`). Staff never receive anyone's data (decision #271).
        `send_confirm` (`purpose` export or erase): queues one email, placeholder wording, to that login's own confirmed address (never the
        address typed on the form) with a one-time link to its own site (`GET` and `POST /api/data-request` on the candidate or employer site),
        made when the outbox sends it and valid for 7 days; only its hash is kept. A new send ends an older link and an older confirmation.
        Refused `email_not_confirmed` and `account_deleted`. For an export the owner downloads it from the link. `close`: ends an open item
        (its link stops working), with an audit row. `erase_propose`: refused `not_confirmed` unless the request is proved (sent by that login
        while signed in, or its owner confirmed an erase from the link); one pending erase per item. `erase_confirm`: a different administrator
        confirms and the erase runs at once, as the retention erase does: refused, and the request left pending, while the person has an open
        services case or is the target of an open report (or, for a portal login, is an account owner with other active members, or the only
        active owner of an open company), when the item is no longer open (`not_open`), or when the match or the proof has changed. The stored
        files are removed, every visitor message from the requester's address (the request's own among them) is emptied and the open items
        pointing to them close, the item closes and one audit row names both administrators. `erase_refuse`: a different administrator refuses,
        or the proposer withdraws. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId, purpose]
                  properties:
                    action: { const: send_confirm }
                    itemId: { $ref: '#/components/schemas/Id' }
                    purpose: { type: string, enum: [export, erase] }
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [close, erase_propose] }
                    itemId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [erase_confirm, erase_refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: send_confirm, itemId: '52', purpose: erase }
      responses:
        '200':
          description: "`send_confirm`: the account and the purpose. `erase_propose`: the account and the request id. `erase_confirm`: the account and the stored files removed. `close` and `erase_refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [ok, kind, userId, purpose]
                    properties:
                      ok: { const: true }
                      kind: { type: string, enum: [candidate, portal] }
                      userId: { $ref: '#/components/schemas/LoginId' }
                      purpose: { type: string, enum: [export, erase] }
                  - type: object
                    additionalProperties: false
                    required: [ok, kind, userId, requestId]
                    properties:
                      ok: { const: true }
                      kind: { type: string, enum: [candidate, portal] }
                      userId: { $ref: '#/components/schemas/LoginId' }
                      requestId: { $ref: '#/components/schemas/Id' }
                  - type: object
                    additionalProperties: false
                    required: [ok, kind, userId, filesRemoved]
                    properties:
                      ok: { const: true }
                      kind: { type: string, enum: [candidate, portal] }
                      userId: { $ref: '#/components/schemas/LoginId' }
                      filesRemoved: { type: integer }
                  - type: object
                    additionalProperties: false
                    required: [ok]
                    properties:
                      ok: { const: true }
              example: { ok: true, kind: candidate, userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', purpose: erase }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over the cap. `bad_action`: unknown action. `bad_item_id`, `bad_request_id`: not an id. `bad_purpose`: not export or erase."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_item_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role. `reauth_required` (C4, #270, audit SEC-12): proposing or confirming an erasure on a session older than 10 minutes; sign in again (the other actions work on any session)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no open data request item with this id, or no such erase request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`no_account`, `several_accounts`, `sender_not_account`: see above. `email_not_confirmed`, `account_deleted`: no confirm email can go. `not_confirmed`: the owner has not confirmed an erase. `open_services_case`, `open_report`, `owner_with_members`, `not_open`, `account_changed`: the erase is refused for now. `close_company_first`: the login is the only active owner of an open company; close the company first, or a member joins and takes the owner role (`/api/companies/owner-reassign`). `decision_pending`: an erase of this item waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_confirmed } } }
        '500': { $ref: '#/components/responses/ServerError' }

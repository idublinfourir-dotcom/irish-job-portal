    post:
      operationId: actOnFetchedJobItem
      summary: Claim, release, approve or reject a fetched job
      description: >-
        `claim` takes an open item (or a stale claim). Only the claimer releases, approves or rejects. `approve` re-runs the rules chain on
        the saved advert with the claimer's occupation code (four digits, on the Critical Skills or Ineligible list) and, if given, the pay
        (whole euros a year, 1 to 1,000,000; a top needs a bottom and may not be below it) and the contract; only a pass the fetcher would
        make live goes live, otherwise `rules_failed` with the stage and the item stays claimed. `reject` closes the job as removed. The
        Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [fetched_job_reviewer]
      x-rate-limit: none
      x-body-cap: 600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [claim, release] }
                    itemId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, occupationCode]
                  properties:
                    action: { const: approve }
                    itemId: { $ref: '#/components/schemas/Id' }
                    occupationCode: { type: string, pattern: '^[0-9]{4}$' }
                    salaryLow: { type: integer, minimum: 1, maximum: 1000000 }
                    salaryHigh: { type: integer, minimum: 1, maximum: 1000000 }
                    contractConfirmed: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, reason]
                  properties:
                    action: { const: reject }
                    itemId: { $ref: '#/components/schemas/Id' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: approve, itemId: '3301', occupationCode: '2136', salaryLow: 45000, salaryHigh: 60000, contractConfirmed: true }
      responses:
        '200':
          description: "`approve` also gives the job and its pass route; the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  jobId: { $ref: '#/components/schemas/Id' }
                  passRoute: { type: string, enum: [stated_pay, big_company] }
              example: { ok: true, jobId: '6601', passRoute: stated_pay }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, or over 600 characters. `bad_action`: unknown action.
            `bad_item_id`: not an id. `bad_occupation_code`: not four digits, or on neither list. `bad_salary`: out of range, a top with no
            bottom, or a top below the bottom. `bad_input`: contractConfirmed not a boolean. `bad_reason`: not a reason code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_salary } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_reviewer`: no fetched_job_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `already_decided`, `claimed_by_other`, `not_claimed`, `not_claimer`: the item's state does not allow it. `job_not_in_review`: the
            job left review. `no_advert_text`: no saved advert to re-run the rules on. `rules_failed`: the rules did not pass; `stage` names
            the stage that failed.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: rules_failed, stage: 5 pay } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/manual-jobs:
    get:
      operationId: listManualPosts
      summary: List the staff manual posts
      description: >-
        The jobs staff posted by hand, newest first, 20 a page. The next page is asked for with `before` (the `next` value of the page
        before, here a plain job id). `reason` says why a draft is not listed. Other query keys are ignored.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - { name: before, in: query, required: false, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManualRow' } }
                  next: { type: [string, 'null'] }
              example:
                items:
                  - { id: '7701', organisation_id: '310', display_name: Example Care Ltd, title: Senior Care Assistant, status: draft, pass_route: null, posted_by_staff_id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', posted_at: '2026-11-18 09:30:00.123456+00', closes_at: '2026-12-31 23:59:59+00', closed_at: null, reason: pay_below_minimum }
                next: null
        '400':
          description: "`bad_cursor`: `before` is not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_manual_viewer`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_manual_viewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnManualPost
      summary: Post a job by hand, or close one's own manual post
      description: >-
        `create` posts a job for an existing employer or agency. It is listed (live, "Critical Skills eligible") only when it passes the
        checks an employer post runs (the occupation list, the contract, the rules chain, then the pay against the minimum for the stated
        hours); otherwise it stays a draft and `reason` says why. Never "Sponsor confirmed". `close` closes a manual post the same staff
        member posted. The Origin header must be the admin app's origin. Field rules for create: title 2 to 200 characters on one line;
        description 20 to 10,000 characters (line breaks and tabs allowed); county one of the 26 counties; occupationCode a SOC 2010 code;
        contractMonths 1 to 600 or null (null means permanent); salaryLow and salaryHigh 1 to 1,000,000 or null (pay or a public pay grade
        is needed; a top needs a bottom and may not be below it); payGrade 1 to 100 characters or null; healthInsuranceEur 0 to 50,000 or
        null; weeklyHours 1 to 60; closesOn a real day, after now and at most 90 days ahead; applyUrl an https address of 10 to 500
        characters with no user name or password.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 30000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, organisationId, title, description, county, occupationCode, weeklyHours, closesOn, applyUrl]
                  properties:
                    action: { const: create }
                    organisationId: { $ref: '#/components/schemas/Id' }
                    title: { type: string, minLength: 2, maxLength: 200 }
                    description: { type: string, minLength: 20, maxLength: 10000 }
                    county: { type: string, enum: [Carlow, Cavan, Clare, Cork, Donegal, Dublin, Galway, Kerry, Kildare, Kilkenny, Laois, Leitrim, Limerick, Longford, Louth, Mayo, Meath, Monaghan, Offaly, Roscommon, Sligo, Tipperary, Waterford, Westmeath, Wexford, Wicklow] }
                    occupationCode: { type: string, pattern: '^[0-9]{4}$' }
                    contractMonths: { type: [integer, 'null'], minimum: 1, maximum: 600 }
                    salaryLow: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
                    salaryHigh: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
                    payGrade: { type: [string, 'null'], minLength: 1, maxLength: 100 }
                    healthInsuranceEur: { type: [integer, 'null'], minimum: 0, maximum: 50000 }
                    weeklyHours: { type: integer, minimum: 1, maximum: 60 }
                    closesOn: { $ref: '#/components/schemas/Date' }
                    applyUrl: { type: string, format: uri, minLength: 10, maxLength: 500 }
                - type: object
                  additionalProperties: false
                  required: [action, jobId]
                  properties:
                    action: { const: close }
                    jobId: { $ref: '#/components/schemas/Id' }
            example: { action: close, jobId: '7701' }
      responses:
        '200':
          description: "`create`: the job, its status and why it is a draft. `close`: the job id."
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId]
                properties:
                  ok: { const: true }
                  jobId: { $ref: '#/components/schemas/Id' }
                  status: { type: string, enum: [live, draft] }
                  passRoute: { type: [string, 'null'], enum: [stated_pay, public_pay, null] }
                  reason:
                    type: [object, 'null']
                    properties:
                      code: { type: string }
                      stage: { type: string }
              example: { ok: true, jobId: '7701', status: draft, passRoute: null, reason: { code: pay_below_minimum } }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, or over 30,000 characters. `bad_action`: not create or close. `bad_input`:
            close with a jobId that is not an id. Create: `bad_organisation_id`, `bad_title`, `bad_apply_url`, `bad_description`,
            `bad_county`, `bad_occupation_code`, `bad_contract_months`, `bad_salary`, `bad_pay_grade`, `bad_health_insurance`,
            `bad_weekly_hours`, `bad_closes_on` (not a real day), `bad_closing_date` (in the past or over 90 days ahead).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_closing_date } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role. `not_poster`: close of a manual post somebody else posted."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_poster } } }
        '404':
          description: "`company_not_found`: no such company (create). `not_found`: no such manual post (close)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: company_not_found } } }
        '409':
          description: "`company_not_postable`: not an employer or agency, merged, or rejected, closed, banned or suspended. `bad_state`: close of a post already closed or hidden."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: company_not_postable } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/pay-floors:
    get:
      operationId: listFloorChecks
      summary: List pay floors waiting for a check, or show one
      description: >-
        Without `id`: the signed pay floors waiting for their staff check, oldest first, 20 a page. With `id` (a floor id, not an item id):
        that floor's check item, whatever its state. Other query keys are ignored.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, description: "A pay floor id.", schema: { type: string }, example: '61' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/FloorCheck' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/FloorCheck' }
              example:
                items:
                  - { floorId: '61', itemId: '4401', createdAt: '2026-11-18 09:30:00.123456+00', roleFamily: '2136', floorEur: 52000, signedAt: '2026-11-18 09:30:00.123456+00', validUntil: '2027-11-18 09:30:00.123456+00', signerName: Example Signer, signerTitle: Account owner, organisationId: '330', displayName: Example Global Ltd, kind: employer, isBigCompany: true, organisationStatus: verified, currentFloorEur: null, requestId: null, proposedBy: null }
                next: null
        '400':
          description: "`bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_floor_staff`: neither rules_data_editor nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_floor_staff } } }
        '404':
          description: "`not_found`: the floor has no check item (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnPayFloor
      summary: Propose, confirm or reject a pay floor
      description: >-
        Two people: a rules_data_editor checks the floor and `propose`s it; an administrator who did not propose `confirm`s, and the floor
        becomes active at once (an active floor of the same role family is replaced). `reject` (either role, a reason code) ends the floor
        and drops a pending proposal. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor (propose), administrator (confirm), rules_data_editor or administrator (reject)]
      x-rate-limit: none
      x-body-cap: 500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, floorId]
                  properties:
                    action: { type: string, enum: [propose, confirm] }
                    floorId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, floorId, reason]
                  properties:
                    action: { const: reject }
                    floorId: { $ref: '#/components/schemas/Id' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: propose, floorId: '61' }
      responses:
        '200':
          description: "`propose`: the approval request. `confirm`: the floor and the floor it replaced. `reject`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  floorId: { $ref: '#/components/schemas/Id' }
                  replacedId: { type: [string, 'null'] }
              example: { ok: true, floorId: '61', replacedId: null }
        '400':
          description: "`bad_body`: not one JSON object, an unknown field, or over 500 characters. `bad_action`: unknown action. `bad_floor_id`: not an id. `bad_reason`: reject without a reason code, or a reason on propose or confirm."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_rules_editor`: propose without rules_data_editor. `not_administrator`: confirm without administrator. `not_floor_staff`: reject with neither role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such floor."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`floor_not_pending`: the floor is not waiting for its check. `floor_expired`, `not_big_company`, `organisation_not_active`: the floor can no longer be made active. `decision_pending`: propose when a proposal waits. `nothing_pending`: confirm with no proposal. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_person } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/rules:
    get:
      operationId: listRules
      summary: List the rules versions
      description: >-
        The rules versions in force today, the confirmed ones still to come, and the pending proposals with their change against the
        version in force (entries added, removed and changed). Any active staff member. Query keys are ignored.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The versions and proposals.
          content:
            application/json:
              schema:
                type: object
                required: [inForce, upcoming, pending]
                properties:
                  inForce: { type: array, items: { $ref: '#/components/schemas/RulesVersion' } }
                  upcoming: { type: array, items: { $ref: '#/components/schemas/RulesVersion' } }
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, kind, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        kind: { type: string, description: "A rules kind, or `big_company_flag` for the flag on one company." }
                        effectiveFrom: { type: string }
                        organisationId: { $ref: '#/components/schemas/Id' }
                        displayName: { type: [string, 'null'] }
                        proposedBy: { type: string }
                        createdAt: { type: string }
                        change: { $ref: '#/components/schemas/RulesChange' }
              example:
                inForce: [{ kind: minimums, versionId: '3', effectiveFrom: '2026-01-01', data: { criticalSkills: 40000 } }]
                upcoming: []
                pending: [{ requestId: '90', kind: big_company_flag, organisationId: '330', displayName: Example Global Ltd, proposedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', createdAt: '2026-11-18 09:30:00.123456+00' }]
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnRules
      summary: Propose, confirm, refuse or withdraw a rules change
      description: >-
        `propose` (rules_data_editor): a whole new version of one kind, in force from `effectiveFrom` (today or later); `data` is checked
        for its kind (packages/db/src/rules-data.ts), and a new or changed big-company name needs its link, date read and next review date.
        One pending proposal per kind. `propose_flag` (rules_data_editor): set the big-company flag on one company, refused unless one of
        its names matches a big-company name in force. `confirm` and `refuse` (an administrator who did not propose): confirm writes the
        version or sets the flag in the same transaction; confirming new minimums queues one email and portal notice per company with a
        live or draft job. `withdraw`: the proposer withdraws their own proposal. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor (propose, propose_flag), administrator (confirm, refuse), the proposer (withdraw)]
      x-rate-limit: none
      x-body-cap: 300000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, kind, effectiveFrom, data]
                  properties:
                    action: { const: propose }
                    kind: { $ref: '#/components/schemas/RulesKind' }
                    effectiveFrom: { $ref: '#/components/schemas/Date' }
                    data: { description: The whole version for its kind. }
                - type: object
                  additionalProperties: false
                  required: [action, organisationId]
                  properties:
                    action: { const: propose_flag }
                    organisationId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm, refuse, withdraw] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: propose_flag, organisationId: '330' }
      responses:
        '200':
          description: "`propose`: the request and the change. `propose_flag`: the request. `confirm`: the version written (null for a flag) and the emails queued. `refuse`, `withdraw`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  change: { $ref: '#/components/schemas/RulesChange' }
                  versionId: { type: [string, 'null'] }
                  notices: { type: integer }
              example: { ok: true, versionId: '4', notices: 12 }
        '400':
          description: >-
            `bad_body`: not one JSON object, a field that does not belong to the action, a missing field, kind or effectiveFrom not a
            string, or over 300,000 characters. `bad_action`: unknown action. `bad_id`: requestId or organisationId not an id. `bad_kind`:
            not a rules kind. `bad_date`: not a real day. `bad_data`: the data does not fit its kind; `detail` names the first problem
            (`RulesDataError`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulesDataError' }
              example: { error: bad_data, detail: 'minimums: checkedOn is not a date' }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_rules_editor`: propose without rules_data_editor. `not_administrator`: confirm or refuse without administrator. `not_proposer`: withdraw of someone else's proposal."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_proposer } } }
        '404':
          description: "`not_found`: no such company (propose_flag) or no such rules request (confirm, refuse, withdraw)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`date_in_past`: effectiveFrom before today. `no_change`: the data equals the version in force. `decision_pending`: a proposal for this kind or company waits already. `already_big`: the company has the flag. `no_name_match`: none of the company's names is a big-company name in force. `not_pending`: the request is not pending. `same_person`: the proposer confirming or refusing. `date_passed`: confirm after the proposed date."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: no_change } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/staff:
    get:
      operationId: listStaff
      summary: List staff logins and pending role grants
      description: >-
        Every staff login with its roles and status (at most 200; `truncated` says more exist), and the role grants waiting for a second
        administrator. No query key is allowed (`bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema:
                type: object
                required: [staff, truncated, pending]
                properties:
                  staff: { type: array, items: { $ref: '#/components/schemas/StaffRow' } }
                  truncated: { type: boolean }
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, staffId, role, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        staffId: { $ref: '#/components/schemas/LoginId' }
                        role: { $ref: '#/components/schemas/StaffRole' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example:
                staff: [{ id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', name: Example Reviewer, email: reviewer@example.com, status: active, createdAt: '2026-11-01 09:30:00.123456+00', roles: [account_reviewer] }]
                truncated: false
                pending: []
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnStaff
      summary: Grant, remove or confirm roles; disable or enable a login
      description: >-
        `propose_role`: an administrator proposes a role for a login (one pending grant per login and kind). `confirm_role`: a different
        administrator confirms and the role is written. `refuse_role`: a different administrator refuses, or the proposer withdraws.
        `remove_role`: one administrator removes a role at once. `disable`: the login is disabled and its sessions end in the same
        transaction. `enable`: a disabled login with no roles is turned back on. Nothing here makes a login (the owner's command does). The
        last active administrator cannot lose the role or be disabled. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, staffId, role]
                  properties:
                    action: { type: string, enum: [propose_role, remove_role] }
                    staffId: { $ref: '#/components/schemas/LoginId' }
                    role: { $ref: '#/components/schemas/StaffRole' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm_role, refuse_role] }
                    requestId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, staffId]
                  properties:
                    action: { type: string, enum: [disable, enable] }
                    staffId: { $ref: '#/components/schemas/LoginId' }
            example: { action: propose_role, staffId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', role: content_editor }
      responses:
        '200':
          description: "`propose_role`: the request id. `confirm_role`: the login and role written. `disable`: the sessions ended. The rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  staffId: { $ref: '#/components/schemas/LoginId' }
                  role: { $ref: '#/components/schemas/StaffRole' }
                  sessionsEnded: { type: integer }
              example: { ok: true, requestId: '120' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 500 characters. `bad_action`: unknown action. `bad_staff_id`: not a login id. `bad_request_id`: not an id. `bad_role`: not one of the seven roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_role } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such login, request, or role on that login."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`target_not_active`: the login is disabled. `already_holds`: it has the role. `grant_pending`: a grant of that kind waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming. `last_administrator`: it would leave no active administrator. `already_disabled`, `not_disabled`: the login's status. `holds_roles`: enable of a login that still holds roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: last_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/reports:
    get:
      operationId: listReports
      summary: List open job reports, or show one
      description: >-
        Without `id`: the open and job_hidden reports, oldest first, 20 a page (no evidence text, no reporter). With `id`: one report with
        its evidence, the job as reported and, until it is decided, who reported it. Other query keys are ignored.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '801' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`; adds evidenceText, targetSnapshot, reporterCandidateUserId, reporterPortalUserId, decidedByStaffUserId, decidedAt and caseId).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ReportSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        allOf:
                          - $ref: '#/components/schemas/ReportSummary'
                          - type: object
                            properties:
                              evidenceText: { type: [string, 'null'] }
                              targetSnapshot: { description: The job as it was when reported (any JSON). }
                              reporterCandidateUserId: { type: [string, 'null'] }
                              reporterPortalUserId: { type: [string, 'null'] }
                              decidedByStaffUserId: { type: [string, 'null'] }
                              decidedAt: { $ref: '#/components/schemas/NullableTimestamp' }
                              caseId: { type: [string, 'null'] }
              example:
                items: [{ id: '801', status: open, targetKind: job, reason: asks_for_money, createdText: '2026-11-18 09:30:00.123456+00', targetJobId: '5501', jobTitle: Staff Nurse, jobStatus: live, organisationId: '312', displayName: Example Recruitment Ltd }]
                next: null
        '400':
          description: "`bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role (no other role stands in)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such report (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnReport
      summary: Hide the reported job, clear the report, or uphold it
      description: >-
        `hide` hides the live job at once. `clear` closes the report and the job comes back. `uphold` closes the report, the database closes
        a hidden job, and a case opens on the job's company (`caseKind` and `reasonCode` must pair: false_claim with false_sponsorship,
        false_pay_floor with false_pay_floor, instant_ban with asks_for_money, fake_company or fake_job). `noticeSummary` 1 to 1,000
        characters (line breaks and tabs allowed). The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      x-body-cap: 12000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, reportId]
                  properties:
                    action: { type: string, enum: [hide, clear] }
                    reportId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, reportId, caseKind, reasonCode]
                  properties:
                    action: { const: uphold }
                    reportId: { $ref: '#/components/schemas/Id' }
                    caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban] }
                    reasonCode: { type: string, enum: [false_sponsorship, false_pay_floor, asks_for_money, fake_company, fake_job] }
                    noticeSummary: { type: string, maxLength: 1000 }
            example: { action: uphold, reportId: '801', caseKind: instant_ban, reasonCode: asks_for_money }
      responses:
        '200':
          description: "`uphold` answers the new case id; the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  caseId: { $ref: '#/components/schemas/Id' }
              example: { ok: true, caseId: '51' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 12,000 characters. `bad_action`: unknown action. `bad_id`, `bad_kind`, `bad_reason`, `bad_summary`: a field of the wrong shape; `bad_reason` also when caseKind and reasonCode do not pair."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`, `not_trust_and_safety`: as on GET."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such report."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`: the report was cleared or upheld. `already_hidden`: hide of a job hidden already. `job_not_live`: hide of a job that is not live."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_hidden } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/cases:
    get:
      operationId: listCases
      summary: List cases that need a step, or show one
      description: >-
        Without `id`: the cases that need a step (undecided, an appeal waiting, or a ban lift waiting for its second person), oldest first,
        20 a page; `after` is the last case id seen (the `next` value, here a plain id). With `id`: one case with its company, pending
        two-person requests, ban rows and whether the WRC report is ticked off. Other query keys are ignored.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '51' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` with every case field (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        type: object
                        description: >-
                          The case row in camel case (id, organisationId, caseKind, jobId, reportId, reasonCode, noticeSummary, level, stage,
                          outcome, the reply and appeal fields and who entered them, decidedBy and decidedAt, banLiftedAt, createdAt), the
                          company (displayName, organisationKind, organisationStatus, restrictedUntil, claimsRemovedAt), `pending` (the
                          two-person requests), `bans` and `wrcReported`.
                        required: [id, organisationId, caseKind, stage, pending, bans, wrcReported]
                        properties:
                          id: { $ref: '#/components/schemas/Id' }
                          organisationId: { $ref: '#/components/schemas/Id' }
                          caseKind: { type: string }
                          stage: { type: string }
                          pending: { type: array, items: { type: object } }
                          bans: { type: array, items: { type: object } }
                          wrcReported: { type: boolean }
              example:
                items: [{ id: '51', organisationId: '312', displayName: Example Recruitment Ltd, caseKind: instant_ban, reasonCode: asks_for_money, stage: case_open, outcome: null, level: null, replyDueAt: null, appealDueAt: null, createdAt: '2026-11-18T09:30:00.000Z' }]
                next: null
        '400':
          description: "`bad_cursor`: `after` is not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such case (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnCase
      summary: One step of a trust and safety case
      description: >-
        `open`: a case on a company (optionally about one of its jobs); an instant_ban case suspends a verified company and hides its live
        jobs at once. `notify`: tell the employer, starting the 7-day reply window. `record_reply`, `record_appeal`: a reply or appeal that
        came by email or post, with when it arrived (text 1 to 5,000 characters, line breaks and tabs allowed). `decide`: cleared, strike or
        (instant_ban cases only) ban; clearing and strike 1 apply at once, strike 2, strike 3 and a ban wait for a second officer;
        `conclusive` only with ban. `confirm`, `refuse`: the second officer on what waits (never the proposer or whoever entered the
        reply). `decide_appeal`: upheld or overturned (not by whoever entered the appeal or decided the case). `propose_ban_lift`: propose
        lifting the case's bans. `mark_wrc`: tick off that an agency's instant-ban case was reported to the WRC. The Origin header must be
        the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      x-body-cap: 12000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, organisationId, caseKind, reasonCode]
                  properties:
                    action: { const: open }
                    organisationId: { $ref: '#/components/schemas/Id' }
                    jobId: { $ref: '#/components/schemas/Id' }
                    caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban] }
                    reasonCode: { type: string, enum: [false_sponsorship, false_pay_floor, asks_for_money, fake_company, fake_job] }
                    noticeSummary: { type: string, maxLength: 1000 }
                - type: object
                  additionalProperties: false
                  required: [action, caseId]
                  properties:
                    action: { type: string, enum: [notify, confirm, refuse, propose_ban_lift, mark_wrc] }
                    caseId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, text, receivedAt]
                  properties:
                    action: { type: string, enum: [record_reply, record_appeal] }
                    caseId: { $ref: '#/components/schemas/Id' }
                    text: { type: string, maxLength: 5000 }
                    receivedAt: { type: string, description: 'An ISO date and time with a zone, for example 2026-11-17T14:05:00Z.', pattern: '^\d{4}-\d\d-\d\dT\d\d:\d\d(:\d\d(\.\d{1,3})?)?(Z|[+-]\d\d:\d\d)$' }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, outcome]
                  properties:
                    action: { const: decide }
                    caseId: { $ref: '#/components/schemas/Id' }
                    outcome: { type: string, enum: [cleared, strike, ban] }
                    conclusive: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, result]
                  properties:
                    action: { const: decide_appeal }
                    caseId: { $ref: '#/components/schemas/Id' }
                    result: { type: string, enum: [upheld, overturned] }
            example: { action: decide, caseId: '51', outcome: strike }
      responses:
        '200':
          description: >-
            `open`: `caseId`. `notify`: `notices` queued. `decide`: `outcome`, `level`, whether it was `applied` and the `requestId` waiting
            for a second officer. `confirm`: what was `applied` (strike_2, strike_3, ban or ban_lift). `decide_appeal`: `result` and
            `liftsProposed`. `propose_ban_lift`: `requests`. The rest `{ ok: true }`.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  caseId: { $ref: '#/components/schemas/Id' }
                  notices: { type: integer }
                  outcome: { type: string }
                  level: { type: integer }
                  applied: { type: [boolean, string] }
                  requestId: { $ref: '#/components/schemas/Id' }
                  result: { type: string }
                  liftsProposed: { type: integer }
                  requests: { type: integer }
              example: { ok: true, outcome: strike, level: 1, applied: true }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, `conclusive` without outcome ban, or over 12,000 characters.
            `bad_action`: unknown action. `bad_id`, `bad_kind`, `bad_reason`, `bad_summary`, `bad_text`, `bad_time`, `bad_outcome`,
            `bad_flag`, `bad_result`: a field of the wrong shape; `bad_reason` also when caseKind and reasonCode do not pair; `bad_outcome`
            also for ban on a case that is not instant_ban or strike on one that is.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_time } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such case, company or job."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `job_not_in_organisation`: open with a job of another company. `already_notified`, `not_notified`, `reply_window_open`: the reply
            window does not allow it yet. `already_decided`, `decision_pending`, `other_case_pending` (another case of the company waits for
            its second person), `nothing_pending`, `nothing_to_ban`, `no_ban`: the case's state. `same_person`, `entered_reply`,
            `entered_appeal`, `decided_case`: the two-person rules. `no_appeal_window`, `already_appealed`, `no_appeal`, `appeal_decided`,
            `window_closed`: the appeal's state. `not_agency_ban`, `already_marked`: mark_wrc on a case it does not apply to, or twice.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: reply_window_open } } }
        '500': { $ref: '#/components/responses/ServerError' }

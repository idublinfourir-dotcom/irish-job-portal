            Content-Security-Policy: { schema: { type: string, const: "frame-ancestors 'self'" } }
          content:
            application/pdf: { schema: { type: string, format: binary }, example: '(the file bytes, at most 4,194,304)' }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '400':
          description: "`bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_rules_viewer`: none of the six roles (a content editor, or no role)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_rules_viewer } } }
        '404':
          description: "`not_found`: no such file (also no `file`, or one that is not a rules evidence id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409': { $ref: '#/components/responses/StaffFileRefused' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. No audit row is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
    post:
      operationId: uploadRulesEvidence
      summary: Upload an evidence file for a pay-deal entry
      description: >-
        B66: `multipart/form-data` with exactly one field `file` (PDF, JPEG or PNG, found from the bytes; at most 4,194,304 bytes). The answer's `file` goes on an entry's
        `evidence.file` in a `propose` of public_pay_employers on /api/rules; nothing changes until a second person confirms that. Order: Origin, the `Content-Length`
        cap (before the session), the session, the role (before the body is read), then the file. A row write that fails removes the stored file.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor]
      x-rate-limit: none
      x-body-cap: 4210688 bytes (4 MiB file plus 16 KiB of multipart wrapping), counted while reading
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, additionalProperties: false, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: The stored file's id and name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, file, contentType, sizeBytes]
                properties:
                  ok: { const: true }
                  file:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: { type: string, description: The id to put on an entry., example: 0f8fad5b-d9cb-469f-a165-70867728950e.pdf }
                      name: { type: string, description: The cleaned file name., example: service-arrangement-2026.pdf }
                  contentType: { type: string, enum: [pdf, jpeg, png], description: The kind found from the bytes., example: pdf }
                  sizeBytes: { type: integer, description: The stored size., example: 182044 }
              example: { ok: true, file: { id: 0f8fad5b-d9cb-469f-a165-70867728950e.pdf, name: service-arrangement-2026.pdf }, contentType: pdf, sizeBytes: 182044 }
        '400':
          description: "`bad_query`: any query key. `bad_file`: not exactly one `file` field. `empty_file`: the file has no bytes."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_file } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: not the admin site's Origin. `not_active_staff`: the login is not active. `not_rules_editor`: no rules_data_editor role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_rules_editor } } }
        '413':
          description: "`file_too_large`: over the cap by header or while reading."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: file_too_large } } }
        '415':
          description: "`wrong_file_type`: the bytes are not a PDF, JPEG or PNG, or the file does not decode (as the sponsor confirmation upload)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: wrong_file_type } } }
        '422':
          description: "`file_active_content`: a PDF that carries active content, is encrypted, or hides objects the check cannot read."

openapi: 3.1.0
info:
  title: Admin API (staff)
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    The routes of the admin app, used by staff only. Every route but the health check needs a staff session, and each
    route checks the staff roles it needs inside the database call, reads included. Nothing here is open to the public.

    ## Conventions (the same text in candidate.yaml, portal.yaml and admin.yaml)

    - **Origin check on writes.** Every POST, PUT and DELETE that a signed-in person sends must carry an `Origin` header equal to its
      own app's origin (the `*_AUTH_URL` setting). Anything else is refused with 403 before the body is read. The exceptions are named
      on the route: the alert unsubscribe (a mail provider's server sends it with no Origin) and the health checks (GET only).
    - **Body size caps.** Every write has a cap, given on the route in `x-body-cap` (characters of the JSON text, or bytes for a
      file upload). A `Content-Length` over the cap is refused before the body is read, and a body over the cap after reading is
      refused too: 413 on the candidate and portal sites, 400 `bad_body` on the admin site. The Better Auth routes
      (`/api/auth/*`) keep Better Auth's own handling; this repo sets no cap there.
    - **Strict bodies.** A body must be one JSON object with exactly the documented fields: an unknown field, a wrong type or a
      value outside its limits is refused with 400 (no field is dropped silently). Strings are trimmed where the route says so and
      may not hold control characters unless the route says line breaks are allowed.
    - **Two error formats exist today.** Most candidate and portal routes answer `{ "code": "UPPER_CASE" }` (`CodeError`); the admin
      routes and a few others answer `{ "error": "lower_case" }` (`ErrorBody`). Each response names which. A 500 never says why
      (`{ "error": "server_error" }` on admin, an empty or framework body elsewhere); the reason stays in the server log.
    - **Sessions.** Each app has its own Better Auth login pool and its own cookie (`candidate.session_token`,
      `portal.session_token`, `staff.session_token`; `__Secure-` in front of the name over HTTPS). A route that needs a session
      answers 401 without one. Sessions are read from the database on every request (no cookie cache), so a suspended, blocked,
      disabled or deleted login is refused on its next request.
    - **Paging.** Lists page by keyset, never by offset: the reply carries an opaque `next` (and sometimes `previous`) token,
      and the next page is asked for with `after=<token>` (or `before=<token>`). A token works only with the sort and filters it was
      made for; a changed or forged token, or another list's token, is 400. Page sizes are given on each route (job lists 20, a
      visitor 6, audit 50, notices 50, content 20, admin queues 20).
    - **Rate limits.** Limits are counted in the database (shared by every server instance). Over a limit the answer is 429; only
      the public candidate reads send `Retry-After` (seconds). Each write names its limit in `x-rate-limit` ("none" where the code
      has none, as on the admin routes, which rely on the staff sign-in limits).
    - **Ids.** Database ids are 64-bit integers. Every route sends and takes them as strings of digits (`"123"`, pattern
      `^[1-9][0-9]{0,18}$`, at most 9223372036854775807), so no client loses precision. `0`, a leading zero, a JSON number or a
      longer string is refused with the field's 400 code. Login ids (Better Auth) are 32 letters and digits.
    - **Times** are ISO 8601 strings in UTC (`2026-11-18T09:30:00.000Z`); dates without a time are `YYYY-MM-DD`. Not yet uniform:
      the admin replies send Postgres text (`2026-11-18 09:30:00.123456+00`, `DbTime` in admin.yaml) in most lists; each field
      says which. The candidate and portal replies use the `Z` form only.
    - **Admin query strings** are strict: an unknown or repeated query key is 400 `bad_query` on every admin GET (the merge
      preview's `id` is the one key that may repeat).
    - **Examples** are made up. No example holds a real person, company, address or secret.
servers:
  - url: /
    description: The app's own origin (relative; each app is deployed on its own host).
components:
  schemas:
    CodeError:
      type: object
      description: The error body of most candidate and portal routes.
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
      example: { code: BAD_REQUEST }
    ErrorBody:
      type: object
      description: The error body of the admin routes and some portal and candidate routes. `stage` is set only when a rules check failed.
      required: [error]
      properties:
        error: { type: string }
        stage: { type: string }
      example: { error: bad_body }
    Id:
      type: string
      description: A database id as text.
      pattern: '^[1-9][0-9]{0,18}$'
      example: '1042'
    LoginId:
      type: string
      description: A Better Auth login id.
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP'
    Timestamp:
      type: string
      format: date-time
      description: An ISO 8601 time in UTC.
      example: '2026-11-18T09:30:00.000Z'
    Date:
      type: string
      format: date
      example: '2026-11-18'
    Cursor:
      type: string
      description: An opaque keyset paging token from a previous reply. Send it back unchanged.
      pattern: '^[A-Za-z0-9_-]{1,300}$'
      example: eyJzIjoic3BvbnNvciIsInEiOmZhbHNlfQ
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    ReasonCode:
      type: string
      description: A reason code, never free text (the audit log holds no free text).
      pattern: '^[a-z][a-z0-9_]{0,62}$'
      example: duplicate_listing
    NullableText:
      type: [string, 'null']
    NullableTimestamp:
      type: [string, 'null']
      description: An ISO 8601 time, or null. Times read as text from the database keep the database's form (`2026-11-18 09:30:00.123456+00`).
    DbTime:
      type: string
      description: A time as the database writes it as text (`2026-11-18 09:30:00.123456+00`), kept as text so the microseconds survive.
      example: '2026-11-18 09:30:00.123456+00'
    StaffRole:
      type: string
      enum: [account_reviewer, fetched_job_reviewer, rules_data_editor, trust_and_safety, services_case_handler, content_editor, administrator]
    DomainTakenError:
      type: object
      description: The 409 of a domain another company already holds; names that company.
      required: [error, owner]
      properties:
        error: { type: string, const: domain_owned_by_other }
        owner:
          type: object
          required: [organisationId, displayName]
          properties:
            organisationId: { $ref: '#/components/schemas/Id' }
            displayName: { type: string }
    RulesDataError:
      type: object
      description: "A 400 of the rules route: `bad_data` also says which entry is wrong in `detail`."
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
    AccountReviewItem:
      type: object
      required: [id, status, claimedBy, createdAt, organisationId, displayName, kind, organisationStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [open, claimed, done] }
        claimedBy: { type: [string, 'null'], description: The staff id holding the claim. }
        createdAt: { $ref: '#/components/schemas/DbTime' }
        reason: { type: [string, 'null'], description: 'Why the item was made: "claim" or "new organisation".' }
        detail: { description: "What the register check found, as the sign-up function wrote it (any JSON)." }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        kind: { type: string, enum: [employer, agency] }
        organisationStatus: { type: string }
        signupPath: { type: [string, 'null'], enum: [dete_claim, first_time, agency, null] }
        croNumber: { type: [string, 'null'] }
        wrcLicenceNumber: { type: [string, 'null'] }
        claimantEmail: { type: [string, 'null'] }
        emailDomain: { type: [string, 'null'] }
        answer: { type: [string, 'null'], description: "The owner's latest answer to \"ask for more\". Plain text; show it as text, never as HTML." }
        answeredAt: { type: [string, 'null'] }
        flags:
          type: array
          items: { enum: [shared_mailbox, lookalike_domain] }
          description: "Extra reasons to look closely, never a refusal: `shared_mailbox` (the owner's email is hr@, jobs@, careers@, info@, admin@, recruitment@ or office@) and `lookalike_domain` (the email domain is within 2 edits of a saved company domain, 0 and 1 read as o and l)."
        lookalikeOf: { type: [string, 'null'], description: The saved company domain the email domain looks like; null without `lookalike_domain`. }
        claimantName: { type: [string, 'null'], description: "The claimant's name as they gave it at sign-up. Plain text; show it as text, never as HTML. Null when the owner membership is gone.", example: Aoife Byrne }
        freeEmail: { type: boolean, description: "The email domain is a free provider (gmail.com and the like). False with no email.", example: false }
        nonDomainEmail: { type: boolean, description: "The company has not saved the email's domain as its own, so the claimant is not on a company address yet. False with no email.", example: true }
        permitHistory: { type: string, enum: [has_history, first_time, not_linked], description: "The company's DETE label.", example: has_history }
        lastPermitYear: { type: [integer, 'null'], description: "The newest year the company had DETE permits (a year of zero does not count); null when none are on record.", example: 2025 }
        banned: { type: boolean, description: "The owner's email domain or address, or one of the company's CRO numbers, is on the ban list (the check Approve makes again).", example: false }
        decidedAt: { type: [string, 'null'], description: "When the item was decided (database time text); null while it waits. A needs_info item keeps the time it was last asked.", example: '2026-11-18 09:30:00.123456+00' }
        outcome: { type: [string, 'null'], enum: [approved, rejected, needs_info, null], description: "How the item was decided; null while it waits.", example: approved }
    AuditEvent:
      type: object
      required: [id, at, kind, actor, action]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        at: { $ref: '#/components/schemas/DbTime' }
        kind: { type: string }
        actor:
          type: object
          properties:
            staff: { type: [string, 'null'] }
            staffName: { type: [string, 'null'], description: "The acting staff member's name (null when the actor is not staff).", example: Dara Kelly }
            candidate: { type: [string, 'null'] }
            portal: { type: [string, 'null'] }
            system: { type: [string, 'null'] }
        roleInForce: { type: [string, 'null'] }
        action: { type: string }
        objectType: { type: [string, 'null'] }
        objectId: { type: [string, 'null'] }
        objectLabel:
          type: [string, 'null']
          description: >-
            B59: what the object is called, for an organisation (display name), job (title), staff member (name), content page (title), strike (the organisation's name) or
            report (the job title, else the organisation's name). Null for any other object type, and for an object that no longer exists.
          example: Lakeside Care Homes
        changedColumns: { type: [array, 'null'], items: { type: string } }
        before: { description: "Any JSON, or null." }
        after: { description: "Any JSON, or null." }
        reasonCode: { type: [string, 'null'] }
        secondStaff: { type: [string, 'null'] }
        secondStaffName:
          type: [string, 'null']
          description: "B59: the second person's name. Only an administrator is given it; null for anyone else."
          example: Robin Walsh
        relatedCase: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
    DomainRow:
      type: object
      required: [id, domain, source, addedBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        domain: { type: string }
        source: { type: string }
        addedBy: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DbTime' }
    CompanyPreview:
      type: object
      description: Database column names (snake case), as the database returns them.
      required: [id, slug, display_name, kind, status, active_members, jobs, names]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        display_name: { type: string }
        kind: { type: string }
        status: { type: string }
        cro_number: { type: [string, 'null'] }
        merged_into_id: { type: [string, 'null'] }
        active_members: { type: integer }
        jobs: { type: integer }
        names: { type: integer }
    OwnerRequest:
      type: object
      description: Database column names (snake case), as the database returns them.
      required: [id, organisation_id, display_name, new_owner_membership_id, new_owner_email, old_owner_membership_id, requested_by_staff_user_id, requested_at, completes_after, can_complete]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organisation_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        new_owner_membership_id: { $ref: '#/components/schemas/Id' }
        new_owner_email: { type: string }
        old_owner_membership_id: { $ref: '#/components/schemas/Id' }
        old_owner_email: { type: [string, 'null'] }
        requested_by_staff_user_id: { type: string }
        requested_at: { $ref: '#/components/schemas/DbTime' }
        completes_after: { $ref: '#/components/schemas/DbTime' }
        can_complete: { type: boolean }
    ContactSummary:
      type: object
      required: [id, status, topic, createdText]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [new, claimed] }
        topic: { type: string }
        surface: { type: [string, 'null'] }
        createdText: { $ref: '#/components/schemas/DbTime' }
        claimedByStaffUserId: { type: [string, 'null'] }
        claimedText: { type: [string, 'null'] }
    ContactMessage:
      allOf:
        - $ref: '#/components/schemas/ContactSummary'
        - type: object
          properties:
            status: { type: string, enum: [new, claimed, answered, closed, spam] }
            fromName: { type: [string, 'null'] }
            fromEmail: { type: [string, 'null'] }
            body: { type: string, description: "The message as sent. Plain text; show it as text, never as HTML." }
            candidateUserId: { type: [string, 'null'] }
            portalUserId: { type: [string, 'null'] }
            closedText: { type: [string, 'null'] }
            fromHeldLogin: { type: [boolean, 'null'], description: "Topic appeal only (null otherwise): whether `fromEmail` belongs, now, to a blocked portal login (surface portal) or a suspended candidate (candidate site). The sender proved nothing; a reply to that email reaches only its owner." }
    ContentSummary:
      type: object
      required: [id, kind, slug, title, status, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [guide, update, help, occupation, notice] }
        slug: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, published, withdrawn] }
        sourceUrl: { type: [string, 'null'] }
        checkedOn: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'] }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { $ref: '#/components/schemas/DbTime' }
        category: { type: [string, 'null'], enum: [salary_minimums, quotas, occupation_lists, processing, report_problem, permit_services, jobs_badges, account, null], description: "B17, B19: an update's type (salary_minimums, quotas, occupation_lists, processing) or a help page's group (report_problem, permit_services, jobs_badges, account); null for the other kinds.", example: quotas }
        effectiveFrom: { type: [string, 'null'], description: "B17: the day an update's rule starts; null for the other kinds.", example: '2027-01-01' }
    JobQueueItem:
      type: object
      required: [id, queue, status, createdAt, jobId, jobStatus, title, organisationId, company]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        queue: { type: string, enum: [scam_flag, post_strike_job_review, agency_client_check, licence_lapse_job] }
        status: { type: string }
        claimedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time, description: When the item was opened (how long the job has been held). }
        jobId: { $ref: '#/components/schemas/Id' }
        jobStatus: { type: string }
        source: { type: string, enum: [employer, agency] }
        title: { type: string }
        employerName: { type: string }
        county: { type: [string, 'null'] }
        occupationCode: { type: [string, 'null'] }
        permitType: { type: string }
        salaryLow: { type: [integer, 'null'] }
        salaryHigh: { type: [integer, 'null'] }
        payGrade: { type: [string, 'null'] }
        badge: { type: [string, 'null'] }
        closesAt: { description: "An ISO time, or the text \"infinity\" for no closing date." }
        organisationId: { $ref: '#/components/schemas/Id' }
        company: { type: string }
        companyStatus: { type: string }
        restricted: { type: boolean }
        clientName: { type: [string, 'null'] }
        clientCheck: { type: string }
        advertText: { type: [string, 'null'], description: Only on the one-item read. }
    FetchedQueueItem:
      type: object
      required: [id, status, jobId, organisationId, title, employerName, permitHistory, wrcAgency]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string }
        claimedBy: { type: [string, 'null'] }
        jobId: { $ref: '#/components/schemas/Id' }
        organisationId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        employerName: { type: string }
        advertUrl: { type: [string, 'null'] }
        occupationCode: { type: [string, 'null'] }
        permitHistory: { type: string }
        sponsorPermits: { type: [integer, 'null'] }
        stage: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        wrcAgency: { type: boolean, description: "The advert's employer name is an agency or trading name on the WRC licensed agency list (staff only)." }
        advertText: { type: [string, 'null'], description: Only on the one-item read. }
        queuedAt: { $ref: '#/components/schemas/DbTime' }
        county: { type: [string, 'null'], description: "The job's county.", example: Cork }
        sourceKind: { type: string, description: "The kind of source the advert was fetched from (job_source.kind).", example: careers_page }
        quotedEvidence: { type: [string, 'null'], description: "Only on the one-item read: the advert's own words the fetcher quoted as why it queued the item. Plain text; show it as text, never as HTML.", example: "...a specified purpose contract..." }
        matcherModel: { type: [string, 'null'], description: "Only on the one-item read: the model that matched the occupation; null when none was stored.", example: matcher-2026-10 }
    FetchedDryRun:
      type: object
      description: What Approve would do for one item with the given occupation code, pay and contract. Nothing is written.
      required: [itemId, jobId, wouldPublish, passRoute, failedStage, badge, occupationCode, salaryLow, salaryHigh, payGrade, quotaFull, stage, checks]
      properties:
        itemId: { $ref: '#/components/schemas/Id' }
        jobId: { $ref: '#/components/schemas/Id' }
        wouldPublish: { type: boolean, description: "Approve would put the job live with these inputs.", example: true }
        passRoute: { type: [string, 'null'], enum: [stated_pay, big_company, public_pay, null], example: stated_pay }
        failedStage: { type: [string, 'null'], description: "The rules stage that would refuse Approve (`rules_failed`); null when it would publish.", example: null }
        badge: { type: [string, 'null'], enum: [critical_skills_eligible, null], description: "The badge the job would get.", example: critical_skills_eligible }
        occupationCode: { type: string, example: '2231' }
        salaryLow: { type: [integer, 'null'], description: "The pay the rules read (the reviewer's, else the advert's), whole euros a year.", example: 60000 }
        salaryHigh: { type: [integer, 'null'], example: 60000 }
        payGrade: { type: [string, 'null'], description: "The pay grade the job already has.", example: Staff Nurse }
        quotaFull: { type: boolean, description: "The General quota for the occupation is full (always false for a Critical Skills job).", example: false }
        stage: { type: string, description: "The rules stage the chain stopped at, or the PASS text.", example: PASS (salary stated) }
        checks:
          type: array
          description: Every check in the chain's order. A check after the stop is `not_run`.
          items:
            type: object
            required: [check, result, detail]
            properties:
              check: { type: string, enum: [irish_employer, sponsorship_wording, occupation_known, critical_skills_list, contract, salary, scam_wording], example: contract }
              result: { type: string, enum: [pass, fail, unsure, not_run], example: pass }
              detail: { type: [string, 'null'], description: "What the rule found, plain text; null when it did not run.", example: two years stated }
    ManualRow:
      type: object
      description: Database column names (snake case), as the database returns them. `reason` is why a draft is not listed.
      required: [id, organisation_id, display_name, title, status, posted_at, closes_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organisation_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        title: { type: string }
        status: { type: string }
        badge: { type: [string, 'null'], enum: [critical_skills_eligible, sponsor_confirmed, null], description: "The badge the post shows, or null for a draft.", example: critical_skills_eligible }
        pass_route: { type: [string, 'null'] }
        posted_by_staff_id: { type: [string, 'null'] }
        posted_at: { $ref: '#/components/schemas/DbTime' }
        closes_at: { type: string }
        closed_at: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        sponsor_request_id: { type: [string, 'null'], description: "The Sponsor confirmed request waiting for an administrator on this post, or null (#232, Q6).", example: '9001' }
    FloorCheck:
      type: object
      required: [floorId, itemId, createdAt, roleFamily, floorEur, organisationId, displayName]
      properties:
        floorId: { $ref: '#/components/schemas/Id' }
        itemId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/DbTime' }
        roleFamily: { type: string, pattern: '^[0-9]{4}$' }
        floorEur: { type: integer }
        signedAt: { type: string }
        validUntil: { type: string }
        signerName: { type: [string, 'null'] }
        signerTitle: { type: [string, 'null'] }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        kind: { type: string }
        isBigCompany: { type: boolean }
        organisationStatus: { type: string }
        currentFloorEur: { type: [integer, 'null'] }
        requestId: { type: [string, 'null'] }
        proposedBy: { type: [string, 'null'] }
    RulesKind:
      type: string
      description: 'public_pay_employers holds the HSE switch (#261): the entry "health service executive" (tier 1) gives every HSE name tier 1 while it is in force; a version without it, or with it `on: false`, turns the switch off. Each public_pay_employers value is a `PayDealEntry` (B66). pay_scales (#269) is a list of grades, each {code (1 to 12 capital letters or digits, unique), title, firstEur, lastEur (whole euro, first not above last), sourceUrl (https), sourcePage, note?}; it may have no version yet, and an empty or broken one stops the rules loading.'
      enum: [minimums, critical_skills_list, ineligible_list, public_pay_employers, big_company_names, pay_scales]
    RulesChange:
      type: object
      properties:
        added: { type: object }
        removed: { type: object }
        changed: { type: object }
    RulesVersion:
      type: object
      required: [kind, versionId, effectiveFrom, data]
      properties:
        kind: { $ref: '#/components/schemas/RulesKind' }
        versionId: { $ref: '#/components/schemas/Id' }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        data: { description: The whole version for its kind (see packages/db/src/rules-data.ts; for public_pay_employers a map of lower-case employer name to `PayDealEntry`). }
        hourly:
          type: object
          description: "B64, the kind minimums only: each yearly minimum as euro an hour, to the cent, over 52 weeks of `standardWeekHours` (the General figures only when the version has them)."
          additionalProperties: { type: number }
          example: { criticalSkills: 20.17, graduate: 18.17, nonList: 33.98, general: 18.05, generalLower: 16.12 }
    PayDealEvidence:
      type: object
      additionalProperties: false
      required: [kind, link, file]
      description: "B66: why an employer's pay follows a public sector pay deal. `link` and `file` may both be given; at least one is not null."
      properties:
        kind: { type: string, enum: [service_arrangement, published_pay_policy, dete_rule_text, other], description: What the evidence is., example: service_arrangement }
        link: { type: [string, 'null'], description: "An https address of at most 500 characters, or null.", example: null }
        file:
          type: [object, 'null']
          additionalProperties: false
          required: [id, name]
          description: "A file from POST /api/rules/evidence, or null. In a `propose` the name is replaced with the name the file was uploaded with; a file never uploaded there is `bad_data`."
          properties:
            id: { type: string, pattern: '^[0-9a-f-]{36}\.(pdf|jpg|png)$', description: "The file's id, for GET /api/rules/evidence?file=.", example: 0f8fad5b-d9cb-469f-a165-70867728950e.pdf }
            name: { type: string, maxLength: 200, description: "The file's name as uploaded (a label only).", example: service-arrangement-2026.pdf }
    PayDealEntry:
      type: object
      additionalProperties: false
      required: [tier]
      description: "B66: one public pay-deal employer. A new or changed entry that is on needs `bodyType` and `evidence`; one saved before B66 may have neither until it is changed."
      properties:
        tier: { type: integer, enum: [1, 2], description: "1 for the HSE entry (matched by the HSE name test), 2 for a name matched exactly.", example: 2 }
        note: { type: string, maxLength: 500, description: A staff note., example: Confirmed HSE consolidated scales apply to nursing grades. }
        bodyType: { type: string, enum: [public_body, section_38, section_39], description: What kind of body it is., example: section_38 }
        evidence: { $ref: '#/components/schemas/PayDealEvidence' }
        addedOn: { type: string, format: date, description: "The day the entry was first proposed. Set by the server: whatever a `propose` sends is replaced.", example: '2026-11-25' }
        addedBy: { type: string, description: "The staff id of who proposed it. Set by the server, as addedOn.", example: q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP }
        on: { type: boolean, description: "false keeps the entry on the list but switched off: no badge, posting check or fetch counts it while that version is in force. Absent or true is on. At least one entry of a version is on.", example: false }
    ManualCheck:
      type: object
      additionalProperties: false
      required: [id, state, detail]
      description: One check of a manual post.
      properties:
        id: { type: string, enum: [occupation, contract, wording, money, pay], description: "`wording` is the rules chain on the text; `money` is wording that asks the candidate for money.", example: pay }
        state: { type: string, enum: [pass, blocked], description: A blocked check keeps the post a draft., example: pass }
        code: { type: string, description: "Why it is blocked: occupation_ineligible, occupation_not_on_list, contract_too_short, rules_failed, needs_review, pay_required, pay_below_minimum or pay_not_on_scale.", example: pay_below_minimum }
        detail:
          type: object
          description: "The facts: occupation {occupationCode, list (critical_skills, ineligible or null)}; contract {months, minimumMonths}; wording {stage}; money {phrase}; pay {minimumEur, countedEur, healthInsuranceEur, weeklyHours, route}."
          additionalProperties: { type: [string, number, boolean, 'null'] }
    StaffRow:
      type: object
      required: [id, name, email, status, createdAt, roles]
      properties:
        id: { $ref: '#/components/schemas/LoginId' }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { $ref: '#/components/schemas/DbTime' }
        roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
    ReportSummary:
      type: object
      description: The list shows no evidence text and no reporter.
      required: [id, status, targetKind, reason, createdText]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string }
        targetKind: { type: string, description: "`job` or `organisation` (a company report, #102: no job; targetJobId, jobTitle and jobStatus are null)." }
        reason: { type: string }
        createdText: { $ref: '#/components/schemas/DbTime' }
        targetJobId: { type: [string, 'null'] }
        jobTitle: { type: [string, 'null'] }
        jobStatus: { type: [string, 'null'] }
        organisationId: { type: [string, 'null'], description: "The job's company, or the reported company." }
        displayName: { type: [string, 'null'] }
        organisationStatus: { type: [string, 'null'], description: "The company's status now (S11)." }
    CaseSummary:
      type: object
      required: [id, organisationId, displayName, caseKind, reasonCode, stage]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban] }
        reasonCode: { type: string }
        stage: { type: string }
        outcome: { type: [string, 'null'] }
        level: { type: [integer, 'null'] }
        replyDueAt: { $ref: '#/components/schemas/NullableTimestamp' }
        appealDueAt: { $ref: '#/components/schemas/NullableTimestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    TrustItem:
      type: object
      description: One row of the trust and safety list, a report or a case. No reporter and no evidence text (#99).
      required: [kind, id, label, createdAt, organisationId, displayName, organisationKind, jobId, jobTitle, reason, state, outcome, level, reportId, jobReports, companyReports]
      properties:
        kind: { type: string, enum: [report, case], description: Whether the row is a report or a case., example: report }
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string, pattern: '^[RC]-[0-9]{4,}$', description: "The one id label: `R-` and the report id, or `C-` and the case id, at least 4 digits (reports and cases have separate id spaces).", example: R-0801 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        organisationId: { type: [string, 'null'], description: "The company: the job's company, or the reported or case company. Null for a report on a message or a person.", example: '312' }
        displayName: { type: [string, 'null'], description: The company's name now., example: Example Recruitment Ltd }
        organisationKind: { type: [string, 'null'], enum: [employer, agency, public_body, null], description: "The company's kind (the frame's `(agency)` mark).", example: agency }
        jobId: { type: [string, 'null'], description: "The reported job, or the case's job; null when there is none.", example: '5501' }
        jobTitle: { type: [string, 'null'], example: Care Assistant }
        reason: { type: string, description: "A report's reason code, or a case's reason code (for example `asks_for_money`, `false_sponsorship`).", example: asks_for_money }
        state: { type: string, description: "A report's status (`open`, `job_hidden`, `cleared`, `upheld`) or a case's stage (`case_open`, `employer_notified`, `reply_window`, `decided`, `applied`, `appealed`, `upheld`, `overturned`).", example: open }
        outcome: { type: [string, 'null'], description: "A case's decision (`cleared`, `strike`, `ban`); null for a report and for an undecided case.", example: null }
        level: { type: [integer, 'null'], description: "A case's strike level 1 to 3; null for a report, an instant-ban case and an undecided case.", example: null }
        reportId: { type: [string, 'null'], description: The report a case came from; null for a report row and for a case opened by hand., example: null }
        jobReports: { type: integer, minimum: 0, maximum: 200, description: "How many reports (any status) name this job; 200 means 200 or more.", example: 3 }
        companyReports: { type: integer, minimum: 0, maximum: 200, description: "How many reports (any status) name this company or one of its jobs; 200 means 200 or more.", example: 5 }
    BanItem:
      type: object
      description: One banned value. A ban row that holds more than one value (a CRO number and an email domain) gives one item for each.
      required: [banId, type, value, reasonCode, caseId, caseLabel, caseKind, organisationId, displayName, addedAt, proposedBy, confirmedBy, liftPending]
      properties:
        banId: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [cro_number, email_domain, email_address], description: What the value is., example: cro_number }
        value: { type: string, description: "The banned CRO number, email domain or email address; none of them can sign up again.", example: '123456' }
        reasonCode: { type: string, enum: [asks_for_money, fake_company, fake_job, strike_3], description: Why the ban was made., example: asks_for_money }
        caseId: { $ref: '#/components/schemas/Id' }
        caseLabel: { type: string, description: The case's id label., example: C-0064 }
        caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban], example: instant_ban }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string, description: The company the case was about., example: Example Recruitment Ltd }
        addedAt: { $ref: '#/components/schemas/NullableTimestamp' }
        proposedBy: { type: [string, 'null'], description: The officer who proposed the ban (the name; null if the login was removed)., example: Kit Nolan }
        confirmedBy: { type: [string, 'null'], description: The second officer who confirmed it., example: Dara Kelly }
        liftPending: { type: boolean, description: A lift of this ban waits for its second officer., example: false }
    WrcItem:
      type: object
      description: One case ticked off as reported to the WRC.
      required: [caseId, caseLabel, organisationId, displayName, organisationKind, reasonCode, reportedAt, reportedBy]
      properties:
        caseId: { $ref: '#/components/schemas/Id' }
        caseLabel: { type: string, example: C-0064 }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string, example: Example Recruitment Ltd }
        organisationKind: { type: string, example: agency }
        reasonCode: { type: string, example: asks_for_money }
        reportedAt: { $ref: '#/components/schemas/Timestamp' }
        reportedBy: { type: [string, 'null'], description: The officer who ticked it off., example: Kit Nolan }
  headers:
    RetryAfter:
      description: Seconds until the limit that was hit has a new window.
      schema: { type: integer, minimum: 1 }
      example: 42
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: staff.session_token
      description: >-
        The staff Better Auth session cookie (`__Secure-staff.session_token` over HTTPS), set by `POST /api/auth/staff/sign-in/email`.
        A staff session ends after 8 hours without use (`expiresIn` 8 h, refreshed at most every 5 minutes), and a disabled login is
        refused on its next request.
  responses:
    NoStaffSession:
      description: "`no_session`: no staff session cookie, or it has ended. `not_active`: the login behind the session is not active."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { error: no_session }
    StaffFileRefused:
      description: >-
        The malware scan (GuardDuty Malware Protection for S3, S-Q7 A) has not passed, so the file is not sent and no audit row is written.
        `scan_pending`: the object has no `GuardDutyMalwareScanStatus` tag yet (also every file until the scan is switched on).
        `file_blocked`: the tag is anything but `NO_THREATS_FOUND` (`THREATS_FOUND`, `UNSUPPORTED`, `ACCESS_DENIED`, `FAILED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { error: scan_pending }
    ServerError:
      description: "`server_error`: anything the route does not expect. The reason stays in the server log."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { error: server_error }
paths:
  /api:
    get:
      operationId: getApiIndex
      summary: Index of this app's routes
      description: >-
        This app's name, the deployed commit (`version`, set per deploy; `local` on a developer machine), the environment, the time and
        every route of the admin site as `METHOD /path (who may call it)`, keyed by operationId; "(anyone)" is left out. Made from this file
        (decision #265): the sync test fails when `lib/api-index.json` differs from it. Any active staff member only, so the staff routes are not a public map. It takes no query key: any key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The index.
          content:
            application/json:
              schema:
                type: object
                required: [success, name, version, environment, timestamp, routes]
                additionalProperties: false
                properties:
                  success: { const: true }
                  name: { type: string }
                  version: { type: string, description: "The first 7 characters of the deployed commit, or `local`." }
                  environment: { type: string, enum: [production, preview, development] }
                  timestamp: { type: string, format: date-time }
                  routes: { type: object, additionalProperties: { type: string } }
              example:
                success: true
                name: Admin API (staff)
                version: 31e144d
                environment: production
                timestamp: '2026-11-19T06:20:00.000Z'
                routes: { getHealth: GET /api/health, listRules: 'GET /api/rules (any active staff member)' }
        '400':
          description: "`bad_query`: any query key (this GET takes none)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Answers whether the app can reach its database. No session, no Origin check, no rate limit; it reads no data. `sharp` (U3) says whether the image re-encoder used at upload loads in this function; it is worked out once per server instance and is not part of `ok`.
      security: []
      x-roles: [anyone]
      x-rate-limit: none
      x-no-4xx: The route reads no input, needs no session and has no refusal; it only answers 200 or 503.
      responses:
        '200':
          description: The database answered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, database]
                properties:
                  ok: { type: boolean }
                  database: { type: boolean }
                  sharp: { type: boolean }
              example: { ok: true, database: true, sharp: true }
        '503':
          description: The database did not answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  database: { type: boolean }
                  sharp: { type: boolean }
              example: { ok: false, database: false, sharp: true }
  /api/auth/staff/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >-
          The Better Auth endpoint under `/api/auth/staff/` (it may hold slashes, for example `sign-in/email`). The route is a Next.js
          catch-all (`[...all]`) that hands every request to Better Auth's own handler.
        schema: { type: string }
        example: sign-in/email
    get:
      operationId: staffAuthGet
      summary: Better Auth, staff pool (GET)
      description: >-
        Better Auth's own GET endpoints for the staff login pool. The admin pages use `get-session` (200 with the session and user, or
        200 with an empty body when there is no session). Shapes are Better Auth's own (better-auth 1.x); only what the repo's tests show
        is described here.
      security: []
      x-roles: [anyone]
      x-rate-limit: "Better Auth's own limits, counted in the database (staff_rate_limit)."
      responses:
        '200':
          description: Better Auth's answer.
          content:
            application/json:
              schema: {}
              example: { session: { id: 'Zx81LmQp0aB7cD9eF1gH3iJ5kL7mN9oP', userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP' }, user: { id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', email: 'reviewer@example.com', name: 'Example Reviewer' } }
        '404':
          description: An endpoint Better Auth does not have.
    post:
      operationId: staffAuthPost
      summary: Better Auth, staff pool (POST)
      description: >-
        Better Auth's own POST endpoints for the staff login pool. Used by the admin app: `sign-in/email` (`{ email, password }`; 200 sets
        the `staff.session_token` cookie) and `sign-out`. Settings: sign-up is off (`sign-up/email` answers 400), email verification is not
        required for staff, a password reset ends every other session, the session ends after 8 hours without use (STAFF_IDLE_SECONDS,
        refreshed every 5 minutes; a "remember me: false" sign-in is capped at the same limit), the cookie cache is off, a disabled login
        cannot sign in (403) and Better Auth's own Origin check is on (trusted origin: STAFF_AUTH_URL). The client address for limits is
        `x-vercel-forwarded-for` only. Staff email is not set up yet, so `request-password-reset` sends nothing. There is no bot check on
        the staff pool. `revoke-sessions` (sign out everywhere, C4) ends every session of this login at once and `revoke-other-sessions` all
        but this one; any signed-in session may call them and the next request with an ended session is 401. `change-email` is off for staff
        (400): administrators change staff emails. Shapes are Better Auth's own; only what the repo's tests show is described here.
        The pages `/sign-in`, `/forgot-password` and `/reset-password` use `sign-in/email` (401 `INVALID_EMAIL_OR_PASSWORD`, 400 `INVALID_EMAIL`), `request-password-reset` (`{ email, redirectTo: "/reset-password" }`; 200 whether or not the address has a login)
        and `reset-password` (`{ newPassword, token }`; 400 `INVALID_TOKEN` for an ended or used link, `PASSWORD_TOO_SHORT` under 8 characters, `PASSWORD_TOO_LONG` over 128). The emailed link is
        `/api/auth/staff/reset-password/<token>?callbackURL=/reset-password`, which redirects to `/reset-password?token=<token>` (or `?error=INVALID_TOKEN`).
      security: []
      x-roles: [anyone]
      x-body-cap: none set by this repo (Better Auth's own handling)
      x-rate-limit: >-
        Per client address, counted in the database: sign-in/email 5 a minute; sign-up/email 5 a minute; request-password-reset 3 in 5
        minutes; send-verification-email 3 in 5 minutes. Other paths keep Better Auth's default.
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
            example: { email: reviewer@example.com, password: an-example-password }
      responses:
        '200':
          description: Signed in (the `Set-Cookie` header carries the session cookie) or signed out.
          headers:
            Set-Cookie:
              description: The session cookie on sign-in.
              schema: { type: string }
          content:
            application/json:
              schema: {}
              example: { redirect: false, token: 'Zx81LmQp0aB7cD9eF1gH3iJ5kL7mN9oP', user: { id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', email: 'reviewer@example.com', name: 'Example Reviewer' } }
        '400':
          description: A walk-in `sign-up/email` (sign-up is off), or a body Better Auth refuses.
        '401':
          description: Wrong email or password.
        '403':
          description: A disabled staff login signing in ("This account cannot sign in."), or an Origin Better Auth does not trust.
        '429':
          description: Over one of the per-address limits above.
  /api/accounts:
    get:
      operationId: listCandidateMerges
      summary: List the candidate account merges waiting for a second administrator
      description: >-
        The pending `candidate_merge` requests (step 15 C6), ids only, oldest first, at most 200. No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The pending merges.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, keep, drop, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        keep: { $ref: '#/components/schemas/LoginId' }
                        drop: { $ref: '#/components/schemas/LoginId' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example:
                pending: [{ requestId: '131', keep: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', drop: 'Z1y2X3w4V5u6T7s8R9q0P1o2N3m4L5k6', proposedBy: 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6', createdAt: '2026-11-18 09:30:00.123456+00' }]
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnAccount
      summary: Suspend or block a login, lift it, or merge two candidate accounts
      description: >-
        `suspend_candidate`: a candidate login is suspended (suspended_at set). `block_portal`: an employer or agency login is blocked
        (status blocked, blocked_at, blocked_reason_code). Either way every open session of the login ends in the same transaction, and the
        next request of an old cookie is refused. `lift_candidate` and `lift_portal` lift it again. One audit row (account.suspend,
        account.unsuspend, account.block, account.unblock) with the reason code; never free text. Appeal is through the contact form.
        C4 (#270): every action here needs a session from a sign-in in the last 10 minutes, else 403 `reauth_required` (checked right after the
        session, before the body and the administrator check).
        `merge_propose` (step 15 C6): an administrator proposes merging candidate account `drop` into `keep`; one pending merge per dropped
        account. `merge_confirm`: a different administrator confirms and the merge runs at once: refused, and the request left pending, while
        either account has an open services case or an open report. The dropped account's saved jobs, alerts, tracker rows, hidden companies,
        applications and contact requests (with their consent records, CV files and messages) move to the kept account, the kept account's
        own rows winning every clash (and the caps of 200 saved jobs and 10 alerts kept); its profile and CV move only when the kept account has
        none. Then the dropped account is erased as a data request erases it, and its stored files are removed. The kept account gets one
        notice and one email; one audit row names both accounts and both administrators. `merge_refuse`: a different administrator refuses,
        or the proposer withdraws. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, userId, reason]
                  properties:
                    action: { type: string, enum: [suspend_candidate, lift_candidate, block_portal, lift_portal] }
                    userId: { $ref: '#/components/schemas/LoginId' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
                - type: object
                  additionalProperties: false
                  required: [action, keep, drop]
                  properties:
                    action: { const: merge_propose }
                    keep: { $ref: '#/components/schemas/LoginId' }
                    drop: { $ref: '#/components/schemas/LoginId' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [merge_confirm, merge_refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: suspend_candidate, userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', reason: fake_documents }
      responses:
        '200':
          description: "A hold or lift: the sessions ended (0 on a lift). `merge_propose`: the request id. `merge_confirm`: both accounts, the rows moved and the stored files removed. `merge_refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [ok, sessionsEnded]
                    properties:
                      ok: { const: true }
                      sessionsEnded: { type: integer }
                  - type: object
                    additionalProperties: false
                    required: [ok, requestId]
                    properties:
                      ok: { const: true }
                      requestId: { $ref: '#/components/schemas/Id' }
                  - type: object
                    additionalProperties: false
                    required: [ok, keep, drop, moved, filesRemoved]
                    properties:
                      ok: { const: true }
                      keep: { $ref: '#/components/schemas/LoginId' }
                      drop: { $ref: '#/components/schemas/LoginId' }
                      filesRemoved: { type: integer }
                      moved:
                        type: object
                        additionalProperties: false
                        required: [savedJobs, alerts, tracker, hiddenOrganisations, profile, cv, applications, contactRequests, servicesCases, servicesCaseIds]
                        properties:
                          savedJobs: { type: integer }
                          alerts: { type: integer }
                          tracker: { type: integer }
                          hiddenOrganisations: { type: integer }
                          profile: { type: integer }
                          cv: { type: integer }
                          applications: { type: integer }
                          contactRequests: { type: integer }
                          servicesCases: { type: integer, description: "the dropped account's closed services cases moved to the kept one (0064)" }
                          servicesCaseIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
                  - type: object
                    additionalProperties: false
                    required: [ok]
                    properties:
                      ok: { const: true }
              example: { ok: true, sessionsEnded: 2 }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 300 characters. `bad_action`: unknown action. `bad_user_id`: not a login id. `bad_reason`: not a reason code. `bad_request_id`: not an id. `same_account`: keep and drop are the same."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role. `reauth_required` (C4, #270): the session is older than 10 minutes; sign in again."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such login in that pool, no such candidate account (either one, also when gone since the proposal), or no such merge request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_held`: the login is already suspended or blocked. `not_held`: a lift of a login that is not. `decision_pending`: a merge of that dropped account waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming. `kept_account_deleted`: the account to keep is deleted. `open_services_case`, `open_report`: either account has one open."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_held } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/account-review:
    get:
      operationId: listAccountReviews
      summary: List open account reviews, or show one
      description: >-
        Without `id`: the open and claimed `account_review` items (employer and agency sign-ups and claims), oldest first, 20 a page. With `tab`
        the list is that tab's: `waiting` (open or claimed, the company not in needs_info), `needs_info` (asked for more, not yet decided),
        `approved` or `rejected` (decided, newest decision first). Every list also gives the number on each of the four tabs in `counts`.
        With `id`: that one item, whatever its status (an id that is not an account review, or not digits, is 404). The list shows the
        claimant's email, so only account reviewers read it. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, description: "One item's id.", schema: { type: string }, example: '1042' }
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: tab, in: query, required: false, description: "One tab of the page. Without it, every open and claimed item.", schema: { type: string, enum: [waiting, needs_info, approved, rejected] }, example: waiting }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next, counts]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AccountReviewItem' } }
                      next: { type: [string, 'null'] }
                      counts:
                        type: object
                        description: The number on each tab, whatever tab the list is.
                        required: [waiting, needsInfo, approved, rejected]
                        properties:
                          waiting: { type: integer, example: 9 }
                          needsInfo: { type: integer, example: 3 }
                          approved: { type: integer, example: 212 }
                          rejected: { type: integer, example: 17 }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/AccountReviewItem' }
              example:
                items:
                  - { id: '1042', status: open, claimedBy: null, createdAt: '2026-11-18 09:30:00.123456+00', reason: claim, detail: { found: true }, organisationId: '310', displayName: Example Care Ltd, kind: employer, organisationStatus: pending_review, signupPath: dete_claim, croNumber: '123456', wrcLicenceNumber: null, claimantEmail: owner@example.ie, emailDomain: example.ie, answer: null, answeredAt: null, flags: [], lookalikeOf: null, claimantName: Aoife Byrne, freeEmail: false, nonDomainEmail: true, permitHistory: has_history, lastPermitYear: 2025, banned: false, decidedAt: null, outcome: null }
                next: null
                counts: { waiting: 9, needsInfo: 3, approved: 212, rejected: 17 }
        '400':
          description: "`bad_cursor`: `after` is not a token this list made. `bad_tab`: `tab` is not one of the four. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_tab } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the staff login is not active. `not_reviewer`: no account_reviewer role (no other role stands in)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: `id` is not an account review item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnAccountReview
      summary: Claim, release, approve, ask for more, or reject an account review
      description: >-
        One action on one item. The Origin header must be the admin app's origin. Only the claimer approves, asks for more or rejects.
        `approve` verifies the company; with `addDomain: true` it also saves the claimant's email domain for the company (refused for a free
        email provider or a domain another company holds). `ask_more` sets the company to needs_info, sends the optional `question` (1 to
        1,000 characters after trimming, no control characters) to the owner and puts the item back to open; `reason` defaults to
        `needs_info`. `reject` needs `reason`; a DETE claim goes back to unclaimed, a new registration becomes rejected. A stale claim
        (over 24 hours, or held by a login no longer active) can be taken over by `claim`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 4500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [claim, release] }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { const: approve }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                    addDomain: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { const: ask_more }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
                    question: { type: string, maxLength: 1000 }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, reason]
                  properties:
                    action: { const: reject }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: approve, itemId: '1042', addDomain: true }
      responses:
        '200':
          description: "`claim` and `release`: `{ ok: true }`. The three decisions also give the company's new status and the domain added."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  organisationId: { $ref: '#/components/schemas/Id' }
                  organisationStatus: { type: string, enum: [verified, needs_info, rejected, unclaimed] }
                  domainAdded: { type: [string, 'null'] }
              example: { ok: true, organisationId: '310', organisationStatus: verified, domainAdded: example.ie }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, a field on the wrong action, a wrong type, or over 4,500 characters.
            `bad_action`: unknown action. `bad_item_id`: itemId not 1 to 19 digits. `bad_reason`: reject with no reason, or a reason that is
            not a code. `bad_question`: the question is empty, over 1,000 characters or holds control characters. `bad_input`: addDomain not
            a boolean.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_body } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`, `not_reviewer`: as on GET. `reauth_required` (C4, #270, audit SEC-12): an approve on a session older than 10 minutes; sign in again (the other actions work on any session)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such account review item (also an itemId that is not a valid id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `already_decided`, `not_claimed`, `not_claimer`, `claimed_by_other` (a fresh claim of someone else): the item's state does not
            allow it. `organisation_not_pending`: the company is no longer pending_review or needs_info. `no_claimant`: the company has no
            active owner. `claimant_not_active`: the owner was blocked, erased or banned since the claim. `has_permit_history`: a first-time
            employer turns out to have a DETE permit record. `free_email_domain`, `bad_domain`, `domain_owned_by_other`: addDomain refused.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_claimer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/audit:
    get:
      operationId: listAudit
      summary: Read the audit log
      description: >-
        Newest first, 50 a page. An administrator reads every row and may filter by any staff member; any other active staff member reads
        only the rows where they are the actor (and is refused another member's id). Dates are UTC days, both ends inclusive. Only the
        listed query keys, each at most once (anything else is `bad_query`). Nothing here writes. B59: each row carries the staff member's name and a label for its
        object (`actor.staffName`, `objectLabel`, `secondStaffName`), and `kind` and `case` filter (`kind=data_access` is the personal data views). Paging is by `after`
        only, there are no page numbers. The same filters as a file: `GET /api/audit/export`.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member (own rows), administrator (every row)]
      x-rate-limit: none
      parameters:
        - { name: staff, in: query, required: false, description: "The acting staff id.", schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: action, in: query, required: false, schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,80}$' }, example: account_review.approved }
        - { name: objectType, in: query, required: false, schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,40}$' }, example: organisation }
        - { name: objectId, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }, example: '310' }
        - { name: kind, in: query, required: false, description: "B59: the kind of row. `data_access` is a staff member opening personal data.", schema: { type: string, enum: [admin_action, data_access, security] }, example: data_access }
        - { name: case, in: query, required: false, description: "B59: rows about one case, as the `relatedCase` value.", schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }, example: 'strike:12' }
        - { name: from, in: query, required: false, description: "First UTC day (inclusive).", schema: { $ref: '#/components/schemas/Date' } }
        - { name: to, in: query, required: false, description: "Last UTC day (inclusive).", schema: { $ref: '#/components/schemas/Date' } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [events, next]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next: { type: [string, 'null'] }
              example:
                events:
                  - { id: '88001', at: '2026-11-18 09:30:00.123456+00', kind: admin_action, actor: { staff: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', staffName: Dara Kelly, candidate: null, portal: null, system: null }, roleInForce: null, action: account_review.approved, objectType: organisation, objectId: '310', objectLabel: Lakeside Care Homes, changedColumns: [status], before: { status: pending_review }, after: { status: verified }, reasonCode: approved, secondStaff: null, secondStaffName: null, relatedCase: null, source: panel }
                next: null
        '400':
          description: >-
            `bad_query`: an unknown or repeated query key. `bad_staff_id`, `bad_action`, `bad_object_type`, `bad_object_id`, `bad_case_id`: a filter of the
            wrong shape. `bad_kind`: not admin_action, data_access or security. `bad_from`, `bad_to`: not a real YYYY-MM-DD day. `bad_range`: from after to. `bad_cursor`: a token this list did not make.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_range } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: a non-administrator filtered by another member's id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/audit/export:
    get:
      operationId: exportAudit
      summary: Download the audit log as a CSV file
      description: >-
        B59: the rows of `GET /api/audit` for the same filters (no `after`), newest first, at most 2,000, as one CSV file (`Content-Disposition: attachment; filename="audit-YYYY-MM-DD.csv"`,
        `Cache-Control: no-store`). The first line names the columns: id, at, kind, staffId, staffName, action, objectType, objectId, objectLabel, reasonCode, relatedCase, secondStaffId,
        secondStaffName, source, changedColumns, before, after. Every cell is quoted, and a cell that would run as a spreadsheet formula starts with a quote mark. When there were more rows the
        header `x-audit-export-truncated: 1` is set: narrow the filters. Who sees what is as the list: an administrator every row, any other staff member their own (and is refused another member's id).
        Writes one audit row (`audit.export`, with the filters and the row count). C4 (#270): the session must come from a sign-in in the last 10 minutes, else 403 `reauth_required`.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member (own rows), administrator (every row)]
      x-rate-limit: none
      parameters:
        - { name: staff, in: query, required: false, description: "The acting staff id.", schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: action, in: query, required: false, schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,80}$' }, example: account_review.approved }
        - { name: objectType, in: query, required: false, schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,40}$' }, example: organisation }
        - { name: objectId, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }, example: '310' }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [admin_action, data_access, security] }, example: data_access }
        - { name: case, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }, example: 'strike:12' }
        - { name: from, in: query, required: false, description: "First UTC day (inclusive).", schema: { $ref: '#/components/schemas/Date' } }
        - { name: to, in: query, required: false, description: "Last UTC day (inclusive).", schema: { $ref: '#/components/schemas/Date' } }
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="audit-2026-11-18.csv"
            x-audit-export-truncated:
              description: "`1` only when the filters matched more than 2,000 rows."
              schema: { type: string }
              example: '1'
          content:
            text/csv:
              schema: { type: string }
              example: "\"id\",\"at\",\"kind\",\"staffId\",\"staffName\",\"action\",\"objectType\",\"objectId\",\"objectLabel\",\"reasonCode\",\"relatedCase\",\"secondStaffId\",\"secondStaffName\",\"source\",\"changedColumns\",\"before\",\"after\"\r\n\"88001\",\"2026-11-18 09:30:00.123456+00\",\"admin_action\",\"q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP\",\"Dara Kelly\",\"account_review.approved\",\"organisation\",\"310\",\"Lakeside Care Homes\",\"approved\",\"\",\"\",\"\",\"panel\",\"status\",\"{\\\"status\\\":\\\"pending_review\\\"}\",\"{\\\"status\\\":\\\"verified\\\"}\"\r\n"
        '400':
          description: "As `GET /api/audit`: `bad_query` (an unknown or repeated key, `after` included), `bad_staff_id`, `bad_action`, `bad_object_type`, `bad_object_id`, `bad_case_id`, `bad_kind`, `bad_from`, `bad_to`, `bad_range`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_range } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`reauth_required`: no sign-in in the last 10 minutes. `not_active_staff`: the login is not active. `not_administrator`: a non-administrator filtered by another member's id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: reauth_required } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/signup-no-counts:
    get:
      operationId: listSignupNoCounts
      summary: Read the daily count of "no" answers at candidate sign-up
      description: >-
        C5 (#253): how many visitors answered "no" to "Do you need a work permit?" at candidate sign-up, one number per UTC day, newest first,
        the last 366 counted days. A day with no such answer has no row. Nothing about any visitor is kept. No query keys (any is `bad_query`). Nothing here writes.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The counted days.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [days]
                properties:
                  days:
                    type: array
                    maxItems: 366
                    items:
                      type: object
                      additionalProperties: false
                      required: [day, count]
                      properties:
                        day: { $ref: '#/components/schemas/Date' }
                        count: { type: integer, minimum: 1 }
              example: { days: [{ day: '2026-11-18', count: 12 }, { day: '2026-11-17', count: 9 }] }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/permit-rises:
    get:
      operationId: listPermitRises
      summary: Read the DETE names whose permit count went up in the newest monthly import
      description: >-
        D6 (#49): each DETE name and year whose count rose in the newest monthly import (rows found within a day of the newest), biggest rise first,
        at most 200, with the linked company when there is one. DETE publishes these counts. No query keys (any is `bad_query`). Nothing here writes.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The rises.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rises]
                properties:
                  rises:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: false
                      required: [deteName, year, before, after, organisationId, organisation, foundAt]
                      properties:
                        deteName: { type: string }
                        year: { type: integer }
                        before: { type: integer, minimum: 0 }
                        after: { type: integer, minimum: 1 }
                        organisationId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
                        organisation: { $ref: '#/components/schemas/NullableText' }
                        foundAt: { $ref: '#/components/schemas/Timestamp' }
              example: { rises: [{ deteName: 'Example Ltd', year: 2026, before: 3, after: 5, organisationId: '1042', organisation: 'Example', foundAt: '2026-11-15T03:10:00.000Z' }] }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/dete-links:
    get:
      operationId: listDeteLinkSuggestions
      summary: Suggested links from DETE names to companies
      description: >-
        DETE employer names none of whose rows is linked yet, each matched to a company by the R23 name matcher run on the company's names
        (its display name included), best first (score, then permits over every year), 50 a page. A pair staff rejected or unlinked is left
        out. Companies merged away, rejected or closed are left out. Only `page` (1 to 1000), at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
      responses:
        '200':
          description: One page of suggestions and how many there are in all.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, page, total]
                properties:
                  page: { type: integer, minimum: 1 }
                  total: { type: integer, minimum: 0 }
                  suggestions:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [deteName, permits, organisationId, organisation, matchedName, score, kind]
                      properties:
                        deteName: { type: string }
                        permits: { type: integer, minimum: 0 }
                        organisationId: { $ref: '#/components/schemas/Id' }
                        organisation: { type: string }
                        matchedName: { type: string, description: The company name the matcher used. }
                        score: { type: number, minimum: 0, maximum: 1 }
                        kind: { type: string, enum: [exact, suggested] }
              example: { page: 1, total: 1, suggestions: [{ deteName: 'Example Software Ireland Ltd', permits: 120, organisationId: '310', organisation: Example, matchedName: Example Software, score: 1, kind: exact }] }
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_page`: page not a whole number from 1 to 1000."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_page } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_dete_link_viewer`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_dete_link_viewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: changeDeteLink
      summary: Link, unlink or reject a DETE name for a company
      description: >-
        `link` adds the DETE name to the company as a legal name from DETE (or uses the company's name of the same normalised form), points
        every DETE row of the name at it and refreshes the permit history labels, so the company's permit history and sponsor sort change at
        once. `unlink` takes the link off every row of the name, removes the name a link added when nothing else uses it, and remembers the pair
        as rejected. `reject` turns a suggestion down so it is not suggested again. The Origin header must be the admin app's origin. One
        audit row each. `deteName` is the stored DETE name exactly (no leading or trailing space).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, deteName]
              properties:
                action: { type: string, enum: [link, unlink, reject] }
                deteName: { type: string, minLength: 1, maxLength: 300 }
                organisationId: { $ref: '#/components/schemas/Id' }
            example: { action: link, deteName: 'Example Software Ireland Ltd', organisationId: '310' }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [ok, organisationId, organisationNameId, nameAdded, rowsLinked, labelsChanged, permitHistory]
                    properties:
                      ok: { const: true }
                      organisationId: { $ref: '#/components/schemas/Id' }
                      organisationNameId: { $ref: '#/components/schemas/Id' }
                      nameAdded: { type: boolean }
                      rowsLinked: { type: integer, minimum: 0 }
                      labelsChanged: { type: integer, minimum: 0 }
                      permitHistory: { type: string, enum: [has_history, first_time, not_linked] }
                  - type: object
                    required: [ok, rowsUnlinked, namesRemoved, labelsChanged, organisationIds]
                    properties:
                      ok: { const: true }
                      rowsUnlinked: { type: integer, minimum: 0 }
                      namesRemoved: { type: array, items: { type: integer } }
                      labelsChanged: { type: integer, minimum: 0 }
                      organisationIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
                  - type: object
                    required: [ok, organisationId, rejected]
                    properties:
                      ok: { const: true }
                      organisationId: { $ref: '#/components/schemas/Id' }
                      rejected: { const: true }
              example: { ok: true, organisationId: '310', organisationNameId: '5521', nameAdded: true, rowsLinked: 6, labelsChanged: 1, permitHistory: has_history }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field or over 2,000 characters. `bad_action`: not link, unlink or reject. `bad_name`:
            deteName missing, not a string, empty, over 300 characters, with control characters or with leading or trailing space.
            `bad_organisation_id`: missing (link, reject) or not an id.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_name } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_dete_link_staff`: not an account reviewer."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_dete_link_staff } } }
        '404':
          description: "`not_found`: no such company. `name_not_found`: no DETE row has this name."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: name_not_found } } }
        '409':
          description: >-
            `linked_elsewhere`: the name is linked to another company (unlink first). `name_taken`: another company has a name of the same
            normalised form (merge first). `company_merged`: the company was merged into another. `not_linked`: unlink of a name not linked.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: linked_elsewhere } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/domains:
    get:
      operationId: listCompanyDomains
      summary: List a company's email domains
      description: >-
        The domains saved for one company, by name. A claimant on one of these domains is verified with no review, so only account
        reviewers and administrators see and change them. Only `organisationId`, at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      parameters:
        - { name: organisationId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains: { type: array, items: { $ref: '#/components/schemas/DomainRow' } }
              example: { domains: [{ id: '17', domain: example.ie, source: admin, addedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', createdAt: '2026-11-18 09:30:00.123456+00' }] }
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_organisation_id`: missing or not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_organisation_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_domain_staff`: neither account_reviewer nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_domain_staff } } }
        '404':
          description: "`not_found`: no such company."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: changeCompanyDomain
      summary: Add or remove a company's email domain
      description: >-
        `add` saves a domain (source admin) for the company; `remove` deletes one. The Origin header must be the admin app's origin. A
        domain is a plain lower-case host name of two or more labels (no scheme, port, IP address, punycode label or free email provider)
        for add; remove takes any saved string up to 253 characters, so an old row stays removable. One audit row with the reason code.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, organisationId, domain, reason]
              properties:
                action: { type: string, enum: [add, remove] }
                organisationId: { $ref: '#/components/schemas/Id' }
                domain: { type: string, maxLength: 253 }
                reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: add, organisationId: '310', domain: example.ie, reason: owner_confirmed }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, domain]
                properties:
                  ok: { const: true }
                  domain: { type: string }
              example: { ok: true, domain: example.ie }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, a missing field or over 1,000 characters. `bad_action`: not add or remove.
            `bad_organisation_id`, `bad_domain`, `bad_reason`: a field of the wrong shape.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_domain } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`, `not_domain_staff`: as on GET. `reauth_required` (C4, #270, audit SEC-12): the session is older than 10 minutes; sign in again."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such company. `domain_not_found`: remove of a domain the company does not have."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: domain_not_found } } }
        '409':
          description: >-
            `domain_owned_by_other`: another company has the domain (the body names it, `DomainTakenError`). `free_email_domain`: a free
            email provider. `already_added`: the company has it already. `company_merged`: the company was merged into another.
            `open_ban_case`: an open trust and safety case would ban this domain, so it cannot be removed now.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/DomainTakenError'
                  - $ref: '#/components/schemas/ErrorBody'
              example: { error: domain_owned_by_other, owner: { organisationId: '311', displayName: Example Holdings Ltd } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/member-limit:
    post:
      operationId: setMemberLimit
      summary: Set a company's member limit
      description: >-
        Sets how many active members a company may have, from 1 to 50, never below its active members now. The Origin header must be the
        admin app's origin. One audit row with the old and new limit and the reason code.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisationId, memberLimit, reason]
              properties:
                organisationId: { $ref: '#/components/schemas/Id' }
                memberLimit: { type: integer, minimum: 1, maximum: 50 }
                reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { organisationId: '310', memberLimit: 12, reason: larger_team }
      responses:
        '200':
          description: The new limit and the active members counted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, organisationId, memberLimit, activeMembers]
                properties:
                  ok: { const: true }
                  organisationId: { $ref: '#/components/schemas/Id' }
                  memberLimit: { type: integer }
                  activeMembers: { type: integer }
              example: { ok: true, organisationId: '310', memberLimit: 12, activeMembers: 4 }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, reason not a string, memberLimit not a number, or over 1,000 characters.
            `bad_input`: organisationId not an id. `bad_limit`: not a whole number from 1 to 50. `bad_reason`: not a reason code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_limit } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_limit_staff`: neither account_reviewer nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_limit_staff } } }
        '404':
          description: "`not_found`: no such company."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`below_active`: the limit is lower than the company's active members."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: below_active } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/merge:
    get:
      operationId: previewMerge
      summary: Show two companies before a merge
      description: >-
        The companies with the given ids (one or two `id` keys) and the counts a merge would move. No person's data. `id` is the one key
        that may repeat; any other key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, fetched_job_reviewer, rules_data_editor, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - name: id
          in: query
          required: true
          description: One or two company ids (`?id=1&id=2`).
          style: form
          explode: true
          schema: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: The companies found (an unknown id is simply missing).
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies: { type: array, items: { $ref: '#/components/schemas/CompanyPreview' } }
              example: { companies: [{ id: '310', slug: example-care, display_name: Example Care Ltd, kind: employer, status: verified, cro_number: '123456', merged_into_id: null, active_members: 2, jobs: 5, names: 1 }] }
        '400':
          description: "`bad_input`: no id, more than two, or one that is not an id. `bad_query`: a query key other than `id`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_input } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_company_viewer`: none of the roles listed."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_company_viewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: mergeCompanies
      summary: Merge one company into another
      description: >-
        Moves the absorbed company's names (with their DETE links) and jobs to the survivor and marks it merged. No undo route (the audit
        row lists every moved id, so a merge can be reversed by hand). The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, fetched_job_reviewer]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [absorbedId, survivorId]
              properties:
                absorbedId: { $ref: '#/components/schemas/Id' }
                survivorId: { $ref: '#/components/schemas/Id' }
            example: { absorbedId: '311', survivorId: '310' }
      responses:
        '200':
          description: Merged, with what moved.
          content:
            application/json:
              schema:
                type: object
                required: [ok, absorbed, survivor, names, jobs]
                properties:
                  ok: { const: true }
                  absorbed: { $ref: '#/components/schemas/Id' }
                  survivor: { $ref: '#/components/schemas/Id' }
                  names: { type: integer }
                  jobs: { type: integer }
              example: { ok: true, absorbed: '311', survivor: '310', names: 1, jobs: 3 }
        '400':
          description: "`bad_body`: not one JSON object, an unknown field, or over 1,000 characters. `bad_input`: an id missing or not an id. `same_company`: both ids the same."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_company } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_company_staff`: neither account_reviewer nor fetched_job_reviewer. `reauth_required` (C4, #270, audit SEC-12): the session is older than 10 minutes; sign in again."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_company_staff } } }
        '404':
          description: "`not_found`: one of the companies does not exist."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `already_merged`: the absorbed company was merged already. `target_merged`: the survivor was merged into another.
            `not_mergeable`: one is rejected, closed, banned or suspended. `kind_mismatch`: not the same kind. `active_members`: the absorbed
            company still has active members. `has_applications`: the absorbed company has applications. `open_reports`: the absorbed
            company has open company reports (decide them first). A merge moves the absorbed company's decided company reports and strike cases too.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: kind_mismatch } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/owner-reassign:
    get:
      operationId: listOwnerReassigns
      summary: List open owner reassignment requests
      description: >-
        The open requests to make another member the account owner, oldest first, 20 a page. Shows both people's emails, so account
        reviewers only. `after` is the opaque `next` token of the page before. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      parameters:
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OwnerRequest' } }
                  next: { type: [string, 'null'] }
              example:
                items:
                  - { id: '5', organisation_id: '310', display_name: Example Care Ltd, new_owner_membership_id: '77', new_owner_email: new.owner@example.ie, old_owner_membership_id: '70', old_owner_email: old.owner@example.ie, requested_by_staff_user_id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', requested_at: '2026-11-11 09:30:00.123456+00', completes_after: '2026-11-18 09:30:00.123456+00', can_complete: true }
                next: null
        '400':
          description: "`bad_cursor`: `after` is not a token of this list (a plain id, a changed token or another list's token). `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_account_reviewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnOwnerReassign
      summary: Request, complete or cancel an owner reassignment
      description: >-
        `request` records a member's request to become the account owner, after the reviewer checked the company domain and the CRO number
        (both ticks must be true); the old owner gets a notice. `complete` finishes it once its 7 days have passed (the old owner becomes a
        recruiter). `cancel` ends an open request. One open request per company. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, membershipId, domainChecked, croChecked]
                  properties:
                    action: { const: request }
                    membershipId: { $ref: '#/components/schemas/Id' }
                    domainChecked: { type: boolean }
                    croChecked: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [complete, cancel] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: request, membershipId: '77', domainChecked: true, croChecked: true }
      responses:
        '200':
          description: "`request`: the request id, company and when it may complete. `complete`: the new owner membership. `cancel`: the request id."
          content:
            application/json:
              schema:
                type: object
                required: [ok, requestId]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  organisationId: { $ref: '#/components/schemas/Id' }
                  completesAfter: { type: string }
                  ownerMembershipId: { $ref: '#/components/schemas/Id' }
              example: { ok: true, requestId: '5', organisationId: '310', completesAfter: '2026-11-25T09:30:00.123456+00:00' }
        '400':
          description: >-
            `bad_body`: not one JSON object, a field that does not belong to the action, a tick that is not a boolean, or over 1,000
            characters. `bad_action`: not request, complete or cancel. `bad_input`: an id that is not an id. `not_checked`: a tick is false.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_checked } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role. `reauth_required` (C4, #270, audit SEC-12): a request or a completion on a session older than 10 minutes; sign in again (cancel works on any session)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`member_not_found`: no such membership (request). `not_found`: no such request (complete, cancel)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: member_not_found } } }
        '409':
          description: >-
            `already_owner`: the member is the owner. `company_not_open`: the company is not open for this. `no_owner`: the company has no
            owner. `user_not_active`: the member's login is not active. `request_open`: the company has an open request already.
            `not_open`: the request is not open. `too_early`: the 7 days have not passed. `owner_changed`: the owner is no longer the one the
            request named. `member_gone`: the member left. `same_person` (audit SEC-11, migration 0079): the reviewer completing is the one who asked;
            another account reviewer completes it.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: too_early } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/contact:
    get:
      operationId: listContactMessages
      summary: List contact messages, or read one
      description: >-
        Without `id`: the new and claimed contact form messages, oldest first, 20 a page (no name, email or text in the list). With `id`:
        that one message in full, whatever its status; the read is logged (an audit row of kind data_access, with the candidate as
        subject). Only `id` and `after`, each at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, content_editor, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '901' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ContactSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/ContactMessage' }
              example:
                items: [{ id: '901', status: new, topic: general, surface: candidate, createdText: '2026-11-18 09:30:00.123456+00', claimedByStaffUserId: null, claimedText: null }]
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_contact_reader`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_contact_reader } } }
        '404':
          description: "`not_found`: no such message (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnContactMessage
      summary: Claim a contact message, or mark it answered, closed or spam
      description: >-
        `claim` takes a new message (or a stale claim: over 24 hours, or held by a login no longer active); claiming one's own is fine.
        `answer`, `close` and `spam` are for the claimer only. Each step writes one audit row (ids and the new status, never the text).
        Nothing is sent from here: staff reply from the support mailbox. The Origin header must be the admin app's origin. An administrator
        may read but not act.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, content_editor]
      x-rate-limit: none
      x-body-cap: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, messageId]
              properties:
                action: { type: string, enum: [claim, answer, close, spam] }
                messageId: { $ref: '#/components/schemas/Id' }
            example: { action: claim, messageId: '901' }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 200 characters. `bad_action`: unknown action. `bad_message_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_message_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_contact_staff`: neither services_case_handler nor content_editor."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_contact_staff } } }
        '404':
          description: "`not_found`: no such message."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`: answered, closed or spam already. `claimed_by_other`: a fresh claim of someone else. `not_claimed`: answer, close or spam on a new message. `not_claimer`: someone else holds the claim."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_claimer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/content:
    get:
      operationId: listContentPages
      summary: List content pages, or show one
      description: >-
        Without `id`: pages of every state, newest change first, 20 a page, filtered by `kind` and `status`. With `id`: one page with its
        body. With `stale=1` (step 15 Q14, B74): the published guides, help and occupation pages whose checked-on date is over `staleDays` (90) days
        old, oldest first, at most 100 (a help page with no checked-on date is not listed); `kind` (guide, help or occupation) narrows it and is the only other key allowed with it.
        With `id` and `preview=1` (B74): the page as its public page is made, whatever its state, as `{ item }` (no `Cache-Control` caching: `no-store`), with `status`
        so the page can say Draft; no other key. Only `id`, `kind`, `status`, `after`, `stale` and `preview`, each at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [content_editor, rules_data_editor, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '41' }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [guide, update, help, occupation, notice] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, published, withdrawn] } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: stale, in: query, required: false, schema: { const: '1' } }
        - { name: preview, in: query, required: false, description: "B74: `1` with `id` shows the page as the public page would.", schema: { const: '1' } }
      responses:
        '200':
          description: The page (no `id`), `{ item }` with `body` (with `id`), the page as its public page (with `id` and `preview=1`), or the stale pages (with `stale=1`).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ContentSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        allOf:
                          - $ref: '#/components/schemas/ContentSummary'
                          - { type: object, required: [body], properties: { body: { type: string } } }
                  - type: object
                    description: "B74: `?id=&preview=1`. The fields the public read of this kind gives, plus the state."
                    required: [item]
                    properties:
                      item:
                        type: object
                        required: [id, kind, slug, title, body, sourceUrl, checkedOn, publishedAt, updatedAt, status]
                        properties:
                          id: { $ref: '#/components/schemas/Id' }
                          kind: { type: string, enum: [guide, update, help, occupation, notice] }
                          slug: { type: string, example: how-to-apply }
                          title: { type: string, example: How to apply }
                          body: { type: string, example: "First, check the job page." }
                          sourceUrl: { type: [string, 'null'], example: 'https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/' }
                          checkedOn: { type: [string, 'null'], example: '2026-11-01' }
                          publishedAt: { type: [string, 'null'], description: "Null for a draft.", example: null }
                          updatedAt: { $ref: '#/components/schemas/DbTime' }
                          category: { type: [string, 'null'], enum: [salary_minimums, quotas, occupation_lists, processing, report_problem, permit_services, jobs_badges, account, null], description: "B17, B19: an update's type (salary_minimums, quotas, occupation_lists, processing) or a help page's group (report_problem, permit_services, jobs_badges, account); null for the other kinds.", example: quotas }
                          effectiveFrom: { type: [string, 'null'], description: "B17: the day an update's rule starts; null for the other kinds.", example: '2027-01-01' }
                          status: { type: string, enum: [draft, published, withdrawn], example: draft }
                  - type: object
                    required: [staleDays, items, truncated]
                    properties:
                      staleDays: { type: integer }
                      items: { type: array, items: { $ref: '#/components/schemas/ContentSummary' } }
                      truncated: { type: boolean }
              example:
                items: [{ id: '41', kind: help, slug: how-to-apply, title: How to apply, status: draft, sourceUrl: null, checkedOn: null, publishedAt: null, updatedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', updatedAt: '2026-11-18 09:30:00.123456+00' }]
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key, `stale` or `preview` not `1`, `stale` with a key other than `kind`, `preview` without `id` or with another key. `bad_kind`: not one of the values (with `stale`, only guide, help or occupation). `bad_status`: not one of the values. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_kind } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_content_staff`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_content_staff } } }
        '404':
          description: "`not_found`: no such page (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnContentPage
      summary: Create or edit a draft, publish or withdraw a page
      description: >-
        `create` (content_editor) writes a new draft; an occupation page's slug is its SOC 2010 code. Kind `notice` (decision #291) is a short notice staff switch on (publish) and off (withdraw): the permit pages show the published one with slug `dete-portal-closed` (GET /api/permit-notice on the candidate site); like help it needs no source or checked-on date. `edit` (content_editor) changes a
        draft or a withdrawn page; kind and slug never change and a published page is withdrawn first. `publish`: a content_editor
        publishes help and update pages, a rules_data_editor guides and occupation texts; anything but help needs a source and a
        checked-on date. `withdraw` (content_editor) takes any published page down. Title 1 to 200 characters, body 1 to 50,000
        characters (line breaks and tabs allowed, no other control characters), sourceUrl an http or https address up to 500 characters,
        checkedOn a real day not in the future. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [content_editor, rules_data_editor]
      x-rate-limit: none
      x-body-cap: 110000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, kind, slug, title, body]
                  properties:
                    action: { const: create }
                    kind: { type: string, enum: [guide, update, help, occupation, notice] }
                    slug: { type: string }
                    title: { type: string, maxLength: 200 }
                    body: { type: string, maxLength: 50000 }
                    sourceUrl: { type: string, maxLength: 500 }
                    checkedOn: { $ref: '#/components/schemas/Date' }
                    category: { type: string, enum: [salary_minimums, quotas, occupation_lists, processing, report_problem, permit_services, jobs_badges, account], description: "B17, B19: an update takes one of the first four, a help page one of the last four, any other kind none (`bad_category`).", example: quotas }
                    effectiveFrom: { $ref: '#/components/schemas/Date', description: "B17: updates only (`bad_effective_from` for another kind). Unlike checkedOn it may be a future day." }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: edit }
                    id: { $ref: '#/components/schemas/Id' }
                    title: { type: string, maxLength: 200 }
                    body: { type: string, maxLength: 50000 }
                    sourceUrl: { type: string, maxLength: 500 }
                    checkedOn: { $ref: '#/components/schemas/Date' }
                    category: { type: string, enum: [salary_minimums, quotas, occupation_lists, processing, report_problem, permit_services, jobs_badges, account], description: "B17, B19: an update takes one of the first four, a help page one of the last four, any other kind none (`bad_category`).", example: quotas }
                    effectiveFrom: { $ref: '#/components/schemas/Date', description: "B17: updates only (`bad_effective_from` for another kind). Unlike checkedOn it may be a future day." }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { type: string, enum: [publish, withdraw] }
                    id: { $ref: '#/components/schemas/Id' }
            example: { action: create, kind: help, slug: how-to-apply, title: How to apply, body: Pick a job and follow the link to the employer's own page. }
      responses:
        '200':
          description: "`create` answers the new id; the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  id: { $ref: '#/components/schemas/Id' }
              example: { ok: true, id: '41' }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, or over 110,000 characters. `bad_action`: unknown action.
            `bad_id`, `bad_kind`, `bad_slug`, `bad_title`, `bad_body_text` (also a body that breaks the body format of B16), `bad_source_url`, `bad_checked_on`, `bad_category`, `bad_effective_from`: a field of the wrong type or
            outside its rules. `nothing_to_change`: an edit with no field.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_slug } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: >-
            `bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_content_editor`: create,
            edit or withdraw without content_editor, or publish of help or update without it. `not_rules_data_editor`: publish of a guide or
            occupation text without rules_data_editor. `not_publisher`: publish with neither role.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_content_editor } } }
        '404':
          description: "`not_found`: no such page."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`slug_taken`: a page with this kind and slug exists. `not_editable`: edit of a published page. `already_published`: publish of a published page. `not_published`: withdraw of a page that is not published. `needs_source_and_checked_on`: publish of a page that is not help or a notice without both."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: needs_source_and_checked_on } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/employer-jobs:
    get:
      operationId: listEmployerJobQueue
      summary: List a held employer or agency job queue, or show one item
      description: >-
        Without `id`: the open and claimed items of one queue (`queue` required), oldest first, 20 a page. With `id`: one item of the four
        queues with its advert text, whatever its status. scam_flag is for trust_and_safety, post_strike_job_review, agency_client_check and
        licence_lapse_job (P9: a live job of an agency whose licence was not found on the WRC list) for account_reviewer; an administrator may
        read and act on all four. Only `id`, `queue` and `after`, each at most once (anything
        else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety (scam_flag), account_reviewer (post_strike_job_review, agency_client_check, licence_lapse_job), administrator (all four)]
      x-rate-limit: none
      parameters:
        - { name: queue, in: query, required: false, description: "Required without `id`.", schema: { type: string, enum: [scam_flag, post_strike_job_review, agency_client_check, licence_lapse_job] } }
        - { name: id, in: query, required: false, schema: { type: string }, example: '2201' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` with `advertText` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/JobQueueItem' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/JobQueueItem' }
              example:
                items:
                  - { id: '2201', queue: agency_client_check, status: open, claimedBy: null, reason: client_not_found, createdAt: '2026-11-24T09:12:00.000Z', jobId: '5501', jobStatus: in_review, source: agency, title: Staff Nurse, employerName: Example Recruitment Ltd, county: Dublin, occupationCode: '2231', permitType: critical_skills, salaryLow: 38000, salaryHigh: 45000, payGrade: null, badge: null, closesAt: '2026-12-31T23:59:59.000Z', organisationId: '312', company: Example Recruitment Ltd, companyStatus: verified, restricted: false, clientName: Example Hospital, clientCheck: not_found }
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_queue`: no `queue` (without `id`) or an unknown one. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_queue } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_reviewer`: no role for any of the queues, or not for this queue or this item's queue."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no such item (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnEmployerJobItem
      summary: Claim, release, approve or reject a held employer or agency job
      description: >-
        `claim` takes an open item (or a stale claim of someone else). Only the claimer releases, approves or rejects. `approve` closes the
        item; the job goes live only when no other open item of the three queues holds it and the company may go live. `reject` closes the
        item and closes the job as removed (it never comes back), dropping its other items. A licence_lapse_job item holds a job that is not
        in review: `approve` closes the item and leaves the job as it is, `reject` closes the job as removed. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety (scam_flag), account_reviewer (post_strike_job_review, agency_client_check, licence_lapse_job), administrator (all four)]
      x-rate-limit: none
      x-body-cap: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [claim, release, approve] }
                    itemId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, reason]
                  properties:
                    action: { const: reject }
                    itemId: { $ref: '#/components/schemas/Id' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: approve, itemId: '2201' }
      responses:
        '200':
          description: "`approve` also gives the job's status after it (live, or still in_review while another item holds it); the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  jobId: { $ref: '#/components/schemas/Id' }
                  jobStatus: { type: string, enum: [live, in_review, under_review, hidden] }
              example: { ok: true, jobId: '5501', jobStatus: live }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 300 characters. `bad_action`: unknown action. `bad_item_id`: not an id. `bad_reason`: not a reason code."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_reviewer`: no role for this item's queue."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no such item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`, `claimed_by_other`, `not_claimed`, `not_claimer`: the item's state does not allow it. `job_not_in_review`: the job is no longer in review. `company_not_active`: approve of a job whose company may not go live (not verified, or suspended, banned or closed)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_claimer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/employer-jobs/authority:
    get:
      operationId: getEmployerJobAuthority
      summary: List or open the client's written authority kept on an agency job
      description: >-
        P8. With `jobId` only: the copies an agency uploaded on its job that names a client (metadata only, oldest first, a copy removed by
        retention shows `copyDeleted`). With `jobId` and `docId`: the stored copy itself (S-Q6: inline, the type from the stored kind, nosniff, no-store),
        only once the malware scan passed, and one `data_access` audit row (`job_authority.open`, the copy's id, the job id, the role in force). The list writes no audit row. For the staff who check
        agency jobs: account_reviewer (the agency_client_check queue) or an administrator. Only `jobId` and `docId`, each at most once.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      parameters:
        - { name: jobId, in: query, required: true, schema: { type: string }, example: '5501' }
        - { name: docId, in: query, required: false, schema: { type: string }, example: '77' }
      responses:
        '200':
          description: The copies (without `docId`, JSON), or the stored copy itself (with `docId`).
          headers:
            Content-Type: { schema: { type: string, enum: [application/pdf, image/jpeg, image/png] }, description: "With the id: from the stored kind, never the uploader's." }
            Content-Disposition: { schema: { type: string }, example: "inline; filename*=UTF-8''letter.pdf" }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Security-Policy: { schema: { type: string, const: "frame-ancestors 'self'" } }
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, fileName, contentType, sizeBytes, uploadedAt, copyDeleted]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        fileName: { type: [string, 'null'] }
                        contentType: { type: [string, 'null'], enum: [pdf, jpeg, png, null] }
                        sizeBytes: { type: [integer, 'null'] }
                        uploadedAt: { $ref: '#/components/schemas/Timestamp' }
                        copyDeleted: { type: boolean }
              example: { documents: [{ id: '77', fileName: client-authority.pdf, contentType: pdf, sizeBytes: 182044, uploadedAt: '2026-11-18T10:00:00.000Z', copyDeleted: false }] }
            application/pdf: { schema: { type: string, format: binary }, example: '(the file bytes, at most 4,194,304)' }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '400':
          description: "`bad_query`: no `jobId`, or an unknown or repeated key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_reviewer`: neither account_reviewer nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no agency job naming a client with that id, or no stored copy with that id on it (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409': { $ref: '#/components/responses/StaffFileRefused' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. No audit row is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
  /api/fetched-jobs:
    get:
      operationId: listFetchedJobQueue
      summary: List the fetched-job queue, or show one item
      description: >-
        Without `id`: the open and claimed fetched-job review items, oldest first, 20 a page, with `counts` of the open items per rules stage
        text (the category tabs; the counts ignore `stage`). `stage` keeps only the items with exactly that stage text. With `id`: one item
        with the saved advert text, the quoted evidence and the matcher model, whatever its status. Only `id`, `after` and `stage`, each at
        most once (anything else is `bad_query`). No role stands in for fetched_job_reviewer, not even administrator.
      security: [{ staffSession: [] }]
      x-roles: [fetched_job_reviewer]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '3301' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: stage, in: query, required: false, description: "Only items with exactly this stage text (1 to 200 characters), as `counts` lists them.", schema: { type: string, minLength: 1, maxLength: 200 }, example: 7 contract unclear (admin queue) }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` with `advertText`, `quotedEvidence` and `matcherModel` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next, counts]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/FetchedQueueItem' } }
                      next: { type: [string, 'null'] }
                      counts:
                        type: object
                        description: Open and claimed items per stage text, biggest first.
                        required: [total, stages]
                        properties:
                          total: { type: integer, example: 34 }
                          stages:
                            type: array
                            items:
                              type: object
                              required: [stage, count]
                              properties:
                                stage: { type: [string, 'null'], description: "The stage text; null for an item with no fetched advert.", example: 7 contract unclear (admin queue) }
                                count: { type: integer, example: 8 }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/FetchedQueueItem' }
              example:
                items:
                  - { id: '3301', status: open, claimedBy: null, jobId: '6601', organisationId: '320', title: Software Engineer, employerName: Example Software Ltd, advertUrl: 'https://jobs.example.com/12345', occupationCode: null, permitHistory: has_history, sponsorPermits: 14, stage: 4 occupation, reason: occupation unclear, wrcAgency: false, queuedAt: '2026-11-09 06:02:11.123456+00', county: Cork, sourceKind: careers_page }
                next: null
                counts: { total: 1, stages: [{ stage: 4 occupation, count: 1 }] }
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_cursor`: a token this list did not make. `bad_stage`: `stage` is empty or over 200 characters."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_stage } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_reviewer`: no fetched_job_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no such item (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnFetchedJobItem
      summary: Claim, release, approve or reject a fetched job
      description: >-
        `claim` takes an open item (or a stale claim). Only the claimer releases, approves or rejects. `approve` re-runs the rules chain on
        the saved advert with the claimer's occupation code (four digits, on the Critical Skills or Ineligible list) and, if given, the pay
        (whole euros a year, 1 to 1,000,000; a top needs a bottom and may not be below it) and the contract; only a pass the fetcher would
        make live goes live, otherwise `rules_failed` with the stage and the item stays claimed. `reject` closes the job as removed. The
        Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [fetched_job_reviewer]
      x-rate-limit: none
      x-body-cap: 600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [claim, release] }
                    itemId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, occupationCode]
                  properties:
                    action: { const: approve }
                    itemId: { $ref: '#/components/schemas/Id' }
                    occupationCode: { type: string, pattern: '^[0-9]{4}$' }
                    salaryLow: { type: integer, minimum: 1, maximum: 1000000 }
                    salaryHigh: { type: integer, minimum: 1, maximum: 1000000 }
                    contractConfirmed: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, reason]
                  properties:
                    action: { const: reject }
                    itemId: { $ref: '#/components/schemas/Id' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: approve, itemId: '3301', occupationCode: '2136', salaryLow: 45000, salaryHigh: 60000, contractConfirmed: true }
      responses:
        '200':
          description: "`approve` also gives the job and its pass route; the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  jobId: { $ref: '#/components/schemas/Id' }
                  passRoute: { type: string, enum: [stated_pay, big_company, public_pay] }
              example: { ok: true, jobId: '6601', passRoute: stated_pay }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, or over 600 characters. `bad_action`: unknown action.
            `bad_item_id`: not an id. `bad_occupation_code`: not four digits, or on neither list. `bad_salary`: out of range, a top with no
            bottom, or a top below the bottom. `bad_input`: contractConfirmed not a boolean. `bad_reason`: not a reason code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_salary } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_reviewer`: no fetched_job_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `already_decided`, `claimed_by_other`, `not_claimed`, `not_claimer`: the item's state does not allow it. `job_not_in_review`: the
            job left review. `no_advert_text`: no saved advert to re-run the rules on. `rules_failed`: the rules did not pass; `stage` names
            the stage that failed.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: rules_failed, stage: 5 pay } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/fetched-jobs/dry-run:
    get:
      operationId: dryRunFetchedJobApprove
      summary: What Approve would do for a fetched job, nothing written
      description: >-
        Re-runs the rules on the saved advert with the occupation code, pay and contract given, as `approve` does, and returns each check, the
        badge the job would get, its pay grade and its quota status. Any fetched-job reviewer may ask, claimed or not; a decided item or a job
        no longer in review is refused as Approve would. Not a hold: the rules or the advert may change before the real Approve. Only the
        named keys, each once (anything else is `bad_query`). No role stands in for fetched_job_reviewer, not even administrator. Never cached.
      security: [{ staffSession: [] }]
      x-roles: [fetched_job_reviewer]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: true, description: "The item's id.", schema: { type: string }, example: '3301' }
        - { name: occupationCode, in: query, required: true, description: "Four digits, on the Critical Skills or Ineligible list.", schema: { type: string, pattern: '^[0-9]{4}$' }, example: '2231' }
        - { name: salaryLow, in: query, required: false, description: "Whole euros a year, 1 to 1,000,000.", schema: { type: integer, minimum: 1, maximum: 1000000 }, example: 45000 }
        - { name: salaryHigh, in: query, required: false, description: "Whole euros a year; needs salaryLow and may not be below it.", schema: { type: integer, minimum: 1, maximum: 1000000 }, example: 60000 }
        - { name: contractConfirmed, in: query, required: false, description: "The reviewer confirms the contract is long enough.", schema: { type: string, enum: ['true', 'false'] }, example: 'true' }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchedDryRun' }
              example: { itemId: '3301', jobId: '6601', wouldPublish: true, passRoute: stated_pay, failedStage: null, badge: critical_skills_eligible, occupationCode: '2231', salaryLow: 45000, salaryHigh: 60000, payGrade: Staff Nurse, quotaFull: false, stage: PASS (salary stated), checks: [{ check: irish_employer, result: pass, detail: brand list match }, { check: contract, result: pass, detail: two years stated }] }
        '400':
          description: "`bad_item_id`: `id` missing or not an id. `bad_occupation_code`: missing, not four digits, or on neither list. `bad_salary`: not whole euros, out of range, a top with no bottom, or a top below the bottom. `bad_input`: contractConfirmed is not true or false. `bad_query`: an unknown or repeated key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_salary } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_reviewer`: no fetched_job_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no such item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`: the item is decided. `job_not_in_review`: the job left review. `no_advert_text`: no saved advert to re-run the rules on."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_decided } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/manual-jobs:
    get:
      operationId: listManualPosts
      summary: List the staff manual posts
      description: >-
        The jobs staff posted by hand, newest first, 20 a page. The next page is asked for with `after` (the opaque `next` token of the
        page before); `mine=true` lists only the signed-in member's own posts. `reason` says why a draft is not listed; `badge` and
        `sponsor_request_id` say where the post stands in the later two-person "Sponsor confirmed" step (#232). An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: mine, in: query, required: false, description: "`true`: only one's own posts. Any other value is `bad_query`.", schema: { type: string, enum: ['true'] }, example: 'true' }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManualRow' } }
                  next: { type: [string, 'null'] }
              example:
                items:
                  - { id: '7701', organisation_id: '310', display_name: Example Care Ltd, title: Senior Care Assistant, status: draft, badge: null, pass_route: null, posted_by_staff_id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', posted_at: '2026-11-18 09:30:00.123456+00', closes_at: '2026-12-31 23:59:59+00', closed_at: null, reason: pay_below_minimum, sponsor_request_id: null }
                next: null
        '400':
          description: "`bad_cursor`: `after` is not a token of this list (a plain id, a changed token or another list's token). `bad_query`: an unknown or repeated query key (`before` included), or `mine` not `true`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_manual_viewer`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_manual_viewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnManualPost
      summary: Post a job by hand, or close one's own manual post
      description: >-
        `create` posts a job for an existing employer or agency. It is listed (live, "Critical Skills eligible") only when it passes the
        checks an employer post runs (the occupation list, the contract, the rules chain, then the pay against the minimum for the stated
        hours; a public pay employer on a list role passes without the minimum, unless payGrade is a grade code of the pay scales in force and the
        stated pay is off that grade's scale, `pay_not_on_scale`, #269); otherwise it stays a draft and `reason` says why. Never "Sponsor confirmed". `close` closes a manual post the same staff
        member posted. The Origin header must be the admin app's origin. Field rules for create: title 2 to 200 characters on one line;
        description 20 to 10,000 characters (line breaks and tabs allowed); county one of the 26 counties; occupationCode a SOC 2010 code;
        contractMonths 1 to 600 or null (null means permanent); salaryLow and salaryHigh 1 to 1,000,000 or null (pay or a public pay grade
        is needed; a top needs a bottom and may not be below it); payGrade 1 to 100 characters or null; healthInsuranceEur 0 to 50,000 or
        null; weeklyHours 1 to 60; closesOn a real day, after now and at most 90 days ahead; applyUrl an https address of 10 to 500
        characters with no user name or password.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 30000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, organisationId, title, description, county, occupationCode, weeklyHours, closesOn, applyUrl]
                  properties:
                    action: { const: create }
                    organisationId: { $ref: '#/components/schemas/Id' }
                    title: { type: string, minLength: 2, maxLength: 200 }
                    description: { type: string, minLength: 20, maxLength: 10000 }
                    county: { type: string, enum: [Carlow, Cavan, Clare, Cork, Donegal, Dublin, Galway, Kerry, Kildare, Kilkenny, Laois, Leitrim, Limerick, Longford, Louth, Mayo, Meath, Monaghan, Offaly, Roscommon, Sligo, Tipperary, Waterford, Westmeath, Wexford, Wicklow] }
                    occupationCode: { type: string, pattern: '^[0-9]{4}$' }
                    contractMonths: { type: [integer, 'null'], minimum: 1, maximum: 600 }
                    salaryLow: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
                    salaryHigh: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
                    payGrade: { type: [string, 'null'], minLength: 1, maxLength: 100 }
                    healthInsuranceEur: { type: [integer, 'null'], minimum: 0, maximum: 50000 }
                    weeklyHours: { type: integer, minimum: 1, maximum: 60 }
                    closesOn: { $ref: '#/components/schemas/Date' }
                    applyUrl: { type: string, format: uri, minLength: 10, maxLength: 500 }
                - type: object
                  additionalProperties: false
                  required: [action, jobId]
                  properties:
                    action: { const: close }
                    jobId: { $ref: '#/components/schemas/Id' }
            example: { action: close, jobId: '7701' }
      responses:
        '200':
          description: "`create`: the job, its status and why it is a draft. `close`: the job id."
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId]
                properties:
                  ok: { const: true }
                  jobId: { $ref: '#/components/schemas/Id' }
                  status: { type: string, enum: [live, draft] }
                  passRoute: { type: [string, 'null'], enum: [stated_pay, public_pay, null] }
                  reason:
                    type: [object, 'null']
                    properties:
                      code: { type: string }
                      stage: { type: string }
              example: { ok: true, jobId: '7701', status: draft, passRoute: null, reason: { code: pay_below_minimum } }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, or over 30,000 characters. `bad_action`: not create or close. `bad_input`:
            close with a jobId that is not an id. Create: `bad_organisation_id`, `bad_title`, `bad_apply_url`, `bad_description`,
            `bad_county`, `bad_occupation_code`, `bad_contract_months`, `bad_salary`, `bad_pay_grade`, `bad_health_insurance`,
            `bad_weekly_hours`, `bad_closes_on` (not a real day), `bad_closing_date` (in the past or over 90 days ahead).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_closing_date } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role. `not_poster`: close of a manual post somebody else posted."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_poster } } }
        '404':
          description: "`company_not_found`: no such company (create). `not_found`: no such manual post (close)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: company_not_found } } }
        '409':
          description: "`company_not_postable`: not an employer or agency, merged, or rejected, closed, banned or suspended. `bad_state`: close of a post already closed or hidden."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: company_not_postable } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/manual-jobs/companies:
    get:
      operationId: searchManualCompanies
      summary: Find a company to post a manual job for
      description: >-
        B72: the employer picker. At most 10 employers and agencies a post can be made for (not merged, rejected, closed, banned or suspended) whose display name, or any
        legal or alias name, contains the text, or whose CRO number starts with it, by display name. `more` is true when there are others (type more). Company facts
        only: no login, member or email. Staff do not create companies here (#287). Nothing is written.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      parameters:
        - { name: q, in: query, required: true, description: "3 to 100 characters after trimming, no control character.", schema: { type: string, minLength: 3, maxLength: 100 }, example: Fake Orchard }
      responses:
        '200':
          description: The companies.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, more]
                properties:
                  items:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, displayName, kind, croNumber, status, county]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        displayName: { type: string, description: "The company's display name.", example: Fake Orchard Foods Ltd }
                        kind: { type: string, enum: [employer, agency], description: What the company is., example: employer }
                        croNumber: { type: [string, 'null'], description: "The Companies Registration Office number, or null when none is stored.", example: '123456' }
                        status: { type: string, description: "The company's status now.", example: verified }
                        county: { type: [string, 'null'], description: "The company's county, or null.", example: Cork }
                  more: { type: boolean, description: True when more than 10 companies match., example: false }
              example: { items: [{ id: '1204', displayName: Fake Orchard Foods Ltd, kind: employer, croNumber: '123456', status: verified, county: Cork }], more: false }
        '400':
          description: "`bad_query`: no `q`, `q` repeated, under 3 or over 100 characters after trimming, a control character in it, or any other query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_account_reviewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/manual-jobs/dry-run:
    post:
      operationId: dryRunManualPost
      summary: What posting this job by hand would do, nothing written
      description: >-
        B72: the body is the `create` body of POST /api/manual-jobs without `action`, with the same field rules. Answers what `create` would do with it now (live with the
        badge, or a draft and why) and every check, the ones after a blocked one included. Never "Sponsor confirmed": that is the later two-person step on a live post
        (/api/manual-jobs/sponsor-confirmation, #232). Not a hold: the rules may change before the real post. Never cached. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 30000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisationId, title, description, county, occupationCode, weeklyHours, closesOn, applyUrl]
              properties:
                organisationId: { $ref: '#/components/schemas/Id' }
                title: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, minLength: 20, maxLength: 10000 }
                county: { type: string, enum: [Carlow, Cavan, Clare, Cork, Donegal, Dublin, Galway, Kerry, Kildare, Kilkenny, Laois, Leitrim, Limerick, Longford, Louth, Mayo, Meath, Monaghan, Offaly, Roscommon, Sligo, Tipperary, Waterford, Westmeath, Wexford, Wicklow] }
                occupationCode: { type: string, pattern: '^[0-9]{4}$' }
                contractMonths: { type: [integer, 'null'], minimum: 1, maximum: 600 }
                salaryLow: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
                salaryHigh: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
                payGrade: { type: [string, 'null'], minLength: 1, maxLength: 100 }
                healthInsuranceEur: { type: [integer, 'null'], minimum: 0, maximum: 50000 }
                weeklyHours: { type: integer, minimum: 1, maximum: 60 }
                closesOn: { $ref: '#/components/schemas/Date' }
                applyUrl: { type: string, format: uri, minLength: 10, maxLength: 500 }
            example: { organisationId: '310', title: Software Engineer, description: We are hiring a software engineer in Dublin., county: Dublin, occupationCode: '2136', contractMonths: null, salaryLow: 50000, salaryHigh: 60000, weeklyHours: 39, closesOn: '2026-12-31', applyUrl: 'https://careers.example.ie/jobs/1' }
      responses:
        '200':
          description: What the post would be, and every check in order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, badge, passRoute, reason, closesAt, checks]
                properties:
                  status: { type: string, enum: [live, draft], description: Whether the post would be listed., example: live }
                  badge: { type: [string, 'null'], enum: [critical_skills_eligible, null], description: "The badge it would get, or null for a draft.", example: critical_skills_eligible }
                  passRoute: { type: [string, 'null'], enum: [stated_pay, public_pay, null], description: "How the pay passed, or null for a draft.", example: stated_pay }
                  reason:
                    type: [object, 'null']
                    description: "Why it would be a draft (the code of the first refusal, and the chain's stage when it stopped there), or null."
                    properties:
                      code: { type: string, example: pay_below_minimum }
                      stage: { type: string, example: 6 wording }
                  closesAt: { type: string, format: date-time, description: "When the post would close: the end of closesOn, Irish time.", example: '2026-12-31T23:59:59.000Z' }
                  checks: { type: array, minItems: 5, maxItems: 5, items: { $ref: '#/components/schemas/ManualCheck' } }
              example:
                status: draft
                badge: null
                passRoute: null
                reason: { code: pay_below_minimum }
                closesAt: '2026-12-31T23:59:59.000Z'
                checks:
                  - { id: occupation, state: pass, detail: { occupationCode: '2136', list: critical_skills } }
                  - { id: contract, state: pass, detail: { months: null, minimumMonths: 24 } }
                  - { id: wording, state: pass, detail: { stage: PASS (salary stated) } }
                  - { id: money, state: pass, detail: { phrase: null } }
                  - { id: pay, state: blocked, code: pay_below_minimum, detail: { minimumEur: 40904, countedEur: 30000, healthInsuranceEur: 0, weeklyHours: 39, route: null } }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field (`action` included), or over 30,000 characters. `bad_query`: any query key. The field codes of `create`:
            `bad_organisation_id`, `bad_title`, `bad_apply_url`, `bad_description`, `bad_county`, `bad_occupation_code`, `bad_contract_months`, `bad_salary`,
            `bad_pay_grade`, `bad_health_insurance`, `bad_weekly_hours`, `bad_closes_on`, `bad_closing_date`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_salary } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_account_reviewer } } }
        '404':
          description: "`company_not_found`: no such company."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: company_not_found } } }
        '409':
          description: "`company_not_postable`: not an employer or agency, merged, or rejected, closed, banned or suspended."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: company_not_postable } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/manual-jobs/sponsor-confirmation:
    get:
      operationId: listSponsorConfirmations
      summary: List the Sponsor confirmed requests waiting, or open one confirmation file
      description: >-
        Q6 (#16). Without `requestId`: the employer confirmations uploaded on manual posts that wait for an administrator (oldest first, at most
        200). With `requestId`: that confirmation file itself (S-Q6: inline, the type from the stored kind, nosniff, no-store, only once the malware scan passed) (a pending request, or a confirmed one whose statement
        still holds the file) and one `data_access` audit row (`job.sponsor_confirmation_open`, the request id, the role in force). For the
        manual posting viewers: account_reviewer, trust_and_safety, administrator. Only `requestId`, at most once.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - { name: requestId, in: query, required: false, schema: { type: string }, example: '9001' }
      responses:
        '200':
          description: The requests waiting (without `requestId`, JSON), or the confirmation file itself (with `requestId`).
          headers:
            Content-Type: { schema: { type: string, enum: [application/pdf, image/jpeg, image/png] }, description: "With the id: from the stored kind, never the uploader's." }
            Content-Disposition: { schema: { type: string }, example: "inline; filename*=UTF-8''letter.pdf" }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Security-Policy: { schema: { type: string, const: "frame-ancestors 'self'" } }
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [requestId, jobId, title, organisationId, displayName, fileName, contentType, sizeBytes, proposedBy, proposedByName, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        jobId: { $ref: '#/components/schemas/Id' }
                        title: { type: string, description: "The post's job title.", example: Fake Staff Nurse }
                        organisationId: { $ref: '#/components/schemas/Id' }
                        displayName: { type: string, description: "The company's display name.", example: Example Care Ltd }
                        proposedByName: { type: [string, 'null'], description: "The name of the staff member who uploaded it (never their email).", example: Fake Reviewer }
                        fileName: { type: string }
                        contentType: { type: string, enum: [pdf, jpeg, png] }
                        sizeBytes: { type: integer }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example: { pending: [{ requestId: '9001', jobId: '5501', title: Fake Staff Nurse, organisationId: '310', displayName: Example Care Ltd, proposedByName: Fake Reviewer, fileName: sponsor-letter.pdf, contentType: pdf, sizeBytes: 182044, proposedBy: made-up-staff-id, createdAt: '2026-11-19 10:00:00.123456+00' }] }
            application/pdf: { schema: { type: string, format: binary }, example: '(the file bytes, at most 4,194,304)' }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '400':
          description: "`bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_manual_viewer`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_manual_viewer } } }
        '404':
          description: "`not_found`: no such request with a file (refused and withdrawn ones have none; also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409': { $ref: '#/components/responses/StaffFileRefused' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. No audit row is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
    post:
      operationId: sponsorConfirmation
      summary: Upload the employer's written confirmation on a manual post, or confirm or refuse it
      description: |
        Q6 (#16, 20c "Manual posting": the account reviewer edits, the administrator approves). Two bodies:
        - `multipart/form-data` with `?jobId=` and exactly one field `file` (PDF, JPEG or PNG, found from the bytes; at most 4,194,304 bytes):
          an account reviewer uploads the employer's written confirmation on a live manual post whose company is not restricted. It makes a
          two-person request (`manual_post_sponsor_confirmed`); one at a time per post. Order: Origin, the `Content-Length` cap (before the
          session), the session, the role and the post (before the body is read), then the file. A row write that fails removes the stored file.
        - `application/json` `{ action: "confirm" | "refuse", requestId }`: a different administrator confirms (the `admin_on_behalf`
          sponsorship statement is written with the file and the post shows Sponsor confirmed, in one transaction) or refuses; the proposer
          may withdraw with `refuse`. A refused or withdrawn request's file is removed. Staff never sign for the employer (no signer).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer (upload, withdraw own), administrator (confirm, refuse)]
      x-rate-limit: none (one pending request per post)
      x-body-cap: 4210688 bytes for the upload (4 MiB file plus 16 KiB of multipart wrapping), counted while reading; 1000 characters for the JSON body
      parameters:
        - { name: jobId, in: query, required: false, description: The manual post (the upload only)., schema: { type: string }, example: '5501' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, additionalProperties: false, required: [file], properties: { file: { type: string, format: binary } } }
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, requestId]
              properties:
                action: { type: string, enum: [confirm, refuse] }
                requestId: { $ref: '#/components/schemas/Id' }
            example: { action: confirm, requestId: '9001' }
      responses:
        '200':
          description: "Upload: `{ ok, requestId }`. Confirm: `{ ok, jobId, badge }`. Refuse: `{ ok }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  jobId: { $ref: '#/components/schemas/Id' }
                  badge: { type: string, const: sponsor_confirmed }
              example: { ok: true, jobId: '5501', badge: sponsor_confirmed }
        '400':
          description: >-
            `bad_input`: no `jobId` or one that is not an id. `bad_query`: an unknown or repeated query key. `bad_file`: not exactly one `file`
            field. `empty_file`: the file has no bytes. `bad_body`, `bad_action`, `bad_request_id`: the JSON body.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_file } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: >-
            `bad_origin`: not the admin site's Origin. `not_active_staff`. `not_account_reviewer`: the upload without that role.
            `not_administrator`: confirm without the role, or refuse of another person's request without it. `not_sponsor_staff`: refuse
            with neither role.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no manual post with that id, or no such request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `job_not_live`: the post is a draft or closed. `already_confirmed`: it shows Sponsor confirmed already. `company_restricted`: its
            company is restricted (strike 2). `decision_pending`: a request is already waiting. `request_not_pending`: decided already.
            `same_person`: the proposer cannot confirm. `no_statement_text`: no sponsorship statement wording is saved yet.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_person } } }
        '413':
          description: "`file_too_large`: over the cap by header or while reading."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: file_too_large } } }
        '415':
          description: "`wrong_file_type`: the bytes are not a PDF, JPEG or PNG, or an image (PNG, JPEG, WebP) does not decode or is over 40,000,000 pixels, or a PDF is cut short (no %%EOF at its end). Images are stored re-encoded, with no metadata (disarm at upload, S-Q6)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: wrong_file_type } } }
        '422':
          description: "`file_active_content`: a PDF that carries active content (/JavaScript, /JS, /OpenAction, /AA, /Launch, /EmbeddedFile(s), /RichMedia, /XFA, also escaped or inside an object stream), is encrypted, or hides objects behind a filter the check cannot read, or an object stream that inflates past 16 MiB."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: file_active_content } } }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. Nothing is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
  /api/pay-floors:
    get:
      operationId: listFloorChecks
      summary: List pay floors waiting for a check, or show one
      description: >-
        Without `id`: the signed pay floors waiting for their staff check, oldest first, 20 a page. With `id` (a floor id, not an item id):
        that floor's check item, whatever its state. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, description: "A pay floor id.", schema: { type: string }, example: '61' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/FloorCheck' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/FloorCheck' }
              example:
                items:
                  - { floorId: '61', itemId: '4401', createdAt: '2026-11-18 09:30:00.123456+00', roleFamily: '2136', floorEur: 52000, signedAt: '2026-11-18 09:30:00.123456+00', validUntil: '2027-11-18 09:30:00.123456+00', signerName: Example Signer, signerTitle: Account owner, organisationId: '330', displayName: Example Global Ltd, kind: employer, isBigCompany: true, organisationStatus: verified, currentFloorEur: null, requestId: null, proposedBy: null }
                next: null
        '400':
          description: "`bad_cursor`: a token this list did not make. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_floor_staff`: neither rules_data_editor nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_floor_staff } } }
        '404':
          description: "`not_found`: the floor has no check item (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnPayFloor
      summary: Propose, confirm or reject a pay floor
      description: >-
        Two people: a rules_data_editor checks the floor and `propose`s it; an administrator who did not propose `confirm`s, and the floor
        becomes active at once (an active floor of the same role family is replaced). `reject` (either role, a reason code) ends the floor
        and drops a pending proposal. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor (propose), administrator (confirm), rules_data_editor or administrator (reject)]
      x-rate-limit: none
      x-body-cap: 500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, floorId]
                  properties:
                    action: { type: string, enum: [propose, confirm] }
                    floorId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, floorId, reason]
                  properties:
                    action: { const: reject }
                    floorId: { $ref: '#/components/schemas/Id' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: propose, floorId: '61' }
      responses:
        '200':
          description: "`propose`: the approval request. `confirm`: the floor and the floor it replaced. `reject`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  floorId: { $ref: '#/components/schemas/Id' }
                  replacedId: { type: [string, 'null'] }
              example: { ok: true, floorId: '61', replacedId: null }
        '400':
          description: "`bad_body`: not one JSON object, an unknown field, or over 500 characters. `bad_action`: unknown action. `bad_floor_id`: not an id. `bad_reason`: reject without a reason code, or a reason on propose or confirm."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_rules_editor`: propose without rules_data_editor. `not_administrator`: confirm without administrator. `not_floor_staff`: reject with neither role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such floor."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`floor_not_pending`: the floor is not waiting for its check. `floor_expired`, `not_big_company`, `organisation_not_active`: the floor can no longer be made active. `decision_pending`: propose when a proposal waits. `nothing_pending`: confirm with no proposal. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_person } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/rules:
    get:
      operationId: listRules
      summary: List the rules versions
      description: >-
        The rules versions in force today, the confirmed ones still to come, and the pending proposals with their change against the
        version in force (entries added, removed and changed). Any active staff member. It takes no query key: any key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The versions and proposals.
          content:
            application/json:
              schema:
                type: object
                required: [inForce, upcoming, pending]
                properties:
                  inForce: { type: array, items: { $ref: '#/components/schemas/RulesVersion' } }
                  upcoming: { type: array, items: { $ref: '#/components/schemas/RulesVersion' } }
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, kind, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        kind: { type: string, description: "A rules kind, or `big_company_flag` for the flag on one company." }
                        effectiveFrom: { type: string }
                        organisationId: { $ref: '#/components/schemas/Id' }
                        displayName: { type: [string, 'null'] }
                        proposedBy: { type: string }
                        proposedByName: { type: string, description: "The proposer's name (never their email).", example: Fake Editor }
                        createdAt: { type: string }
                        change: { $ref: '#/components/schemas/RulesChange' }
              example:
                inForce: [{ kind: minimums, versionId: '3', effectiveFrom: '2026-01-01', data: { criticalSkills: 40000 } }]
                upcoming: []
                pending: [{ requestId: '90', kind: big_company_flag, organisationId: '330', displayName: Example Global Ltd, proposedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', proposedByName: Fake Editor, createdAt: '2026-11-18 09:30:00.123456+00' }]
        '400':
          description: "`bad_query`: any query key (this GET takes none)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnRules
      summary: Propose, confirm, refuse or withdraw a rules change
      description: >-
        `propose` (rules_data_editor): a whole new version of one kind, in force from `effectiveFrom` (today or later); `data` is checked
        for its kind (packages/db/src/rules-data.ts), and a new or changed big-company name needs its link, date read and next review date. `public_pay_employers` (B66): each value is a
        `PayDealEntry`; a new or changed entry that is on needs its body type and evidence (#67), its date added and added by are the server's,
        an evidence file must come from POST /api/rules/evidence, and at least one entry stays on. Switching an entry off is `on: false`.
        One pending proposal per kind. `propose_flag` (rules_data_editor): set the big-company flag on one company, refused unless one of
        its names matches a big-company name in force. `confirm` and `refuse` (an administrator who did not propose): confirm writes the
        version or sets the flag in the same transaction; confirming new minimums queues one email and portal notice per company with a
        live or draft job. `withdraw`: the proposer withdraws their own proposal. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor (propose, propose_flag), administrator (confirm, refuse), the proposer (withdraw)]
      x-rate-limit: none
      x-body-cap: 300000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, kind, effectiveFrom, data]
                  properties:
                    action: { const: propose }
                    kind: { $ref: '#/components/schemas/RulesKind' }
                    effectiveFrom: { $ref: '#/components/schemas/Date' }
                    data: { description: The whole version for its kind. }
                - type: object
                  additionalProperties: false
                  required: [action, organisationId]
                  properties:
                    action: { const: propose_flag }
                    organisationId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm, refuse, withdraw] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: propose_flag, organisationId: '330' }
      responses:
        '200':
          description: "`propose`: the request and the change. `propose_flag`: the request. `confirm`: the version written (null for a flag) and the emails queued. `refuse`, `withdraw`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  change: { $ref: '#/components/schemas/RulesChange' }
                  versionId: { type: [string, 'null'] }
                  notices: { type: integer }
              example: { ok: true, versionId: '4', notices: 12 }
        '400':
          description: >-
            `bad_body`: not one JSON object, a field that does not belong to the action, a missing field, kind or effectiveFrom not a
            string, or over 300,000 characters. `bad_action`: unknown action. `bad_id`: requestId or organisationId not an id. `bad_kind`:
            not a rules kind. `bad_date`: not a real day. `bad_data`: the data does not fit its kind; `detail` names the first problem
            (`RulesDataError`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulesDataError' }
              example: { error: bad_data, detail: 'minimums: checkedOn is not a date' }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_rules_editor`: propose without rules_data_editor. `not_administrator`: confirm or refuse without administrator. `not_proposer`: withdraw of someone else's proposal."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_proposer } } }
        '404':
          description: "`not_found`: no such company (propose_flag) or no such rules request (confirm, refuse, withdraw)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`date_in_past`: effectiveFrom before today. `no_change`: the data equals the version in force. `decision_pending`: a proposal for this kind or company waits already. `already_big`: the company has the flag. `no_name_match`: none of the company's names is a big-company name in force. `not_pending`: the request is not pending. `same_person`: the proposer confirming or refusing. `date_passed`: confirm after the proposed date."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: no_change } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/rules/evidence:

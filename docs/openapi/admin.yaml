openapi: 3.1.0
info:
  title: Admin API (staff)
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    The routes of the admin app, used by staff only. Every route but the health check needs a staff session, and each
    route checks the staff roles it needs inside the database call, reads included. Nothing here is open to the public.

    ## Conventions (the same text in candidate.yaml, portal.yaml and admin.yaml)

    - **Origin check on writes.** Every POST, PUT and DELETE that a signed-in person sends must carry an `Origin` header equal to its
      own app's origin (the `*_AUTH_URL` setting). Anything else is refused with 403 before the body is read. The exceptions are named
      on the route: the alert unsubscribe (a mail provider's server sends it with no Origin) and the health checks (GET only).
    - **Body size caps.** Every write has a cap, given on the route in `x-body-cap` (characters of the JSON text, or bytes for a
      file upload). A `Content-Length` over the cap is refused before the body is read, and a body over the cap after reading is
      refused too: 413 on the candidate and portal sites, 400 `bad_body` on the admin site. The Better Auth routes
      (`/api/auth/*`) keep Better Auth's own handling; this repo sets no cap there.
    - **Strict bodies.** A body must be one JSON object with exactly the documented fields: an unknown field, a wrong type or a
      value outside its limits is refused with 400 (no field is dropped silently). Strings are trimmed where the route says so and
      may not hold control characters unless the route says line breaks are allowed.
    - **Two error formats exist today.** Most candidate and portal routes answer `{ "code": "UPPER_CASE" }` (`CodeError`); the admin
      routes and a few others answer `{ "error": "lower_case" }` (`ErrorBody`). Each response names which. A 500 never says why
      (`{ "error": "server_error" }` on admin, an empty or framework body elsewhere); the reason stays in the server log.
    - **Sessions.** Each app has its own Better Auth login pool and its own cookie (`candidate.session_token`,
      `portal.session_token`, `staff.session_token`; `__Secure-` in front of the name over HTTPS). A route that needs a session
      answers 401 without one. Sessions are read from the database on every request (no cookie cache), so a suspended, blocked,
      disabled or deleted login is refused on its next request.
    - **Paging.** Lists page by keyset, never by offset: the reply carries an opaque `next` (and sometimes `previous`) token,
      and the next page is asked for with `after=<token>` (or `before=<token>`). A token works only with the sort and filters it was
      made for; a changed or forged token, or another list's token, is 400. Page sizes are given on each route (job lists 20, a
      visitor 6, audit 50, notices 50, content 20, admin queues 20).
    - **Rate limits.** Limits are counted in the database (shared by every server instance). Over a limit the answer is 429; only
      the public candidate reads send `Retry-After` (seconds). Each write names its limit in `x-rate-limit` ("none" where the code
      has none, as on the admin routes, which rely on the staff sign-in limits).
    - **Ids.** Database ids are 64-bit integers. Every route sends and takes them as strings of digits (`"123"`, pattern
      `^[1-9][0-9]{0,18}$`, at most 9223372036854775807), so no client loses precision. `0`, a leading zero, a JSON number or a
      longer string is refused with the field's 400 code. Login ids (Better Auth) are 32 letters and digits.
    - **Times** are ISO 8601 strings in UTC (`2026-11-18T09:30:00.000Z`); dates without a time are `YYYY-MM-DD`. Not yet uniform:
      the admin replies send Postgres text (`2026-11-18 09:30:00.123456+00`, `DbTime` in admin.yaml) in most lists; each field
      says which. The candidate and portal replies use the `Z` form only.
    - **Admin query strings** are strict: an unknown or repeated query key is 400 `bad_query` on every admin GET (the merge
      preview's `id` is the one key that may repeat).
    - **Examples** are made up. No example holds a real person, company, address or secret.
servers:
  - url: /
    description: The app's own origin (relative; each app is deployed on its own host).
components:
  schemas:
    CodeError:
      type: object
      description: The error body of most candidate and portal routes.
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
      example: { code: BAD_REQUEST }
    ErrorBody:
      type: object
      description: The error body of the admin routes and some portal and candidate routes. `stage` is set only when a rules check failed.
      required: [error]
      properties:
        error: { type: string }
        stage: { type: string }
      example: { error: bad_body }
    Id:
      type: string
      description: A database id as text.
      pattern: '^[1-9][0-9]{0,18}$'
      example: '1042'
    LoginId:
      type: string
      description: A Better Auth login id.
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP'
    Timestamp:
      type: string
      format: date-time
      description: An ISO 8601 time in UTC.
      example: '2026-11-18T09:30:00.000Z'
    Date:
      type: string
      format: date
      example: '2026-11-18'
    Cursor:
      type: string
      description: An opaque keyset paging token from a previous reply. Send it back unchanged.
      pattern: '^[A-Za-z0-9_-]{1,300}$'
      example: eyJzIjoic3BvbnNvciIsInEiOmZhbHNlfQ
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    ReasonCode:
      type: string
      description: A reason code, never free text (the audit log holds no free text).
      pattern: '^[a-z][a-z0-9_]{0,62}$'
      example: duplicate_listing
    NullableText:
      type: [string, 'null']
    NullableTimestamp:
      type: [string, 'null']
      description: An ISO 8601 time, or null. Times read as text from the database keep the database's form (`2026-11-18 09:30:00.123456+00`).
    DbTime:
      type: string
      description: A time as the database writes it as text (`2026-11-18 09:30:00.123456+00`), kept as text so the microseconds survive.
      example: '2026-11-18 09:30:00.123456+00'
    StaffRole:
      type: string
      enum: [account_reviewer, fetched_job_reviewer, rules_data_editor, trust_and_safety, services_case_handler, content_editor, administrator]
    DomainTakenError:
      type: object
      description: The 409 of a domain another company already holds; names that company.
      required: [error, owner]
      properties:
        error: { type: string, const: domain_owned_by_other }
        owner:
          type: object
          required: [organisationId, displayName]
          properties:
            organisationId: { $ref: '#/components/schemas/Id' }
            displayName: { type: string }
    RulesDataError:
      type: object
      description: "A 400 of the rules route: `bad_data` also says which entry is wrong in `detail`."
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
    AccountReviewItem:
      type: object
      required: [id, status, claimedBy, createdAt, organisationId, displayName, kind, organisationStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [open, claimed, done] }
        claimedBy: { type: [string, 'null'], description: The staff id holding the claim. }
        createdAt: { $ref: '#/components/schemas/DbTime' }
        reason: { type: [string, 'null'], description: 'Why the item was made: "claim" or "new organisation".' }
        detail: { description: "What the register check found, as the sign-up function wrote it (any JSON)." }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        kind: { type: string, enum: [employer, agency] }
        organisationStatus: { type: string }
        signupPath: { type: [string, 'null'], enum: [dete_claim, first_time, agency, null] }
        croNumber: { type: [string, 'null'] }
        wrcLicenceNumber: { type: [string, 'null'] }
        claimantEmail: { type: [string, 'null'] }
        emailDomain: { type: [string, 'null'] }
        answer: { type: [string, 'null'], description: "The owner's latest answer to \"ask for more\". Plain text; show it as text, never as HTML." }
        answeredAt: { type: [string, 'null'] }
        flags:
          type: array
          items: { enum: [shared_mailbox, lookalike_domain] }
          description: "Extra reasons to look closely, never a refusal: `shared_mailbox` (the owner's email is hr@, jobs@, careers@, info@, admin@, recruitment@ or office@) and `lookalike_domain` (the email domain is within 2 edits of a saved company domain, 0 and 1 read as o and l)."
        lookalikeOf: { type: [string, 'null'], description: The saved company domain the email domain looks like; null without `lookalike_domain`. }
    AuditEvent:
      type: object
      required: [id, at, kind, actor, action]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        at: { $ref: '#/components/schemas/DbTime' }
        kind: { type: string }
        actor:
          type: object
          properties:
            staff: { type: [string, 'null'] }
            candidate: { type: [string, 'null'] }
            portal: { type: [string, 'null'] }
            system: { type: [string, 'null'] }
        roleInForce: { type: [string, 'null'] }
        action: { type: string }
        objectType: { type: [string, 'null'] }
        objectId: { type: [string, 'null'] }
        changedColumns: { type: [array, 'null'], items: { type: string } }
        before: { description: "Any JSON, or null." }
        after: { description: "Any JSON, or null." }
        reasonCode: { type: [string, 'null'] }
        secondStaff: { type: [string, 'null'] }
        relatedCase: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
    DomainRow:
      type: object
      required: [id, domain, source, addedBy, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        domain: { type: string }
        source: { type: string }
        addedBy: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DbTime' }
    CompanyPreview:
      type: object
      description: Database column names (snake case), as the database returns them.
      required: [id, slug, display_name, kind, status, active_members, jobs, names]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { type: string }
        display_name: { type: string }
        kind: { type: string }
        status: { type: string }
        cro_number: { type: [string, 'null'] }
        merged_into_id: { type: [string, 'null'] }
        active_members: { type: integer }
        jobs: { type: integer }
        names: { type: integer }
    OwnerRequest:
      type: object
      description: Database column names (snake case), as the database returns them.
      required: [id, organisation_id, display_name, new_owner_membership_id, new_owner_email, old_owner_membership_id, requested_by_staff_user_id, requested_at, completes_after, can_complete]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organisation_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        new_owner_membership_id: { $ref: '#/components/schemas/Id' }
        new_owner_email: { type: string }
        old_owner_membership_id: { $ref: '#/components/schemas/Id' }
        old_owner_email: { type: [string, 'null'] }
        requested_by_staff_user_id: { type: string }
        requested_at: { $ref: '#/components/schemas/DbTime' }
        completes_after: { $ref: '#/components/schemas/DbTime' }
        can_complete: { type: boolean }
    ContactSummary:
      type: object
      required: [id, status, topic, createdText]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [new, claimed] }
        topic: { type: string }
        surface: { type: [string, 'null'] }
        createdText: { $ref: '#/components/schemas/DbTime' }
        claimedByStaffUserId: { type: [string, 'null'] }
        claimedText: { type: [string, 'null'] }
    ContactMessage:
      allOf:
        - $ref: '#/components/schemas/ContactSummary'
        - type: object
          properties:
            status: { type: string, enum: [new, claimed, answered, closed, spam] }
            fromName: { type: [string, 'null'] }
            fromEmail: { type: [string, 'null'] }
            body: { type: string, description: "The message as sent. Plain text; show it as text, never as HTML." }
            candidateUserId: { type: [string, 'null'] }
            portalUserId: { type: [string, 'null'] }
            closedText: { type: [string, 'null'] }
            fromHeldLogin: { type: [boolean, 'null'], description: "Topic appeal only (null otherwise): whether `fromEmail` belongs, now, to a blocked portal login (surface portal) or a suspended candidate (candidate site). The sender proved nothing; a reply to that email reaches only its owner." }
    ContentSummary:
      type: object
      required: [id, kind, slug, title, status, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [guide, update, help, occupation] }
        slug: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, published, withdrawn] }
        sourceUrl: { type: [string, 'null'] }
        checkedOn: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'] }
        updatedBy: { type: [string, 'null'] }
        updatedAt: { $ref: '#/components/schemas/DbTime' }
    JobQueueItem:
      type: object
      required: [id, queue, status, jobId, jobStatus, title, organisationId, company]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        queue: { type: string, enum: [scam_flag, post_strike_job_review, agency_client_check] }
        status: { type: string }
        claimedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        jobId: { $ref: '#/components/schemas/Id' }
        jobStatus: { type: string }
        source: { type: string, enum: [employer, agency] }
        title: { type: string }
        employerName: { type: string }
        county: { type: [string, 'null'] }
        occupationCode: { type: [string, 'null'] }
        permitType: { type: string }
        salaryLow: { type: [integer, 'null'] }
        salaryHigh: { type: [integer, 'null'] }
        payGrade: { type: [string, 'null'] }
        badge: { type: [string, 'null'] }
        closesAt: { description: "An ISO time, or the text \"infinity\" for no closing date." }
        organisationId: { $ref: '#/components/schemas/Id' }
        company: { type: string }
        companyStatus: { type: string }
        restricted: { type: boolean }
        clientName: { type: [string, 'null'] }
        clientCheck: { type: string }
        advertText: { type: [string, 'null'], description: Only on the one-item read. }
    FetchedQueueItem:
      type: object
      required: [id, status, jobId, organisationId, title, employerName, permitHistory, wrcAgency]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string }
        claimedBy: { type: [string, 'null'] }
        jobId: { $ref: '#/components/schemas/Id' }
        organisationId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        employerName: { type: string }
        advertUrl: { type: [string, 'null'] }
        occupationCode: { type: [string, 'null'] }
        permitHistory: { type: string }
        sponsorPermits: { type: [integer, 'null'] }
        stage: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        wrcAgency: { type: boolean, description: "The advert's employer name is an agency or trading name on the WRC licensed agency list (staff only)." }
        advertText: { type: [string, 'null'], description: Only on the one-item read. }
    ManualRow:
      type: object
      description: Database column names (snake case), as the database returns them. `reason` is why a draft is not listed.
      required: [id, organisation_id, display_name, title, status, posted_at, closes_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organisation_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        title: { type: string }
        status: { type: string }
        pass_route: { type: [string, 'null'] }
        posted_by_staff_id: { type: [string, 'null'] }
        posted_at: { $ref: '#/components/schemas/DbTime' }
        closes_at: { type: string }
        closed_at: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
    FloorCheck:
      type: object
      required: [floorId, itemId, createdAt, roleFamily, floorEur, organisationId, displayName]
      properties:
        floorId: { $ref: '#/components/schemas/Id' }
        itemId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/DbTime' }
        roleFamily: { type: string, pattern: '^[0-9]{4}$' }
        floorEur: { type: integer }
        signedAt: { type: string }
        validUntil: { type: string }
        signerName: { type: [string, 'null'] }
        signerTitle: { type: [string, 'null'] }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        kind: { type: string }
        isBigCompany: { type: boolean }
        organisationStatus: { type: string }
        currentFloorEur: { type: [integer, 'null'] }
        requestId: { type: [string, 'null'] }
        proposedBy: { type: [string, 'null'] }
    RulesKind:
      type: string
      description: 'public_pay_employers holds the HSE switch (#261): the entry "health service executive" (tier 1) gives every HSE name tier 1 while it is in force; a version without it turns the switch off.'
      enum: [minimums, critical_skills_list, ineligible_list, public_pay_employers, big_company_names]
    RulesChange:
      type: object
      properties:
        added: { type: object }
        removed: { type: object }
        changed: { type: object }
    RulesVersion:
      type: object
      required: [kind, versionId, effectiveFrom, data]
      properties:
        kind: { $ref: '#/components/schemas/RulesKind' }
        versionId: { $ref: '#/components/schemas/Id' }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        data: { description: The whole version for its kind (see packages/db/src/rules-data.ts). }
    StaffRow:
      type: object
      required: [id, name, email, status, createdAt, roles]
      properties:
        id: { $ref: '#/components/schemas/LoginId' }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, disabled] }
        createdAt: { $ref: '#/components/schemas/DbTime' }
        roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' } }
    ReportSummary:
      type: object
      description: The list shows no evidence text and no reporter.
      required: [id, status, targetKind, reason, createdText]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string }
        targetKind: { type: string }
        reason: { type: string }
        createdText: { $ref: '#/components/schemas/DbTime' }
        targetJobId: { type: [string, 'null'] }
        jobTitle: { type: [string, 'null'] }
        jobStatus: { type: [string, 'null'] }
        organisationId: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
    CaseSummary:
      type: object
      required: [id, organisationId, displayName, caseKind, reasonCode, stage]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        organisationId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban] }
        reasonCode: { type: string }
        stage: { type: string }
        outcome: { type: [string, 'null'] }
        level: { type: [integer, 'null'] }
        replyDueAt: { $ref: '#/components/schemas/NullableTimestamp' }
        appealDueAt: { $ref: '#/components/schemas/NullableTimestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
  headers:
    RetryAfter:
      description: Seconds until the limit that was hit has a new window.
      schema: { type: integer, minimum: 1 }
      example: 42
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: staff.session_token
      description: >-
        The staff Better Auth session cookie (`__Secure-staff.session_token` over HTTPS), set by `POST /api/auth/staff/sign-in/email`.
        A staff session ends after 8 hours without use (`expiresIn` 8 h, refreshed at most every 5 minutes), and a disabled login is
        refused on its next request.
  responses:
    NoStaffSession:
      description: "`no_session`: no staff session cookie, or it has ended. `not_active`: the login behind the session is not active."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { error: no_session }
    ServerError:
      description: "`server_error`: anything the route does not expect. The reason stays in the server log."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { error: server_error }
paths:
  /api:
    get:
      operationId: getApiIndex
      summary: Index of this app's routes
      description: >-
        This app's name, the deployed commit (`version`, set per deploy; `local` on a developer machine), the environment, the time and
        every route of the admin site as `METHOD /path (who may call it)`, keyed by operationId; "(anyone)" is left out. Made from this file
        (decision #265): the sync test fails when `lib/api-index.json` differs from it. Any active staff member only, so the staff routes are not a public map. It takes no query key: any key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The index.
          content:
            application/json:
              schema:
                type: object
                required: [success, name, version, environment, timestamp, routes]
                additionalProperties: false
                properties:
                  success: { const: true }
                  name: { type: string }
                  version: { type: string, description: "The first 7 characters of the deployed commit, or `local`." }
                  environment: { type: string, enum: [production, preview, development] }
                  timestamp: { type: string, format: date-time }
                  routes: { type: object, additionalProperties: { type: string } }
              example:
                success: true
                name: Admin API (staff)
                version: 31e144d
                environment: production
                timestamp: '2026-11-19T06:20:00.000Z'
                routes: { getHealth: GET /api/health, listRules: 'GET /api/rules (any active staff member)' }
        '400':
          description: "`bad_query`: any query key (this GET takes none)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Answers whether the app can reach its database. No session, no Origin check, no rate limit; it reads no data.
      security: []
      x-roles: [anyone]
      x-rate-limit: none
      x-no-4xx: The route reads no input, needs no session and has no refusal; it only answers 200 or 503.
      responses:
        '200':
          description: The database answered.
          content:
            application/json:
              schema:
                type: object
                required: [ok, database]
                properties:
                  ok: { type: boolean }
                  database: { type: boolean }
              example: { ok: true, database: true }
        '503':
          description: The database did not answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  database: { type: boolean }
              example: { ok: false, database: false }
  /api/auth/staff/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >-
          The Better Auth endpoint under `/api/auth/staff/` (it may hold slashes, for example `sign-in/email`). The route is a Next.js
          catch-all (`[...all]`) that hands every request to Better Auth's own handler.
        schema: { type: string }
        example: sign-in/email
    get:
      operationId: staffAuthGet
      summary: Better Auth, staff pool (GET)
      description: >-
        Better Auth's own GET endpoints for the staff login pool. The admin pages use `get-session` (200 with the session and user, or
        200 with an empty body when there is no session). Shapes are Better Auth's own (better-auth 1.x); only what the repo's tests show
        is described here.
      security: []
      x-roles: [anyone]
      x-rate-limit: "Better Auth's own limits, counted in the database (staff_rate_limit)."
      responses:
        '200':
          description: Better Auth's answer.
          content:
            application/json:
              schema: {}
              example: { session: { id: 'Zx81LmQp0aB7cD9eF1gH3iJ5kL7mN9oP', userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP' }, user: { id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', email: 'reviewer@example.com', name: 'Example Reviewer' } }
        '404':
          description: An endpoint Better Auth does not have.
    post:
      operationId: staffAuthPost
      summary: Better Auth, staff pool (POST)
      description: >-
        Better Auth's own POST endpoints for the staff login pool. Used by the admin app: `sign-in/email` (`{ email, password }`; 200 sets
        the `staff.session_token` cookie) and `sign-out`. Settings: sign-up is off (`sign-up/email` answers 400), email verification is not
        required for staff, a password reset ends every other session, the session ends after 8 hours without use (STAFF_IDLE_SECONDS,
        refreshed every 5 minutes; a "remember me: false" sign-in is capped at the same limit), the cookie cache is off, a disabled login
        cannot sign in (403) and Better Auth's own Origin check is on (trusted origin: STAFF_AUTH_URL). The client address for limits is
        `x-vercel-forwarded-for` only. Staff email is not set up yet, so `request-password-reset` sends nothing. There is no bot check on
        the staff pool. Shapes are Better Auth's own; only what the repo's tests show is described here.
      security: []
      x-roles: [anyone]
      x-body-cap: none set by this repo (Better Auth's own handling)
      x-rate-limit: >-
        Per client address, counted in the database: sign-in/email 5 a minute; sign-up/email 5 a minute; request-password-reset 3 in 5
        minutes; send-verification-email 3 in 5 minutes. Other paths keep Better Auth's default.
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
            example: { email: reviewer@example.com, password: an-example-password }
      responses:
        '200':
          description: Signed in (the `Set-Cookie` header carries the session cookie) or signed out.
          headers:
            Set-Cookie:
              description: The session cookie on sign-in.
              schema: { type: string }
          content:
            application/json:
              schema: {}
              example: { redirect: false, token: 'Zx81LmQp0aB7cD9eF1gH3iJ5kL7mN9oP', user: { id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', email: 'reviewer@example.com', name: 'Example Reviewer' } }
        '400':
          description: A walk-in `sign-up/email` (sign-up is off), or a body Better Auth refuses.
        '401':
          description: Wrong email or password.
        '403':
          description: A disabled staff login signing in ("This account cannot sign in."), or an Origin Better Auth does not trust.
        '429':
          description: Over one of the per-address limits above.
  /api/accounts:
    get:
      operationId: listCandidateMerges
      summary: List the candidate account merges waiting for a second administrator
      description: >-
        The pending `candidate_merge` requests (step 15 C6), ids only, oldest first, at most 200. No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The pending merges.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, keep, drop, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        keep: { $ref: '#/components/schemas/LoginId' }
                        drop: { $ref: '#/components/schemas/LoginId' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example:
                pending: [{ requestId: '131', keep: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', drop: 'Z1y2X3w4V5u6T7s8R9q0P1o2N3m4L5k6', proposedBy: 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6', createdAt: '2026-11-18 09:30:00.123456+00' }]
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnAccount
      summary: Suspend or block a login, lift it, or merge two candidate accounts
      description: >-
        `suspend_candidate`: a candidate login is suspended (suspended_at set). `block_portal`: an employer or agency login is blocked
        (status blocked, blocked_at, blocked_reason_code). Either way every open session of the login ends in the same transaction, and the
        next request of an old cookie is refused. `lift_candidate` and `lift_portal` lift it again. One audit row (account.suspend,
        account.unsuspend, account.block, account.unblock) with the reason code; never free text. Appeal is through the contact form.
        `merge_propose` (step 15 C6): an administrator proposes merging candidate account `drop` into `keep`; one pending merge per dropped
        account. `merge_confirm`: a different administrator confirms and the merge runs at once: refused, and the request left pending, while
        either account has an open services case or an open report. The dropped account's saved jobs, alerts, tracker rows, hidden companies,
        applications and contact requests (with their consent records, CV files and messages) move to the kept account, the kept account's
        own rows winning every clash (and the caps of 200 saved jobs and 10 alerts kept); its profile and CV move only when the kept account has
        none. Then the dropped account is erased as a data request erases it, and its stored files are removed. The kept account gets one
        notice and one email; one audit row names both accounts and both administrators. `merge_refuse`: a different administrator refuses,
        or the proposer withdraws. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, userId, reason]
                  properties:
                    action: { type: string, enum: [suspend_candidate, lift_candidate, block_portal, lift_portal] }
                    userId: { $ref: '#/components/schemas/LoginId' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
                - type: object
                  additionalProperties: false
                  required: [action, keep, drop]
                  properties:
                    action: { const: merge_propose }
                    keep: { $ref: '#/components/schemas/LoginId' }
                    drop: { $ref: '#/components/schemas/LoginId' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [merge_confirm, merge_refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: suspend_candidate, userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', reason: fake_documents }
      responses:
        '200':
          description: "A hold or lift: the sessions ended (0 on a lift). `merge_propose`: the request id. `merge_confirm`: both accounts, the rows moved and the stored files removed. `merge_refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [ok, sessionsEnded]
                    properties:
                      ok: { const: true }
                      sessionsEnded: { type: integer }
                  - type: object
                    additionalProperties: false
                    required: [ok, requestId]
                    properties:
                      ok: { const: true }
                      requestId: { $ref: '#/components/schemas/Id' }
                  - type: object
                    additionalProperties: false
                    required: [ok, keep, drop, moved, filesRemoved]
                    properties:
                      ok: { const: true }
                      keep: { $ref: '#/components/schemas/LoginId' }
                      drop: { $ref: '#/components/schemas/LoginId' }
                      filesRemoved: { type: integer }
                      moved:
                        type: object
                        additionalProperties: false
                        required: [savedJobs, alerts, tracker, hiddenOrganisations, profile, cv, applications, contactRequests]
                        properties:
                          savedJobs: { type: integer }
                          alerts: { type: integer }
                          tracker: { type: integer }
                          hiddenOrganisations: { type: integer }
                          profile: { type: integer }
                          cv: { type: integer }
                          applications: { type: integer }
                          contactRequests: { type: integer }
                  - type: object
                    additionalProperties: false
                    required: [ok]
                    properties:
                      ok: { const: true }
              example: { ok: true, sessionsEnded: 2 }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 300 characters. `bad_action`: unknown action. `bad_user_id`: not a login id. `bad_reason`: not a reason code. `bad_request_id`: not an id. `same_account`: keep and drop are the same."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such login in that pool, no such candidate account (either one, also when gone since the proposal), or no such merge request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_held`: the login is already suspended or blocked. `not_held`: a lift of a login that is not. `decision_pending`: a merge of that dropped account waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming. `kept_account_deleted`: the account to keep is deleted. `open_services_case`, `open_report`: either account has one open."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_held } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/account-review:
    get:
      operationId: listAccountReviews
      summary: List open account reviews, or show one
      description: >-
        Without `id`: the open and claimed `account_review` items (employer and agency sign-ups and claims), oldest first, 20 a page. With
        `id`: that one item, whatever its status (an id that is not an account review, or not digits, is 404). The list shows the
        claimant's email, so only account reviewers read it. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, description: "One item's id.", schema: { type: string }, example: '1042' }
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AccountReviewItem' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/AccountReviewItem' }
              example:
                items:
                  - { id: '1042', status: open, claimedBy: null, createdAt: '2026-11-18 09:30:00.123456+00', reason: claim, detail: { found: true }, organisationId: '310', displayName: Example Care Ltd, kind: employer, organisationStatus: pending_review, signupPath: dete_claim, croNumber: '123456', wrcLicenceNumber: null, claimantEmail: owner@example.ie, emailDomain: example.ie, answer: null, answeredAt: null, flags: [], lookalikeOf: null }
                next: null
        '400':
          description: "`bad_cursor`: `after` is not a token this list made. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the staff login is not active. `not_reviewer`: no account_reviewer role (no other role stands in)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: `id` is not an account review item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnAccountReview
      summary: Claim, release, approve, ask for more, or reject an account review
      description: >-
        One action on one item. The Origin header must be the admin app's origin. Only the claimer approves, asks for more or rejects.
        `approve` verifies the company; with `addDomain: true` it also saves the claimant's email domain for the company (refused for a free
        email provider or a domain another company holds). `ask_more` sets the company to needs_info, sends the optional `question` (1 to
        1,000 characters after trimming, no control characters) to the owner and puts the item back to open; `reason` defaults to
        `needs_info`. `reject` needs `reason`; a DETE claim goes back to unclaimed, a new registration becomes rejected. A stale claim
        (over 24 hours, or held by a login no longer active) can be taken over by `claim`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 4500
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [claim, release] }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { const: approve }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                    addDomain: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { const: ask_more }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
                    question: { type: string, maxLength: 1000 }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, reason]
                  properties:
                    action: { const: reject }
                    itemId: { type: string, pattern: '^[0-9]{1,19}$' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: approve, itemId: '1042', addDomain: true }
      responses:
        '200':
          description: "`claim` and `release`: `{ ok: true }`. The three decisions also give the company's new status and the domain added."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  organisationId: { $ref: '#/components/schemas/Id' }
                  organisationStatus: { type: string, enum: [verified, needs_info, rejected, unclaimed] }
                  domainAdded: { type: [string, 'null'] }
              example: { ok: true, organisationId: '310', organisationStatus: verified, domainAdded: example.ie }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, a field on the wrong action, a wrong type, or over 4,500 characters.
            `bad_action`: unknown action. `bad_item_id`: itemId not 1 to 19 digits. `bad_reason`: reject with no reason, or a reason that is
            not a code. `bad_question`: the question is empty, over 1,000 characters or holds control characters. `bad_input`: addDomain not
            a boolean.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_body } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`, `not_reviewer`: as on GET."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such account review item (also an itemId that is not a valid id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `already_decided`, `not_claimed`, `not_claimer`, `claimed_by_other` (a fresh claim of someone else): the item's state does not
            allow it. `organisation_not_pending`: the company is no longer pending_review or needs_info. `no_claimant`: the company has no
            active owner. `claimant_not_active`: the owner was blocked, erased or banned since the claim. `has_permit_history`: a first-time
            employer turns out to have a DETE permit record. `free_email_domain`, `bad_domain`, `domain_owned_by_other`: addDomain refused.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_claimer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/audit:
    get:
      operationId: listAudit
      summary: Read the audit log
      description: >-
        Newest first, 50 a page. An administrator reads every row and may filter by any staff member; any other active staff member reads
        only the rows where they are the actor (and is refused another member's id). Dates are UTC days, both ends inclusive. Only the
        listed query keys, each at most once (anything else is `bad_query`). Nothing here writes.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member (own rows), administrator (every row)]
      x-rate-limit: none
      parameters:
        - { name: staff, in: query, required: false, description: "The acting staff id.", schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: action, in: query, required: false, schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,80}$' }, example: account_review.approved }
        - { name: objectType, in: query, required: false, schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,40}$' }, example: organisation }
        - { name: objectId, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }, example: '310' }
        - { name: from, in: query, required: false, description: "First UTC day (inclusive).", schema: { $ref: '#/components/schemas/Date' } }
        - { name: to, in: query, required: false, description: "Last UTC day (inclusive).", schema: { $ref: '#/components/schemas/Date' } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [events, next]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
                  next: { type: [string, 'null'] }
              example:
                events:
                  - { id: '88001', at: '2026-11-18 09:30:00.123456+00', kind: admin_action, actor: { staff: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', candidate: null, portal: null, system: null }, roleInForce: null, action: account_review.approved, objectType: organisation, objectId: '310', changedColumns: [status], before: { status: pending_review }, after: { status: verified }, reasonCode: approved, secondStaff: null, relatedCase: null, source: panel }
                next: null
        '400':
          description: >-
            `bad_query`: an unknown or repeated query key. `bad_staff_id`, `bad_action`, `bad_object_type`, `bad_object_id`: a filter of the
            wrong shape. `bad_from`, `bad_to`: not a real YYYY-MM-DD day. `bad_range`: from after to. `bad_cursor`: a token this list did not make.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_range } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: a non-administrator filtered by another member's id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/signup-no-counts:
    get:
      operationId: listSignupNoCounts
      summary: Read the daily count of "no" answers at candidate sign-up
      description: >-
        C5 (#253): how many visitors answered "no" to "Do you need a work permit?" at candidate sign-up, one number per UTC day, newest first,
        the last 366 counted days. A day with no such answer has no row. Nothing about any visitor is kept. No query keys (any is `bad_query`). Nothing here writes.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The counted days.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [days]
                properties:
                  days:
                    type: array
                    maxItems: 366
                    items:
                      type: object
                      additionalProperties: false
                      required: [day, count]
                      properties:
                        day: { $ref: '#/components/schemas/Date' }
                        count: { type: integer, minimum: 1 }
              example: { days: [{ day: '2026-11-18', count: 12 }, { day: '2026-11-17', count: 9 }] }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/permit-rises:
    get:
      operationId: listPermitRises
      summary: Read the DETE names whose permit count went up in the newest monthly import
      description: >-
        D6 (#49): each DETE name and year whose count rose in the newest monthly import (rows found within a day of the newest), biggest rise first,
        at most 200, with the linked company when there is one. DETE publishes these counts. No query keys (any is `bad_query`). Nothing here writes.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      responses:
        '200':
          description: The rises.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rises]
                properties:
                  rises:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: false
                      required: [deteName, year, before, after, organisationId, organisation, foundAt]
                      properties:
                        deteName: { type: string }
                        year: { type: integer }
                        before: { type: integer, minimum: 0 }
                        after: { type: integer, minimum: 1 }
                        organisationId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
                        organisation: { $ref: '#/components/schemas/NullableText' }
                        foundAt: { $ref: '#/components/schemas/Timestamp' }
              example: { rises: [{ deteName: 'Example Ltd', year: 2026, before: 3, after: 5, organisationId: '1042', organisation: 'Example', foundAt: '2026-11-15T03:10:00.000Z' }] }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/dete-links:
    get:
      operationId: listDeteLinkSuggestions
      summary: Suggested links from DETE names to companies
      description: >-
        DETE employer names none of whose rows is linked yet, each matched to a company by the R23 name matcher run on the company's names
        (its display name included), best first (score, then permits over every year), 50 a page. A pair staff rejected or unlinked is left
        out. Companies merged away, rejected or closed are left out. Only `page` (1 to 1000), at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
      responses:
        '200':
          description: One page of suggestions and how many there are in all.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, page, total]
                properties:
                  page: { type: integer, minimum: 1 }
                  total: { type: integer, minimum: 0 }
                  suggestions:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [deteName, permits, organisationId, organisation, matchedName, score, kind]
                      properties:
                        deteName: { type: string }
                        permits: { type: integer, minimum: 0 }
                        organisationId: { $ref: '#/components/schemas/Id' }
                        organisation: { type: string }
                        matchedName: { type: string, description: The company name the matcher used. }
                        score: { type: number, minimum: 0, maximum: 1 }
                        kind: { type: string, enum: [exact, suggested] }
              example: { page: 1, total: 1, suggestions: [{ deteName: 'Example Software Ireland Ltd', permits: 120, organisationId: '310', organisation: Example, matchedName: Example Software, score: 1, kind: exact }] }
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_page`: page not a whole number from 1 to 1000."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_page } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_dete_link_viewer`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_dete_link_viewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: changeDeteLink
      summary: Link, unlink or reject a DETE name for a company
      description: >-
        `link` adds the DETE name to the company as a legal name from DETE (or uses the company's name of the same normalised form), points
        every DETE row of the name at it and refreshes the permit history labels, so the company's permit history and sponsor sort change at
        once. `unlink` takes the link off every row of the name, removes the name a link added when nothing else uses it, and remembers the pair
        as rejected. `reject` turns a suggestion down so it is not suggested again. The Origin header must be the admin app's origin. One
        audit row each. `deteName` is the stored DETE name exactly (no leading or trailing space).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, deteName]
              properties:
                action: { type: string, enum: [link, unlink, reject] }
                deteName: { type: string, minLength: 1, maxLength: 300 }
                organisationId: { $ref: '#/components/schemas/Id' }
            example: { action: link, deteName: 'Example Software Ireland Ltd', organisationId: '310' }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [ok, organisationId, organisationNameId, nameAdded, rowsLinked, labelsChanged, permitHistory]
                    properties:
                      ok: { const: true }
                      organisationId: { $ref: '#/components/schemas/Id' }
                      organisationNameId: { $ref: '#/components/schemas/Id' }
                      nameAdded: { type: boolean }
                      rowsLinked: { type: integer, minimum: 0 }
                      labelsChanged: { type: integer, minimum: 0 }
                      permitHistory: { type: string, enum: [has_history, first_time, not_linked] }
                  - type: object
                    required: [ok, rowsUnlinked, namesRemoved, labelsChanged, organisationIds]
                    properties:
                      ok: { const: true }
                      rowsUnlinked: { type: integer, minimum: 0 }
                      namesRemoved: { type: array, items: { type: integer } }
                      labelsChanged: { type: integer, minimum: 0 }
                      organisationIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
                  - type: object
                    required: [ok, organisationId, rejected]
                    properties:
                      ok: { const: true }
                      organisationId: { $ref: '#/components/schemas/Id' }
                      rejected: { const: true }
              example: { ok: true, organisationId: '310', organisationNameId: '5521', nameAdded: true, rowsLinked: 6, labelsChanged: 1, permitHistory: has_history }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field or over 2,000 characters. `bad_action`: not link, unlink or reject. `bad_name`:
            deteName missing, not a string, empty, over 300 characters, with control characters or with leading or trailing space.
            `bad_organisation_id`: missing (link, reject) or not an id.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_name } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_dete_link_staff`: not an account reviewer."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_dete_link_staff } } }
        '404':
          description: "`not_found`: no such company. `name_not_found`: no DETE row has this name."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: name_not_found } } }
        '409':
          description: >-
            `linked_elsewhere`: the name is linked to another company (unlink first). `name_taken`: another company has a name of the same
            normalised form (merge first). `company_merged`: the company was merged into another. `not_linked`: unlink of a name not linked.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: linked_elsewhere } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/domains:
    get:
      operationId: listCompanyDomains
      summary: List a company's email domains
      description: >-
        The domains saved for one company, by name. A claimant on one of these domains is verified with no review, so only account
        reviewers and administrators see and change them. Only `organisationId`, at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      parameters:
        - { name: organisationId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains: { type: array, items: { $ref: '#/components/schemas/DomainRow' } }
              example: { domains: [{ id: '17', domain: example.ie, source: admin, addedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', createdAt: '2026-11-18 09:30:00.123456+00' }] }
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_organisation_id`: missing or not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_organisation_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_domain_staff`: neither account_reviewer nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_domain_staff } } }
        '404':
          description: "`not_found`: no such company."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: changeCompanyDomain
      summary: Add or remove a company's email domain
      description: >-
        `add` saves a domain (source admin) for the company; `remove` deletes one. The Origin header must be the admin app's origin. A
        domain is a plain lower-case host name of two or more labels (no scheme, port, IP address, punycode label or free email provider)
        for add; remove takes any saved string up to 253 characters, so an old row stays removable. One audit row with the reason code.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, organisationId, domain, reason]
              properties:
                action: { type: string, enum: [add, remove] }
                organisationId: { $ref: '#/components/schemas/Id' }
                domain: { type: string, maxLength: 253 }
                reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: add, organisationId: '310', domain: example.ie, reason: owner_confirmed }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, domain]
                properties:
                  ok: { const: true }
                  domain: { type: string }
              example: { ok: true, domain: example.ie }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, a missing field or over 1,000 characters. `bad_action`: not add or remove.
            `bad_organisation_id`, `bad_domain`, `bad_reason`: a field of the wrong shape.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_domain } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`, `not_domain_staff`: as on GET."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such company. `domain_not_found`: remove of a domain the company does not have."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: domain_not_found } } }
        '409':
          description: >-
            `domain_owned_by_other`: another company has the domain (the body names it, `DomainTakenError`). `free_email_domain`: a free
            email provider. `already_added`: the company has it already. `company_merged`: the company was merged into another.
            `open_ban_case`: an open trust and safety case would ban this domain, so it cannot be removed now.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/DomainTakenError'
                  - $ref: '#/components/schemas/ErrorBody'
              example: { error: domain_owned_by_other, owner: { organisationId: '311', displayName: Example Holdings Ltd } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/member-limit:
    post:
      operationId: setMemberLimit
      summary: Set a company's member limit
      description: >-
        Sets how many active members a company may have, from 1 to 50, never below its active members now. The Origin header must be the
        admin app's origin. One audit row with the old and new limit and the reason code.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organisationId, memberLimit, reason]
              properties:
                organisationId: { $ref: '#/components/schemas/Id' }
                memberLimit: { type: integer, minimum: 1, maximum: 50 }
                reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { organisationId: '310', memberLimit: 12, reason: larger_team }
      responses:
        '200':
          description: The new limit and the active members counted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, organisationId, memberLimit, activeMembers]
                properties:
                  ok: { const: true }
                  organisationId: { $ref: '#/components/schemas/Id' }
                  memberLimit: { type: integer }
                  activeMembers: { type: integer }
              example: { ok: true, organisationId: '310', memberLimit: 12, activeMembers: 4 }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown field, reason not a string, memberLimit not a number, or over 1,000 characters.
            `bad_input`: organisationId not an id. `bad_limit`: not a whole number from 1 to 50. `bad_reason`: not a reason code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_limit } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_limit_staff`: neither account_reviewer nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_limit_staff } } }
        '404':
          description: "`not_found`: no such company."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`below_active`: the limit is lower than the company's active members."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: below_active } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/merge:
    get:
      operationId: previewMerge
      summary: Show two companies before a merge
      description: >-
        The companies with the given ids (one or two `id` keys) and the counts a merge would move. No person's data. `id` is the one key
        that may repeat; any other key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, fetched_job_reviewer, rules_data_editor, trust_and_safety, administrator]
      x-rate-limit: none
      parameters:
        - name: id
          in: query
          required: true
          description: One or two company ids (`?id=1&id=2`).
          style: form
          explode: true
          schema: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: The companies found (an unknown id is simply missing).
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies: { type: array, items: { $ref: '#/components/schemas/CompanyPreview' } }
              example: { companies: [{ id: '310', slug: example-care, display_name: Example Care Ltd, kind: employer, status: verified, cro_number: '123456', merged_into_id: null, active_members: 2, jobs: 5, names: 1 }] }
        '400':
          description: "`bad_input`: no id, more than two, or one that is not an id. `bad_query`: a query key other than `id`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_input } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_company_viewer`: none of the roles listed."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_company_viewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: mergeCompanies
      summary: Merge one company into another
      description: >-
        Moves the absorbed company's names (with their DETE links) and jobs to the survivor and marks it merged. No undo route (the audit
        row lists every moved id, so a merge can be reversed by hand). The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, fetched_job_reviewer]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [absorbedId, survivorId]
              properties:
                absorbedId: { $ref: '#/components/schemas/Id' }
                survivorId: { $ref: '#/components/schemas/Id' }
            example: { absorbedId: '311', survivorId: '310' }
      responses:
        '200':
          description: Merged, with what moved.
          content:
            application/json:
              schema:
                type: object
                required: [ok, absorbed, survivor, names, jobs]
                properties:
                  ok: { const: true }
                  absorbed: { $ref: '#/components/schemas/Id' }
                  survivor: { $ref: '#/components/schemas/Id' }
                  names: { type: integer }
                  jobs: { type: integer }
              example: { ok: true, absorbed: '311', survivor: '310', names: 1, jobs: 3 }
        '400':
          description: "`bad_body`: not one JSON object, an unknown field, or over 1,000 characters. `bad_input`: an id missing or not an id. `same_company`: both ids the same."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_company } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_company_staff`: neither account_reviewer nor fetched_job_reviewer."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_company_staff } } }
        '404':
          description: "`not_found`: one of the companies does not exist."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `already_merged`: the absorbed company was merged already. `target_merged`: the survivor was merged into another.
            `not_mergeable`: one is rejected, closed, banned or suspended. `kind_mismatch`: not the same kind. `active_members`: the absorbed
            company still has active members. `has_applications`: the absorbed company has applications.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: kind_mismatch } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/owner-reassign:
    get:
      operationId: listOwnerReassigns
      summary: List open owner reassignment requests
      description: >-
        The open requests to make another member the account owner, oldest first, 20 a page. Shows both people's emails, so account
        reviewers only. `after` is the opaque `next` token of the page before. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      parameters:
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OwnerRequest' } }
                  next: { type: [string, 'null'] }
              example:
                items:
                  - { id: '5', organisation_id: '310', display_name: Example Care Ltd, new_owner_membership_id: '77', new_owner_email: new.owner@example.ie, old_owner_membership_id: '70', old_owner_email: old.owner@example.ie, requested_by_staff_user_id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', requested_at: '2026-11-11 09:30:00.123456+00', completes_after: '2026-11-18 09:30:00.123456+00', can_complete: true }
                next: null
        '400':
          description: "`bad_cursor`: `after` is not a token of this list (a plain id, a changed token or another list's token). `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_account_reviewer } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnOwnerReassign
      summary: Request, complete or cancel an owner reassignment
      description: >-
        `request` records a member's request to become the account owner, after the reviewer checked the company domain and the CRO number
        (both ticks must be true); the old owner gets a notice. `complete` finishes it once its 7 days have passed (the old owner becomes a
        recruiter). `cancel` ends an open request. One open request per company. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, membershipId, domainChecked, croChecked]
                  properties:
                    action: { const: request }
                    membershipId: { $ref: '#/components/schemas/Id' }
                    domainChecked: { type: boolean }
                    croChecked: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [complete, cancel] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: request, membershipId: '77', domainChecked: true, croChecked: true }
      responses:
        '200':
          description: "`request`: the request id, company and when it may complete. `complete`: the new owner membership. `cancel`: the request id."
          content:
            application/json:
              schema:
                type: object
                required: [ok, requestId]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  organisationId: { $ref: '#/components/schemas/Id' }
                  completesAfter: { type: string }
                  ownerMembershipId: { $ref: '#/components/schemas/Id' }
              example: { ok: true, requestId: '5', organisationId: '310', completesAfter: '2026-11-25T09:30:00.123456+00:00' }
        '400':
          description: >-
            `bad_body`: not one JSON object, a field that does not belong to the action, a tick that is not a boolean, or over 1,000
            characters. `bad_action`: not request, complete or cancel. `bad_input`: an id that is not an id. `not_checked`: a tick is false.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_checked } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_account_reviewer`: no account_reviewer role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`member_not_found`: no such membership (request). `not_found`: no such request (complete, cancel)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: member_not_found } } }
        '409':
          description: >-
            `already_owner`: the member is the owner. `company_not_open`: the company is not open for this. `no_owner`: the company has no
            owner. `user_not_active`: the member's login is not active. `request_open`: the company has an open request already.
            `not_open`: the request is not open. `too_early`: the 7 days have not passed. `owner_changed`: the owner is no longer the one the
            request named. `member_gone`: the member left.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: too_early } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/contact:
    get:
      operationId: listContactMessages
      summary: List contact messages, or read one
      description: >-
        Without `id`: the new and claimed contact form messages, oldest first, 20 a page (no name, email or text in the list). With `id`:
        that one message in full, whatever its status; the read is logged (an audit row of kind data_access, with the candidate as
        subject). Only `id` and `after`, each at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, content_editor, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '901' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ContactSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/ContactMessage' }
              example:
                items: [{ id: '901', status: new, topic: general, surface: candidate, createdText: '2026-11-18 09:30:00.123456+00', claimedByStaffUserId: null, claimedText: null }]
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_contact_reader`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_contact_reader } } }
        '404':
          description: "`not_found`: no such message (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnContactMessage
      summary: Claim a contact message, or mark it answered, closed or spam
      description: >-
        `claim` takes a new message (or a stale claim: over 24 hours, or held by a login no longer active); claiming one's own is fine.
        `answer`, `close` and `spam` are for the claimer only. Each step writes one audit row (ids and the new status, never the text).
        Nothing is sent from here: staff reply from the support mailbox. The Origin header must be the admin app's origin. An administrator
        may read but not act.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, content_editor]
      x-rate-limit: none
      x-body-cap: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, messageId]
              properties:
                action: { type: string, enum: [claim, answer, close, spam] }

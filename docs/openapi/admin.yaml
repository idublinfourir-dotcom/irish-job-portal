        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnLegalText
      summary: Propose, confirm or refuse a new version of a legal text
      description: >-
        Step 15 R5 (20c "Terms and privacy pages": content editor edits, administrator approves; #104 two-person). `propose`: a content editor
        proposes a body and a version label for one purpose; one pending proposal per purpose, and a label already used for that purpose is
        refused. `confirm`: an administrator who did not propose confirms and the text is published at once (the database's approval check
        uses the request); new sign-ups of that purpose consent to it from then on. Existing users are not asked again. `refuse`: an
        administrator refuses, or the proposer withdraws. `propose` and `confirm` publish legal text, so they need a sign-in in the last 10
        minutes (C4, #270); `refuse` does not. The body is plain text, at most 100,000 characters, not blank; line breaks and tabs are kept,
        any other control or format character (bidi marks, zero-width) is refused. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]

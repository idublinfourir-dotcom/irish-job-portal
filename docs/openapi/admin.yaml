          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnSetting
      summary: Propose, confirm or refuse a setting's new value
      description: >-
        `propose`: an administrator proposes a new value for a known key (a whole number from 0 to 100,000, or null for not set); one pending
        change per key. `confirm`: a different administrator confirms and the value is written at once (the database's setting guard uses the
        request and writes the audit row naming both). `refuse`: a different administrator refuses, or the proposer withdraws. The unit never
        changes here. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, key, value]
                  properties:
                    action: { const: propose }
                    key: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                    value: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm, refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: propose, key: draft_job, value: 6 }
      responses:
        '200':
          description: "`propose`: the request id. `confirm`: the key and value written. `refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  key: { type: string }
                  value: { type: [integer, 'null'] }
              example: { ok: true, requestId: '130' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 300 characters. `bad_action`: unknown action. `bad_key`: not a key's shape. `bad_value`: missing, not a whole number from 0 to 100,000 and not null. `bad_request_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_value } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role. `reauth_required` (C4, #270, audit SEC-12): a propose or confirm on a session older than 10 minutes; sign in again (refuse works on any session)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such setting, or no such setting request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`no_change`: the value is already that. `decision_pending`: a change of that key waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_person } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/legal-texts:

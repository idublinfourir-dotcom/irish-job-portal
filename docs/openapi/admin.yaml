        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 200 characters. `bad_action`: unknown action. `bad_message_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_message_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_contact_staff`: neither services_case_handler nor content_editor."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_contact_staff } } }
        '404':
          description: "`not_found`: no such message."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`: answered, closed or spam already. `claimed_by_other`: a fresh claim of someone else. `not_claimed`: answer, close or spam on a new message. `not_claimer`: someone else holds the claim."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_claimer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/content:
    get:
      operationId: listContentPages
      summary: List content pages, or show one
      description: >-
        Without `id`: pages of every state, newest change first, 20 a page, filtered by `kind` and `status`. With `id`: one page with its
        body. With `stale=1` alone (step 15 Q14): the published guides whose checked-on date is over `staleDays` (90) days old, oldest
        first, at most 100. Only `id`, `kind`, `status`, `after` and `stale`, each at most once (anything else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [content_editor, rules_data_editor, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '41' }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [guide, update, help, occupation] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, published, withdrawn] } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
        - { name: stale, in: query, required: false, schema: { const: '1' } }
      responses:
        '200':
          description: The page (no `id`), `{ item }` with `body` (with `id`), or the stale guides (with `stale=1`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ContentSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        allOf:
                          - $ref: '#/components/schemas/ContentSummary'
                          - { type: object, required: [body], properties: { body: { type: string } } }
                  - type: object
                    required: [staleDays, items, truncated]
                    properties:
                      staleDays: { type: integer }
                      items: { type: array, items: { $ref: '#/components/schemas/ContentSummary' } }
                      truncated: { type: boolean }
              example:
                items: [{ id: '41', kind: help, slug: how-to-apply, title: How to apply, status: draft, sourceUrl: null, checkedOn: null, publishedAt: null, updatedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', updatedAt: '2026-11-18 09:30:00.123456+00' }]
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key, or `stale` with another key or not `1`. `bad_kind`, `bad_status`: not one of the values. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_kind } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_content_staff`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_content_staff } } }
        '404':
          description: "`not_found`: no such page (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnContentPage
      summary: Create or edit a draft, publish or withdraw a page
      description: >-
        `create` (content_editor) writes a new draft; an occupation page's slug is its SOC 2010 code. `edit` (content_editor) changes a
        draft or a withdrawn page; kind and slug never change and a published page is withdrawn first. `publish`: a content_editor
        publishes help and update pages, a rules_data_editor guides and occupation texts; anything but help needs a source and a
        checked-on date. `withdraw` (content_editor) takes any published page down. Title 1 to 200 characters, body 1 to 50,000
        characters (line breaks and tabs allowed, no other control characters), sourceUrl an http or https address up to 500 characters,
        checkedOn a real day not in the future. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [content_editor, rules_data_editor]
      x-rate-limit: none
      x-body-cap: 110000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, kind, slug, title, body]
                  properties:
                    action: { const: create }
                    kind: { type: string, enum: [guide, update, help, occupation] }
                    slug: { type: string }
                    title: { type: string, maxLength: 200 }
                    body: { type: string, maxLength: 50000 }
                    sourceUrl: { type: string, maxLength: 500 }
                    checkedOn: { $ref: '#/components/schemas/Date' }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: edit }
                    id: { $ref: '#/components/schemas/Id' }
                    title: { type: string, maxLength: 200 }
                    body: { type: string, maxLength: 50000 }
                    sourceUrl: { type: string, maxLength: 500 }
                    checkedOn: { $ref: '#/components/schemas/Date' }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { type: string, enum: [publish, withdraw] }
                    id: { $ref: '#/components/schemas/Id' }
            example: { action: create, kind: help, slug: how-to-apply, title: How to apply, body: Pick a job and follow the link to the employer's own page. }
      responses:
        '200':
          description: "`create` answers the new id; the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  id: { $ref: '#/components/schemas/Id' }
              example: { ok: true, id: '41' }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, or over 110,000 characters. `bad_action`: unknown action.
            `bad_id`, `bad_kind`, `bad_slug`, `bad_title`, `bad_body_text`, `bad_source_url`, `bad_checked_on`: a field of the wrong type or
            outside its rules. `nothing_to_change`: an edit with no field.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_slug } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: >-
            `bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_content_editor`: create,
            edit or withdraw without content_editor, or publish of help or update without it. `not_rules_data_editor`: publish of a guide or
            occupation text without rules_data_editor. `not_publisher`: publish with neither role.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_content_editor } } }
        '404':
          description: "`not_found`: no such page."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`slug_taken`: a page with this kind and slug exists. `not_editable`: edit of a published page. `already_published`: publish of a published page. `not_published`: withdraw of a page that is not published. `needs_source_and_checked_on`: publish of a non-help page without both."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: needs_source_and_checked_on } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/employer-jobs:
    get:
      operationId: listEmployerJobQueue
      summary: List a held employer or agency job queue, or show one item
      description: >-
        Without `id`: the open and claimed items of one queue (`queue` required), oldest first, 20 a page. With `id`: one item of the three
        queues with its advert text, whatever its status. scam_flag is for trust_and_safety, post_strike_job_review and agency_client_check
        for account_reviewer; an administrator may read and act on all three. Only `id`, `queue` and `after`, each at most once (anything
        else is `bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety (scam_flag), account_reviewer (post_strike_job_review, agency_client_check), administrator (all three)]
      x-rate-limit: none
      parameters:
        - { name: queue, in: query, required: false, description: "Required without `id`.", schema: { type: string, enum: [scam_flag, post_strike_job_review, agency_client_check] } }
        - { name: id, in: query, required: false, schema: { type: string }, example: '2201' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` with `advertText` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/JobQueueItem' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item: { $ref: '#/components/schemas/JobQueueItem' }
              example:
                items:
                  - { id: '2201', queue: agency_client_check, status: open, claimedBy: null, reason: client_not_found, jobId: '5501', jobStatus: in_review, source: agency, title: Staff Nurse, employerName: Example Recruitment Ltd, county: Dublin, occupationCode: '2231', permitType: critical_skills, salaryLow: 38000, salaryHigh: 45000, payGrade: null, badge: null, closesAt: '2026-12-31T23:59:59.000Z', organisationId: '312', company: Example Recruitment Ltd, companyStatus: verified, restricted: false, clientName: Example Hospital, clientCheck: not_found }
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key. `bad_queue`: no `queue` (without `id`) or an unknown one. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_queue } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_reviewer`: no role for any of the queues, or not for this queue or this item's queue."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no such item (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnEmployerJobItem
      summary: Claim, release, approve or reject a held employer or agency job
      description: >-
        `claim` takes an open item (or a stale claim of someone else). Only the claimer releases, approves or rejects. `approve` closes the
        item; the job goes live only when no other open item of the three queues holds it and the company may go live. `reject` closes the
        item and closes the job as removed (it never comes back), dropping its other items. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety (scam_flag), account_reviewer (post_strike_job_review, agency_client_check), administrator (all three)]
      x-rate-limit: none
      x-body-cap: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [claim, release, approve] }
                    itemId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, itemId, reason]
                  properties:
                    action: { const: reject }
                    itemId: { $ref: '#/components/schemas/Id' }
                    reason: { $ref: '#/components/schemas/ReasonCode' }
            example: { action: approve, itemId: '2201' }
      responses:
        '200':
          description: "`approve` also gives the job's status after it (live, or still in_review while another item holds it); the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  jobId: { $ref: '#/components/schemas/Id' }
                  jobStatus: { type: string, enum: [live, in_review] }
              example: { ok: true, jobId: '5501', jobStatus: live }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 300 characters. `bad_action`: unknown action. `bad_item_id`: not an id. `bad_reason`: not a reason code."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_reviewer`: no role for this item's queue."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no such item."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`, `claimed_by_other`, `not_claimed`, `not_claimer`: the item's state does not allow it. `job_not_in_review`: the job is no longer in review. `company_not_active`: approve of a job whose company may not go live (not verified, or suspended, banned or closed)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_claimer } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/employer-jobs/authority:
    get:
      operationId: getEmployerJobAuthority
      summary: List or open the client's written authority kept on an agency job
      description: >-
        P8. With `jobId` only: the copies an agency uploaded on its job that names a client (metadata only, oldest first, a copy removed by
        retention shows `copyDeleted`). With `jobId` and `docId`: 302 to a 60-second download link of that stored copy, and one `data_access`
        audit row (`job_authority.open`, the copy's id, the job id, the role in force). The list writes no audit row. For the staff who check
        agency jobs: account_reviewer (the agency_client_check queue) or an administrator. Only `jobId` and `docId`, each at most once.
      security: [{ staffSession: [] }]
      x-roles: [account_reviewer, administrator]
      x-rate-limit: none
      parameters:
        - { name: jobId, in: query, required: true, schema: { type: string }, example: '5501' }
        - { name: docId, in: query, required: false, schema: { type: string }, example: '77' }
      responses:
        '200':
          description: The copies (without `docId`).
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, fileName, contentType, sizeBytes, uploadedAt, copyDeleted]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        fileName: { type: [string, 'null'] }
                        contentType: { type: [string, 'null'], enum: [pdf, jpeg, png, null] }
                        sizeBytes: { type: [integer, 'null'] }
                        uploadedAt: { $ref: '#/components/schemas/Timestamp' }
                        copyDeleted: { type: boolean }
              example: { documents: [{ id: '77', fileName: client-authority.pdf, contentType: pdf, sizeBytes: 182044, uploadedAt: '2026-11-18T10:00:00.000Z', copyDeleted: false }] }
        '302':
          description: "The download link (with `docId`), valid 60 seconds; not cached, no referrer."
          headers:
            Location: { schema: { type: string, format: uri }, example: 'https://files.example.com/authority/made-up-key?signature=made-up' }
        '400':
          description: "`bad_query`: no `jobId`, or an unknown or repeated key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_reviewer`: neither account_reviewer nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_reviewer } } }
        '404':
          description: "`not_found`: no agency job naming a client with that id, or no stored copy with that id on it (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. No audit row is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
  /api/fetched-jobs:
    get:
      operationId: listFetchedJobQueue
      summary: List the fetched-job queue, or show one item
      description: >-
        Without `id`: the open and claimed fetched-job review items, oldest first, 20 a page. With `id`: one item with the saved advert text,

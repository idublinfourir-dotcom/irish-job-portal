                  settings:
                    type: array
                    items:
                      type: object
                      required: [key, value, unit, is_guess, solicitor_confirmed_at, updated_by, updated_at]
                      properties:
                        key: { type: string }
                        value: { type: [integer, 'null'] }
                        unit: { type: [string, 'null'], enum: [days, months, count, null] }
                        is_guess: { type: boolean }
                        solicitor_confirmed_at: { oneOf: [{ $ref: '#/components/schemas/DbTime' }, { type: 'null' }] }
                        updated_by: { oneOf: [{ $ref: '#/components/schemas/LoginId' }, { type: 'null' }] }
                        updated_at: { $ref: '#/components/schemas/DbTime' }
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, key, value, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }

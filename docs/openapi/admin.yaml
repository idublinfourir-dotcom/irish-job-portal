                        itemId: { $ref: '#/components/schemas/Id' }
                        kind: { type: string, enum: [candidate, portal] }
                        userId: { $ref: '#/components/schemas/LoginId' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example:
                items: [{ itemId: '52', status: open, createdAt: '2026-11-19 09:30:00.123456+00', surface: candidate_site, email: person@example.com, signedIn: false, confirmPurpose: erase, confirmSentAt: '2026-11-19T09:35:00.123456+00:00', confirmedAt: null }]
                truncated: false
                pending: [{ requestId: '160', itemId: '52', kind: candidate, userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', proposedBy: 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6', createdAt: '2026-11-19 09:40:00.123456+00' }]

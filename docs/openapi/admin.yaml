        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. Nothing is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
  /api/rules/history:
    get:
      operationId: listRulesHistory
      summary: List the past versions of one rules kind
      description: >-
        B64: the versions of one kind that have started, newest first, 10 a page; the first is the one in force. Each has its dates, who proposed and confirmed it, and its change
        against the version before it (the first version's change is every entry added), so a figure or an entry at any date can be read from the changes. The next
        page is asked for with `after` (the opaque `next` token of the page before). Any active staff member. Confirmed versions still to come are in GET /api/rules.
      security: [{ staffSession: [] }]
      x-roles: [any active staff member]
      x-rate-limit: none
      parameters:
        - { name: kind, in: query, required: true, description: The rules kind., schema: { $ref: '#/components/schemas/RulesKind' }, example: minimums }
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kind, items, next]
                properties:
                  kind: { $ref: '#/components/schemas/RulesKind' }
                  items:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [versionId, effectiveFrom, until, inForce, seeded, proposedBy, proposedByName, confirmedByName, confirmedAt, change]
                      properties:
                        versionId: { $ref: '#/components/schemas/Id' }
                        effectiveFrom: { $ref: '#/components/schemas/Date' }
                        until: { type: [string, 'null'], description: "The day the next version started (the same day when it was replaced on its first day), or null for the one in force.", example: '2026-11-25' }
                        inForce: { type: boolean, description: True for the version in force today., example: false }
                        seeded: { type: boolean, description: "True for the owner's first version (nobody proposed or confirmed it).", example: false }
                        proposedBy: { type: [string, 'null'], description: "The proposer's staff id, or null for the first version.", example: q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP }
                        proposedByName: { type: [string, 'null'], description: "The proposer's name, or null.", example: Fake Editor }
                        confirmedByName: { type: [string, 'null'], description: "The name of the administrator who confirmed, or null.", example: Fake Administrator }
                        confirmedAt: { type: [string, 'null'], description: "When it was confirmed (database time text), or null.", example: '2026-11-18 09:30:00.123456+00' }
                        change: { $ref: '#/components/schemas/RulesChange' }
                  next: { type: [string, 'null'], description: "The token of the next page, or null on the last.", example: null }
              example:
                kind: minimums
                items:
                  - { versionId: '3', effectiveFrom: '2026-03-01', until: null, inForce: true, seeded: false, proposedBy: q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP, proposedByName: Fake Editor, confirmedByName: Fake Administrator, confirmedAt: '2026-02-18 09:30:00.123456+00', change: { added: {}, removed: {}, changed: { criticalSkills: { before: 38000, after: 40904 } } } }
                next: null
        '400':
          description: "`bad_kind`: no kind or not a rules kind. `bad_cursor`: `after` is not a token of this list. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_kind } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/rules/pay-deal-employers:

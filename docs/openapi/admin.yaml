                pending: [{ requestId: '131', purpose: privacy_notice, version: '2026-12-01', body: PLACEHOLDER TEXT., proposedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', createdAt: '2026-11-19 09:30:00.123456+00' }]
        '400':
          description: "`bad_query`: any query key."

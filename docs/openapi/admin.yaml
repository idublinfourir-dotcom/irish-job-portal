  /api/staff:
    get:
      operationId: listStaff
      summary: List staff logins and pending role grants
      description: >-
        Every staff login with its roles and status (at most 200; `truncated` says more exist), and the role grants waiting for a second
        administrator. No query key is allowed (`bad_query`).
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema:
                type: object
                required: [staff, truncated, pending]
                properties:
                  staff: { type: array, items: { $ref: '#/components/schemas/StaffRow' } }
                  truncated: { type: boolean }
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, staffId, role, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        staffId: { $ref: '#/components/schemas/LoginId' }
                        role: { $ref: '#/components/schemas/StaffRole' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example:
                staff: [{ id: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', name: Example Reviewer, email: reviewer@example.com, status: active, createdAt: '2026-11-01 09:30:00.123456+00', roles: [account_reviewer] }]
                truncated: false
                pending: []
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnStaff
      summary: Invite a login; grant, remove or confirm roles; disable or enable a login
      description: >-
        `propose_role`: an administrator proposes a role for a login (one pending grant per login and kind). `confirm_role`: a different
        administrator confirms and the role is written. `refuse_role`: a different administrator refuses, or the proposer withdraws.
        `remove_role`: one administrator removes a role at once. `disable`: the login is disabled and its sessions end in the same
        transaction. C4 (#270): every action here needs a session from a sign-in in the last 10 minutes, else 403 `reauth_required`. `enable`: a disabled login with no roles is turned back on. `invite` (step 15 Q15): makes an active login with no
        password and no role for the email (stored lowercased), proposes `role` for it as `propose_role` does (a different administrator
        confirms), then sends the set-password email through the staff reset (the security@ sender; the link works for 1 hour, and the
        invitee can ask for a new one through the reset). If the sender refuses the email the answer is 502 `email_not_sent` with the
        new login and its grant request, both kept. `resend_invite`: a new set-password email for a login that has not set a password yet, at
        most 3 an hour per login (429 `too_many_resends`), 502 `email_not_sent` when the sender refuses it. The last active
        administrator cannot lose the role or be disabled. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, staffId, role]
                  properties:
                    action: { type: string, enum: [propose_role, remove_role] }
                    staffId: { $ref: '#/components/schemas/LoginId' }
                    role: { $ref: '#/components/schemas/StaffRole' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm_role, refuse_role] }
                    requestId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, staffId]
                  properties:
                    action: { type: string, enum: [disable, enable, resend_invite] }
                    staffId: { $ref: '#/components/schemas/LoginId' }
                - type: object
                  additionalProperties: false
                  required: [action, email, name, role]
                  properties:
                    action: { const: invite }
                    email: { type: string, format: email, maxLength: 254 }
                    name: { type: string, minLength: 1, maxLength: 100 }
                    role: { $ref: '#/components/schemas/StaffRole' }
            example: { action: propose_role, staffId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', role: content_editor }
      responses:
        '200':
          description: "`propose_role`: the request id. `confirm_role`: the login and role written. `disable`: the sessions ended. `invite`: the new login and its grant request. The rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  staffId: { $ref: '#/components/schemas/LoginId' }
                  role: { $ref: '#/components/schemas/StaffRole' }
                  sessionsEnded: { type: integer }
              example: { ok: true, requestId: '120' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 1,000 characters. `bad_action`: unknown action. `bad_staff_id`: not a login id. `bad_request_id`: not an id. `bad_role`: not one of the seven roles. `bad_email`: not a plain address. `bad_name`: empty, over 100 characters or with control characters."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_role } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role. `reauth_required` (C4, #270): the session is older than 10 minutes; sign in again."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such login, request, or role on that login."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`target_not_active`: the login is disabled. `already_holds`: it has the role. `grant_pending`: a grant of that kind waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming. `last_administrator`: it would leave no active administrator. `already_disabled`, `not_disabled`: the login's status. `holds_roles`: enable of a login that still holds roles. `email_taken`: a staff login with this email exists. `password_set`: resend_invite for a login that has set its password."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: last_administrator } } }
        '429':
          description: "`too_many_resends`: 3 resends of this login in the last hour."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: too_many_resends } } }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: "`email_not_sent`: invite or resend_invite, the sender refused the set-password email. The login (and, for invite, its grant request) is kept; try resend_invite."
          content:
            application/json:
              schema:
                type: object
                required: [error, staffId]
                properties:
                  error: { const: email_not_sent }
                  staffId: { $ref: '#/components/schemas/LoginId' }
                  requestId: { $ref: '#/components/schemas/Id' }
              example: { error: email_not_sent, staffId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', requestId: '121' }
  /api/trust-safety/reports:
    get:
      operationId: listReports
      summary: List open job and company reports, or show one
      description: >-
        Without `id`: the open and job_hidden reports, job and company reports together, oldest first, 20 a page (no evidence text, no
        reporter), each with its company. With `id`: one report with its evidence, the job or company as reported and, until it is decided,
        who reported it. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '801' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`; adds evidenceText, targetSnapshot, reporterCandidateUserId, reporterPortalUserId, decidedByStaffUserId, decidedAt and caseId).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ReportSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        allOf:
                          - $ref: '#/components/schemas/ReportSummary'
                          - type: object
                            properties:
                              evidenceText: { type: [string, 'null'] }
                              targetSnapshot: { description: The job or company as it was when reported (any JSON). }
                              reporterCandidateUserId: { type: [string, 'null'] }
                              reporterPortalUserId: { type: [string, 'null'] }
                              decidedByStaffUserId: { type: [string, 'null'] }
                              decidedAt: { $ref: '#/components/schemas/NullableTimestamp' }
                              caseId: { type: [string, 'null'] }
                              evidenceFile: { type: boolean, description: "Q7: an evidence file is attached (GET /api/trust-safety/evidence?reportId=)." }
              example:
                items: [{ id: '801', status: open, targetKind: job, reason: asks_for_money, createdText: '2026-11-18 09:30:00.123456+00', targetJobId: '5501', jobTitle: Staff Nurse, jobStatus: live, organisationId: '312', displayName: Example Recruitment Ltd }]
                next: null
        '400':
          description: "`bad_cursor`: a token this list did not make. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role (no other role stands in)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such report (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnReport
      summary: Hide the reported job, clear the report, or uphold it
      description: >-
        `hide` hides the live job at once (a job report only; a company report is 409 `not_a_job_report`, as a report never hides a
        company or its jobs by itself). `clear` closes the report and the job comes back. `uphold` closes the report, the database closes
        a hidden job, and a case opens on the job's company, or on the reported company with no job (`caseKind` and `reasonCode` must pair: false_claim with false_sponsorship,
        false_pay_floor with false_pay_floor, instant_ban with asks_for_money, fake_company or fake_job). `noticeSummary` 1 to 1,000
        characters (line breaks and tabs allowed). The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      x-body-cap: 12000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, reportId]
                  properties:
                    action: { type: string, enum: [hide, clear] }
                    reportId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, reportId, caseKind, reasonCode]
                  properties:
                    action: { const: uphold }
                    reportId: { $ref: '#/components/schemas/Id' }
                    caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban] }
                    reasonCode: { type: string, enum: [false_sponsorship, false_pay_floor, asks_for_money, fake_company, fake_job] }
                    noticeSummary: { type: string, maxLength: 1000 }
            example: { action: uphold, reportId: '801', caseKind: instant_ban, reasonCode: asks_for_money }
      responses:
        '200':
          description: "`uphold` answers the new case id; the rest `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  caseId: { $ref: '#/components/schemas/Id' }
              example: { ok: true, caseId: '51' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 12,000 characters. `bad_action`: unknown action. `bad_id`, `bad_kind`, `bad_reason`, `bad_summary`: a field of the wrong shape; `bad_reason` also when caseKind and reasonCode do not pair."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_reason } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`, `not_trust_and_safety`: as on GET."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_origin } } }
        '404':
          description: "`not_found`: no such report."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`: the report was cleared or upheld. `already_hidden`: hide of a job hidden already. `job_not_live`: hide of a job that is not live. `not_a_job_report`: hide of a company report."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_hidden } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/cases:
    get:
      operationId: listCases
      summary: List cases that need a step, or show one
      description: >-
        Without `id`: the cases that need a step (undecided, an appeal waiting, or a ban lift waiting for its second person), oldest first,
        20 a page; `after` is the opaque `next` token of the page before. With `id`: one case with its company, pending
        two-person requests, ban rows and whether the WRC report is ticked off. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '51' }
        - { name: after, in: query, required: false, description: "The `next` token of the page before.", schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` with every case field (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        type: object
                        description: >-
                          The case row in camel case (id, organisationId, caseKind, jobId, reportId, reasonCode, noticeSummary, level, stage,
                          outcome, the reply and appeal fields and who entered them, decidedBy and decidedAt, banLiftedAt, createdAt), the
                          company (displayName, organisationKind, organisationStatus, restrictedUntil, claimsRemovedAt), `pending` (the
                          two-person requests), `bans`, `notes` (B69), `wrcReported` and `evidenceFile`.
                        required: [id, organisationId, caseKind, stage, pending, bans, wrcReported]
                        properties:
                          id: { $ref: '#/components/schemas/Id' }
                          organisationId: { $ref: '#/components/schemas/Id' }
                          caseKind: { type: string }
                          stage: { type: string }
                          pending: { type: array, items: { type: object } }
                          bans: { type: array, items: { type: object } }
                          notes: { type: array, maxItems: 200, description: "The staff notes on the case, oldest first (B69). Staff text: it is never put in a notice or an email.", items: { type: object, required: [id, text, staffName, createdAt], properties: { id: { $ref: '#/components/schemas/Id' }, text: { type: string, example: "Phoned the employer, no answer." }, staffName: { type: string, example: Kit Nolan }, createdAt: { type: string, description: "The time the note was written, as the database writes it in JSON.", example: '2026-11-19T10:15:00.123456+00:00' } } } }
                          wrcReported: { type: boolean }
                          evidenceFile: { type: boolean, description: "Q7: an evidence file is attached (GET /api/trust-safety/evidence?caseId=)." }
              example:
                items: [{ id: '51', organisationId: '312', displayName: Example Recruitment Ltd, caseKind: instant_ban, reasonCode: asks_for_money, stage: case_open, outcome: null, level: null, replyDueAt: null, appealDueAt: null, createdAt: '2026-11-18T09:30:00.000Z' }]
                next: null
        '400':
          description: "`bad_cursor`: `after` is not a token of this list (a plain id, a changed token or another list's token). `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such case (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnCase
      summary: One step of a trust and safety case
      description: >-
        `open`: a case on a company (optionally about one of its jobs); an instant_ban case suspends a verified company and hides its live
        jobs at once. `notify`: tell the employer, starting the 7-day reply window. `record_reply`, `record_appeal`: a reply or appeal that
        came by email or post, with when it arrived (text 1 to 5,000 characters, line breaks and tabs allowed). `decide`: cleared, strike or
        (instant_ban cases only) ban; clearing and strike 1 apply at once, strike 2, strike 3 and a ban wait for a second officer;
        `conclusive` only with ban. `confirm`, `refuse`: the second officer on what waits (never the proposer or whoever entered the
        reply). `decide_appeal`: upheld or overturned (not by whoever entered the appeal or decided the case). `propose_ban_lift`: propose
        lifting the case's bans. `mark_wrc`: tick off that an agency's instant-ban case was reported to the WRC. `add_note` (B69): add a staff note to the case (text 1 to 5,000 characters, line breaks and tabs allowed); it needs no fresh sign-in and the audit row holds the note's id, not its words. The Origin header must be
        the admin app's origin. C4 (#270): `decide`, `confirm`, `decide_appeal` and `propose_ban_lift` need a session from a sign-in in the
        last 10 minutes, else 403 `reauth_required` (before the role check); the other actions do not.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      x-body-cap: 12000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, organisationId, caseKind, reasonCode]
                  properties:
                    action: { const: open }
                    organisationId: { $ref: '#/components/schemas/Id' }
                    jobId: { $ref: '#/components/schemas/Id' }
                    caseKind: { type: string, enum: [false_claim, false_pay_floor, instant_ban] }
                    reasonCode: { type: string, enum: [false_sponsorship, false_pay_floor, asks_for_money, fake_company, fake_job] }
                    noticeSummary: { type: string, maxLength: 1000 }
                - type: object
                  additionalProperties: false
                  required: [action, caseId]
                  properties:
                    action: { type: string, enum: [notify, confirm, refuse, propose_ban_lift, mark_wrc] }
                    caseId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, text, receivedAt]
                  properties:
                    action: { type: string, enum: [record_reply, record_appeal] }
                    caseId: { $ref: '#/components/schemas/Id' }
                    text: { type: string, maxLength: 5000 }
                    receivedAt: { type: string, description: 'An ISO date and time with a zone, for example 2026-11-17T14:05:00Z.', pattern: '^\d{4}-\d\d-\d\dT\d\d:\d\d(:\d\d(\.\d{1,3})?)?(Z|[+-]\d\d:\d\d)$' }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, text]
                  properties:
                    action: { const: add_note }
                    caseId: { $ref: '#/components/schemas/Id' }
                    text: { type: string, minLength: 1, maxLength: 5000, description: The note., example: "Phoned the employer, no answer." }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, outcome]
                  properties:
                    action: { const: decide }
                    caseId: { $ref: '#/components/schemas/Id' }
                    outcome: { type: string, enum: [cleared, strike, ban] }
                    conclusive: { type: boolean }
                - type: object
                  additionalProperties: false
                  required: [action, caseId, result]
                  properties:
                    action: { const: decide_appeal }
                    caseId: { $ref: '#/components/schemas/Id' }
                    result: { type: string, enum: [upheld, overturned] }
            example: { action: decide, caseId: '51', outcome: strike }
      responses:
        '200':
          description: >-
            `open`: `caseId`. `notify`: `notices` queued. `decide`: `outcome`, `level`, whether it was `applied` and the `requestId` waiting
            for a second officer. `confirm`: what was `applied` (strike_2, strike_3, ban or ban_lift). `decide_appeal`: `result` and
            `liftsProposed`. `propose_ban_lift`: `requests`. `add_note`: `noteId`. The rest `{ ok: true }`.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  caseId: { $ref: '#/components/schemas/Id' }
                  notices: { type: integer }
                  outcome: { type: string }
                  level: { type: integer }
                  applied: { type: [boolean, string] }
                  requestId: { $ref: '#/components/schemas/Id' }
                  result: { type: string }
                  liftsProposed: { type: integer }
                  requests: { type: integer }
                  noteId: { $ref: '#/components/schemas/Id' }
              example: { ok: true, outcome: strike, level: 1, applied: true }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, `conclusive` without outcome ban, or over 12,000 characters.
            `bad_action`: unknown action. `bad_id`, `bad_kind`, `bad_reason`, `bad_summary`, `bad_text`, `bad_time`, `bad_outcome`,
            `bad_flag`, `bad_result`: a field of the wrong shape; `bad_reason` also when caseKind and reasonCode do not pair; `bad_outcome`
            also for ban on a case that is not instant_ban or strike on one that is.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_time } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role. `reauth_required` (C4, #270): the session is older than 10 minutes; sign in again."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such case, company or job."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `job_not_in_organisation`: open with a job of another company. `already_notified`, `not_notified`, `reply_window_open`: the reply
            window does not allow it yet. `already_decided`, `decision_pending`, `other_case_pending` (another case of the company waits for
            its second person), `nothing_pending`, `nothing_to_ban`, `no_ban`: the case's state. `same_person`, `entered_reply`,
            `entered_appeal`, `decided_case`: the two-person rules. `no_appeal_window`, `already_appealed`, `no_appeal`, `appeal_decided`,
            `window_closed`: the appeal's state. `not_agency_ban`, `already_marked`: mark_wrc on a case it does not apply to, or twice.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: reply_window_open } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/list:
    get:
      operationId: listTrust
      summary: One list of reports and cases for a tab (B69)
      description: >-
        The page behind the reports and strikes screen: reports and cases together, each with one id label (`R-0801` for a report, `C-0051` for a case), the company, the job and how
        many reports name that job and that company. `tab`: `open` (reports not yet decided, and cases that need a step other than a reply or an appeal), `waiting` (cases waiting for the
        employer's reply), `appeals` (cases with an appeal waiting) or `closed` (decided reports and finished cases, newest first, the history); default `open`. The other tabs are oldest first.
        20 a page, keyset paging: `after` is the `next` of the page before and is good for the same tab only. `counts` (the number on each tab, at most 200: 200 means 200 or more) comes
        with the first page only and is null on later pages. No reporter and no evidence text is in the list (read one report for that). A case's staff notes are on `GET /api/trust-safety/cases?id=`.
        An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: tab, in: query, required: false, schema: { type: string, enum: [open, waiting, appeals, closed], default: open }, example: open }
        - { name: after, in: query, required: false, description: "The `next` token of the page before, from the same tab.", schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page and, on the first page, the count of each tab.
          content:
            application/json:
              schema:
                type: object
                required: [items, next, counts]
                properties:
                  items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/TrustItem' } }
                  next: { type: [string, 'null'], description: The token for the next page; null on the last page. }
                  counts:
                    description: The number on each tab (at most 200 each); null on a page after the first.
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [open, waiting, appeals, closed]
                        properties:
                          open: { type: integer, minimum: 0, maximum: 200, example: 6 }
                          waiting: { type: integer, minimum: 0, maximum: 200, example: 2 }
                          appeals: { type: integer, minimum: 0, maximum: 200, example: 1 }
                          closed: { type: integer, minimum: 0, maximum: 200, example: 143 }
              example:
                items: [{ kind: report, id: '801', label: R-0801, createdAt: '2026-11-18T09:30:00.123Z', organisationId: '312', displayName: Example Recruitment Ltd, organisationKind: agency, jobId: '5501', jobTitle: Care Assistant, reason: asks_for_money, state: open, outcome: null, level: null, reportId: null, jobReports: 3, companyReports: 5 }]
                next: null
                counts: { open: 6, waiting: 2, appeals: 1, closed: 143 }
        '400':
          description: "`bad_tab`: a tab that does not exist. `bad_cursor`: a token this list and tab did not make. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_tab } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_trust_and_safety`: no trust_and_safety role (no other role stands in, #104)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/bans:
    get:
      operationId: listBans
      summary: Every ban (B70)
      description: >-
        The ban list: every banned CRO number, email domain and email address with the company, the reason, the case, the date and who proposed and confirmed it, newest first. A page is
        20 ban rows; a row that holds several values gives one item for each, so a page can hold up to 60 items. `after` is the `next` of the page before. There is no way to add a ban here:
        a ban comes from a decided case (a strike 3 or an instant ban, with a second officer) and is lifted by `propose_ban_lift` and a second officer's `confirm` on `POST /api/trust-safety/cases`.
        An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page of banned values.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, maxItems: 60, items: { $ref: '#/components/schemas/BanItem' } }
                  next: { type: [string, 'null'] }
              example:
                items: [{ banId: '17', type: cro_number, value: '123456', reasonCode: asks_for_money, caseId: '64', caseLabel: C-0064, caseKind: instant_ban, organisationId: '312', displayName: Example Recruitment Ltd, addedAt: '2026-11-19T10:15:00.000Z', proposedBy: Kit Nolan, confirmedBy: Dara Kelly, liftPending: false }]
                next: null
        '400':
          description: "`bad_cursor`: a token this list did not make. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`, `not_trust_and_safety`: as on `GET /api/trust-safety/list`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/wrc:
    get:
      operationId: listWrcReported
      summary: The cases reported to the WRC (B70)
      description: >-
        The agency instant-ban cases staff ticked off as reported to the WRC (`mark_wrc`, #214 d), newest first, 20 a page, with the date and who ticked it off. `after` is the `next` of the
        page before. An unknown or repeated query key is 400 `bad_query`.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: One page of reported cases.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/WrcItem' } }
                  next: { type: [string, 'null'] }
              example:
                items: [{ caseId: '64', caseLabel: C-0064, organisationId: '312', displayName: Example Recruitment Ltd, organisationKind: agency, reasonCode: asks_for_money, reportedAt: '2026-11-20T11:00:00.000Z', reportedBy: Kit Nolan }]
                next: null
        '400':
          description: "`bad_cursor`: a token this list did not make. `bad_query`: an unknown or repeated query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`, `not_trust_and_safety`: as on `GET /api/trust-safety/list`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/trust-safety/evidence:
    get:
      operationId: openTrustSafetyEvidence
      summary: Open the evidence file of a report or a case
      description: >-
        Q7 (#91, #99). Exactly one of `reportId` and `caseId`: its evidence file itself (S-Q6: inline, the type from the stored kind, nosniff,
        no-store, only once the malware scan passed) and one `data_access`
        audit row (`trust_safety.evidence_open`, object `report` or `strike`). trust_and_safety only. Whether a report or case has a file is
        `evidenceFile` on `GET /api/trust-safety/reports?id=` and `GET /api/trust-safety/cases?id=`.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none
      parameters:
        - { name: reportId, in: query, required: false, schema: { type: string }, example: '801' }
        - { name: caseId, in: query, required: false, schema: { type: string }, example: '51' }
      responses:
        '200':
          description: The evidence file itself.
          headers:
            Content-Type: { schema: { type: string, enum: [application/pdf, image/jpeg, image/png] }, description: "With the id: from the stored kind, never the uploader's." }
            Content-Disposition: { schema: { type: string }, example: "inline; filename*=UTF-8''letter.pdf" }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Security-Policy: { schema: { type: string, const: "frame-ancestors 'self'" } }
          content:
            application/pdf: { schema: { type: string, format: binary }, example: '(the file bytes, at most 4,194,304)' }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '400':
          description: "`bad_query`: not exactly one of `reportId` and `caseId`, or an unknown or repeated key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_trust_and_safety`: the role is missing."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such report or case, or it has no evidence file (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409': { $ref: '#/components/responses/StaffFileRefused' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. No audit row is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
    post:
      operationId: attachTrustSafetyEvidence
      summary: Attach the one evidence file to a report or a case
      description: |
        Q7 (#91, #99). `multipart/form-data` with exactly one of `?reportId=` and `?caseId=` and exactly one field `file` (PDF, JPEG or PNG, found
        from the bytes; at most 4,194,304 bytes). trust_and_safety only. One file per report or case, never replaced; a report only while open or
        job_hidden, a case until its appeal is decided. The file follows the row's retention (rules 21 to 23 delete it with the row). One
        `trust_safety.evidence_attach` audit row (type and size only). Order: Origin, the `Content-Length` cap (before the session), the session,
        the role and the target (before the body is read), then the file. A row write that fails (two at once) removes the stored file.
        The reporter cannot attach a file: the report routes take a small JSON body (`POST /api/report`), not a file.
      security: [{ staffSession: [] }]
      x-roles: [trust_and_safety]
      x-rate-limit: none (one file per report or case)
      x-body-cap: 4210688 bytes (4 MiB file plus 16 KiB of multipart wrapping), counted while reading
      parameters:
        - { name: reportId, in: query, required: false, schema: { type: string }, example: '801' }
        - { name: caseId, in: query, required: false, schema: { type: string }, example: '51' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, additionalProperties: false, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: The file was stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, contentType, sizeBytes]
                properties:
                  ok: { type: boolean, const: true }
                  contentType: { type: string, enum: [pdf, jpeg, png] }
                  sizeBytes: { type: integer }
              example: { ok: true, contentType: png, sizeBytes: 90211 }
        '400':
          description: "`bad_query`: not exactly one of `reportId` and `caseId`. `bad_file`: not multipart or not exactly one `file` field. `empty_file`: no bytes."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_file } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: not the admin site's Origin. `not_active_staff`. `not_trust_and_safety`: the role is missing."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_trust_and_safety } } }
        '404':
          description: "`not_found`: no such report or case (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_attached`: it has its file already. `already_decided`: the report is decided, or the case's appeal is."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_attached } } }
        '413':
          description: "`file_too_large`: over the cap by header or while reading."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: file_too_large } } }
        '415':
          description: "`wrong_file_type`: the bytes are not a PDF, JPEG or PNG, or an image (PNG, JPEG, WebP) does not decode or is over 40,000,000 pixels, or a PDF is cut short (no %%EOF at its end). Images are stored re-encoded, with no metadata (disarm at upload, S-Q6)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: wrong_file_type } } }
        '422':
          description: "`file_active_content`: a PDF that carries active content (/JavaScript, /JS, /OpenAction, /AA, /Launch, /EmbeddedFile(s), /RichMedia, /XFA, also escaped or inside an object stream), is encrypted, or hides objects behind a filter the check cannot read, or an object stream that inflates past 16 MiB."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: file_active_content } } }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. Nothing is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
  /api/services/cases/{id}/documents:
    get:
      operationId: listServicesCaseDocuments
      summary: List the stored copies of a services case (metadata only)
      description: >-
        M4. Every copy kept on the case (the candidate's, the employer's and staff ones, oldest first; a copy removed by retention shows
        `copyDeleted`), metadata only, no audit row. Only the services_case_handler the case is assigned to (`assigned_staff_user_id`); a case
        assigned to someone else or to no one is 404 like a missing one. Takes no query.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler]
      x-rate-limit: none
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: '301' }
      responses:
        '200':
          description: The copies.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, fileName, contentType, sizeBytes, uploadedAt, copyDeleted, uploadedBy]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        fileName: { type: [string, 'null'], maxLength: 200 }
                        contentType: { type: [string, 'null'], enum: [pdf, jpeg, png, null] }
                        sizeBytes: { type: [integer, 'null'] }
                        uploadedAt: { type: string, description: 'The upload time (the Postgres timestamp as JSON).' }
                        copyDeleted: { type: boolean }
                        uploadedBy: { type: string, enum: [candidate, portal, staff, gone] }
              example: { documents: [{ id: '77', fileName: offer.pdf, contentType: pdf, sizeBytes: 182044, uploadedAt: '2026-11-18T10:00:00.000Z', copyDeleted: false, uploadedBy: candidate }] }
        '400':
          description: "`bad_query`: any query key. `bad_id`: an id that is not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_case_handler`: not a services_case_handler (every other role, administrator included, S-Q11 B). `own_case`: the member's staff email is the requester's account email (20c:231)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_case_handler } } }
        '404':
          description: "`case_not_found`: no such case, or it is not assigned to this member."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: case_not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/services/cases/{id}/documents/{docId}:
    get:
      operationId: openServicesCaseDocument
      summary: Open one stored copy of a services case
      description: >-
        M4 (S-Q6, S-Q8 A). The copy itself through this route (never a presigned link): inline, the type from the stored kind, nosniff,
        no-store, only once the malware scan passed, with one `data_access` audit row (`case_document.open`, the copy's id, reason
        `services_case`, related case `services_case:<id>`, role services_case_handler) in the same transaction. Only the services_case_handler
        the case is assigned to. A copy of another case is 404 (no cross-case read). Takes no query.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler]
      x-rate-limit: none
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: '301' }
        - { name: docId, in: path, required: true, schema: { type: string }, example: '77' }
      responses:
        '200':
          description: The stored copy itself.
          headers:
            Content-Type: { schema: { type: string, enum: [application/pdf, image/jpeg, image/png] }, description: "From the stored kind, never the uploader's." }
            Content-Disposition: { schema: { type: string }, example: "inline; filename*=UTF-8''offer.pdf" }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Security-Policy: { schema: { type: string, const: "frame-ancestors 'self'" } }
          content:
            application/pdf: { schema: { type: string, format: binary }, example: '(the file bytes, at most 4,194,304)' }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '400':
          description: "`bad_query`: any query key. `bad_id`: an id that is not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_case_handler`: not a services_case_handler (every other role, administrator included, S-Q11 B). `own_case`: the member's staff email is the requester's account email (20c:231)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_case_handler } } }
        '404':
          description: "`case_not_found`: no such case, or not assigned to this member. `document_not_found`: no stored copy with that id on this case (another case's, or removed)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: document_not_found } } }
        '409': { $ref: '#/components/responses/StaffFileRefused' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: "`files_unavailable`: file storage is not set up. No audit row is written."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: files_unavailable } } }
  /api/staff/me:
    get:
      operationId: getMyStaffIdentity
      summary: Who am I
      description: >-
        B57: the signed-in staff member's id, name and roles (the seven backend roles, sorted), for the name chip and for which sidebar links to show. Any active staff login,
        whatever its roles (a login with no role has an empty list). No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [any active staff]
      x-rate-limit: none
      responses:
        '200':
          description: The identity.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name, roles]
                properties:
                  id: { type: string, description: "The staff login id.", example: q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP }
                  name: { type: string, description: "The name shown on the account.", example: Dara Kelly }
                  roles: { type: array, items: { $ref: '#/components/schemas/StaffRole' }, description: "The roles held now, sorted.", example: [account_reviewer, content_editor] }
              example: { id: q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP, name: Dara Kelly, roles: [account_reviewer, content_editor] }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/staff/me/export:
    get:
      operationId: exportMyStaffData
      summary: Download my staff data
      description: >-
        One JSON file (`Content-Disposition: attachment; filename="my-data-YYYY-MM-DD.json"`, `Cache-Control: no-store`) with the signed-in
        staff member's own data: account, roles, own audit rows (kind, action, object type, reason code, time), and the review items,
        approval requests, reports, strikes, contact messages, cases and case notes they claimed, decided, proposed, confirmed, were
        given or wrote, as ids and codes only. Never case evidence, note or message bodies, reasons, before or after values, or another
        staff member's id. Writes one audit row (it shows in the next export). Any active staff login, whatever its roles. No query key
        is allowed (`bad_query`). Staff do not delete their own login: an administrator disables it (`POST /api/staff`, action `disable`).
        C4 (#270): the session must come from a sign-in in the last 10 minutes, else 403 `reauth_required`.
      security: [{ staffSession: [] }]
      x-roles: [any active staff login]
      x-rate-limit: none
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="my-data-2026-11-18.json"
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, account, roles, yourActions, reviewItems, approvalRequests, reportsDecided, strikesDecided, contactMessagesClaimed, casesAssigned, caseNotesWritten]
                additionalProperties: false
                properties:
                  exportedAt: { type: string, format: date-time }
                  account: { type: object }
                  roles: { type: array, items: { type: object, required: [role, seededByOwner], properties: { role: { $ref: '#/components/schemas/StaffRole' }, seededByOwner: { type: boolean } } } }
                  yourActions: { type: array }
                  reviewItems: { type: array }
                  approvalRequests: { type: array }
                  reportsDecided: { type: array }
                  strikesDecided: { type: array }
                  contactMessagesClaimed: { type: array }
                  casesAssigned: { type: array }
                  caseNotesWritten: { type: array }
              example:
                exportedAt: '2026-11-18T09:30:00.000Z'
                account: { name: Sam Example, email: sam@example.com, emailConfirmed: true, status: active, createdAt: '2026-10-01T09:00:00+00:00', signInMethods: [credential] }
                roles: [{ role: account_reviewer, seededByOwner: true }]
                yourActions: [{ kind: admin_action, action: review.approve, objectType: organisation, reasonCode: null, source: panel, at: '2026-11-17T10:00:00+00:00' }]
                reviewItems: [{ id: '31', queue: account_review, status: done, outcome: approved, claimedAt: '2026-11-17T09:58:00+00:00', decidedAt: '2026-11-17T10:00:00+00:00' }]
                approvalRequests: []
                reportsDecided: []
                strikesDecided: []
                contactMessagesClaimed: []
                casesAssigned: []
                caseNotesWritten: []
        '400': { description: "`bad_query`: any query key.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403': { description: "`not_active_staff`: the login was disabled between the session check and the read. `reauth_required` (C4, #270): the session is older than 10 minutes; sign in again.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: reauth_required } } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/scheduled-checks:
    get:
      operationId: listScheduledChecks
      summary: List the open scheduled reminders for my roles
      description: >-
        The open scheduled_check items (step 15 Q3) the daily command writes: a weekly DETE notice check, a monthly hand check of 100 jobs,
        a 6-monthly big-company review, one per big-company name or health registration body due for review, and a quarterly pay scales
        review once a pay_scales version is in force (rules_data_editor), and a quarterly role review
        (administrator; the hand check is fetched_job_reviewer); the daily retention run adds a monthly sole_owner_retention reminder
        (administrator) per open company whose only active owner it leaves out (0050). Each member sees the items of the roles they hold; an administrator sees
        them all. Oldest first, at most 100 (`truncated` says more exist). No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor, fetched_job_reviewer, administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The reminders.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, reason, detail, status, created_at]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        reason: { type: string, enum: [dete_notice_check, hand_check_100, big_company_review, role_review, big_company_name_review, registration_body_review, pay_scales_review, sole_owner_retention, dete_page_changed, dete_page_failing] }
                        detail:
                          type: object
                          description: "`key` names the reminder and its period; `role` works it; a big-company name review also has `name` and `reviewOn`. A sole_owner_retention reminder (0050, administrator) has `organisationId`: retention would erase that company's only active owner, so it waits until the company is closed or has another owner. A dete_page_changed item (D5, 0060, rules data editor, written by the weekly DETE watch) has `name` and `address` (the DETE page or Word file that changed) and, for the notices page, `newTitles` (the new item titles, plain text, at most 1,000 characters); staff update the rules through /api/rules themselves. A dete_page_failing item (D5, rules data editor) has `name`, `address` and `failure` (a short reason, such as `HTTP 404` or `HTTP 301 to <address>`): that address failed 2 weekly runs in a row; one item per failure streak."
                          required: [key, role]
                          properties:
                            key: { type: string }
                            role: { type: string }
                            name: { type: string }
                            reviewOn: { $ref: '#/components/schemas/Date' }
                            organisationId: { $ref: '#/components/schemas/Id' }
                            address: { type: string, format: uri }
                            newTitles: { type: string, maxLength: 1000 }
                            failure: { type: string, maxLength: 200 }
                        status: { type: string, enum: [open, claimed] }
                        created_at: { $ref: '#/components/schemas/DbTime' }
                  truncated: { type: boolean }
              example:
                items: [{ id: '501', reason: dete_notice_check, detail: { key: 'dete_notice_check:2026-W47', role: rules_data_editor }, status: open, created_at: '2026-11-16 05:40:00.123456+00' }]
                truncated: false
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_scheduled_staff`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_scheduled_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: doneScheduledCheck
      summary: Mark a scheduled reminder done
      description: >-
        `done` closes one open reminder of a role the member holds (an administrator: any), with an audit row. The Origin header must be the
        admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor, fetched_job_reviewer, administrator]
      x-rate-limit: none
      x-body-cap: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, itemId]
              properties:
                action: { const: done }
                itemId: { $ref: '#/components/schemas/Id' }
            example: { action: done, itemId: '501' }
      responses:
        '200':
          description: Done.
          content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { const: true } } }, example: { ok: true } } }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 200 characters. `bad_action`: not `done`. `bad_item_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_item_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_scheduled_staff`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_scheduled_staff } } }
        '404':
          description: "`not_found`: no such reminder, or one of a role the member does not hold."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`already_decided`: the reminder is done or dropped."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: already_decided } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/overdue:
    get:
      operationId: listOverdue
      summary: List queue items and approval requests older than one working day
      description: >-
        Open and claimed review items of every queue created before `before`: one working day ago, counting Monday to Friday in Irish time
        only (Monday 10:00 gives Friday 10:00; at the weekend, the start of Friday). No bank holidays. Oldest first, at most 100
        (`truncated` says more exist). Each item is opened in its own queue's route. `approvals`: two-person requests still pending (waiting
        for a second person) proposed before `before`, oldest first, at most 100 (`approvalsTruncated`). No query key is allowed (step 15 Q12).
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The overdue items.
          content:
            application/json:
              schema:
                type: object
                required: [before, items, truncated, approvals, approvalsTruncated]
                properties:
                  before: { $ref: '#/components/schemas/Timestamp' }
                  approvals:
                    type: array
                    items:
                      type: object
                      required: [id, kind, target_table, target_id, proposed_by, created_at]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        kind: { type: string }
                        target_table: { type: string }
                        target_id: { type: string }
                        proposed_by: { $ref: '#/components/schemas/LoginId' }
                        created_at: { $ref: '#/components/schemas/DbTime' }
                  approvalsTruncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, queue, status, claimed_by, created_at]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        queue: { type: string }
                        status: { type: string, enum: [open, claimed] }
                        claimed_by: { oneOf: [{ $ref: '#/components/schemas/LoginId' }, { type: 'null' }] }
                        created_at: { $ref: '#/components/schemas/DbTime' }
                  truncated: { type: boolean }
              example:
                before: '2026-11-17T10:00:00.000Z'
                items: [{ id: '88', queue: fetched_job, status: open, claimed_by: null, created_at: '2026-11-16 05:40:00.123456+00' }]
                truncated: false
                approvals: [{ id: '41', kind: setting, target_table: setting, target_id: draft_job, proposed_by: staff_example_1, created_at: '2026-11-15 09:00:00.123456+00' }]
                approvalsTruncated: false
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/staff/me/counts:
    get:
      operationId: getMyStaffCounts
      summary: Count the work waiting for my roles
      description: >-
        The signed-in member's notices (step 15 Q11): open and claimed items of each review queue their roles may work (a queue with none is
        left out), and for the roles that work them: open reports and those of the last 24 hours (trust_and_safety), strike appeals waiting
        (trust_and_safety, administrator), new and claimed contact messages (services_case_handler, content_editor, administrator) and
        two-person requests someone else proposed (administrator). A count the roles do not cover is null. Any active staff login. B57 adds
        `oldestSeconds` (how long the oldest item of each queue has waited), `reportsJobHidden`, `casesOpen` and, with `?merges=1`, `mergeSuggestions`.
        The only query key is `merges`, and only as `1`. The daily digest email carries the numbers of the first list only.
      security: [{ staffSession: [] }]
      x-roles: [any active staff]
      x-rate-limit: none
      parameters:
        - { name: merges, in: query, required: false, description: "B57: `1` adds the name-merge suggestion count (it runs the name matcher, about 170 ms at real size, so ask for it only on the page that shows it).", schema: { const: '1' } }
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [queues, oldestSeconds, reportsOpen, reportsNew, reportsJobHidden, appeals, contact, approvals, casesUnassigned, casesMine, casesOpen, mergeSuggestions]
                properties:
                  queues: { type: object, additionalProperties: { type: integer, minimum: 1 } }
                  oldestSeconds: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: "B57: for each queue in `queues`, seconds the oldest open or claimed item has waited.", example: { scam_flag: 32400 } }
                  reportsOpen: { type: [integer, 'null'] }
                  reportsNew: { type: [integer, 'null'] }
                  reportsJobHidden: { type: [integer, 'null'], description: "B57: open reports whose job is already hidden, part of `reportsOpen` (trust_and_safety).", example: 1 }
                  appeals: { type: [integer, 'null'] }
                  contact: { type: [integer, 'null'] }
                  approvals: { type: [integer, 'null'] }
                  casesUnassigned: { type: [integer, 'null'], description: Open services cases nobody holds (services case handlers). }
                  casesMine: { type: [integer, 'null'], description: Open services cases assigned to this member (services case handlers). }
                  casesOpen: { type: [integer, 'null'], description: "B57: every open services case, held or not (services case handlers).", example: 11 }
                  mergeSuggestions: { type: [integer, 'null'], description: "B57: DETE name to company link suggestions (account_reviewer, trust_and_safety, administrator). Null unless `merges=1` was sent and a role covers it.", example: 14 }
              example: { queues: { scam_flag: 2, scheduled_check: 1 }, oldestSeconds: { scam_flag: 32400, scheduled_check: 86400 }, reportsOpen: 3, reportsNew: 1, reportsJobHidden: 1, appeals: 0, contact: null, approvals: null, casesUnassigned: null, casesMine: null, casesOpen: null, mergeSuggestions: null }
        '400':
          description: "`bad_query`: a query key other than `merges`, a repeated one, or `merges` with a value other than `1`."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/accuracy-sample:
    get:
      operationId: getAccuracySample
      summary: Read this month's sample of live jobs for the hand check
      description: >-
        This month's (Irish time) sample of up to 100 random live jobs for the badge hand check (#74, step 15 Q8), made on the first read of
        the month and stored on that month's `hand_check_100` reminder, so a reload shows the same jobs in the same order. Each job as it is
        now, with the source link, the badge and permit type, the pass route and the fetcher's stage, reason, quoted evidence and model.
        `approvedByYou`: the reader approved it in the fetched-job queue (20c section 3: someone else should check it). With no live job
        nothing is made: `key` and `createdAt` are null and `jobs` is empty. No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [fetched_job_reviewer, rules_data_editor, trust_and_safety, administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The sample.
          content:
            application/json:
              schema:
                type: object
                required: [key, createdAt, jobs]
                properties:
                  key: { type: [string, 'null'] }
                  createdAt: { oneOf: [{ $ref: '#/components/schemas/DbTime' }, { type: 'null' }] }
                  jobs:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, title, employerName, sourceUrl, source, status, badge, permitType, passRoute, occupationCode, salaryLow, salaryHigh, stage, reason, quotedEvidence, matcherModel, approvedByYou]
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        title: { type: string }
                        employerName: { type: string }
                        sourceUrl: { type: [string, 'null'] }
                        source: { type: string, enum: [fetched, employer, agency, admin_manual] }
                        status: { type: string }
                        badge: { type: [string, 'null'] }
                        permitType: { type: string, enum: [critical_skills, general] }
                        passRoute: { type: [string, 'null'] }
                        occupationCode: { type: [string, 'null'] }
                        salaryLow: { type: [integer, 'null'] }
                        salaryHigh: { type: [integer, 'null'] }
                        stage: { type: [string, 'null'] }
                        reason: { type: [string, 'null'] }
                        quotedEvidence: { type: [string, 'null'] }
                        matcherModel: { type: [string, 'null'] }
                        approvedByYou: { type: boolean }
              example:
                key: 'hand_check_100:2026-11'
                createdAt: '2026-11-19 09:00:00.123456+00'
                jobs: [{ id: '501', title: Example Software Engineer, employerName: Example Ltd, sourceUrl: 'https://jobs.example.com/1', source: fetched, status: live, badge: critical_skills_eligible, permitType: critical_skills, passRoute: stated_pay, occupationCode: '2136', salaryLow: 45000, salaryHigh: 55000, stage: '7 passed', reason: null, quotedEvidence: null, matcherModel: null, approvedByYou: false }]
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_sample_staff`: none of the four roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_sample_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/fetched-jobs/decisions:
    get:
      operationId: listFetchedDecisions
      summary: Export the fetched-job queue decisions as labelled rows
      description: >-
        The decided items of the fetched-job queue as labelled rows for the matcher test set (#120, step 15 Q8): `label` approved or rejected,
        the decision's reason code, the advert text and link, the job's occupation code after the decision, and the fetcher's stage, reason,
        quoted evidence and model. Oldest first by item id, 50 a page; `next` is the `after` of the next page (null on the last). Only `after`
        is allowed in the query.
      security: [{ staffSession: [] }]
      x-roles: [fetched_job_reviewer, rules_data_editor, administrator]
      x-rate-limit: none
      parameters:
        - name: after
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: One page of decisions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  next: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [itemId, label, reasonCode, decidedAt, jobId, title, employerName, sourceUrl, occupationCode, county, stage, reason, quotedEvidence, matcherModel, advertText]
                      properties:
                        itemId: { $ref: '#/components/schemas/Id' }
                        label: { type: string, enum: [approved, rejected] }
                        reasonCode: { type: [string, 'null'] }
                        decidedAt: { $ref: '#/components/schemas/DbTime' }
                        jobId: { $ref: '#/components/schemas/Id' }
                        title: { type: string }
                        employerName: { type: string }
                        sourceUrl: { type: [string, 'null'] }
                        occupationCode: { type: [string, 'null'] }
                        county: { type: [string, 'null'] }
                        stage: { type: [string, 'null'] }
                        reason: { type: [string, 'null'] }
                        quotedEvidence: { type: [string, 'null'] }
                        matcherModel: { type: [string, 'null'] }
                        advertText: { type: [string, 'null'] }
              example:
                next: null
                items: [{ itemId: '88', label: rejected, reasonCode: not_in_ireland, decidedAt: '2026-11-16 10:40:00.123456+00', jobId: '501', title: Example Nurse, employerName: Example Clinic, sourceUrl: 'https://jobs.example.com/2', occupationCode: '2231', county: Dublin, stage: '4 low confidence', reason: matcher unsure, quotedEvidence: null, matcherModel: null, advertText: Example advert text. }]
        '400':
          description: "`bad_query`: any query key but `after`, or it twice. `bad_cursor`: `after` is not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_cursor } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_decision_staff`: none of the three roles."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_decision_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/targets:
    get:
      operationId: getTargetCounts
      summary: Read the counts behind the launch targets
      description: >-
        Aggregates for the #74 targets (step 15 Q8): candidates active in the last 7 days, "Yes, I applied" and "Mark applied" taps (tracker
        entries by origin), jobs whose employer answered yes to "did you hire", on-site applications marked hired, live jobs now, reports of
        the last 30 days and those per 1,000 live jobs (one decimal; null with no live job). Counts only, never a person or a job. Any staff
        login holding a role. No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [any staff role]
      x-rate-limit: none
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [weeklyActiveCandidates, yesIApplied, markApplied, hires, hiredOnSite, liveJobs, reports30Days, reportsPer1000LiveJobs]
                properties:
                  weeklyActiveCandidates: { type: integer, minimum: 0 }
                  yesIApplied: { type: integer, minimum: 0 }
                  markApplied: { type: integer, minimum: 0 }
                  hires: { type: integer, minimum: 0 }
                  hiredOnSite: { type: integer, minimum: 0 }
                  liveJobs: { type: integer, minimum: 0 }
                  reports30Days: { type: integer, minimum: 0 }
                  reportsPer1000LiveJobs: { type: [number, 'null'], minimum: 0 }
              example: { weeklyActiveCandidates: 420, yesIApplied: 75, markApplied: 30, hires: 4, hiredOnSite: 0, liveJobs: 1200, reports30Days: 6, reportsPer1000LiveJobs: 5 }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `no_role`: the login holds no role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: no_role } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/search:
    get:
      operationId: searchStaff
      summary: Search organisations, jobs and services cases
      description: >-
        B58: the staff search behind the shell's search box and the `/search` page. One query key, `q` (required, exactly once): 3 to 100 characters after trimming, no control character.
        A kind is searched only when the member's roles allow it, and a kind the roles do not allow is left out of the answer (never answered with an empty list): `organisations` and `jobs` for
        account reviewer, fetched-job reviewer, rules data editor, trust and safety officer and administrator (the company viewers of the merge preview); `cases` for services case handler and
        administrator. A login whose roles allow none of them (a content editor, or no role) gets `{}`. One query per kind, at most 10 rows each, newest or alphabetical as named, no page numbers and no cursor:
        `more` is true when a kind has more than the 10 shown, and the answer is to type more of the text. Organisations: the name contains the text (any case) or the CRO number starts with it;
        companies merged into another are left out. Jobs: the title or the employer name contains the text, or the text is the job id; drafts are left out; newest first. Cases: the text is a case id (digits only);
        the same columns as the services board list, no requester name or contact. `%`, `_` and `\` in the text are plain characters. Nothing is written (no audit row: no requester data is shown).
      security: [{ staffSession: [] }]
      x-roles: [any active staff member (organisations and jobs: account_reviewer, fetched_job_reviewer, rules_data_editor, trust_and_safety, administrator; cases: services_case_handler, administrator)]
      x-rate-limit: none
      parameters:
        - name: q
          in: query
          required: true
          description: The text to search for, 3 to 100 characters after trimming, no control character.
          schema: { type: string, minLength: 3, maxLength: 100 }
          example: Fake Orchard
      responses:
        '200':
          description: The matches, one entry per kind the roles may search.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  organisations:
                    type: object
                    additionalProperties: false
                    required: [items, more]
                    description: Present for the five company viewer roles. Ordered by display name, then id.
                    properties:
                      items:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          additionalProperties: false
                          required: [id, displayName, croNumber, kind, status]
                          properties:
                            id: { $ref: '#/components/schemas/Id' }
                            displayName: { type: string, description: "The company's display name.", example: Fake Orchard Foods Ltd }
                            croNumber: { type: [string, 'null'], description: "The Companies Registration Office number, or null when none is stored.", example: '123456' }
                            kind: { type: string, enum: [employer, agency, public_body], description: "What the organisation is.", example: employer }
                            status: { type: string, description: "The organisation's status now.", example: verified }
                      more: { type: boolean, description: "True when more than 10 organisations match.", example: false }
                  jobs:
                    type: object
                    additionalProperties: false
                    required: [items, more]
                    description: Present for the five company viewer roles. Newest posted first, then id.
                    properties:
                      items:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          additionalProperties: false
                          required: [id, title, employerName, county, status]
                          properties:
                            id: { $ref: '#/components/schemas/Id' }
                            title: { type: string, description: "The job title.", example: Fake Warehouse Operative }
                            employerName: { type: string, description: "The employer name on the job.", example: Fake Orchard Foods Ltd }
                            county: { type: [string, 'null'], description: "The county, or null.", example: Cork }
                            status: { type: string, enum: [in_review, live, under_review, hidden, closed], description: "The job's status now (drafts are never listed).", example: live }
                      more: { type: boolean, description: "True when more than 10 jobs match.", example: false }
                  cases:
                    type: object
                    additionalProperties: false
                    required: [items, more]
                    description: Present for services case handlers and administrators. At most one row, and only when the text is a case id.
                    properties:
                      items:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          additionalProperties: false
                          required: [id, status, permitType, createdAt]
                          properties:
                            id: { $ref: '#/components/schemas/Id' }
                            status: { type: string, description: "The case status now.", example: received }
                            permitType: { type: string, description: "The permit type the case asks for.", example: general }
                            createdAt: { $ref: '#/components/schemas/DbTime' }
                      more: { type: boolean, description: "Always false: a case id matches at most one case.", example: false }
              example:
                organisations: { items: [{ id: '1204', displayName: Fake Orchard Foods Ltd, croNumber: '123456', kind: employer, status: verified }], more: false }
                jobs: { items: [{ id: '88017', title: Fake Warehouse Operative, employerName: Fake Orchard Foods Ltd, county: Cork, status: live }], more: false }
        '400':
          description: "`bad_query`: no `q`, `q` repeated, `q` under 3 or over 100 characters after trimming, a control character in it, or any other query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_active_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/services/cases:
    get:
      operationId: listServicesCases
      summary: List open services cases at one status, or open one case
      description: >-
        Without `id`: the open cases at `status` (default received), oldest first, 20 a page, with the payer ("who pays") and whether the
        requester ticked the HR-contact consent; no requester name or contact. With `id`: that case. A services case handler sees all of it
        (requester name and email while the case is open and the requester not erased, offer details, consents, payer, status, outcome,
        documents needed with labels, the count of stored copies, the assigned handler, the notes); an administrator sees it without the notes,
        the copies or the requester's name and email. Every open writes an audit row of kind data_access with reason services_case and the case
        id (S-Q8 A). A staff member whose email is the requester's is refused (20c:231). Only `id`, `status` and `after`, each once; `id` alone.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, administrator]
      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '31' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [received, documents_needed, waiting_for_employer, submitted, decision] } }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items:
                        type: array
                        maxItems: 20
                        items:
                          type: object
                          additionalProperties: false
                          required: [id, status, createdAt, permitType, payer, hrContactConsent, assignedStaffUserId, side]
                          properties:
                            id: { type: string }
                            status: { type: string }
                            createdAt: { type: string }
                            permitType: { type: [string, 'null'] }
                            payer: { type: [string, 'null'], enum: [employer, agency, null] }
                            hrContactConsent: { type: boolean }
                            assignedStaffUserId: { type: [string, 'null'] }
                            side: { type: [string, 'null'], enum: [candidate, portal, null] }
                      next: { type: [string, 'null'] }
                  - type: object
                    required: [item]
                    properties:
                      item:
                        type: object
                        required: [id, status, payer, hrContactConsent, decisionOutcome, documentsNeeded, assignedStaffUserId, side, requesterErased]
                        properties:
                          id: { type: string }
                          status: { type: string }
                          createdAt: { type: string }
                          permitType: { type: [string, 'null'] }
                          offerDetails: { type: [object, 'null'] }
                          payer: { type: [string, 'null'] }
                          organisationId: { type: [string, 'null'] }
                          jobId: { type: [string, 'null'] }
                          consentRecordId: { type: string }
                          hrContactConsent: { type: boolean }
                          decisionOutcome: { type: [string, 'null'], enum: [granted, refused, null] }
                          documentsNeeded: { type: array, items: { type: object, required: [code, label], properties: { code: { type: string }, label: { type: [string, 'null'] } } } }
                          decidedAt: { type: [string, 'null'] }
                          closedAt: { type: [string, 'null'] }
                          closeReason: { type: [string, 'null'] }
                          referralSolicitorId: { type: [string, 'null'] }
                          assignedStaffUserId: { type: [string, 'null'] }
                          side: { type: [string, 'null'] }
                          requesterErased: { type: boolean }
                          requesterName: { type: [string, 'null'], description: Handlers only. }
                          requesterEmail: { type: [string, 'null'], description: Handlers only. }
                          copies: { type: integer, description: Handlers only. }
                          notes:
                            description: Handlers only, at most 200.
                            type: array
                            items: { type: object, required: [id, authorStaffUserId, body, createdAt], properties: { id: { type: string }, authorStaffUserId: { type: string }, body: { type: string, maxLength: 2000 }, createdAt: { type: string } } }
              example:
                items: [{ id: '31', status: received, createdAt: '2026-11-20 09:00:00.123456+00', permitType: null, payer: employer, hrContactConsent: true, assignedStaffUserId: null, side: candidate }]
                next: null
        '400':
          description: "`bad_query`: an unknown or repeated key, or `id` with another key. `bad_status`: not an open status. `bad_cursor`: a token this list did not make."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_status } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_case_staff`: neither services_case_handler nor administrator. `own_case`: the requester's email is this staff member's."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_case_staff } } }
        '404':
          description: "`not_found`: no such case (also an id that is not an id)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnServicesCase
      summary: Assign, move, ask for documents, record the outcome, close, refer or note a services case
      description: >-
        One transaction each, with one case_event (none for a note) and one audit row of kind admin_action (codes and ids only, never a note's
        text). `assign`: a handler takes an unassigned case or passes on their own to another handler; an administrator may reassign any open
        case; the assignee must be an active handler who is not the requester. Every other action is for the assigned handler only (an
        administrator gets `not_case_handler`). `status`: received to documents_needed, waiting_for_employer or submitted; documents_needed and
        waiting_for_employer to each other or submitted; submitted to documents_needed (DETE may ask for more documents after submission) or decision. `documents`: codes from the fixed list (passport_copy,
        offer_letter, contract, degree, registration, payslip, cv, other, passport_photo, immigration_stamp, previous_permits, idaei_support_letter, revenue_statement, lmnt_advert_evidence, aws_permission_letter, hgv_licence), before the decision. `decision`: granted or refused, at decision only.
        `close`: decided (needs an outcome), employer_not_engaged or no_reply (not once an outcome is recorded). `refer`: closes as
        referred_to_solicitor, optionally naming an active firm from the solicitor list. `note`: 1 to 2000 characters, newlines and tabs only,
        never shown to the requester. Each event gives the requester an in-app notice; documents, the decision, close and refer also queue one
        short email with no details (0063). Origin checked. A staff member whose email is the requester's is refused.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, administrator]
      x-rate-limit: none
      x-body-cap: 3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, caseId]
              properties:
                action: { type: string, enum: [assign, status, documents, decision, close, refer, note] }
                caseId: { $ref: '#/components/schemas/Id' }
                staffUserId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: assign }
                status: { type: string, enum: [documents_needed, waiting_for_employer, submitted, decision], description: status }
                codes: { type: array, maxItems: 30, items: { type: string, maxLength: 40 }, description: documents }
                outcome: { type: string, enum: [granted, refused], description: decision }
                reason: { type: string, enum: [decided, employer_not_engaged, no_reply], description: close }
                solicitorId: { $ref: '#/components/schemas/Id' }
                body: { type: string, minLength: 1, maxLength: 2000, description: note }
            example: { action: status, caseId: '31', status: documents_needed }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, or over 3000 characters. `bad_action`: unknown action. `bad_case_id`,
            `bad_staff_id`, `bad_solicitor_id`: not an id. `bad_status`, `bad_outcome`, `bad_reason`: not a known value. `bad_codes`: not a list of
            distinct codes from the fixed list (at most 30). `bad_text`: an empty or over-long note, or control characters other than newline and tab.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_codes } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: >-
            `bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_case_staff`: neither
            services_case_handler nor administrator. `not_case_handler`: an administrator on a handler-only action. `not_assigned`: the case is
            another handler's. `own_case`: the requester's email is this staff member's.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_assigned } } }
        '404':
          description: "`not_found`: no such case."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: >-
            `case_closed`: the case is closed. `bad_move`: not an allowed status move (or documents after the decision). `bad_assignee`: not an
            active handler, or the requester. `not_at_decision`: an outcome before the decision. `not_decided`: decided with no outcome.
            `outcome_recorded`: another close reason after an outcome. `bad_solicitor`: no such active firm. `no_change`: already so.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_move } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/services/solicitors:
    get:
      operationId: listReferralSolicitors
      summary: The referral solicitor list
      description: Every firm on the list (S-Q10 B), active first, at most 200. No query keys.
      security: [{ staffSession: [] }]
      x-roles: [services_case_handler, administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [id, firm, contact, active, createdAt]
                      properties:
                        id: { type: string }
                        firm: { type: string, maxLength: 200 }
                        contact: { type: string, maxLength: 300 }
                        active: { type: boolean }
                        createdAt: { type: string }
              example: { items: [{ id: '3', firm: Fake Solicitors LLP, contact: fake.firm@example.test, active: true, createdAt: '2026-11-20 09:00:00.123456+00' }] }
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_case_staff`: neither services_case_handler nor administrator."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_case_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: changeReferralSolicitors
      summary: Add, edit or deactivate a referral firm
      description: >-
        Administrators only. `add` takes firm (1 to 200 characters) and contact (1 to 300), trimmed, no control characters. `edit` changes
        either or both. `deactivate` takes the firm off the list for new referrals; nothing is ever deleted. One audit row of kind admin_action
        each (the id, what changed and the active flag; no text). Origin checked.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [add, edit, deactivate] }
                solicitorId: { $ref: '#/components/schemas/Id' }
                firm: { type: string, minLength: 1, maxLength: 200 }
                contact: { type: string, minLength: 1, maxLength: 300 }
            example: { action: add, firm: Fake Solicitors LLP, contact: fake.firm@example.test }
      responses:
        '200':
          description: Done; `add` also gives the new id.
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean }, id: { type: string } } }
              example: { ok: true, id: '3' }
        '400':
          description: >-
            `bad_body`: not one JSON object, an unknown or missing field, or over 1000 characters. `bad_action`: unknown action.
            `bad_solicitor_id`: not an id. `bad_firm`, `bad_contact`: empty, too long, untrimmed or with control characters. `nothing_to_change`: an edit with no field.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_firm } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_case_staff`: no services role. `not_administrator`: a handler."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such firm."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`no_change`: already so."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: no_change } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/settings:
    get:
      operationId: listSettings
      summary: List the settings and the pending changes
      description: >-
        Every `setting` row (the retention periods and limits) with its value, and the value changes waiting for a second administrator
        (step 15 R2). No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings, pending]
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      required: [key, value, unit, is_guess, solicitor_confirmed_at, updated_by, updated_at]
                      properties:
                        key: { type: string }
                        value: { type: [integer, 'null'] }
                        unit: { type: [string, 'null'], enum: [days, months, count, null] }
                        is_guess: { type: boolean }

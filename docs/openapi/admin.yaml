              example:
                settings: [{ key: draft_job, value: 12, unit: months, is_guess: true, solicitor_confirmed_at: null, updated_by: null, updated_at: '2026-11-01 09:30:00.123456+00' }]
                pending: [{ requestId: '130', key: draft_job, value: 6, proposedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', createdAt: '2026-11-18 09:30:00.123456+00' }]
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnSetting
      summary: Propose, confirm or refuse a setting's new value
      description: >-
        `propose`: an administrator proposes a new value for a known key (a whole number from 0 to 100,000, or null for not set); one pending
        change per key. `confirm`: a different administrator confirms and the value is written at once (the database's setting guard uses the
        request and writes the audit row naming both). `refuse`: a different administrator refuses, or the proposer withdraws. The unit never
        changes here. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, key, value]
                  properties:
                    action: { const: propose }
                    key: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                    value: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm, refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: propose, key: draft_job, value: 6 }
      responses:
        '200':
          description: "`propose`: the request id. `confirm`: the key and value written. `refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  key: { type: string }
                  value: { type: [integer, 'null'] }
              example: { ok: true, requestId: '130' }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over 300 characters. `bad_action`: unknown action. `bad_key`: not a key's shape. `bad_value`: missing, not a whole number from 0 to 100,000 and not null. `bad_request_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_value } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no such setting, or no such setting request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`no_change`: the value is already that. `decision_pending`: a change of that key waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: same_person } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/companies/seed:
    get:
      operationId: listCompanySeed
      summary: Show the pending company seed import
      description: >-
        The company seed (brand list) import waiting for an administrator, at most one, with its parsed rows (step 15 Q14). No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor, administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The pending import, if any.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      required: [requestId, proposedBy, createdAt, rows]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
                        rows:
                          type: array
                          items:
                            type: object
                            required: [line, displayName, kind, brandNames, deteNames]
                            properties:
                              line: { type: integer }
                              displayName: { type: string }
                              kind: { type: string, enum: [employer, public_body, agency] }
                              brandNames: { type: array, items: { type: string } }
                              deteNames: { type: array, items: { type: string } }
              example:
                pending: [{ requestId: '140', proposedBy: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', createdAt: '2026-11-18 09:30:00.123456+00', rows: [{ line: 2, displayName: Example Co, kind: employer, brandNames: [Example], deteNames: [Example Co Limited] }] }]
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_seed_staff`: neither role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_seed_staff } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnCompanySeed
      summary: Propose, confirm or refuse a company seed import
      description: >-
        `propose` (rules_data_editor): `text` is a file in the company seed command's format (tab separated: display_name, kind, brand_names,
        dete_names; names split by " ;; "), at most 1,000,000 characters; a file with any bad line is refused whole. One pending import at a
        time. `confirm` (an administrator who did not propose): the seed runs in the same transaction and its counts are returned; a row whose
        names reach two companies or another row's company is refused alone and listed. `refuse`: an administrator refuses, or the proposer
        withdraws. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [rules_data_editor, administrator]
      x-rate-limit: none
      x-body-cap: 1100000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, text]
                  properties:
                    action: { const: propose }
                    text: { type: string, maxLength: 1000000 }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [confirm, refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: propose, text: "display_name\tkind\tbrand_names\tdete_names\nExample Co\temployer\tExample\tExample Co Limited\n" }
      responses:
        '200':
          description: "`propose`: the request id and the number of rows. `confirm`: the seed's counts and lists. `refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  requestId: { $ref: '#/components/schemas/Id' }
                  rows: { type: integer }
                  created: { type: integer }
                  found: { type: integer }
                  namesAdded: { type: integer }
                  deteRowsLinked: { type: integer }
                  labelsChanged: { type: integer }
                  refused: { type: array, items: { type: string } }
                  deteNotFound: { type: array, items: { type: string } }
                  notes: { type: array, items: { type: string } }
              example: { ok: true, created: 1, found: 0, namesAdded: 2, deteRowsLinked: 1, labelsChanged: 1, refused: [], deteNotFound: [], notes: [] }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over the cap. `bad_action`: unknown action. `bad_text`: not a string, empty or over 1,000,000 characters. `bad_data`: a bad file; `stage` gives the first errors. `bad_request_id`: not an id."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_data, stage: 'line 2: at least one brand name is needed' } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_rules_data_editor`: propose without that role. `not_administrator`: confirm without that role. `not_seed_staff`: refuse with neither role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_rules_data_editor } } }
        '404':
          description: "`not_found`: no such import request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`decision_pending`: an import waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: decision_pending } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/data-requests:
    get:
      operationId: listDataRequests
      summary: List the open data requests and the erasures waiting for a second administrator
      description: >-
        The open and claimed `data_request` items (step 15 Q2), oldest first, at most 100 (`truncated` says more wait), each with the
        requester's email from its contact message, whether that message came from a signed-in login, and the state of the owner's
        confirmation (decision #271: the purpose sent, when, and when the owner confirmed); and the pending `data_request_erase` requests with
        the account each names. No query key is allowed.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      responses:
        '200':
          description: The open items and the pending erasures.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, truncated, pending]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [itemId, status, createdAt, surface, email, signedIn, confirmPurpose, confirmSentAt, confirmedAt]
                      properties:
                        itemId: { $ref: '#/components/schemas/Id' }
                        status: { type: string, enum: [open, claimed] }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
                        surface: { type: string, enum: [candidate_site, portal] }
                        email: { type: [string, 'null'] }
                        signedIn: { type: boolean }
                        confirmPurpose: { type: [string, 'null'], enum: [export, erase, null] }
                        confirmSentAt: { type: [string, 'null'] }
                        confirmedAt: { type: [string, 'null'] }
                  truncated: { type: boolean }
                  pending:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [requestId, itemId, kind, userId, proposedBy, createdAt]
                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        itemId: { $ref: '#/components/schemas/Id' }
                        kind: { type: string, enum: [candidate, portal] }
                        userId: { $ref: '#/components/schemas/LoginId' }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }
                        createdAt: { $ref: '#/components/schemas/DbTime' }
              example:
                items: [{ itemId: '52', status: open, createdAt: '2026-11-19 09:30:00.123456+00', surface: candidate_site, email: person@example.com, signedIn: false, confirmPurpose: erase, confirmSentAt: '2026-11-19T09:35:00.123456+00:00', confirmedAt: null }]
                truncated: false
                pending: [{ requestId: '160', itemId: '52', kind: candidate, userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', proposedBy: 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6', createdAt: '2026-11-19 09:40:00.123456+00' }]
        '400':
          description: "`bad_query`: any query key."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_query } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: actOnDataRequest
      summary: Ask the account owner to confirm, erase the account a data request names, or close the request
      description: >-
        The account is the one candidate or portal login whose email is the requester's email on the item's contact message (compared in
        lower case). Refused when none matches (`no_account`), when a candidate and a portal login share the address (`several_accounts`), or
        when a signed-in sender typed another login's address (`sender_not_account`). Staff never receive anyone's data (decision #271).
        `send_confirm` (`purpose` export or erase): queues one email, placeholder wording, to that login's own confirmed address (never the
        address typed on the form) with a one-time link to its own site (`GET` and `POST /api/data-request` on the candidate or employer site),
        made when the outbox sends it and valid for 7 days; only its hash is kept. A new send ends an older link and an older confirmation.
        Refused `email_not_confirmed` and `account_deleted`. For an export the owner downloads it from the link. `close`: ends an open item
        (its link stops working), with an audit row. `erase_propose`: refused `not_confirmed` unless the request is proved (sent by that login
        while signed in, or its owner confirmed an erase from the link); one pending erase per item. `erase_confirm`: a different administrator
        confirms and the erase runs at once, as the retention erase does: refused, and the request left pending, while the person has an open
        services case or is the target of an open report (or, for a portal login, is an account owner with other active members, or the only
        active owner of an open company), when the item is no longer open (`not_open`), or when the match or the proof has changed. The stored
        files are removed, every visitor message from the requester's address (the request's own among them) is emptied and the open items
        pointing to them close, the item closes and one audit row names both administrators. `erase_refuse`: a different administrator refuses,
        or the proposer withdraws. The Origin header must be the admin app's origin.
      security: [{ staffSession: [] }]
      x-roles: [administrator]
      x-rate-limit: none
      x-body-cap: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, itemId, purpose]
                  properties:
                    action: { const: send_confirm }
                    itemId: { $ref: '#/components/schemas/Id' }
                    purpose: { type: string, enum: [export, erase] }
                - type: object
                  additionalProperties: false
                  required: [action, itemId]
                  properties:
                    action: { type: string, enum: [close, erase_propose] }
                    itemId: { $ref: '#/components/schemas/Id' }
                - type: object
                  additionalProperties: false
                  required: [action, requestId]
                  properties:
                    action: { type: string, enum: [erase_confirm, erase_refuse] }
                    requestId: { $ref: '#/components/schemas/Id' }
            example: { action: send_confirm, itemId: '52', purpose: erase }
      responses:
        '200':
          description: "`send_confirm`: the account and the purpose. `erase_propose`: the account and the request id. `erase_confirm`: the account and the stored files removed. `close` and `erase_refuse`: `{ ok: true }`."
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [ok, kind, userId, purpose]
                    properties:
                      ok: { const: true }
                      kind: { type: string, enum: [candidate, portal] }
                      userId: { $ref: '#/components/schemas/LoginId' }
                      purpose: { type: string, enum: [export, erase] }
                  - type: object
                    additionalProperties: false
                    required: [ok, kind, userId, requestId]
                    properties:
                      ok: { const: true }
                      kind: { type: string, enum: [candidate, portal] }
                      userId: { $ref: '#/components/schemas/LoginId' }
                      requestId: { $ref: '#/components/schemas/Id' }
                  - type: object
                    additionalProperties: false
                    required: [ok, kind, userId, filesRemoved]
                    properties:
                      ok: { const: true }
                      kind: { type: string, enum: [candidate, portal] }
                      userId: { $ref: '#/components/schemas/LoginId' }
                      filesRemoved: { type: integer }
                  - type: object
                    additionalProperties: false
                    required: [ok]
                    properties:
                      ok: { const: true }
              example: { ok: true, kind: candidate, userId: 'q8Hn2LxV0aB7cD9eF1gH3iJ5kL7mN9oP', purpose: erase }
        '400':
          description: "`bad_body`: not one JSON object, an unknown or missing field, or over the cap. `bad_action`: unknown action. `bad_item_id`, `bad_request_id`: not an id. `bad_purpose`: not export or erase."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: bad_item_id } } }
        '401': { $ref: '#/components/responses/NoStaffSession' }
        '403':
          description: "`bad_origin`: Origin missing or not the admin app's. `not_active_staff`: the login is not active. `not_administrator`: no administrator role."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_administrator } } }
        '404':
          description: "`not_found`: no open data request item with this id, or no such erase request."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_found } } }
        '409':
          description: "`no_account`, `several_accounts`, `sender_not_account`: see above. `email_not_confirmed`, `account_deleted`: no confirm email can go. `not_confirmed`: the owner has not confirmed an erase. `open_services_case`, `open_report`, `owner_with_members`, `not_open`, `account_changed`: the erase is refused for now. `close_company_first`: the login is the only active owner of an open company; close the company first, or a member joins and takes the owner role (`/api/companies/owner-reassign`). `decision_pending`: an erase of this item waits already. `request_not_pending`: the request is not pending. `same_person`: the proposer confirming."
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' }, example: { error: not_confirmed } } }
        '500': { $ref: '#/components/responses/ServerError' }

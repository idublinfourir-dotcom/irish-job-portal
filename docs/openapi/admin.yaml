      x-rate-limit: none
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, example: '3301' }
        - { name: after, in: query, required: false, schema: { $ref: '#/components/schemas/Cursor' } }
      responses:
        '200':
          description: The page (no `id`), or `{ item }` with `advertText` (with `id`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [items, next]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/FetchedQueueItem' } }
                      next: { type: [string, 'null'] }

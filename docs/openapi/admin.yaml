                      properties:
                        requestId: { $ref: '#/components/schemas/Id' }
                        purpose: { type: string, enum: [signup_terms, portal_signup_terms, privacy_notice, cookie_policy, employer_acceptable_use, data_retention] }
                        version: { type: string }
                        body: { type: string }
                        proposedBy: { $ref: '#/components/schemas/LoginId' }

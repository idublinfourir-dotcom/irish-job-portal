nts and execute strategies to completion&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Capture operational requirements and work with key stakeholders to assess the impact on the business.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Management of client-facing projects technical readiness tasks such as reporting requirements or NSCC set up&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Lead in client project calls and governance for technical readiness and transition planning for technical set ups such as NSCC.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Management of Challenges and /Escalations as appropriate&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Management of Workstream Meetings&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Liaises extensively with clients to establish exact requirements, agree solutions for global operation model&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Proactive identification and management of project risks, ensuring that the appropriate measures are taken to ensure that all stakeholders have an appropriate appreciation of the key risks and that the required steps to mitigate these risks are completed.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Thorough documentation throughout the project life cycle including of all required signoffs&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Develop detailed execution plans; questionnaires; set up forms and documentation to successfully support the implementation of new clients and products.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Support and interact with other business units involved in the project and coordinates the project team and activities.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Works within the Transfer Agency Project Office structure and ensures that all standard templates are used and required resources are procured.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Ability to develop detailed project plans encompassing, Technical Readiness requirements across all departments within TA.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Manage expectations of key stakeholders and ensure transparency in all communication.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Provide frequent progress/ status reporting.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Attend Business Requirement walkthroughs; provide operational insight and assess impact on the business through active engagement of key stakeholders.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Cultivate open communication with clients and business partners in an effort to identify opportunities to improve processes and methodologies&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Keep abreast of industry trends and best practices, market data and new product rollouts.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Drive the development and implementation of appropriate procedures to meet internal control and external compliance/regulatory requirements&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Quality Focused&lt;/b&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;All employees are accountable for the delivery of a Quality service, driving for excellence in all their work activities;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;To be quality driven, aiming for 100% accuracy and timeliness of delivery;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;To effectively plan the way services are delivered so that all activity is directly related to providing quality services and meeting the expectations of the client (internal and external);&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;To continuously review processes and practices relating to the role and act as a catalyst for change and improvement in individual and team performance;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;To observe proper standards of market, business and personal conduct, demonstrating integrity in the execution of duties;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;To communicate and promote the values which reinforce and support a consistent quality culture.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;To adhere to company values of p skills including initiative, accountability, credibility, and consensus building.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Ability to manage direct and indirect reports in a virtual team setting&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Well-developed decision making, judgment and problem-solving skills.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Ability to engage internal stakeholders across a number of different functional areas.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Client Service orientation, with a proven ability to work with clients and internal groups to diagnose and develop solutions.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Enthusiastic and proactive approach with meticulous attention to detail&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Positive  impact - performs in a manner that makes a strong positive impression on others; e.g., high energy level, a problem-solving approach, approachable; and the ability to act with a sense of urgency when required.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Undergraduate degree.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Business Analysis qualification or relevant experience&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Experience with analysis and project life cycle methodologies as well as an understanding of the implementation project life cycle is preferred.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Knowledge of compliance, anti-money laundering and regulatory environment.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Proactive in acquiring information to develop new skills to improve job performance; grasps new material quickly and easily, and applies new information, concepts and procedures in a constructive manner.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Detail oriented with a demonstrated ability to enhance process improvement capabilities.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Understanding of investment concepts and the ability to communicate a working knowledge of investment strategies and products&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Knowledg

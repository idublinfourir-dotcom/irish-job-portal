<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-11-12","description":"<p><b>Discover your future at Citi</b></p><p>Working at Citi is far more than just a job. A career with us means joining a team of more than 230,000 dedicated people from around the globe. At Citi, you’ll have the opportunity to grow your career, give back to your community and make a real impact.</p><br /><p><b>Job Overview</b></p><p>Engineer the future of global finance. At Citi, our Tech team doesn’t just support finance - we are helping to redefine it. Every day, $5 trillion crosses through our network. We do business in 180&#43; countries operating at a scale few can match. From deploying advanced AI to helping shape global markets, we build systems that matter. Look to join a team where your work helps influence economies, your ideas can drive innovation and outcomes, and your growth is backed by mentorship, continuous learning and flexibility with potential hybrid work opportunities. Help solve real-world challenges that touch millions and get the opportunity to build the future of finance with Citi Tech.</p><br /><p><span style='color:#000000'>As a Snowflake Data Engineer at Citi, you will build and maintain the data pipelines that power critical decisions across one of the world&#39;s leading financial institutions. You will use Snowflake, SQL, and Python to turn raw, large-scale data into reliable, analysis-ready assets that teams across the business depend on. This role puts you at the center of Citi&#39;s data infrastructure, working hands-on with modern cloud data tools every day.</span><br /><br /><b><u>Responsibilities:</u></b></p><ul><li>Utilise knowledge of applications development procedures and concepts, and basic knowledge of other technical areas to identify and define necessary system enhancements, including using script tools and analyzing/interpreting code</li><li>Consult with users, clients, and other technology groups on issues, and recommend programming solutions, install, and support customer exposure systems</li><li>Apply fundamental knowledge of programming languages for design specifications.</li><li>Analyze applications to identify vulnerabilities and security issues, as well as conduct testing and debugging</li><li>Serve as advisor or coach to new or lower-level analysts</li><li>Identify problems, analyze information, and make evaluative judgements to recommend and implement solutions</li><li>Resolve issues by identifying and selecting solutions through the applications of acquired technical experience and guided by precedents</li><li>Has the ability to operate with a limited level of direct supervision. </li><li>Can exercise independence of judgement and autonomy. </li><li>Acts as SME to senior stakeholders and /or other team members.</li><li>Appropriately assess risk when business decisions are made, demonstrating particular consideration for the firm&#39;s reputation and safeguarding Citigroup, its clients and assets, by driving compliance with applicable laws, rules and regulations, adhering to Policy, applying sound ethical judgment regarding personal behavior, conduct and business practices, and escalating, managing and reporting control issues with transparency.</li><li>Independently exercise judgement and decision-making in managing day-to-day responsibilities, including evaluating complex situations, resolving issues, and determining appropriate courses of action. Drive and influence delivery of work within area of responsibility, contributing to operational priorities and ensuring progress against timelines.  Will be accountable for delivery outcomes, including quality and timelines, and may have a measurable impact on business results within scope. In addition, will provide oversight on execution by reviewing outputs, guiding approach where required, and addressing gaps to ensure delivery meets expected standards. Take ownership of decisions and deliverables within remit, applying analytical thinking and professional expertise to solve problems and ensure effective outcomes. </li><li>Support execution of business decisions within the function by translating direction into actionable steps and ensuring effective follow‑through. Address non‑routine situations and practical challenges by applying judgement to identify solutions or take decisions within scope.  Will support effective functioning of the business area by ensuring processes are implemented consistently and outputs meet expected standards. Operate across varied and evolving situations, exercising discretion to respond to changing requirements and priorities, while ensuring reliability, timeliness, and quality in execution within defined scope. </li><li>Applies domain expertise and advanced analytical capability to deliver outputs aligned with established standards and professional benchmarks. Evaluate business requirements by analyzing complex issues, forming well‑reasoned views, and recommending practical, implementable solutions. Apply structured thinking, analytical rigor, and creativity in approaching work, particularly in situations where standard methodologies may require refinement. Exercise sound professional judgement in interpreting requirements and determining appropriate courses of action, taking into account the broader business context and potential implications.</li></ul><br /><h2 style='color:!important'><span style='color:#000000'>Specific Responsibilities</span></h2><ul><li><span style='color:#000000'>Design and build scalable data pipelines in Snowflake to support reliable, high-performance data delivery across the organization.</span></li><li><span style='color:#000000'>Write and optimize complex SQL queries and stored procedures to transform and prepare large datasets for business use.</span></li><li><span style='color:#000000'>Develop and schedule Snowflake tasks and streams to automate data processing workflows and keep information continuously up to date.</span></li><li><span style='color:#000000'>Configure Snowflake data sharing to enable secure, efficient data exchange between internal teams and external partners.</span></li><li><span style='color:#000000'>Use Snowpark and Python to build advanced data transformations and support scalable analytics solutions.</span></li><li><span style='color:#000000'>Analyze large and complex datasets to identify patterns, resolve data quality issues, and support informed decision-making.</span></li><li><span style='color:#000000'>Manage source code and collaborate with team members using GitHub to maintain version control and code quality.</span></li><li><span style='color:#000000'>Apply DevOps practices across the development lifecycle to streamline deployment and improve the reliability of data solutions.</span></li></ul><p style='color:!important'><span style='color:#000000'> </span></p><h2 style='color:!important'><span style='color:#000000'>Required Qualifications &amp; Skills</span></h2><ul><li><span style='color:#000000'>Hands-on experience writing and optimizing SQL queries and stored procedures in Snowflake.</span></li><li><span style='color:#000000'>Experience building and managing Snowflake tasks and streams to automate data workflows.</span></li><li><span style='color:#000000'>Practical knowledge of Snowflake data sharing for secure data distribution across teams and partners.</span></li><li><span style='color:#000000'>Experience using Snowpark and Python for data transformation and pipeline development.</span></li><li><span style='color:#000000'>Proven ability to analyze and work with large, complex datasets.</span></li><li><span style='color:#000000'>Experience using GitHub for version control and collaborative development.</span></li><li><span style='color:#000000'>Familiarity with DevOps practices and the software development lifecycle.</span></li></ul><p><br /><b>Education:</b></p><ul><li>Bachelor’s degree/University degree or equivalent experience</li></ul><br /><p>This job description provides a high-level review of the types of work performed. Other job-related duties may be assigned as required.</p><br /><h2 style='color:!important'><span style='color:#000000'>What We Offer</span></h2><p style='color:!important'><span style='color:#000000'> </span></p><p style='color:!important'><span style='color:#000000'>Work with modern cloud data technologies as part of a collaborative, global data engineering team, with real opportunities to grow your technical expertise.</span></p><p style='color:!important'><span style='color:#000000'> </span></p><ul><li style='color:!important'><span style='color:#000000'>Work in a hybrid model with three days in the office and two days working remotely each week.</span></li><li style='color:!important'><span style='color:#000000'>Build deep technical expertise in Snowflake, Python, and modern data engineering tools through hands-on project work.</span></li><li style='color:!important'><span style='color:#000000'>Collaborate with data and technology teams across Citi&#39;s global network.</span></li><li style='color:!important'><span style='color:#000000'>Access ongoing learning and development programs to support your long-term career growth.</span></li><li style='color:!important'><span style='color:#000000'>Benefit from resources that support your financial wellbeing and work-life balance.</span></li></ul><p style='color:!important'><span style='color:#000000'> </span></p><p style='color:!important'><span style='color:#000000'>Join Citi to build the data infrastructure that powers decisions across a global financial institution.</span></p><br /><p><span style='color:#000000'>#LI-MR7</span></p><p style='text-align:inherit'><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span clas

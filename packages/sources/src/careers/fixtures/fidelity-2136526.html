ageous\u003C/li\u003E\u003C/ul\u003E\u003Cp\u003E\u00B7 Oracle APEX knowledge would be advantageous\u003C/p\u003E\u003Cul\u003E\u003Cli\u003EExperience with a source control system\u003C/li\u003E\u003Cli\u003EAbility to work with project teams located in multiple geographic locations\u003C/li\u003E\u003Cli\u003EFinancials and Investment domains exposure will be a plus.\u003C/li\u003E\u003C/ul\u003E\u003Cp\u003EThe \u003Cstrong\u003EValue\u003C/strong\u003E You Deliver\u003C/p\u003E\u003Cul\u003E\u003Cli\u003EContribute to the delivering of high quality, timely, cost effective and maintainable software solutions in an agile environment to meet functional and non-functional business requirements.\u003C/li\u003E\u003Cli\u003EComplying with and helping to adopt good engineering practices such as test-driven development, code and design reviews, Oracle Xplans, CI/CD\u003C/li\u003E\u003Cli\u003EWork as part of a team in delivering complex technical features\u003C/li\u003E\u003Cli\u003ECommunicate effectively in a team-oriented environment\u003C/li\u003E\u003Cli\u003EYou demonstrate a positive, collaborative attitude while delivering individually\u003C/li\u003E\u003C/ul\u003E\u003Cp\u003EHow Your Work \u003Cstrong\u003EImpacts\u003C/strong\u003E the Organization\u003C/p\u003E\u003Cp\u003EThe position aligns to the Asset Management Technology organization which provides worldwide technology and support to the Investment Management, Research, Trading and Investment Operations functions. This Data Engineer role involves developing consistent, reliable, maintainable, performance focused code for Equity Data platforms leveraged by the applications supporting Fidelity\u2019s Asset Management business.\u003C/p\u003E\u003Cp\u003EThe team environment consists of a global Asset Management data engineering team of approx. 300 associates including Data Engineers, Data Modelers, DBAs plus working with Data Architecture partners.\u003C/p\u003E\u003Cp\u003ECompany Overview\u003C/p\u003E\

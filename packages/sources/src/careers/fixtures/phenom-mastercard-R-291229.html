<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Mastercard","value":"R-291229"},"hiringOrganization":{"@type":"Organization","name":"Mastercard","sameAs":"https://careers.mastercard.com/us/en","url":"https://careers.mastercard.com/us/en/job/R-291229/Senior-Enterprise-Operations-Engineer","logo":"https://assets.phenompeople.com/CareerConnectResources/MASRUS/images/job_logo_config-1660728447482.jpg"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"53.33306","longitude":"-6.24889"},"address":{"@type":"PostalAddress","postalCode":"","addressCountry":"Ireland","addressLocality":"Dublin 18","addressRegion":"Dublin"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;&lt;span&gt;&lt;b&gt;Our Purpose&lt;/b&gt;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;i&gt;Mastercard powers economies and empowers people in 200&#43; countries and territories worldwide. Together with our customers, we’re helping build a sustainable economy where everyone can prosper. We support a wide range of digital payments choices, making transactions secure, simple, smart and accessible. Our technology and innovation, partnerships and networks combine to deliver a unique set of products and services that help people, businesses and governments realize their greatest potential.&lt;/i&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Title and Summary&lt;/b&gt;&lt;/p&gt;&lt;h3&gt;&lt;/h3&gt;&lt;p&gt;&lt;/p&gt;Senior Enterprise Operations Engineer&lt;h3&gt;&lt;/h3&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;Who is Mastercard?&lt;br&gt;Mastercard is a global technology company in the payments industry. Our mission is to connect and power an inclusive, digital economy that benefits everyone, everywhere by making transactions safe, simple, smart, and accessible. Using secure data and networks, partnerships and passion, our innovations and solutions help individuals, financial institutions, governments, and businesses realize their greatest potential.&lt;br&gt;Our decency quotient, or DQ, drives our culture and everything we do inside and outside of our company. With connections across more than 210 countries and territories, we are building a sustainable world that unlocks priceless possibilities for all.&lt;br&gt;&lt;br&gt;Overview&lt;br&gt;The Network Operations team is seeking a Senior Network Engineer to oversee Incident, Problem, and Change Management for Mastercard’s Network programs. This role helps ensure our products and services meet customer expectations for performance and availability. The ideal candidate has strong knowledge of current network technologies, experience in Network Operations and/or Engineering, and a solid understanding of Information Technology Infrastructure Library (ITIL) and Information Technology Service Management (ITSM) methodologies.&lt;br&gt;&lt;br&gt;Role&lt;br&gt;•\tProvide oversight and subject matter expertise for Network Operations and Engineering’s ITSM processes for Problem and Change Management.&lt;br&gt;•\tProvide reporting to leadership on key performance indicators on adherence to Mastercard’s ITSM requirements. &lt;br&gt;•\tIdentify gaps and opportunities to mature existing ITSM processes and partner with the ONE Service Management team to implement improvements.&lt;br&gt;•\tCollaborate with subject matter experts to conduct root cause analysis (RCA) and track remediation efforts. &lt;br&gt;•\tPrepare presentations for post-mortem reviews of major incidents with executive leadership.&lt;br&gt;•\tAccountable for Change Management policy adherence to ensure network changes are strategically planned and executed with the least risk of service disruption to our customers.&lt;br&gt;•\tAccountable for evaluating changes for accurate and appropriate documentation and information is present prior to change approval.&lt;br&gt;•\tAudit Incident and Problem tickets to ensure that documentation is sufficient and Post-Incident Review and RCA activities are completed.&lt;br&gt;•\tPerform Problem Management to track and manage monitoring defects or process gaps to prevent the reoccurrence of Network outages.&lt;br&gt;•\tPerform network analysis to ensure network integrity and performance is at an optimal state.&lt;br&gt;•\tProvide coaching and guidance to team members about Mastercard’s ITSM processes and requirements.&lt;br&gt;&lt;br&gt;All About You&lt;br&gt;•\tDo you like to come up with solutions to tough problems?&lt;br&gt;•\tDo you have strong analytical skills?&lt;br&gt;•\tAdvanced understanding of ITIL and ITSM principles for Change, Incident, and Problem Management.&lt;br&gt;•\tIntermediate knowledge of network routing and switching is required.&lt;br&gt;•\tExperience with Remedy is highly desired.&lt;br&gt;•\tExperiencing creating reports is required.&lt;br&gt;•\tStrong written and verbal communication skills required.&lt;br&gt;•\tBachelors Degree with a major relevant to Information Technology or equivalent Network Architecture/Engineering experience required.&lt;br&gt;&lt;br&gt;Responsibility&lt;br&gt;Every person working for, or on behalf of, Mastercard is responsible for information security. All activities involving access to Mastercard assets, information, and networks comes with an inherent risk to the organization and therefore, it is expected that the successful candidate for this position must:&lt;br&gt;&lt;br&gt;•\tAbide by Mastercard’s security policies and practices;&lt;br&gt;•\tEnsure the confidentiality and integrity of the information being accessed;&lt;br&gt;•\tReport any suspected information security violation or breach, and &lt;br&gt;•\tComplete all periodic mandatory security trainings in accordance with Mastercard’s guidelines.&lt;h3&gt;&lt;/h3&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;h3&gt;&lt;/h3&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Corporate Security Responsibility&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;br /&gt;All activities involving access to Mastercard assets, information, and networks comes with an inherent risk to the organization and, therefore, it is expected that every person working for, or on behalf of, Mastercard is responsible for information security and must:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p style=\"text-align:left\"&gt;Abide by Mastercard’s security policies and practices;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p style=\"text-align:left\"&gt;Ensure the confidentiality and integrity of the information being accessed;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p style=\"text-align:left\"&gt;Report any suspected information security violation or breach, and&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p style=\"text-align:left\"&gt;Complete all periodic mandatory security trainings in accordance with Mastercard’s guidelines.&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;","title":"Senior Enterprise Operations Engineer","datePosted":"2026-11-17","@context":"http://schema.org","occupationalCategory":"Engineering","directApply":false}</script>

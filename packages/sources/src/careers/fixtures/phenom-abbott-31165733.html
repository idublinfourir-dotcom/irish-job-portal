<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Abbott Laboratories","value":"31165733"},"hiringOrganization":{"@type":"Organization","name":"Abbott Laboratories","sameAs":"https://www.jobs.abbott/us/en","url":"https://www.jobs.abbott/us/en/job/31165733/Warehouse-Operator","logo":"https://assets.phenompeople.com/CareerConnectResources/pp/ABLAUS/images/job_logo_config-1600583224835.png"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"52.65417","longitude":"-7.25222"},"address":{"@type":"PostalAddress","addressCountry":"Ireland","addressLocality":"Kilkenny","addressRegion":"State Not Indicated"},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;Job Description&lt;/p&gt;&lt;p&gt;&lt;b&gt;About Abbott&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Abbott is a global healthcare leader that helps people live more fully at all stages of life. Our portfolio of life-changing technologies spans the spectrum of healthcare, with leading businesses and products in diagnostics, medical devices, nutritionals and branded generic medicines. Our 114,000 colleagues serve people in more than 160 countries.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Abbott in Ireland&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Abbott has been operating in Ireland since 1946 and serves the Irish market with a diverse range of healthcare products including diagnostics, diabetes care, medical devices and nutritional products. In Ireland, Abbott currently employs about 6,000 people across ten sites located in Dublin, Donegal, Clonmel, Cootehill, Galway, Kilkenny, Longford and Sligo.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Please note any offer of employment for this position is conditional upon the successful completion of a pre-employment medical examination, including drug and alcohol screening, conducted by a medical&lt;/p&gt;&lt;p&gt;practitioner designated by the Company&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Abbott Diabetes Care Kilkenny&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Abbott Diabetes Care has opened  a new site, in Kilkenny, that is  at the forefront of Diabetes care with the latest technology, to manufacture FreeStyle blood glucose test strips and FreeStyle Sensors for use in diabetes management. Among Abbott Diabetes Care leading brands are the FreeStyle Precision, FreeStyle Lite and FreeStyle Libre systems.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;This is how you can make a difference at Abbott:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;As a Warehouse Operator, in Abbott, Kilkenny you will be responsible for ensuring a high-quality Storage and Warehousing service is provided to the Manufacturing and Supply Chain Departments, including but not limited to the receipt, storage and shipment of materials and products, whilst adhering to and maintaining Abbott Quality policies and procedures and to the required service level.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;Your main responsibilities will be:&lt;/b&gt;&lt;/p&gt;&lt;p&gt;• To Perform activities related to the receipt, storage, inventory control and shipment of materials.&lt;/p&gt;&lt;p&gt;• Compliance with EHS systems, programs and procedures, being accountable for the health and safety of themselves and others by highlighting where improvements can be made.&lt;/p&gt;&lt;p&gt;• Routine material handling tasks related to the receipt, movement and shipment of materials and Finished goods.&lt;/p&gt;&lt;p&gt;• Receiving deliveries to site and recording the data on the Warehouse Management System (WMS).&lt;/p&gt;&lt;p&gt;•Pick and stage materials based on production work orders and kanban process.&lt;/p&gt;&lt;p&gt;• Pick, prepare and dispatch materials for sub-contract or third-party manufacture processing, arranging transport as necessary.&lt;/p&gt;&lt;p&gt;• To pick, prepare and dispatch Finished Goods for distribution.&lt;/p&gt;&lt;p&gt;• Process transactions related to the receipt, issue, shipment, or transfer of materials in ERP system.&lt;/p&gt;&lt;p&gt;• Perform regular inventory counts as per the requirements of the site PIC requirements (Physical Inventory Control Procedures), and Cycle Count procedures.&lt;/p&gt;&lt;p&gt;• Work with Operations Planning Team members to resolve any issues related to the receipt and approval of materials.&lt;/p&gt;&lt;p&gt;• Ensure that equipment is kept in a good, safe condition in terms of mechanical functionality and       cleanliness. Continually maintain a high level of housekeeping. Keep all areas clean, safe and tidy, reporting any cleaning and safety issues to the Warehouse Lead.&lt;/p&gt;&lt;p&gt;• Support the development of a safe working environment and proactively identify any safety issues and report to the Warehouse Lead.&lt;/p&gt;&lt;p&gt;•Operate warehouse machinery and equipment in accordance to manufactures recommendations and training protocols.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;QUALIFICATIONS AND EXPERIENCE&lt;/b&gt;&lt;/p&gt;&lt;p&gt;• Strong Communication skills.&lt;/p&gt;&lt;p&gt;• Must be comfortable and confident working at heights. (VNA Operation)&lt;/p&gt;&lt;p&gt;• Previous forklift experience desirable but not essential as training will be provided.&lt;/p&gt;&lt;p&gt;• Strong attention to detail.&lt;/p&gt;&lt;p&gt;• Previous experience in Stores / Warehouse environment desirable.&lt;/p&gt;&lt;p&gt;• Comfortable working with computers.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;&lt;b&gt;What we Offer:&lt;/b&gt; Attractive compensation package that includes competitive pay, as well as benefits such as&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Health insurance,&lt;/li&gt;&lt;li&gt;Excellent pension scheme&lt;/li&gt;&lt;li&gt;Life assurance&lt;/li&gt;&lt;li&gt;Career Development&lt;/li&gt;&lt;li&gt;Fantastic new facility&lt;/li&gt;&lt;li&gt;Growing business plus access to many more benefits.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Connect with us at www.abbott.com or https://www.ie.abbott/, on LinkedIn at www.linkedin.com/company/abbott-/, on Facebook at www.facebook.com/Abbott and on Twitter &#64;AbbottNews.&lt;/p&gt;&lt;br /&gt;&lt;p&gt;Abbott is an equal opportunities employer.&lt;/p&gt;&lt;br /&gt;","industry":"Healthcare","title":"Warehouse Operator","datePosted":"2026-11-18","@context":"http://schema.org","occupationalCategory":"Operations","directApply":false}</script>

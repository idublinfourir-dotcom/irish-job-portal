<script id="js-job-posting" type="application/ld&#x2B;json">{"@context":"https://schema.org","@type":"JobPosting","title":"Cost Basis Support Representative II","description":"\u003Ch3\u003E\u003C/h3\u003E\u003Ch3\u003EJob Description:\u003C/h3\u003E\u003Cp\u003ECompany \u003Cstrong\u003EOverview\u003C/strong\u003E \u003C/p\u003E\u003Cbr\u003E\u003Cp\u003EAt Fidelity, we help 23 million people invest their life savings, 20,000 businesses manage their employee benefits programs, 10,000 advisors and institutions requiring innovative technology solutions to invest their clients\u2019 money. To do this well, we place a high degree of value in nurturing a work environment that attracts the best talent and reflects our dedication to being an employer of choice. \u003C/p\u003E\u003Cp\u003EFidelity established its Ireland presence in 1996 and we currently employ over 1000 staff across IT and Operations \u0026amp; Corporate Shared Services with offices in Dublin (Citywest) and Galway (Parkmore East). \u003C/p\u003E\u003Cp\u003EWe are a privately-owned company, committed to innovation and providing the best customer experience in financial services.\u003C/p\u003E\u003Cbr\u003E\u003Cp\u003EThe \u003Cstrong\u003EExpertise\u003C/strong\u003E We\u2019re Looking For \u003C/p\u003E\u003Cbr\u003E\u003Cul\u003E\u003Cli\u003EBachelor\u0026#39;s Degree or higher in Business or related discipline \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003E1-3 years\u2019 experience, preferably within financial services and/or a shared service model \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EStrong analytical skills \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EStrong customer service skills \u003C/li\u003E\u003C/ul\u003E\u003Cbr\u003E\u003Cp\u003EThe \u003Cstrong\u003EPurpose\u003C/strong\u003E of Your Role \u003C/p\u003E\u003Cbr\u003E\u003Cp\u003EYou will work within an exciting, dynamic Tax Services environment and be responsible for supporting client inquiries, maintaining and providing accurate cost basis and gain/loss information on tax forms and client channels. The role involves the processing of service request items and providing subject matter expertise to customers over the telephone in a second line support capacity to the Personal Investing Client Experience reps. You will also look for ways to improve the client experience, reduce client effort and to drive efficiency. \u003C/p\u003E\u003Cp\u003EThe global Cost Basis Service team receives systematic service requests and telephone calls to support the tracking of cost basis information, which is necessary to accurately report information on IRS form 1099 for retail, institutional, advisory firm and correspondent broker dealer customers. \u003C/p\u003E\u003Cbr\u003E\u003Cp\u003ECost basis is the original value of an asset for tax purposes, adjusted for stock splits, dividends and return of capital distributions. This value is used to determine capital gains and losses. \u003C/p\u003E\u003Cbr\u003E\u003Cp\u003EThe \u003Cstrong\u003ESkills\u003C/strong\u003E You Bring \u003C/p\u003E\u003Cul\u003E\u003Cli\u003EYour understanding of IRS cost basis/regulations and the ability to communicate them to clients \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EYour ability to answer client inquiries over the telephone and through internal systems \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EYour ability to analyse complex positions activity and perform cost basis adjustments using spreadsheets and manual calculations \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EYour ability to communicate effectively when resolving issues and providing exceptional customer service \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EYour understanding of the unique needs of each business group supported by the organization \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EDemonstrating your ability and willingness to take on additional tasks as required \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EStrong PC skills including Word, Excel and Power Point \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EExcellent written and verbal communication and interpersonal skills \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EStrong attention to detail \u003C/li\u003E\u003C/ul\u003E\u003Cbr\u003E\u003Cp\u003EThe \u003Cstrong\u003EValue\u003C/strong\u003E You Deliver \u003C/p\u003E\u003Cbr\u003E\u003Cul\u003E\u003Cli\u003EBy ensuring that Fidelity\u2019s cost basis data is accurate and timely, you provide a valuable service to our customers, and help to maintain the firm\u2019s reputation for quality \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EThe relationships that you establish with our US business partners will help ensure adherence to Operations policies and procedures, and will enhance the reputation of the Tax Services team in Ireland \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003ESupporting the production of accurate US Inland Revenue Services tax forms \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EAdapting daily responsibilities to seasonal business needs \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EProviding support to colleagues in relation to complex items and assisting in the training of new colleagues \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EAssisting in the updating of reference resources for cost basis \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EProviding clients with knowledge and understanding of cost basis and tax reporting requirements \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EProviding regular status updates to management \u003C/li\u003E\u003C/ul\u003E\u003Cul\u003E\u003Cli\u003EParticipating in various projects and process improvement initiatives focused on improving the existing workflow, quality, efficiency and policy \u0026amp; procedures \u003C/li\u003E\u003C/ul\u003E\u003Cbr\u003E\u003Cp\u003EHow Your Work \u003Cstrong\u003EImpacts\u003C/strong\u003E the Organization \u003C/p\u003E\u003Cbr\u003E\u003Cp\u003EOperations and Services Group (OSG) is a division of Fidelity Institutional and provides superior customer service to Fidelity businesses through innovation, dedication and commitment to excellence. In operating locations across the US and in Ireland, OSG plays a critical role by processing every transaction into Fidelity and out to customers through the brokerage platform. OSG provides securities execution, clearance, and risk management services to retail, institutional, and correspondent clients. \u003C/p\u003E\u003Ch3\u003E\u003C/h3\u003E\u003Ch3\u003ECategory:\u003C/h3\u003E\u003Ch3\u003E\u003C/h3\u003EBrokerage Operations","identifier":"2136258","mainEntityOfPage":"https://jobs.fidelity.com/ie/jobs/2136258/cost-basis-support-representative-ii/","url":"https://jobs.fidelity.com/ie/jobs/2136258/cost-basis-support-representative-ii/","datePosted":"2026-11-17","employmentType":"OTHER","hiringOrganization":{"@type":"Organization","name":"Fidelity Investments Careers","sameAs":["https://facebook.com/fidelityjobs","https://www.linkedin.com/company/fidelity-investments/","https://www.youtube.com/fidelityjobs","https://www.instagram.com/fidelityjobs/","https://www.glassdoor.com/Reviews/Fidelity-Investments-Reviews-E2786.htm","https://www.tiktok.com/@fidelityjobs"],"url":"https://fidelity.com/","logo":"https://jobs.fidelity.com/images/logo.svg"},"industry":"Operations","jobLocation":{"@type":"Place","name":"Dublin","address":{"@type":"PostalAddress","name":"Dublin","addressCountry":"IE","addressLocality":"Dublin","addressRegion":"D","postalCode":"D24","streetAddress":"1 Waterside, Kingswood Ave"},"latitude":53.3501,"longitude":-6.2662}}</script>

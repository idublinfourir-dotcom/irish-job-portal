lationships with customers while representing our comprehensive portfolio of scientific products and services. Working in a supportive environment that values achievement and innovation, you&#39;ll help enable our customers to make the world healthier, cleaner and safer.&lt;br /&gt;&lt;br /&gt;In this role, you will develop and implement strategic sales plans, manage key account relationships, and ensure customer satisfaction through consultative selling. You&#39;ll work with cross-functional teams to provide tailored solutions that meet customer needs while achieving sales targets. Through a combination of customer visits and virtual engagement, you&#39;ll serve as a trusted advisor to help customers advance their scientific goals.&lt;br /&gt;&lt;br /&gt;REQUIREMENTS:&lt;br /&gt;•Bachelor degree plus 5 years of sales experience, preferably in laboratory, scientific, or healthcare industries&lt;br /&gt;• Preferred Fields of Study: Life Sciences, Chemistry, Material Sciences or related scientific field&lt;br /&gt;• Technical knowledge and ability to understand customer applications and workflows&lt;br /&gt;• Excellent communication, presentation and negotiation skills&lt;/p&gt;&lt;p&gt;•Relevant experience in a commercial environment, preferably capital analytical equipment sales (Capital Equipment in the field of Material Science would be a plus)&lt;/p&gt;&lt;p&gt;•A proven track record in achieving sales quotas and experience in Territory Management &lt;/p&gt;&lt;p&gt;•The ability to work on own initiative and to meet deadlines and targets.&lt;br /&gt;• Demonstrated ability to build and maintain customer relationships at all levels&lt;br /&gt;• Proficiency with CRM systems (preferably Salesforce) and MS Office suite&lt;br /&gt;• Analytical and strategic planning capabilities&lt;br /&gt;• Ability to work both independently and collaboratively in a matrix environment&lt;br /&gt;• Valid driver&#39;s license and ability to travel up to 50-75% within assigned territory&lt;br /&gt;• Fluency in English required; additional languages beneficial&lt;br /&gt;• Commitment to Thermo Fisher&#39;s core values of Integrity, Intensity, Innovation and Involvement&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;","title":"Account Manager","datePosted":"2026-11-17","@context":"http://schema.org","occupationalCategory":"Sales & Business Development","directApply":false}</script>

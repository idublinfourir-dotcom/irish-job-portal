<script id="structural-tag" type="application/ld+json">{"@context": "https://schema.org","@type": "WebPage","inLanguage": "en_global","name": "Lab Services_New","url": "https://jobs.thermofisher.com/global/en/job/R-01367934/CMBL-Scientist-I","datePublished": "2026-03-26","dateModified": "2026-03-26"}</script>
<script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Thermo Fisher Scientific","value":"R-01367934"},"hiringOrganization":{"@type":"Organization","name":"Thermo Fisher Scientific","sameAs":"https://jobs.thermofisher.com/global/en","url":"https://jobs.thermofisher.com/global/en/job/R-01367934/CMBL-Scientist-I","logo":"https://assets.phenompeople.com/CareerConnectResources/pp/TFSCGLOBAL/images/job_logo_config-1576064636944.png"},"jobLocation":{"geo":{"@type":"GeoCoordinates","latitude":"53.42278","longitude":"-7.93722"},"address":{"@type":"PostalAddress","postalCode":"N37 TE84","addressCountry":"Ireland","addressLocality":"Athlone","addressRegion":""},"@type":"Place"},"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Work Schedule&lt;/b&gt;&lt;/p&gt;Standard (Mon-Fri)&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Environmental Conditions&lt;/b&gt;&lt;/p&gt;Adherence to all Good Manufacturing Practices (GMP) Safety Standards&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;&lt;u&gt;Job Description&lt;/u&gt;&lt;/b&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p&gt;Join us as a Scientist I&lt;br /&gt;&lt;br /&gt;At Thermo Fisher Scientific, you’ll discover meaningful work that makes a positive impact on a global scale. Join our colleagues in bringing our Mission to life - enabling our customers to make the world healthier, cleaner and safer. We provide our teams with the resources needed to achieve individual career goals while taking science a step beyond through research, development and delivery of life-changing therapies. With clinical trials conducted in 100&#43; countries and ongoing development of novel frameworks for clinical research through our PPD clinical research portfolio, our work spans laboratory, digital and decentralized clinical trial services. Your determination to deliver quality and accuracy will improve health outcomes that people and communities depend on - now and in the future.&lt;br /&gt;&lt;br /&gt;Our PPD® Laboratory Services team has a direct impact on improving patient health through the expertise of scientists, industry thought-leaders and therapeutic experts. As the world leader in serving science, our laboratory professionals bring their commitment to accuracy and quality to deliver groundbreaking innovations.&lt;br /&gt;&lt;br /&gt;As a Scientist I your role will be to oversee the operations of clinical laboratory testing, ensure the accuracy and reliability of results, manage and mentor lab staff, and uphold the highest standards of quality and compliance in all laboratory practices.&lt;br /&gt;&lt;br /&gt;What You’ll Do:&lt;br /&gt;• Perform lab work in accordance with client protocols, methods and requirements.&lt;br /&gt;• Prepare study protocols, project status reports, final study reports and other project-related technical documentation.&lt;br /&gt;• Design experimental study and participates in technical troubleshooting.&lt;br /&gt;• Review, interpret and analyze data for technical quality and compliance to protocols, methods and SOPs. Review laboratory investigations and deviation.&lt;br /&gt;• Organize, schedule and supervise laboratory resources for group&#39;s project activities and updates project status.&lt;br /&gt;• Respond to client questions and needs, coordinate client communication and records meeting minutes.&lt;br /&gt;• Assist group leaders in their responsibilities.&lt;br /&gt;• Assist in preparation and implementation of PPD/client SOPs and company operational policies. Ensure adherence to SOPs, safety standards and company policies.&lt;br /&gt;&lt;br /&gt;Education and Experience:&lt;br /&gt;• Bachelor&#39;s degree or equivalent and relevant formal academic / vocational qualification&lt;br /&gt;• Previous experience that provides the knowledge, skills, and abilities to perform the job (comparable to 0 to 1 years).&lt;br /&gt;&lt;br /&gt;In some cases, an equivalency, consisting of a combination of appropriate education, training and/or directly related experience, will be considered sufficient for an individual to meet the requirements of the role.&lt;br /&gt;&lt;br /&gt;Knowledge, Skills and Abilities:&lt;br /&gt;• Bioassay experience, Mammalian cell culture, experience with ELISAs &lt;/p&gt;&lt;p&gt;• Flow cytometry an advantage &lt;/p&gt;&lt;p&gt;• Knowledge of routine operation, maintenance and theory of analytical instrumentation, SOPs and regulatory guidelines&lt;br /&gt;• Knowledge of applicable regulatory authority, compendia and ICH guidelines&lt;br /&gt;• Excellent manual dexterity skills&lt;br /&gt;• Good written and oral communication skills&lt;br /&gt;• Time management and project management skills&lt;br /&gt;• Proven problem solving and troubleshooting abilities&lt;br /&gt;• Ability to cross-train on sample preparation techniques with another laboratory group&lt;br /&gt;• Ability to work in a collaborative work environment with a team&lt;br /&gt;&lt;br /&gt;Working Conditions and Environment:&lt;br /&gt;• Work is performed in a laboratory and/or a clinical environment with exposure to electrical office equipment.&lt;br /&gt;• Occasional drives to site locations, occasional domestic travel.&lt;br /&gt;• Exposure to biological fluids with potential exposure to infectious organisms.&lt;br /&gt;• Rare exposure to skin and lung irritants, radiation, toxic materials and hazardous waste.&lt;br /&gt;• Personal protective equipment required such as protective eyewear, garments and gloves.&lt;br /&gt;• Exposure to fluctuating and/or extreme temperatures on rare occasions.&lt;br /&gt;&lt;br /&gt;Physical Requirements:&lt;br /&gt;• Ability to work in an upright and /or stationary position for 6-8 hours per day.&lt;br /&gt;• Repetitive hand movement of both hands with the ability to make fast, simple, repeated movements of the fingers, hands, and wrists to operate lab equipment.&lt;br /&gt;• Occasional mobility needed.&lt;br /&gt;• Occasional crouching, stooping, with frequent bending and twisting of upper body and neck.&lt;br /&gt;• Light to moderate lifting and carrying (or otherwise moves) objects including luggage and laptop computer with a maximum lift of 15-20 lbs.&lt;br /&gt;• Ability to access and use a variety of computer software developed both in-house and off-the-shelf.&lt;br /&gt;• Ability to communicate information and ideas so others will understand; with the ability to listen to and understand information and ideas presented through spoken words and sentences.&lt;br /&gt;• Frequently interacts with others to obtain or relate information to diverse groups.&lt;br /&gt;• Works independently with little guidance or reliance on oral or written instructions and plans work schedules to meet goals. Requires multiple periods of intense concentration.&lt;br /&gt;• Performs a wide range of variable tasks as dictated by variable demands and changing conditions with little predictability as to the occurrence. Ability to perform under stress. Ability to multi-task.&lt;br /&gt;• Regular and consistent attendance.&lt;br /&gt;&lt;br /&gt;Why Join Us?&lt;br /&gt;When you join Thermo Fisher Scientific, you become part of a global team that values passion, innovation, and a commitment to scientific excellence. You’ll work in an environment where collaboration and development are part of the everyday experience - and where your contributions truly make a difference.&lt;br /&gt;&lt;br /&gt;Apply today to help us deliver tomorrow’s breakthrough.&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;&lt;p&gt;&lt;/p&gt;","title":"CMBL - Scientist I","datePosted":"2026-11-17","@context":"http://schema.org","occupationalCategory":"Laboratory Services","directApply":false}</script>

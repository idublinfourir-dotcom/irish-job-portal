<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-11-16","description":"<p>Are you looking for a career move that will put you at the heart of a global financial institution?</p><p style='color:!important'>Shape your career with Citi in Dublin. By joining Citi, you will become part of a global organisation whose mission is to serve as a trusted partner to our clients by responsibly providing financial services that enable growth and economic progress.</p><p style='color:!important'>Citi has had a presence in Ireland since 1965, it was one of the first foreign banks to open an office in the country and is the Citibank Europe Plc Headquarters.</p><br /><p>The Operations Readiness Lead Analyst (Digital Assets) will play a key role in delivering the operational readiness agenda for digital asset programs. This role is responsible for managing day-to-day readiness initiatives, ensuring operational teams have the tools, workflows, and training needed to perform BAU (Business as Usual) activities effectively from launch.</p><p> </p><p><b>Key Responsibilities:</b></p><ul><li>Manage assigned readiness workstreams for digital asset custody projects, ensuring deliverables are completed on time and to quality standards.</li><li>Collaborate with product, technology, and QA teams to capture and validate operational requirements for new and enhanced custody platforms.</li><li>Draft and maintain workflows, desktop procedures, and training materials for custody operations staff.</li><li>Coordinate and support user acceptance testing (UAT), including test case development, execution tracking, and defect resolution follow-up.</li><li>Track and report readiness progress, risks, and issues to management and key stakeholders.</li><li>Support governance processes by ensuring all readiness documentation and sign-offs are completed prior to go-live.</li><li>Work closely with operations managers to ensure seamless knowledge transfer and operational handover, and act as a point of contact for day-to-day readiness queries from operations teams, escalating to management where appropriate.</li><li>Contribute to continuous improvement by identifying efficiency opportunities in readiness processes, workflows, and documentation standards.</li></ul><p> </p><p><b>Qualifications:</b></p><ul><li>Bachelor’s degree in Finance, Business, Technology, or related field required; project management certification (PMP, Prince2, Agile/Scrum) preferred.</li><li>Extensive experience in securities services operations, including custody operations, funds services, and/or project/change management.</li><li>Demonstrated experience managing operational readiness, implementation, or change-related workstreams, supported by strong project management skills.</li><li>Familiarity with digital assets, blockchain, and custody platforms preferred.</li><li>Strong understanding of custody operations, settlement, asset servicing workflows, and UAT planning and execution processes.</li><li>Proficiency in project management tools and readiness documentation standards.</li><li>Fluency in English (written and spoken) required.</li><li>Strong organizational, time management, stakeholder management, and communication skills, with the ability to work effectively in a cross-functional, fast-paced environment while maintaining attention to detail, operational accuracy, and a strong compliance focus.</li></ul><br /><p><b>What we can offer you</b></p><p>By joining Citi Dublin, you will not only be part of a business casual workplace with a hybrid working model (up to 2 days working at home per week), but also receive a competitive base salary (which is annually reviewed) and enjoy a whole host of additional benefits that support you (and your family) to be well, live well and save well. Discover more <a target='_blank' href='https://careers.citigroup.com/why-citi/global-benefits.html'>here.</a></p><p>Alongside these benefits Citi is committed to ensuring our workplace is where everyone feels comfortable coming to work as their whole self every day. We want the best talent around the world to be energised to join us, motivated to stay, and empowered to thrive.</p><br /><p><b>Sounds like Citi has everything you need? Then apply to discover the true extent of your capabilities.</b></p><br /><p># LI-AŁ1</p><br /><br /><p style='text-align:inherit'><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span class='WIN0'>------------------------------------------------------</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></p><h2><b>Job Family Group: </b></h2>Operations - Core<p style='text-align:inherit'><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span class='WIN0'>------------------------------------------------------</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></p><h2><b>Job Family:</b></h2>Operations Project Management<p style='text-align:inherit'><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span><span class='WIN0'>------------------------------------------------------</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></p><h2><b>Time Type:</b></h2>Full time<p style='text-align:inherit'><span><span><span><span><span class='WIN0'>------------------------------------------------------</span></span></span></span></span></p><h2><b>Primary Location Full Time Salary Range:

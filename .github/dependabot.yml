# Audit OPS-6: weekly update pull requests, grouped into one each so a week costs one check and one preview. Versions stay pinned exactly in package.json
# (repeatable builds); Dependabot raises the pin. The workflows pin actions by commit, which github-actions updates too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      all-npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    groups:
      all-actions: { patterns: ["*"] }

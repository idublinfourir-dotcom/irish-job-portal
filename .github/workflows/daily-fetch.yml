name: Daily fetch

# Fetches every board in packages/fetcher/data/boards.json into the live database as app_fetcher (step 6 slice 3), except the Workday boards:
# Workday's Cloudflare answers every data-centre address (GitHub, Vercel Dublin) with a bot challenge (W1b, 18 Nov 2026), so Workday is left out
# until the employers' own career sites replace it (W1c).
# Secrets (set by the engineer): FETCHER_DATABASE_URL (app_fetcher's Supabase session pooler string), FETCHER_MODEL_KEY (OpenRouter),
# ADMIN_DATABASE_URL (app_admin's string, given only to the admin steps after the fetch, one step at a time).
on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC; GitHub may start it late
    # Backup slot, 45 minutes later: GitHub says scheduled runs can be delayed or dropped under load. The guard step below makes this
    # one do nothing when the first already fetched today (a second full run would spend the model's free daily requests and hit 429).
    - cron: "2 6 * * *"
  workflow_dispatch:
    inputs:
      # Set by the fetch watch (fetch-watch.yml) so a run it starts goes through the guard like a scheduled one. A run started by a person leaves it off and always fetches.
      guarded:
        description: "Skip when a fetch already worked today"
        type: boolean
        default: false

permissions:
  contents: read

# Never two runs at once; a second one waits.
concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Free private-repo minutes are limited: at most 30 a day. The run stops assessing at 25 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Scheduled runs and runs the fetch watch started (a run started by hand always fetches). Skips the next two steps when a fetch already worked today (UTC).
      # If the guard cannot tell (database unreachable) it fails, so the run goes red and nothing is fetched.
      - name: Already fetched today?
        id: guard
        if: ${{ github.event_name == 'schedule' || inputs.guarded }}
        env:
          FETCHER_DATABASE_URL: ${{ secrets.FETCHER_DATABASE_URL }}
          # Old Workday runs never count as today's fetch here (W1b).
          FETCHER_SKIP_KINDS: workday
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/fetch-guard-cli.ts
      - name: Fetch
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          FETCHER_DATABASE_URL: ${{ secrets.FETCHER_DATABASE_URL }}
          FETCHER_MODEL_KEY: ${{ secrets.FETCHER_MODEL_KEY }}
          FETCHER_SKIP_KINDS: workday
          FETCHER_MODEL_URL: https://openrouter.ai/api/v1
          FETCHER_MODEL_ID: "nvidia/nemotron-3-ultra-550b-a55b:free"
          # The free key allows 50 requests a day: 40 here (W1b: no laptop run), 10 spare for score reruns (11 November 2026).
          FETCHER_MAX_MODEL_REQUESTS: "40"
          FETCHER_BATCH_SIZE: "13"
          FETCHER_DEADLINE_MINUTES: "25"
          # 20 requests a minute on free models: start calls 4 s apart. A batch of 13 can take minutes: 5 minute timeout.
          FETCHER_MODEL_GAP_MS: "4000"
          FETCHER_MODEL_TIMEOUT_MS: "300000"
          FETCHER_BOARDS_FILE: packages/fetcher/data/boards.json
          PORTAL_PRIVATE_DATA: packages/fetcher/data
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          npx vitest run --config packages/fetcher/vitest.run.config.ts --silent=false
      # The 5-year permit history window moves on 1 January; refresh every day so it is never late. The admin login is given
      # to this step only (engineer's choice, 11 November 2026), and it runs even when the fetch failed.
      - name: Refresh permit history labels
        if: ${{ !cancelled() && steps.guard.outcome != 'failure' && steps.guard.outputs.skip != 'true' }}
        env:
          DETE_ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/dete-cli.ts refresh
      # Employer and agency jobs close at day 30 and get one reminder 3 days before (D7, #48). Same admin login, given to this step only;
      # it runs every day, even when the fetch failed or was skipped, since it does not depend on the fetch.
      - name: Close expired employer jobs
        if: ${{ !cancelled() }}
        env:
          EXPIRY_ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/job-expiry-cli.ts
      # The rules versions (#229, #234 D9): on the first day a new minimum is in force, live employer and agency jobs below it go "under review"
      # and every active pay floor ends. Same admin login, given to this step only; it runs every day after the expiry step and does nothing
      # on a day with no new minimum.
      - name: Apply a new minimum
        if: ${{ !cancelled() }}
        env:
          RULES_ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/rules-run-cli.ts
      # The staff reminders (step 15 Q3): one scheduled_check item per weekly, monthly, 6-monthly and quarterly check and per big-company name due
      # for review; a key already written is skipped, so a second run writes nothing. Same admin login, given to this step only; it runs every day.
      - name: Write scheduled reminders
        if: ${{ !cancelled() }}
        env:
          SCHEDULED_ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/scheduled-checks-cli.ts
      # Job alerts (#236): one email row per candidate with new jobs since their alert last ran, sent later by the outbox command. Same admin
      # login, given to this step only; it runs every day after the jobs are fetched, closed and checked, and before retention.
      - name: Queue job alerts
        if: ${{ !cancelled() }}
        env:
          ALERTS_ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/alerts-run-cli.ts
      # The email outbox (8.1b): sends what is queued (notices, job alerts), at most 200 a run, under Brevo's free 300 a day with room for the
      # apps' own sign-up and reset emails. Email is off until the domain and Brevo exist: with no BREVO_API_KEY secret the step says so and
      # sends nothing. At the switch-on: the secret BREVO_API_KEY and the variables EMAIL_FROM and SITE_URL (the https address alert links use).
      - name: Send queued emails
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then echo "email is off (no BREVO_API_KEY secret): nothing sent"; exit 0; fi
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/outbox-cli.ts --batch 200
      # The retention periods in `setting` (placeholders until the solicitor's, #99): one rule per database call, looped until nothing is due.
      # Same admin login, given to this step only; last, and it runs every day. The stored files the rules return are removed from S3 with the
      # files key (this step only); a removal that fails prints its random key and goes red, and that file is deleted by hand.
      - name: Apply the retention rules
        if: ${{ !cancelled() }}
        env:
          RETENTION_ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          FILES_S3_KEY_ID: ${{ secrets.FILES_S3_KEY_ID }}
          FILES_S3_SECRET: ${{ secrets.FILES_S3_SECRET }}
          FILES_S3_BUCKET: irish-job-portal-files
          FILES_S3_REGION: eu-west-1
        run: |
          export DATABASE_CA_CERT="$(cat packages/fetcher/data/supabase-ca.crt)"
          node packages/db/src/retention-cli.ts

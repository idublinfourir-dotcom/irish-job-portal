name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 25, not 15 (18 Nov 2026, PR #68): the job's wall-clock cap, not a test budget. The test step took 354 s on PR #67 and 622 s on PR #68 (237 files,
    # the same files as fast as main locally), so a slow runner cut the job during the builds. Each test keeps its own budget.
    timeout-minutes: 25
    # The database tests use the same image and port as packages/db/test/test-db.sh. Keep them in step.
    services:
      postgres:
        image: supabase/postgres:17.11.0.018
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on a high or critical advisory, except the ones listed with a reason in packages/db/src/audit-gate-cli.ts. The moderate ones today are in
      # build tools only. pipefail is not needed: npm audit exits 1 on any finding, the gate decides.
      # The WRC list tests read a small made-up PDF through pdftotext.
      - run: sudo apt-get install -y poppler-utils
      - run: npm audit --json | node packages/db/src/audit-gate-cli.ts
      # The backup tests run pg_dump and pg_restore (version 17) inside the database service container: nothing to install.
      - run: echo "PG_TOOLS_PREFIX=docker exec -i -e PGPASSWORD $(docker ps -q --filter ancestor=supabase/postgres:17.11.0.018)" >> "$GITHUB_ENV"
      # A fake Sentry token makes the builds take the source map upload path (to a closed local port, never sentry.io); the bundle check then
      # fails if that value, the token's name or any Session Replay code reached a browser file (decision #267).
      - run: npm run check
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-ci
          SENTRY_URL: http://127.0.0.1:9
      - run: node packages/db/src/bundle-check-cli.ts
        env:
          SENTRY_AUTH_TOKEN: fake-token-for-ci
      # Shared CSS and first-load JS of each app's stub page stay within the size budget (step 16 F1).
      - run: node packages/ui/src/size-budget.ts
      # The built apps' photos, fonts and icons are sent cached for a year, and no page is (step 16, caching).
      - run: node packages/ui/src/cache-check.ts

  # The page gate: full-size fake fill, then every list page must read at most 1,000 pages. About 2 minutes.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database tests use the same image and port as packages/db/test/test-db.sh. Keep them in step.
    services:
      postgres:
        image: supabase/postgres:17.11.0.018
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:perf

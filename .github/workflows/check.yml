name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database tests use the same image and port as packages/db/test/test-db.sh. Keep them in step.
    services:
      postgres:
        image: supabase/postgres:17.11.0.018
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on a high or critical advisory. The moderate ones today are in build tools only.
      - run: npm audit --audit-level=high
      - run: npm run check

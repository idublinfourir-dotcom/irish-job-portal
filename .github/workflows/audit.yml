name: Audit

# Audit OPS-6: a new advisory against an unchanged main is seen within a week, not at the next push. Runs only the advisory gate of check.yml
# (fails on a high or critical advisory except the ones listed with a reason in packages/db/src/audit-gate-cli.ts). No secrets.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --json | node packages/db/src/audit-gate-cli.ts
